<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Lily's Catch!</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%;
    overflow: hidden;
    background: #8ed8f8;
    touch-action: none;
    overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  #game { display: block; width: 100vw; height: 100vh; touch-action: none; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
"use strict";
/* =====================================================================
   LILY'S CATCH!  -  a catch-the-falling-things game for Lily
   ===================================================================== */

/* ============== TWEAKABLE DIFFICULTY CONSTANTS ====================== */
const START_LIVES = 3;          // hearts at the start of the game

// Each level: goal = good catches needed to advance,
// fallSpeed = [min,max] px/sec (at a reference screen height of 800),
// spawnEvery = [min,max] seconds between new falling things,
// maxItems = most things on screen at once,
// badChance = chance a spawned thing is a baddie,
// bonusChance = chance a spawned thing is a sparkly bonus.
const LEVELS = [
  { name: "Level 1", goal: 10, fallSpeed: [115, 165], spawnEvery: [1.05, 1.5],
    maxItems: 3, badChance: 0.20, bonusChance: 0.00,
    good: ["kitten", "heart", "star", "cupcake"],
    bad:  ["steve"],
    bonus: [] },
  { name: "Level 2", goal: 15, fallSpeed: [170, 240], spawnEvery: [0.7, 1.1],
    maxItems: 5, badChance: 0.28, bonusChance: 0.07,
    good: ["kitten", "heart", "star", "cupcake"],
    bad:  ["steve", "cloud", "meteor"],
    bonus: ["rainbow"] },
  { name: "Level 3", goal: 20, fallSpeed: [215, 305], spawnEvery: [0.55, 0.9],
    maxItems: 7, badChance: 0.33, bonusChance: 0.09,
    good: ["kitten", "heart", "star", "cupcake"],
    bad:  ["steve", "cloud", "meteor", "urchin", "gator"],
    bonus: ["rainbow", "unicorn"] },
];

const POINTS_NORMAL  = 1;       // points for a regular good catch
const POINTS_RAINBOW = 5;       // points for catching a rainbow
const POINTS_UNICORN = 10;      // points for catching the unicorn
const UNICORN_SHARE  = 0.35;    // of bonus spawns on level 3, how many are unicorns

const KEYBOARD_SPEED = 560;     // px/sec when using arrow keys / A,D
const FOLLOW_SPEED   = 13;      // how snappily Lily follows finger/mouse (bigger = snappier)
const CATCH_FORGIVE  = 1.0;     // good-item hitbox size multiplier (bigger = easier)
const BAD_HIT_SHRINK = 0.62;    // bad-item hitbox multiplier (smaller = kinder)
const CATCH_TOP      = 172;     // how high on Lily catches register, in her body units
                                // (her feet = 0, top of her head ~= 172)
const DESKTOP_ASPECT = 0.62;    // widest the playfield may be (width/height); wider screens get side bars
const TOUCH_GROUND_LIFT = 0.10; // on touch devices, raise Lily this fraction of the screen height
                                // (keeps fingers away from the phone's bottom gesture-nav zone)
/* ==================================================================== */

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
let W = 1, H = 1, DPR = 1;      // playfield size (the whole game lives in these coords)
let SW = 1, SH = 1, offX = 0;   // full screen size + letterbox offset on wide screens
const IS_TOUCH = (typeof navigator !== "undefined" && navigator.maxTouchPoints > 0) ||
                 ("ontouchstart" in window);

const FONT = "'Comic Sans MS','Chalkboard SE','Comic Neue','Marker Felt',cursive,sans-serif";
const OUTLINE = "#4a3528";

const game = {
  state: "title",      // title | play | levelup | gameover | win
  stateTime: 0,
  level: 0,
  score: 0,
  lives: START_LIVES,
  caught: 0,           // good catches this level
  time: 0,
  shake: 0,
  flash: 0,
  spawnTimer: 1.2,
  items: [],
  particles: [],
  floaters: [],
  confettiTimer: 0,
  muted: false,
};

const player = { x: 0, targetX: null, hurt: 0, happy: 0, tilt: 0, lastX: 0 };
const keys = { left: false, right: false };
const buttons = [];   // clickable rects, rebuilt every frame
let bgClouds = [];
let titleDecor = [];

/* ------------------------- sizing helpers -------------------------- */
function groundY() { return H - Math.min(H * 0.045, 36) - (IS_TOUCH ? H * TOUCH_GROUND_LIFT : 0); }
function playerScale() { return clamp(Math.min(W, H) / 640, 0.55, 1.35); }
function itemR() { return clamp(Math.min(W, H) * 0.058, 24, 50); }
function speedScale() { return H / 800; }
function uiScale() { return clamp(Math.min(W, H) / 520, 0.7, 1.6); }
function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
function rnd(a, b) { return a + Math.random() * (b - a); }
function pick(arr) { return arr[(Math.random() * arr.length) | 0]; }

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2.5);
  SW = window.innerWidth; SH = window.innerHeight;
  H = SH;
  W = Math.min(SW, Math.round(SH * DESKTOP_ASPECT)); // wide screens get a vertical, phone-shaped playfield
  offX = Math.round((SW - W) / 2);
  canvas.width = Math.round(SW * DPR);
  canvas.height = Math.round(SH * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  player.x = clamp(player.x || W / 2, 60, W - 60);
  makeClouds();
}
function makeClouds() {
  bgClouds = [];
  const n = Math.max(3, Math.round(W / 300));
  for (let i = 0; i < n; i++) {
    bgClouds.push({ x: Math.random() * W, y: rnd(H * 0.06, H * 0.4),
                    s: rnd(0.6, 1.3), v: rnd(8, 22) });
  }
  titleDecor = [];
  for (let i = 0; i < 9; i++) {
    titleDecor.push({ x: Math.random() * W, y: Math.random() * H,
                      kind: i % 2 ? "heart" : "star",
                      s: rnd(0.3, 0.55), v: rnd(12, 30), ph: Math.random() * 7 });
  }
}
window.addEventListener("resize", resize);
window.addEventListener("orientationchange", function () { setTimeout(resize, 250); });
resize();

/* ============================ AUDIO ================================= */
let actx = null;
function ensureAudio() {
  if (!actx) {
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) actx = new AC();
    } catch (e) { actx = null; }
  }
  if (actx && actx.state === "suspended") actx.resume().catch(function () {});
}
function tone(freq, when, dur, type, vol, slideTo) {
  if (!actx || game.muted) return;
  try {
    const t = actx.currentTime + when;
    const o = actx.createOscillator();
    const g = actx.createGain();
    o.type = type || "sine";
    o.frequency.setValueAtTime(freq, t);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol || 0.15, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(actx.destination);
    o.start(t); o.stop(t + dur + 0.05);
  } catch (e) { /* never crash on audio */ }
}
function sndDing()  { tone(988, 0, 0.16, "sine", 0.18); tone(1319, 0.07, 0.22, "sine", 0.16); }
function sndBonus() {
  [784, 988, 1175, 1568, 1976].forEach(function (f, i) { tone(f, i * 0.06, 0.18, "sine", 0.15); });
  tone(2637, 0.32, 0.3, "sine", 0.1);
}
function sndBonk()  { tone(170, 0, 0.28, "triangle", 0.28, 75); tone(95, 0.02, 0.3, "sine", 0.2, 55); }
function sndClick() { tone(660, 0, 0.07, "square", 0.07); }
function sndFanfare() {
  [523, 659, 784, 1047].forEach(function (f, i) { tone(f, i * 0.12, 0.22, "triangle", 0.18); });
  tone(1319, 0.5, 0.45, "triangle", 0.16);
}
function sndWin() {
  const m = [523, 659, 784, 1047, 784, 1047, 1319, 1568];
  m.forEach(function (f, i) {
    tone(f, i * 0.14, 0.25, "triangle", 0.17);
    tone(f / 2, i * 0.14, 0.25, "sine", 0.1);
  });
  tone(2093, 1.18, 0.7, "sine", 0.12);
}
function sndOver() { tone(392, 0, 0.25, "triangle", 0.14); tone(330, 0.22, 0.4, "triangle", 0.14); }

/* ============================ INPUT ================================= */
function pointerPos(e) {
  const r = canvas.getBoundingClientRect();
  return { x: e.clientX - r.left - offX, y: e.clientY - r.top };
}
function hitButton(p) {
  for (let i = 0; i < buttons.length; i++) {
    const b = buttons[i];
    const pad = 14;
    if (p.x >= b.x - pad && p.x <= b.x + b.w + pad &&
        p.y >= b.y - pad && p.y <= b.y + b.h + pad) {
      sndClick();
      b.action();
      return true;
    }
  }
  return false;
}
canvas.addEventListener("pointerdown", function (e) {
  e.preventDefault();
  ensureAudio();
  const p = pointerPos(e);
  if (hitButton(p)) return;
  if (game.state === "play") player.targetX = p.x;
  else if (game.state === "levelup" && game.stateTime > 0.7) advanceLevel();
}, { passive: false });

canvas.addEventListener("pointermove", function (e) {
  if (game.state === "play") player.targetX = pointerPos(e).x;
}, { passive: true });

// kill page scroll / pinch / double-tap zoom on mobile
document.addEventListener("touchmove", function (e) { e.preventDefault(); }, { passive: false });
document.addEventListener("gesturestart", function (e) { e.preventDefault(); });
document.addEventListener("dblclick", function (e) { e.preventDefault(); });

window.addEventListener("keydown", function (e) {
  if (e.code === "ArrowLeft" || e.code === "KeyA") { keys.left = true; e.preventDefault(); }
  if (e.code === "ArrowRight" || e.code === "KeyD") { keys.right = true; e.preventDefault(); }
  if (e.code === "Space" || e.code === "Enter") {
    ensureAudio();
    if (game.state === "title") startGame();
    else if (game.state === "levelup" && game.stateTime > 0.5) advanceLevel();
    else if (game.state === "gameover" || game.state === "win") startGame();
  }
});
window.addEventListener("keyup", function (e) {
  if (e.code === "ArrowLeft" || e.code === "KeyA") keys.left = false;
  if (e.code === "ArrowRight" || e.code === "KeyD") keys.right = false;
});

/* ========================= ART HELPERS ============================== */
function rr(c, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  c.beginPath();
  c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r);
  c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r);
  c.arcTo(x, y, x + w, y, r);
  c.closePath();
}
function circle(c, x, y, r) { c.beginPath(); c.arc(x, y, r, 0, Math.PI * 2); c.closePath(); }
function fillStroke(c, fill, stroke, lw) {
  c.fillStyle = fill; c.fill();
  if (stroke) { c.lineWidth = lw || 3; c.strokeStyle = stroke; c.stroke(); }
}
function starPath(c, r1, r2, n, rot) {
  n = n || 5; rot = (rot === undefined) ? -Math.PI / 2 : rot;
  c.beginPath();
  for (let i = 0; i < n * 2; i++) {
    const r = (i % 2 === 0) ? r1 : r2;
    const a = rot + i * Math.PI / n;
    if (i === 0) c.moveTo(Math.cos(a) * r, Math.sin(a) * r);
    else c.lineTo(Math.cos(a) * r, Math.sin(a) * r);
  }
  c.closePath();
}
function heartPath(c, s) {
  c.beginPath();
  c.moveTo(0, s);
  c.bezierCurveTo(-s * 1.3, s * 0.15, -s * 0.66, -s * 0.92, 0, -s * 0.28);
  c.bezierCurveTo(s * 0.66, -s * 0.92, s * 1.3, s * 0.15, 0, s);
  c.closePath();
}
function fluffPath(c, r, bumps, puff) {
  puff = puff || 1.22;
  c.beginPath();
  c.moveTo(r, 0);
  for (let i = 0; i < bumps; i++) {
    const a1 = ((i + 1) / bumps) * Math.PI * 2;
    const am = ((i + 0.5) / bumps) * Math.PI * 2;
    c.quadraticCurveTo(Math.cos(am) * r * puff, Math.sin(am) * r * puff,
                       Math.cos(a1) * r, Math.sin(a1) * r);
  }
  c.closePath();
}
function sparkle4(c, x, y, r, color, alpha) {
  c.save();
  c.translate(x, y);
  c.globalAlpha *= (alpha === undefined ? 1 : alpha);
  c.fillStyle = color;
  c.beginPath();
  for (let i = 0; i < 4; i++) {
    const a = i * Math.PI / 2;
    c.moveTo(0, 0);
    c.quadraticCurveTo(Math.cos(a + 0.5) * r * 0.32, Math.sin(a + 0.5) * r * 0.32,
                       Math.cos(a) * r, Math.sin(a) * r);
    c.quadraticCurveTo(Math.cos(a - 0.5) * r * 0.32, Math.sin(a - 0.5) * r * 0.32, 0, 0);
  }
  c.fill();
  c.restore();
}
function txt(c, str, x, y, size, color, align, strokeCol, strokeW) {
  c.font = "900 " + size + "px " + FONT;
  c.textAlign = align || "center";
  c.textBaseline = "middle";
  if (strokeCol) {
    c.lineWidth = strokeW || size * 0.18;
    c.lineJoin = "round";
    c.strokeStyle = strokeCol;
    c.strokeText(str, x, y);
  }
  c.fillStyle = color;
  c.fillText(str, x, y);
}

/* ========================= CHARACTERS =============================== */
/* Lily — drawn with feet at local (0,0), about 180 units tall.        */
function drawLily(c, opts) {
  opts = opts || {};
  const bob = opts.bob || 0;
  const tilt = opts.tilt || 0;
  const hurt = opts.hurt || 0;
  const cheer = opts.cheer || false;
  const SKIN = "#f6cd9e", SKIN_D = "#dca96f";
  const HAIR = "#3f2a17", HAIR_HI = "#5d4226";
  const PINK = "#ff7bac", PINK_D = "#e0529b";
  const DRESS = "#fffdf8";

  c.save();
  c.rotate(tilt);
  c.translate(0, bob);
  c.lineJoin = "round"; c.lineCap = "round";

  // back hair (big shape behind everything)
  c.beginPath();
  c.moveTo(-38, -140);
  c.quadraticCurveTo(-44, -178, 0, -178);
  c.quadraticCurveTo(44, -178, 38, -140);
  c.quadraticCurveTo(44, -110, 40, -70);
  c.quadraticCurveTo(36, -60, 24, -64);
  c.lineTo(24, -104);
  c.lineTo(-24, -104);
  c.lineTo(-24, -64);
  c.quadraticCurveTo(-36, -60, -40, -70);
  c.quadraticCurveTo(-44, -110, -38, -140);
  c.closePath();
  fillStroke(c, HAIR, OUTLINE, 4);

  // legs + shoes (pink leggings, pink shoes)
  c.fillStyle = PINK;
  rr(c, -21, -58, 15, 50, 7); fillStroke(c, PINK, OUTLINE, 3.5);
  rr(c, 6, -58, 15, 50, 7);  fillStroke(c, PINK, OUTLINE, 3.5);
  c.beginPath(); c.ellipse(-14, -5, 13, 8, 0, 0, Math.PI * 2);
  fillStroke(c, PINK_D, OUTLINE, 3.5);
  c.beginPath(); c.ellipse(14, -5, 13, 8, 0, 0, Math.PI * 2);
  fillStroke(c, PINK_D, OUTLINE, 3.5);
  c.fillStyle = "#fff";
  c.beginPath(); c.ellipse(-17, -8, 4, 3, 0, 0, Math.PI * 2); c.fill();
  c.beginPath(); c.ellipse(11, -8, 4, 3, 0, 0, Math.PI * 2); c.fill();

  // dress (white, kitten + cherry pattern)
  c.beginPath();
  c.moveTo(-19, -103);
  c.lineTo(19, -103);
  c.quadraticCurveTo(30, -90, 40, -52);
  c.quadraticCurveTo(0, -42, -40, -52);
  c.quadraticCurveTo(-30, -90, -19, -103);
  c.closePath();
  fillStroke(c, DRESS, OUTLINE, 4);
  // pattern, clipped inside the dress
  c.save();
  c.clip();
  const spots = [[-18, -88], [12, -92], [-2, -74], [-26, -62], [22, -66], [0, -52], [-13, -49], [28, -52]];
  for (let i = 0; i < spots.length; i++) {
    const px = spots[i][0], py = spots[i][1];
    if (i % 2 === 0) { // tiny kitten face
      c.fillStyle = "#b9b2ad";
      circle(c, px, py, 4.6); c.fill();
      c.beginPath();
      c.moveTo(px - 4, py - 2); c.lineTo(px - 5.4, py - 6.4); c.lineTo(px - 1, py - 4);
      c.moveTo(px + 4, py - 2); c.lineTo(px + 5.4, py - 6.4); c.lineTo(px + 1, py - 4);
      c.fill();
      c.fillStyle = "#544a42";
      circle(c, px - 1.7, py - 0.6, 0.75); c.fill();
      circle(c, px + 1.7, py - 0.6, 0.75); c.fill();
      c.fillStyle = "#f08aa8";
      circle(c, px, py + 1.4, 0.9); c.fill();
    } else { // little cherries
      c.strokeStyle = "#69a85e"; c.lineWidth = 1.4;
      c.beginPath(); c.moveTo(px - 2.4, py); c.quadraticCurveTo(px, py - 6, px + 2.6, py - 0.5); c.stroke();
      c.fillStyle = "#e84b5f";
      circle(c, px - 2.6, py + 1.6, 2.6); c.fill();
      circle(c, px + 2.8, py + 1.2, 2.6); c.fill();
      c.fillStyle = "rgba(255,255,255,.7)";
      circle(c, px - 3.4, py + 0.8, 0.8); c.fill();
      circle(c, px + 2, py + 0.4, 0.8); c.fill();
    }
  }
  c.restore();

  if (cheer) {
    // arms thrown up in celebration
    c.strokeStyle = OUTLINE; c.lineWidth = 13;
    c.beginPath(); c.moveTo(-16, -96); c.quadraticCurveTo(-36, -118, -44, -148); c.stroke();
    c.beginPath(); c.moveTo(16, -96); c.quadraticCurveTo(36, -118, 44, -148); c.stroke();
    c.strokeStyle = SKIN; c.lineWidth = 8;
    c.beginPath(); c.moveTo(-16, -96); c.quadraticCurveTo(-36, -118, -44, -148); c.stroke();
    c.beginPath(); c.moveTo(16, -96); c.quadraticCurveTo(36, -118, 44, -148); c.stroke();
    circle(c, -44, -150, 7); fillStroke(c, SKIN, OUTLINE, 3);
    circle(c, 44, -150, 7); fillStroke(c, SKIN, OUTLINE, 3);
  } else {
    // arms reaching forward to the basket
    c.strokeStyle = OUTLINE; c.lineWidth = 13;
    c.beginPath(); c.moveTo(-17, -96); c.quadraticCurveTo(-34, -86, -34, -66); c.stroke();
    c.beginPath(); c.moveTo(17, -96); c.quadraticCurveTo(34, -86, 34, -66); c.stroke();
    c.strokeStyle = SKIN; c.lineWidth = 8;
    c.beginPath(); c.moveTo(-17, -96); c.quadraticCurveTo(-34, -86, -34, -66); c.stroke();
    c.beginPath(); c.moveTo(17, -96); c.quadraticCurveTo(34, -86, 34, -66); c.stroke();

    // basket
    c.beginPath();
    c.moveTo(-37, -62);
    c.quadraticCurveTo(-34, -30, 0, -30);
    c.quadraticCurveTo(34, -30, 37, -62);
    c.closePath();
    fillStroke(c, "#e3a35c", OUTLINE, 4);
    c.strokeStyle = "#b97a3a"; c.lineWidth = 2.5;
    for (let i = -2; i <= 2; i++) {
      c.beginPath(); c.moveTo(i * 14, -61); c.quadraticCurveTo(i * 13, -44, i * 9, -32); c.stroke();
    }
    c.beginPath(); c.moveTo(-35, -50); c.quadraticCurveTo(0, -42, 35, -50); c.stroke();
    c.beginPath(); c.ellipse(0, -62, 38, 8.5, 0, 0, Math.PI * 2);
    fillStroke(c, "#c98a45", OUTLINE, 4);
    c.beginPath(); c.ellipse(0, -62, 30, 5, 0, 0, Math.PI * 2);
    fillStroke(c, "#8e5a28", "#6f441d", 2);
    // hands on the rim
    circle(c, -34, -64, 7); fillStroke(c, SKIN, OUTLINE, 3);
    circle(c, 34, -64, 7); fillStroke(c, SKIN, OUTLINE, 3);
  }

  // head
  circle(c, 0, -132, 31);
  fillStroke(c, SKIN, OUTLINE, 4);
  // ears
  circle(c, -30, -132, 6); fillStroke(c, SKIN, OUTLINE, 3);
  circle(c, 30, -132, 6); fillStroke(c, SKIN, OUTLINE, 3);

  // front hair: middle-parted cap + long side strands over shoulders
  c.beginPath();
  c.moveTo(0, -160);
  c.quadraticCurveTo(-30, -168, -33.5, -136);
  c.quadraticCurveTo(-26, -144, -12, -147);
  c.quadraticCurveTo(-4, -149, 0, -158);
  c.quadraticCurveTo(4, -149, 12, -147);
  c.quadraticCurveTo(26, -144, 33.5, -136);
  c.quadraticCurveTo(30, -168, 0, -160);
  c.closePath();
  fillStroke(c, HAIR, OUTLINE, 3.5);
  c.beginPath();
  c.moveTo(-33.5, -138);
  c.quadraticCurveTo(-40, -110, -36, -72);
  c.quadraticCurveTo(-30, -64, -22, -70);
  c.quadraticCurveTo(-25, -106, -22, -126);
  c.quadraticCurveTo(-28, -130, -33.5, -138);
  c.closePath();
  fillStroke(c, HAIR, OUTLINE, 3.5);
  c.beginPath();
  c.moveTo(33.5, -138);
  c.quadraticCurveTo(40, -110, 36, -72);
  c.quadraticCurveTo(30, -64, 22, -70);
  c.quadraticCurveTo(25, -106, 22, -126);
  c.quadraticCurveTo(28, -130, 33.5, -138);
  c.closePath();
  fillStroke(c, HAIR, OUTLINE, 3.5);
  // shine in hair
  c.strokeStyle = HAIR_HI; c.lineWidth = 3;
  c.beginPath(); c.moveTo(-20, -154); c.quadraticCurveTo(-27, -148, -28, -136); c.stroke();
  c.beginPath(); c.moveTo(20, -154); c.quadraticCurveTo(27, -148, 28, -136); c.stroke();

  // face
  if (hurt > 0) {
    // ouch face: >.< eyes + little "o" mouth
    c.strokeStyle = OUTLINE; c.lineWidth = 3.4;
    c.beginPath();

const SKIES = [
  ["#8ed8f8", "#e3f6ff"],
  ["#ffc46b", "#fff0c4"],
  ["#c99cff", "#ffe0f4"],
];
function drawBackground(c, levelIdx, t) {
  const sky = SKIES[clamp(levelIdx, 0, SKIES.length - 1)];
  const g = c.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, sky[0]); g.addColorStop(1, sky[1]);
  c.fillStyle = g;
  c.fillRect(0, 0, W, H);

  // smiling sun
  const sx = W * 0.14, sy = H * 0.13, sr = Math.min(W, H) * 0.07;
  c.save();
  c.translate(sx, sy);
  c.rotate(t * 0.1);
  c.strokeStyle = "rgba(255,210,80,.8)"; c.lineWidth = sr * 0.16; c.lineCap = "round";
  for (let i = 0; i < 9; i++) {
    const a = (i / 9) * Math.PI * 2;
    c.beginPath();
    c.moveTo(Math.cos(a) * sr * 1.25, Math.sin(a) * sr * 1.25);
    c.lineTo(Math.cos(a) * sr * 1.6, Math.sin(a) * sr * 1.6);
    c.stroke();
  }
  c.restore();
  circle(c, sx, sy, sr);
  fillStroke(c, "#ffd93d", "#e8a90d", 3);
  c.fillStyle = "#b97700";
  circle(c, sx - sr * 0.3, sy - sr * 0.12, sr * 0.07); c.fill();
  circle(c, sx + sr * 0.3, sy - sr * 0.12, sr * 0.07); c.fill();
  c.strokeStyle = "#b97700"; c.lineWidth = sr * 0.08; c.lineCap = "round";
  c.beginPath(); c.arc(sx, sy + sr * 0.1, sr * 0.4, 0.2 * Math.PI, 0.8 * Math.PI); c.stroke();

  // drifting clouds
  c.fillStyle = "rgba(255,255,255,.92)";
  for (let i = 0; i < bgClouds.length; i++) {
    const cl = bgClouds[i];
    cl.x += cl.v * lastDt;
    const cw = 60 * cl.s;
    if (cl.x - cw * 2 > W) { cl.x = -cw * 2; cl.y = rnd(H * 0.06, H * 0.4); }
    c.save();
    c.translate(cl.x, cl.y); c.scale(cl.s, cl.s);
    c.beginPath();
    c.arc(-26, 0, 18, 0, Math.PI * 2);
    c.arc(0, -10, 24, 0, Math.PI * 2);
    c.arc(26, 0, 17, 0, Math.PI * 2);
    c.arc(0, 6, 20, 0, Math.PI * 2);
    c.fill();
    c.restore();
  }

  // rolling hills
  const gy = groundY();
  c.fillStyle = "#9ed86b";
  c.beginPath();
  c.moveTo(0, gy + 40);
  c.lineTo(0, gy - H * 0.05);
  c.quadraticCurveTo(W * 0.25, gy - H * 0.12, W * 0.5, gy - H * 0.05);
  c.quadraticCurveTo(W * 0.75, gy + H * 0.01, W, gy - H * 0.08);
  c.lineTo(W, gy + 40);
  c.closePath(); c.fill();
  c.fillStyle = "#7cc94e";
  c.beginPath();
  c.moveTo(0, H);
  c.lineTo(0, gy + 2);
  c.quadraticCurveTo(W * 0.3, gy - H * 0.045, W * 0.62, gy + 4);
  c.quadraticCurveTo(W * 0.85, gy + H * 0.02, W, gy - 4);
  c.lineTo(W, H);
  c.closePath(); c.fill();

  // little flowers
  const fs = Math.min(W, H) * 0.012 + 3;
  for (let i = 0; i < 7; i++) {
    const fx = ((i * 0.137 + 0.06) % 1) * W;
    const fy = gy + 8 + ((i * 37) % 3) * 6;
    c.fillStyle = ["#ff8fb1", "#fff", "#ffd93d"][i % 3];
    for (let p = 0; p < 5; p++) {
      const a = (p / 5) * Math.PI * 2 + i;
      circle(c, fx + Math.cos(a) * fs * 0.8, fy + Math.sin(a) * fs * 0.8, fs * 0.5); c.fill();
    }
    c.fillStyle = "#e8a90d";
    circle(c, fx, fy, fs * 0.42); c.fill();

/* ===================== PARTICLES & FLOATERS ========================= */
function burstSparkles(x, y, color, n) {
  for (let i = 0; i < (n || 14); i++) {

    game.particles.push({
      kind: "spark", x: x, y: y,
      vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 60,
      life: rnd(0.4, 0.85), age: 0,
      r: rnd(4, 10) * uiScale() * 0.8,
      color: color || pick(["#fff6c8", "#ffd93d", "#ff8fb1", "#aef0ff"]),
      rot: Math.random() * 7,
    });
  }
}
function burstPuff(x, y) {
  for (let i = 0; i < 10; i++) {
    const a = Math.random() * Math.PI * 2, sp = rnd(30, 130) * speedScale();
    game.particles.push({
      kind: "puff", x: x, y: y,
      vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 30,
      life: rnd(0.35, 0.7), age: 0,

      color: "rgba(120,110,130,0.55)",
    });

}
function spawnConfetti(n) {
  for (let i = 0; i < n; i++) {
    game.particles.push({
      kind: "confetti",
      x: Math.random() * W, y: -20 - Math.random() * H * 0.3,
      vx: rnd(-40, 40), vy: rnd(90, 220) * speedScale(),
      life: 6, age: 0,
      r: rnd(5, 10) * uiScale() * 0.8,
      color: pick(["#ff6fa5", "#ffd93d", "#6fd86f", "#7ea6ff", "#b48cff", "#ff8c42", "#fff"]),
      rot: Math.random() * 7, vr: rnd(-6, 6),
    });
  }
}
function addFloater(x, y, str, color, size) {
  game.floaters.push({ x: x, y: y, str: str, color: color || "#ff4f93",
                       size: (size || 30) * uiScale(), age: 0, life: 1 });
}
function updateParticles(dt) {
  for (let i = game.particles.length - 1; i >= 0; i--) {
    const p = game.particles[i];
    p.age += dt;
    if (p.age >= p.life || p.y > H + 40) { game.particles.splice(i, 1); continue; }
    p.x += p.vx * dt; p.y += p.vy * dt;
    if (p.kind === "spark") p.vy += 350 * speedScale() * dt;
    if (p.kind === "confetti") { p.x += Math.sin(p.age * 5 + p.rot) * 40 * dt; p.rot += p.vr * dt; }
  }
  for (let i = game.floaters.length - 1; i >= 0; i--) {
    const f = game.floaters[i];
    f.age += dt;
    f.y -= 65 * uiScale() * dt;
    if (f.age >= f.life) game.floaters.splice(i, 1);
  }
}
function drawParticles(c) {
  for (let i = 0; i < game.particles.length; i++) {
    const p = game.particles[i];
    const k = 1 - p.age / p.life;
    c.save();
    c.globalAlpha = Math.min(1, k * 2);
    if (p.kind === "spark") {
      c.translate(p.x, p.y); c.rotate(p.rot + p.age * 4);
      sparkle4(c, 0, 0, p.r * (0.5 + k * 0.5), p.color);
    } else if (p.kind === "puff") {
      c.fillStyle = p.color;
      circle(c, p.x, p.y, p.r * (0.6 + (1 - k) * 0.9)); c.fill();
    } else { // confetti
      c.translate(p.x, p.y); c.rotate(p.rot);
      c.fillStyle = p.color;
      c.fillRect(-p.r / 2, -p.r / 3.2, p.r, p.r / 1.6);
    }
    c.restore();
  }
  for (let i = 0; i < game.floaters.length; i++) {
    const f = game.floaters[i];
    const k = 1 - f.age / f.life;
    ctx.save();
    ctx.globalAlpha = Math.min(1, k * 2.5);
    const pop = 1 + Math.sin(Math.min(1, f.age * 5) * Math.PI) * 0.25;
    txt(ctx, f.str, f.x, f.y, f.size * pop, f.color, "center", "#fff", f.size * 0.22);
    ctx.restore();
  }
}

/* ========================= GAME LOGIC =============================== */
function startGame() {
  game.level = 0;
  game.score = 0;
  game.lives = START_LIVES;
  beginLevel();
}
function beginLevel() {
  game.caught = 0;
  game.items = [];
  game.floaters = [];
  game.spawnTimer = 0.8;
  game.state = "play";
  game.stateTime = 0;
  player.targetX = null;
  player.hurt = 0;
}
function advanceLevel() {
  game.level++;
  beginLevel();
}
function spawnItem() {
  const L = LEVELS[game.level];
  let type, good = false, points = 0;
  const roll = Math.random();
  if (L.bonus.length && roll < L.bonusChance) {
    if (L.bonus.indexOf("unicorn") >= 0 && Math.random() < UNICORN_SHARE) type = "unicorn";
    else type = L.bonus[0];
    good = true;
    points = (type === "unicorn") ? POINTS_UNICORN : POINTS_RAINBOW;
  } else if (roll < L.bonusChance + L.badChance) {
    type = pick(L.bad);
  } else {
    type = pick(L.good);
    good = true;
    points = POINTS_NORMAL;
  }
  const r = itemR() * ITEM_SIZE[type];
  game.items.push({
    type: type, good: good, points: points,
    x: rnd(r + 14, W - r - 14), y: -r * 2,
    r: r,
    vy: rnd(L.fallSpeed[0], L.fallSpeed[1]) * speedScale(),
    sway: good ? rnd(10, 26) : rnd(0, 8),
    phase: Math.random() * 7,
    t: Math.random() * 10,
  });
}
function catchZone() {
  const ps = playerScale();
  return { x: player.x, top: groundY() - CATCH_TOP * ps, halfW: 40 * ps };
}
function onCatch(it) {
  const isBonus = (it.type === "rainbow" || it.type === "unicorn");
  game.score += it.points;
  game.caught++;
  player.happy = 0.5;
  burstSparkles(it.x, it.y, isBonus ? "#fff6c8" : null, isBonus ? 26 : 14);
  addFloater(it.x, it.y - it.r, "+" + it.points,
             isBonus ? "#b04df0" : "#ff4f93", isBonus ? 42 : 30);
  if (isBonus) sndBonus(); else sndDing();
  const L = LEVELS[game.level];
  if (game.caught >= L.goal) {
    game.items = [];
    if (game.level >= LEVELS.length - 1) {
      game.state = "win"; game.stateTime = 0;
      game.confettiTimer = 0;
      sndWin();
      spawnConfetti(120);
    } else {
      game.state = "levelup"; game.stateTime = 0;
      sndFanfare();
      burstSparkles(W / 2, H / 2, "#ffd93d", 30);
    }
  }
}
function onHit(it) {
  game.lives--;
  player.hurt = 0.8;
  game.shake = 9;
  game.flash = 0.3;
  burstPuff(it.x, it.y);
  sndBonk();
  if (game.lives <= 0) {
    game.state = "gameover"; game.stateTime = 0;
    game.items = [];
    sndOver();
  }
}
function updatePlay(dt) {
  game.time += dt;
  const L = LEVELS[game.level];
  const ps = playerScale();
  const margin = 46 * ps;

  // movement: keyboard wins while held, else follow pointer target
  if (keys.left || keys.right) {
    player.targetX = null;
    player.x += ((keys.right ? 1 : 0) - (keys.left ? 1 : 0)) * KEYBOARD_SPEED * speedScale() * dt;
  } else if (player.targetX !== null) {
    player.x += (player.targetX - player.x) * Math.min(1, FOLLOW_SPEED * dt);
  }
  player.x = clamp(player.x, margin, W - margin);
  const dx = player.x - player.lastX;
  player.tilt += (clamp(dx * 0.012, -0.16, 0.16) - player.tilt) * Math.min(1, dt * 10);
  player.lastX = player.x;
  player.hurt = Math.max(0, player.hurt - dt);
  player.happy = Math.max(0, player.happy - dt);

  // spawning
  game.spawnTimer -= dt;
  if (game.spawnTimer <= 0 && game.items.length < L.maxItems) {
    spawnItem();
    game.spawnTimer = rnd(L.spawnEvery[0], L.spawnEvery[1]);
  }

  // falling + collisions
  const z = catchZone();
  for (let i = game.items.length - 1; i >= 0; i--) {
    const it = game.items[i];
    it.t += dt;
    it.y += it.vy * dt;
    it.x += Math.sin(it.t * 2 + it.phase) * it.sway * dt;
    it.x = clamp(it.x, it.r * 0.6, W - it.r * 0.6);
    const hitW = it.good
      ? (z.halfW + it.r * 0.9) * CATCH_FORGIVE
      : (z.halfW + it.r * 0.9) * BAD_HIT_SHRINK;
    // triggers the moment the item's bottom touches the top of her head
    if (Math.abs(it.x - z.x) < hitW &&
        it.y + it.r * 0.75 > z.top && it.y - it.r * 0.5 < groundY()) {
      game.items.splice(i, 1);
      if (it.good) onCatch(it); else onHit(it);
      continue;
    }
    if (it.y - it.r > H) game.items.splice(i, 1); // missing costs nothing
  }
}

/* ============================ HUD =================================== */
function drawHUD(c) {
  const u = uiScale();

  for (let i = 0; i < START_LIVES; i++) {
    c.save();
    c.translate(34 * u + i * 44 * u, 36 * u);

    if (full && game.flash > 0) c.scale(1.15, 1.15);
    heartPath(c, 17 * u);
    if (full) {
      fillStroke(c, "#ff5d8f", "#fff", 4 * u);
      c.fillStyle = "rgba(255,255,255,.6)";
      c.beginPath(); c.ellipse(-6 * u, -7 * u, 4 * u, 5 * u, -0.5, 0, Math.PI * 2); c.fill();
    } else {
      fillStroke(c, "rgba(90,70,80,.25)", "rgba(255,255,255,.7)", 3.5 * u);
    }
    c.restore();
  }
  // score (top center)
  c.save();
  c.translate(W / 2, 36 * u);
  c.save(); c.translate(-8 * u - String(game.score).length * 13 * u, 0); c.scale(0.55 * u, 0.55 * u);
  starPath(c, 30, 13);
  fillStroke(c, "#ffd93d", "#fff", 7);
  c.restore();
  txt(c, String(game.score), 16 * u, 1, 38 * u, "#fff", "center", "#e0529b", 7 * u);
  c.restore();
  // level + progress bar
  const L = LEVELS[game.level];
  const bw = 150 * u, bx = W / 2 - bw / 2, by = 64 * u;
  txt(c, L.name, W / 2 - bw / 2 - 12 * u, by + 7 * u, 17 * u, "#fff", "right", "#8b62c9", 4 * u);
  rr(c, bx, by, bw, 14 * u, 7 * u);
  fillStroke(c, "rgba(255,255,255,.55)", "#fff", 2.5 * u);
  const frac = clamp(game.caught / L.goal, 0, 1);
  if (frac > 0) {
    rr(c, bx + 2 * u, by + 2 * u, Math.max(10 * u, (bw - 4 * u) * frac), 10 * u, 5 * u);
    c.fillStyle = "#ff6fa5"; c.fill();
  }
  txt(c, game.caught + " / " + L.goal, W / 2 + bw / 2 + 12 * u, by + 7 * u, 17 * u, "#fff", "left", "#8b62c9", 4 * u);
}
function drawMuteButton(c) {

  c.lineTo(3 * u, 11 * u); c.lineTo(-4 * u, 4 * u); c.lineTo(-10 * u, 4 * u);
  c.closePath(); c.fill();

  } else {
    c.beginPath(); c.arc(4 * u, 0, 9 * u, -0.7, 0.7); c.stroke();
    c.beginPath(); c.arc(4 * u, 0, 14 * u, -0.7, 0.7); c.stroke();
  }
  c.restore();
  buttons.push({ x: x - r, y: y - r, w: r * 2, h: r * 2, action: function () {
    game.muted = !game.muted;
  }});
}
function drawBigButton(c, cx, cy, label, color, action, size) {
  const u = uiScale();
  const fs = (size || 34) * u;
  c.font = "900 " + fs + "px " + FONT;
  const tw = c.measureText(label).width;
  const w = tw + fs * 1.6, h = fs * 1.9;
  const x = cx - w / 2, y = cy - h / 2;
  const wob = 1 + Math.sin(game.time * 3.2) * 0.022;
  c.save();
  c.translate(cx, cy); c.scale(wob, wob); c.translate(-cx, -cy);
  rr(c, x, y + 6 * u, w, h, h / 2);
  c.fillStyle = "rgba(120,40,80,.35)"; c.fill();
  rr(c, x, y, w, h, h / 2);
  fillStroke(c, color, "#fff", 5 * u);
  txt(c, label, cx, cy + 2, fs, "#fff", "center", "rgba(120,40,80,.5)", fs * 0.16);
  c.restore();
  buttons.push({ x: x, y: y, w: w, h: h, action: action });
}

/* ============================ SCREENS =============================== */
function drawTitle(c, t) {
  drawBackground(c, 0, t);
  // floating decor
  for (let i = 0; i < titleDecor.length; i++) {
    const d = titleDecor[i];
    d.y -= d.v * lastDt;
    if (d.y < -50) { d.y = H + 50; d.x = Math.random() * W; }
    c.save();
    c.globalAlpha = 0.5;
    c.translate(d.x + Math.sin(t * 1.5 + d.ph) * 14, d.y);
    c.scale(d.s, d.s);
    if (d.kind === "heart") drawHeartItem(c, t + d.ph);
    else drawStarItem(c, t + d.ph);
    c.restore();
  }
  const u = uiScale();
  // bouncy rainbow title
  const title = "Lily's Catch!";
  const cols = ["#ff5d8f", "#ffa53d", "#ffd93d", "#6fd86f", "#5aa7e8", "#b48cff"];
  const ts = Math.min(W / (title.length * 0.62), H * 0.11);
  c.font = "900 " + ts + "px " + FONT;
  let total = 0;
  const widths = [];
  for (let i = 0; i < title.length; i++) { widths[i] = c.measureText(title[i]).width; total += widths[i]; }
  let lx = W / 2 - total / 2;
  for (let i = 0; i < title.length; i++) {
    const by = Math.sin(t * 2.6 + i * 0.55) * ts * 0.1;
    txt(c, title[i], lx + widths[i] / 2, H * 0.17 + by, ts, cols[i % cols.length], "center", "#fff", ts * 0.21);
    lx += widths[i];
  }
  txt(c, "Catch the cuties  •  dodge the grumps!", W / 2, H * 0.17 + ts * 0.85, Math.min(22 * u, W / 22), "#9b5fb8", "center", "#fff", 5 * u);

  // Lily preview, gently bobbing
  c.save();
  const ps = playerScale() * 1.15;
  c.translate(W / 2, groundY());
  c.scale(ps, ps);
  drawLily(c, { bob: Math.sin(t * 2.4) * 3 });
  c.restore();
  // kitten & Steve flanking her
  const ir = itemR();
  c.save();
  c.translate(W / 2 - Math.max(120 * ps, W * 0.2), groundY() - ir * 0.9);
  c.scale(ir / 50, ir / 50);
  drawKitten(c, t);
  c.restore();
  c.save();
  c.translate(W / 2 + Math.max(120 * ps, W * 0.2), groundY() - ir * 0.9);
  c.scale(ir / 50, ir / 50);
  drawSteve(c, t);
  c.restore();

  drawBigButton(c, W / 2, H * 0.52, "PLAY!", "#ff5d8f", function () { startGame(); }, 46);
  drawMuteButton(c);
}
function drawLevelUp(c, t) {
  drawBackground(c, game.level, t);
  drawPlayerOnGround(c, t);
  const u = uiScale();
  const k = Math.min(1, game.stateTime * 2.2);
  const pop = 0.5 + k * 0.5 + Math.sin(game.stateTime * 4) * 0.03;
  c.save();
  c.translate(W / 2, H * 0.4);
  c.scale(pop, pop);
  c.rotate(Math.sin(t * 2) * 0.03);
  starPath(c, Math.min(W, H) * 0.3, Math.min(W, H) * 0.15, 12, t * 0.3);
  fillStroke(c, "rgba(255,217,61,.85)", "#fff", 6 * u);
  txt(c, LEVELS[game.level].name + " done!", 0, -Math.min(W, H) * 0.05, Math.min(W, H) * 0.06, "#e0529b", "center", "#fff", Math.min(W, H) * 0.012);
  txt(c, "Get ready for", 0, Math.min(W, H) * 0.025, Math.min(W, H) * 0.04, "#9b5fb8", "center", "#fff", Math.min(W, H) * 0.008);
  txt(c, LEVELS[game.level + 1].name + "!", 0, Math.min(W, H) * 0.095, Math.min(W, H) * 0.075, "#ff5d8f", "center", "#fff", Math.min(W, H) * 0.015);
  c.restore();
  if (game.stateTime > 0.9) {
    c.globalAlpha = (Math.sin(t * 4) + 1.4) / 2.4;
    txt(c, "tap to keep going!", W / 2, H * 0.68, 22 * u, "#fff", "center", "#9b5fb8", 5 * u);
    c.globalAlpha = 1;
  }
  drawHUD(c);
  drawMuteButton(c);
  if (game.stateTime > 2.4) advanceLevel();
}
function drawGameOver(c, t) {
  drawBackground(c, game.level, t);
  const u = uiScale();
  c.fillStyle = "rgba(80,50,110,.35)";
  c.fillRect(0, 0, W, H);
  // soft card
  const cw = Math.min(W * 0.86, 520 * u), ch = Math.min(H * 0.62, 460 * u);
  rr(c, W / 2 - cw / 2, H * 0.42 - ch / 2, cw, ch, 30 * u);
  fillStroke(c, "rgba(255,250,252,.95)", "#ff9cc0", 6 * u);
  // smug Steve perched on top of the card
  c.save();
  c.translate(W / 2, H * 0.42 - ch / 2 + 8 * u);
  const sr = Math.min(cw, ch) * 0.0038;
  c.scale(sr, sr);
  drawSteve(c, t * 0.5);
  c.restore();
  txt(c, "Oops!", W / 2, H * 0.42 - ch * 0.16, Math.min(cw * 0.14, 56 * u), "#ff5d8f", "center", "#fff", 8 * u);
  txt(c, "Steve got you this time...", W / 2, H * 0.42 - ch * 0.045, Math.min(cw * 0.055, 24 * u), "#9b5fb8", "center");
  txt(c, "Want to try again?", W / 2, H * 0.42 + ch * 0.035, Math.min(cw * 0.055, 24 * u), "#9b5fb8", "center");
  txt(c, "You caught " + game.score + " points of goodies!", W / 2, H * 0.42 + ch * 0.13, Math.min(cw * 0.05, 21 * u), "#e0a13d", "center");
  drawBigButton(c, W / 2, H * 0.42 + ch * 0.3, "Try Again!", "#6fd86f", function () { startGame(); }, 36);
  drawMuteButton(c);
}
function drawWin(c, t) {
  drawBackground(c, 2, t);
  game.confettiTimer -= lastDt;
  if (game.confettiTimer <= 0) { spawnConfetti(6); game.confettiTimer = 0.12; }
  // cheering Lily
  c.save();
  const ps = playerScale() * 1.2;
  c.translate(W / 2, groundY());
  c.scale(ps, ps);
  const hop = Math.abs(Math.sin(t * 5)) * -12;
  drawLily(c, { cheer: true, bob: hop });
  c.restore();
  // happy kitten bouncing beside her
  const ir = itemR();
  c.save();
  c.translate(W / 2 - Math.max(130 * ps, W * 0.22), groundY() - ir * 0.9 + Math.abs(Math.sin(t * 5 + 1)) * -14);
  c.scale(ir / 50, ir / 50);
  drawKitten(c, t);
  c.restore();
  c.save();
  c.translate(W / 2 + Math.max(130 * ps, W * 0.22), groundY() - ir * 0.9);
  c.scale(ir / 50, ir / 50);
  drawUnicorn(c, t);
  c.restore();

  const u = uiScale();
  const big = Math.min(W / 9, H * 0.1);
  const pop = 1 + Math.sin(t * 3) * 0.04;
  c.save();
  c.translate(W / 2, H * 0.2);
  c.scale(pop, pop);
  txt(c, "You did it,", 0, -big * 0.62, big * 0.72, "#ffd93d", "center", "#fff", big * 0.16);
  txt(c, "Lily!!", 0, big * 0.35, big * 1.25, "#ff5d8f", "center", "#fff", big * 0.25);
  c.restore();
  sparkle4(c, W / 2 - big * 2.4, H * 0.13, big * 0.34, "#fff6c8", (Math.sin(t * 5) + 1.2) / 2.2);
  sparkle4(c, W / 2 + big * 2.5, H * 0.24, big * 0.28, "#fff6c8", (Math.sin(t * 5 + 2) + 1.2) / 2.2);
  txt(c, "All 3 levels - " + game.score + " points! You're a superstar!", W / 2, H * 0.38, Math.min(24 * u, W / 20), "#9b5fb8", "center", "#fff", 5 * u);
  drawBigButton(c, W / 2, H * 0.52, "Play Again!", "#b48cff", function () { startGame(); }, 38);
  drawMuteButton(c);
}
function drawPlayerOnGround(c, t) {
  const ps = playerScale();
  c.save();
  c.translate(player.x, groundY());
  c.scale(ps, ps);
  drawLily(c, {
    bob: Math.sin(t * 3.2) * 2.5 + (player.happy > 0 ? Math.sin(player.happy * 20) * -4 : 0),
    tilt: player.tilt,
    hurt: player.hurt,
  });
  c.restore();
}
function drawPlay(c, t) {
  drawBackground(c, game.level, t);
  // falling items
  for (let i = 0; i < game.items.length; i++) {
    const it = game.items[i];
    c.save();
    c.translate(it.x, it.y);
    const s = it.r / 50;
    c.scale(s, s);
    ITEM_DRAW[it.type](c, it.t + it.phase);
    c.restore();
  }
  drawPlayerOnGround(c, t);
  drawParticles(c);
  drawHUD(c);
  drawMuteButton(c);
  // gentle rose flash when hurt
  if (game.flash > 0) {
    c.fillStyle = "rgba(255,90,120," + (game.flash * 0.5) + ")";
    c.fillRect(0, 0, W, H);
  }
}

/* decorated bars beside the playfield on wide (desktop/landscape) screens */
function drawLetterbox(c) {
  if (offX < 1) return;
  const g = c.createLinearGradient(0, 0, 0, SH);
  g.addColorStop(0, "#6a55a0");
  g.addColorStop(1, "#9a6ab0");
  c.fillStyle = g;
  c.fillRect(0, 0, offX + 1, SH);
  c.fillRect(SW - offX - 1, 0, offX + 1, SH);
  c.fillStyle = "rgba(255,255,255,.07)";
  const step = 54;
  for (let x = step / 2; x < offX - 10; x += step) {
    for (let y = ((x / step) % 2) * step / 2 + step / 2; y < SH + step; y += step) {
      circle(c, x, y, 7); c.fill();
      circle(c, SW - x, y, 7); c.fill();
    }
  }
  c.fillStyle = "rgba(255,255,255,.85)";
  c.fillRect(offX - 4, 0, 4, SH);
  c.fillRect(SW - offX, 0, 4, SH);
}

/* ========================== MAIN LOOP =============================== */
let lastTime = 0, lastDt = 1 / 60;
function frame(ms) {
  const dt = clamp((ms - lastTime) / 1000 || 0.016, 0.001, 0.05);
  lastTime = ms;
  lastDt = dt;
  game.time += (game.state === "play" ? 0 : dt); // play adds its own time
  game.stateTime += dt;
  game.shake = Math.max(0, game.shake - dt * 22);
  game.flash = Math.max(0, game.flash - dt * 1.4);

  buttons.length = 0;
  ctx.save();
  drawLetterbox(ctx);
  ctx.translate(offX, 0);
  ctx.beginPath(); ctx.rect(0, 0, W, H); ctx.clip();
  if (game.shake > 0) {
    ctx.translate(rnd(-game.shake, game.shake), rnd(-game.shake, game.shake));
  }
  const t = game.time;
  if (game.state === "play") {
    updatePlay(dt);
    updateParticles(dt);
    drawPlay(ctx, game.time);
  } else {
    updateParticles(dt);
    if (game.state === "title") drawTitle(ctx, t);
    else if (game.state === "levelup") { drawLevelUp(ctx, t); drawParticles(ctx); }
    else if (game.state === "gameover") { drawGameOver(ctx, t); drawParticles(ctx); }
    else if (game.state === "win") { drawWin(ctx, t); drawParticles(ctx); }
  }
  ctx.restore();
  requestAnimationFrame(frame);
}
player.x = W / 2;
player.lastX = player.x;
requestAnimationFrame(frame);
</script>
