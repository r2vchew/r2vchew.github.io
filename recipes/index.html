<!DOCTYPE html>
<html lang="en-CA">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Recipe Box</title>
  <meta name="description" content="A personal recipe box that works offline.">
  <meta name="theme-color" content="#c64f33">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="app" aria-live="polite"></main>
  <dialog id="import-dialog">
    <h2>Import recipes</h2>
    <p>Paste recipe JSON below (e.g. copied from a Claude ingestion session), or choose a JSON file.</p>
    <textarea id="paste-json" placeholder='[ { "name": "...", "ingredients": [...] } ]' spellcheck="false"></textarea>
    <div class="dialog-actions">
      <button type="button" data-action="close-import">Cancel</button>
      <button type="button" data-action="import-file">Choose a file…</button>
      <button type="button" class="primary" data-action="import-paste">Import pasted JSON</button>
    </div>
  </dialog>
  <div id="toast" role="status"></div>
  <input type="file" id="import-file" accept=".json,application/json" hidden>
  <script src="app.js"></script>
</body>
</html>
