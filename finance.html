<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><title>Chew Family Finances</title><style>
  :root{--bg:#0f1115;--card:#1a1e27;--line:#2a3040;--ink:#e7ebf3;--mut:#9aa4b8;
        --accent:#4f8cff;--good:#37c98a;--bad:#ff7b7b;--save:#c08cff;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:15px/1.45 -apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;
       padding:env(safe-area-inset-top) 0 40px}
  .wrap{max-width:560px;margin:0 auto;padding:0 16px}
  header{padding:18px 0 8px}
  h1{font-size:20px;margin:0;font-weight:680;letter-spacing:.2px}
  .sub{color:var(--mut);font-size:12.5px;margin-top:3px}
  select{width:100%;margin-top:14px;background:#0c0e13;border:1px solid var(--line);color:var(--ink);
         border-radius:10px;padding:12px;font-size:16px;-webkit-appearance:none}
  .togglerow{display:flex;gap:8px;margin-top:10px}
  .seg{flex:1;display:flex;background:#0c0e13;border:1px solid var(--line);border-radius:9px;padding:3px}
  .seg button{flex:1;background:none;border:0;color:var(--mut);padding:8px 4px;border-radius:6px;font-size:12.5px;cursor:pointer}
  .seg button.on{background:var(--accent);color:#fff;font-weight:650}
  .kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 14px}
  .kpi .lab{color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.4px}
  .kpi .val{font-size:21px;font-weight:680;margin-top:5px;font-variant-numeric:tabular-nums}
  .kpi .dl{font-size:12px;margin-top:3px}
  .up{color:var(--bad)}.down{color:var(--good)}.flat{color:var(--mut)}
  section{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px;margin:13px 0}
  h2{font-size:13px;text-transform:uppercase;letter-spacing:.5px;color:var(--mut);margin:0 0 13px}
  .trend{display:flex;gap:7px;align-items:flex-end;height:128px;overflow-x:auto;padding-bottom:4px}
  .col{flex:1;min-width:30px;display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer}
  .bars{display:flex;gap:3px;align-items:flex-end;height:96px}
  .bar{width:9px;border-radius:3px 3px 0 0}
  .bar.in{background:var(--good)}.bar.out{background:var(--bad)}
  .col.sel .mlab{color:var(--ink);font-weight:680}
  .mlab{font-size:10.5px;color:var(--mut)}
  .row{display:flex;align-items:center;gap:10px;margin:9px 0}
  .row .nm{flex:0 0 39%;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .track{flex:1;background:#0c0e13;border-radius:6px;height:18px;overflow:hidden}
  .fill{height:100%;border-radius:6px;background:linear-gradient(90deg,#4f8cff,#6aa0ff)}
  .amt{flex:0 0 auto;font-size:13px;font-variant-numeric:tabular-nums;color:var(--mut);min-width:72px;text-align:right}
  .split{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .split .b{background:#0c0e13;border:1px solid var(--line);border-radius:11px;padding:12px}
  .split .b .lab{font-size:12px;color:var(--mut)}
  .split .b .v{font-size:19px;font-weight:680;margin-top:4px}
  .reg{color:var(--ink)}.exc{color:var(--save)}
  .ev{display:flex;justify-content:space-between;font-size:13px;padding:6px 0;border-top:1px solid #20252f}
  .hint{color:var(--mut);font-size:12.5px;margin-top:10px;line-height:1.5}
  .foot{color:#6f7890;font-size:11.5px;line-height:1.6;margin:18px 0 0;padding:0 2px}
  .pos{color:var(--good)}.neg{color:var(--bad)}
  #gate{display:none;position:fixed;inset:0;background:var(--bg);z-index:99;
        flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
  #gate .lk{font-size:40px;margin-bottom:8px}
  #gate h3{margin:0 0 4px;font-size:19px}
  #gate p{color:var(--mut);font-size:13px;margin:0 0 18px;max-width:300px}
  #gate input{width:240px;max-width:80vw;padding:13px;font-size:16px;border-radius:10px;
        border:1px solid var(--line);background:#0c0e13;color:var(--ink);text-align:center}
  #gate button{margin-top:12px;padding:12px 26px;font-size:15px;border:0;border-radius:10px;
        background:var(--accent);color:#fff;font-weight:650}
  #gateMsg{color:var(--mut);font-size:13px;margin-top:12px;min-height:18px}
  #lockbar{position:fixed;left:0;right:0;bottom:0;background:#11141bdd;backdrop-filter:blur(6px);
        border-top:1px solid var(--line);padding:11px 16px;display:flex;gap:10px;align-items:center;justify-content:center}
  #lockbar button{padding:11px 18px;font-size:14px;border:0;border-radius:10px;background:var(--accent);color:#fff;font-weight:650}
  #lockbar .note{color:var(--mut);font-size:11.5px}
  iframe{border:0;width:100%;height:100vh;display:block}
</style></head><body>
  <div id="gate">
    <div class="lk">&#128274;</div>
    <h3>Chew Family Finances</h3>
    <p>Enter the family password to view.</p>
    <form id="gateForm" autocomplete="off">
      <input id="gatePw" type="password" placeholder="Password" autofocus>
      <div><button type="submit">Unlock</button></div>
    </form>
    <div id="gateMsg"></div>
  </div>

  <div class="wrap">
  <header>
    <h1>Chew Family Finances</h1>
    <div class="sub">Snapshot as of June 12, 2026 &middot; <span id="range"></span></div>
    <select id="month"></select>
    <div class="togglerow">
      <div class="seg" id="segRange">
        <button data-r="1m" class="on">Month</button><button data-r="3m">3 Mo</button><button data-r="ytd">YTD</button>
      </div>
      <div class="seg" id="segMode">
        <button data-m="total" class="on">Total</button><button data-m="disc">Discretionary</button>
      </div>
    </div>
  </header>
  <div class="kpis" id="kpis"></div>
  <section>
    <h2>In vs out by month</h2>
    <div class="trend" id="trend"></div>
    <div class="hint"><span class="pos">&#9632;</span> money in &nbsp; <span class="neg">&#9632;</span> spending &middot; tap a month to focus</div>
  </section>
  <section>
    <h2>Where it went <span id="catmonth" style="text-transform:none;color:var(--mut)"></span></h2>
    <div id="cats"></div>
  </section>
  <section>
    <h2>Regular vs exceptional</h2>
    <div class="split">
      <div class="b"><div class="lab">Regular</div><div class="v reg" id="reg"></div></div>
      <div class="b"><div class="lab">Exceptional</div><div class="v exc" id="exc"></div></div>
    </div>
    <div id="evlist"></div>
  </section>
  <section>
    <h2>Top merchants</h2>
    <div id="merch"></div>
  </section>
  <div class="foot" id="foot"></div>
  </div>

function _b64(buf){var u=new Uint8Array(buf),b='';for(var i=0;i<u.length;i++)b+=String.fromCharCode(u[i]);return btoa(b);}
function _ub64(s){var bin=atob(s),u=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u;}
async function _key(pw,salt){
  var m=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt:salt,iterations:200000,hash:'SHA-256'},m,
    {name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
async function encryptData(pw,txt){
  var salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));
  var k=await _key(pw,salt);
  var ct=await crypto.subtle.encrypt({name:'AES-GCM',iv:iv},k,new TextEncoder().encode(txt));
  return {s:_b64(salt),i:_b64(iv),c:_b64(ct)};
}
async function decryptData(pw,p){
  var k=await _key(pw,_ub64(p.s));
  var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:_ub64(p.i)},k,_ub64(p.c));
  return new TextDecoder('utf-8').decode(pt);
}

function runDashboard(DATA){
  var IGNORE=new Set(["Internal Transfer","Credit-Card Payment"]);
  var SAVE=new Set(["Investments & Savings","Loan"]);
  // Non-discretionary = bills/mortgage nature. Edit this list to taste.
  var NONDISC=new Set(["Loan","Insurance","Property Tax & Town Bills","Utilities & Telecom","Bank Fees & Interest"]);
  // Specific recurring bill-like merchants treated as non-discretionary even
  // though their category (Kids & Activities, Health) is otherwise discretionary.
  var NONDISC_MERCH=["boys and girls","alberta health services"];
  function isNonDisc(r){
    if(NONDISC.has(r[2]))return true;
    var m=(r[4]||"").toLowerCase();
    for(var i=0;i<NONDISC_MERCH.length;i++)if(m.indexOf(NONDISC_MERCH[i])>=0)return true;
    return false;
  }
  var MNAMES=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  function money(n){var neg=n<0;n=Math.abs(n);
    var s=n>=1000?Math.round(n).toLocaleString():n.toFixed(2);return (neg?"-$":"$")+s;}
  function monthLabel(m){var p=m.split("-");return MNAMES[+p[1]-1]+" "+p[0].slice(2);}
  var months=[...new Set(DATA.map(function(r){return r[0].slice(0,7);}))].sort();
  function classify(r){var c=r[2];if(IGNORE.has(c))return "ignore";
    if(c==="Income")return "income";if(SAVE.has(c))return "save";return "spend";}
  var SEL=months[months.length-1], RANGE="1m", MODE="total";
  function countsAsSpend(r){
    if(classify(r)!=="spend")return false;
    if(MODE==="disc"&&isNonDisc(r))return false;
    return true;
  }
  function rangeMonths(end){
    var i=months.indexOf(end);
    if(RANGE==="1m")return [end];
    if(RANGE==="3m")return months.slice(Math.max(0,i-2),i+1);
    var yr=end.slice(0,4);
    return months.filter(function(m){return m.slice(0,4)===yr&&m<=end;});
  }
  function agg(ms){
    var set=new Set(ms),income=0,spend=0,save=0;
    DATA.forEach(function(r){
      if(!set.has(r[0].slice(0,7)))return;
      var k=classify(r);
      if(k==="income"&&r[1]>0)income+=r[1];
      else if(k==="save")save+=-r[1];
      else if(countsAsSpend(r))spend+=-r[1];
    });
    return {income:income,spend:spend,save:save,net:income-spend-save};
  }
  function render(){
    document.getElementById("range").textContent=monthLabel(months[0])+" – "+monthLabel(months[months.length-1]);
    var sel=document.getElementById("month");
    sel.innerHTML=months.slice().reverse().map(function(m){return '<option value="'+m+'">'+monthLabel(m)+'</option>';}).join("");
    sel.value=SEL; sel.onchange=function(){SEL=sel.value;render();};
    var ms=rangeMonths(SEL), a=agg(ms);
    // previous equivalent window for deltas (only when it fully exists)
    var i=months.indexOf(ms[0]), prev=null;
    if(RANGE!=="ytd"&&i>=ms.length){prev=agg(months.slice(i-ms.length,i));}
    var spendLab=MODE==="disc"?"Disc. spending":"Spending";
    var kpi=[["Money in",a.income,"pos",true],[spendLab,a.spend,"neg",false],
             ["Saving & debt",a.save,"",false],["Net",a.net,a.net>=0?"pos":"neg",true]];
    document.getElementById("kpis").innerHTML=kpi.map(function(k,idx){
      var lab=k[0],v=k[1],cls=k[2],goodUp=k[3],dl;
      if(prev){
        var pv=[prev.income,prev.spend,prev.save,prev.net][idx];
        var d=v-pv,pct=pv?Math.round(d/Math.abs(pv)*100):0;
        var isGood=goodUp?d>=0:d<=0;
        var cl=d===0?"flat":(isGood?"down":"up");
        var ar=d>0?"&#9650;":(d<0?"&#9660;":"");
        var cmp=RANGE==="1m"?"vs last mo":"vs prior "+ms.length+" mo";
        dl='<span class="'+cl+'">'+ar+' '+Math.abs(pct)+'% '+cmp+'</span>';
      } else {
        dl='<span class="flat">avg '+money(v/ms.length)+'/mo</span>';
      }
      return '<div class="kpi"><div class="lab">'+lab+'</div><div class="val '+cls+'">'+money(v)+'</div><div class="dl">'+dl+'</div></div>';
    }).join("");
    // trend: always per-month, all months (respects MODE for the spend bar)
    var saveR=RANGE,series; RANGE="1m";
    series=months.map(function(m){var x=agg([m]);x.m=m;return x;});
    RANGE=saveR;
    var max=Math.max.apply(null,series.map(function(s){return Math.max(s.income,s.spend);}).concat([1]));
    document.getElementById("trend").innerHTML=series.map(function(s){
      return '<div class="col '+(ms.indexOf(s.m)>=0?"sel":"")+'" data-m="'+s.m+'"><div class="bars">'+
        '<div class="bar in" style="height:'+Math.round(s.income/max*96)+'px"></div>'+
        '<div class="bar out" style="height:'+Math.round(s.spend/max*96)+'px"></div></div>'+
        '<div class="mlab">'+MNAMES[+s.m.split("-")[1]-1]+'</div></div>';}).join("");
    document.querySelectorAll(".col").forEach(function(c){c.onclick=function(){SEL=c.dataset.m;render();};});
    var rlab=RANGE==="1m"?monthLabel(SEL):(RANGE==="3m"?ms.map(monthLabel).join(" + "):"YTD "+SEL.slice(0,4));
    document.getElementById("catmonth").textContent="· "+rlab;
    var set=new Set(ms),cat={};
    DATA.forEach(function(r){if(!set.has(r[0].slice(0,7)))return;
      if(!countsAsSpend(r))return;
      var c=r[2]||"Uncategorized";cat[c]=(cat[c]||0)+(-r[1]);});
    var ce=Object.entries(cat).filter(function(e){return e[1]>0;}).sort(function(x,y){return y[1]-x[1];});
    var cmax=ce.length?ce[0][1]:1,ctot=ce.reduce(function(s,e){return s+e[1];},0);
    document.getElementById("cats").innerHTML=ce.length?ce.map(function(e){
      return '<div class="row"><div class="nm">'+e[0]+'</div><div class="track"><div class="fill" style="width:'+
        Math.max(3,Math.round(e[1]/cmax*100))+'%"></div></div><div class="amt">'+money(e[1])+' &middot; '+
        Math.round(e[1]/ctot*100)+'%</div></div>';}).join(""):'<div class="hint">No spending in this range.</div>';
    // regular vs exceptional + event NETS (events include reimbursements, so a
    // repaid trip shows true out-of-pocket; CC payments stay excluded)
    var reg=0,exc=0,evs={};
    DATA.forEach(function(r){
      if(!set.has(r[0].slice(0,7)))return;
      if(r[3]&&r[2]!=="Credit-Card Payment"){evs[r[3]]=(evs[r[3]]||0)+(-r[1]);}
      if(!countsAsSpend(r))return;
      if(r[3])exc+=-r[1];else reg+=-r[1];
    });
    document.getElementById("reg").textContent=money(reg);
    document.getElementById("exc").textContent=money(exc);
    var ee=Object.entries(evs).sort(function(a,b){return b[1]-a[1];});
    document.getElementById("evlist").innerHTML=ee.length?
      '<div class="evlist">'+ee.map(function(e){return '<div class="ev"><span>'+e[0]+'</span><span>'+money(e[1])+' net</span></div>';}).join("")+
      '<div class="hint">Event nets include reimbursements (e-transfers in), so a repaid trip shows your true out-of-pocket.</div>'
      :'<div class="hint">Nothing tagged as exceptional in this range. Tag vacations, gifts or one-off events in the review tool and they\'ll split out here.</div>';
    // top merchants: bills + CC payments always excluded
    var mc={};
    DATA.forEach(function(r){
      if(!set.has(r[0].slice(0,7)))return;
      if(classify(r)!=="spend")return;
      if(isNonDisc(r))return;
      mc[r[4]]=(mc[r[4]]||0)+(-r[1]);});
    var me=Object.entries(mc).filter(function(e){return e[1]>0;}).sort(function(a,b){return b[1]-a[1];}).slice(0,8);
    var mmax=me.length?me[0][1]:1;
    document.getElementById("merch").innerHTML=me.length?me.map(function(e){
      return '<div class="row"><div class="nm">'+e[0]+'</div><div class="track"><div class="fill" style="width:'+
        Math.max(3,Math.round(e[1]/mmax*100))+'%"></div></div><div class="amt">'+money(e[1])+'</div></div>';}).join("")
      :'<div class="hint">Nothing in this range.</div>';
    document.getElementById("foot").innerHTML=
      "Transfers between accounts and credit-card payments are excluded so spending isn't double-counted. "+
      "Triangle Mastercard spend is shown at effective cost (after the 17.5% Team CT discount). "+
      "Savings, investments and loan payments show as &ldquo;Saving &amp; debt.&rdquo; "+
      "Discretionary view hides: Loan, Insurance, Property Tax &amp; Town Bills, Utilities &amp; Telecom, Bank Fees, "+
      "plus Boys &amp; Girls Club and AHS (recurring bills). "+
      "Top merchants always exclude bills and card payments.";
  }
  document.getElementById("segRange").onclick=function(e){
    if(!e.target.dataset.r)return;RANGE=e.target.dataset.r;
    this.querySelectorAll("button").forEach(function(b){b.classList.toggle("on",b===e.target);});render();};
  document.getElementById("segMode").onclick=function(e){
    if(!e.target.dataset.m)return;MODE=e.target.dataset.m;
    this.querySelectorAll("button").forEach(function(b){b.classList.toggle("on",b===e.target);});render();};
  render();
}

(function(){
  var P=window.PAYLOAD; if(!P)return;
  if(!P.enc){ runDashboard(P.data); return; }
  var g=document.getElementById('gate'); g.style.display='flex';
  document.getElementById('gateForm').onsubmit=async function(e){
    e.preventDefault();
    var pw=document.getElementById('gatePw').value, msg=document.getElementById('gateMsg');
    msg.textContent='Unlocking…';
    try{ var txt=await decryptData(pw,P.p); var data=JSON.parse(txt);
      g.style.display='none'; runDashboard(data);
    }catch(err){ msg.textContent='Wrong password — try again.'; }
  };
})();
</script></body></html>
