<!DOCTYPE html>

  <title>STEVE</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #1a1a1a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: Georgia, serif;
    }
    h1 {
      color: #e8d5b0;

      margin-bottom: 2rem;

</html>
