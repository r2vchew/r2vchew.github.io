<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>STEVE</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #1a1a1a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: Georgia, serif;
    }
    h1 {
      color: #e8d5b0;
      font-size: 5rem;
      letter-spacing: 0.5rem;
      margin-bottom: 2rem;
      text-shadow: 2px 2px 8px rgba(0,0,0,0.8);
    }
    h1 .subtitle {
      display: block;
      font-size: 1.1rem;
      letter-spacing: 0.15rem;
      font-style: italic;
      color: #a89070;
      margin-top: 0.4rem;
    }
    img {
      max-width: 90vw;
      max-height: 80vh;
      border-radius: 8px;
      box-shadow: 0 8px 40px rgba(0,0,0,0.7);
    }
    .page { display: none; flex-direction: column; align-items: center; }
    .page.active { display: flex; }
    a.nav-link {
      margin-top: 1.5rem;
      color: #a89070;
      font-size: 0.95rem;
      text-decoration: underline;
      cursor: pointer;
    }
    a.nav-link:hover { color: #e8d5b0; }
  </style>
</head>
<body>

  <div class="page active" id="page1">
    <h1>STEVE</h1>
    <img src="steve.jpg" alt="Steve">
    <a class="nav-link" onclick="showPage('page2')">click here</a>
  </div>

  <div class="page" id="page2">
    <h1>ALSO STEVE <span class="subtitle">(featuring Keely)</span></h1>
    <img src="steve2.jpg" alt="Also Steve">
    <a class="nav-link" onclick="showPage('page1')">go back</a>
  </div>

  <script>
    function showPage(id) {
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.getElementById(id).classList.add('active');
    }
  </script>

</body>
</html>
