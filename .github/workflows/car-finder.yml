name: Car finder

on:
  schedule:
    # Once a day at 11:40 UTC — 05:40 in Calgary on MDT, 04:40 on MST.
    #
    # Why this time:
    #  * Private sellers list in the evening, and that is where the cheap cars
    #    are. A pre-dawn run captures the whole of the previous evening.
    #  * Dealer inventory feeds refresh overnight, roughly 02:00-05:00 local,
    #    so scanning after that window avoids reading a half-updated feed.
    #  * It lands before she is up, so the digest is waiting at breakfast and
    #    is only a couple of hours old rather than a full day.
    #  * :40 rather than :00 — GitHub's scheduler queues hardest on the hour,
    #    and a queued run can be delayed by many minutes.
    #
    # Cron is UTC with no daylight-saving handling, so this drifts an hour
    # between MDT and MST. Both land pre-dawn, so it does not matter here.
    - cron: '40 11 * * *'
  # Feedback should take effect straight away, not at the next scheduled scan.
  issues:
    types: [opened, labeled, reopened]
  workflow_dispatch:
    inputs:
      pages:
        description: 'Result pages to read per source'
        default: '2'
      source:
        description: 'Limit to a single source (autotrader, kijiji, cargurus, carpages)'
        default: ''
      force_email:
        description: 'Send the digest even if nothing is new'
        type: boolean
        default: false

concurrency:
  group: car-finder
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  scan:
    runs-on: ubuntu-latest
    # On the issues trigger, only run for feedback issues.
    if: >-
      github.event_name != 'issues' ||
      contains(join(github.event.issue.labels.*.name, ','), 'car-feedback')

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Tests
        working-directory: car-finder
        run: node scripts/test.mjs

      # Her decisions are applied before the scan, so a rejected car never
      # reappears in the very run that follows the rejection.
      - name: Apply feedback
        working-directory: car-finder
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/apply-feedback.mjs

      - name: Scan listings
        working-directory: car-finder
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SCRAPINGBEE_API_KEY: ${{ secrets.SCRAPINGBEE_API_KEY }}
          SCRAPERAPI_KEY: ${{ secrets.SCRAPERAPI_KEY }}
        run: |
          node scripts/run.mjs \
            --pages "${{ inputs.pages || '2' }}" \
            ${{ inputs.source && format('--source {0}', inputs.source) || '' }}

      - name: Build email digest
        id: digest
        working-directory: car-finder
        env:
          SITE_URL: https://${{ github.repository_owner }}.github.io/car-finder/
        run: node scripts/email.mjs ${{ inputs.force_email && '--force' || '' }}

      - name: Commit results
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add car-finder/data
          if git diff --staged --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Car finder: scan for $(date -u +%Y-%m-%d\ %H:%M) UTC"
            for i in 1 2 3 4; do
              git pull --rebase origin "${GITHUB_REF_NAME}" && \
              git push origin "HEAD:${GITHUB_REF_NAME}" && break
              echo "push attempt $i failed; retrying"
              sleep $((2 ** i))
            done
          fi

      # Sent by our own SMTP client rather than a third-party action, so the
      # mailbox password never leaves code in this repository. It no-ops
      # quietly when the secrets are not configured.
      - name: Send digest
        id: mail
        if: steps.digest.outputs.send == 'true'
        working-directory: car-finder
        env:
          MAIL_SERVER: ${{ secrets.MAIL_SERVER }}
          MAIL_PORT: ${{ secrets.MAIL_PORT }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: |
          node scripts/send-mail.mjs \
            --html build/digest.html \
            --subject "${{ steps.digest.outputs.subject }}"

      - name: Summary
        if: always()
        run: |
          {
            echo "### Car finder scan"
            echo ""
            echo "- New cars worth a look: **${{ steps.digest.outputs.new_count || '0' }}**"
            echo "- Digest step: **${{ steps.mail.outcome || 'skipped' }}**"
            echo ""
            echo "Dashboard: https://${{ github.repository_owner }}.github.io/car-finder/"
          } >> "$GITHUB_STEP_SUMMARY"
