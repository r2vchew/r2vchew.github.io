<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><title>Finance Review</title><style>
  :root{--bg:#0f1115;--card:#1a1e27;--line:#2a3040;--ink:#e7ebf3;--mut:#9aa4b8;
        --accent:#4f8cff;--good:#37c98a;--bad:#ff7b7b;--warn:#f0a83c;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:16px/1.5 -apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;
       padding:0 0 96px}
  .wrap{max-width:620px;margin:0 auto;padding:0 14px}
  header{position:sticky;top:0;z-index:6;background:#11141bf2;backdrop-filter:blur(8px);
         border-bottom:1px solid var(--line);padding:12px 14px}
  h1{font-size:17px;margin:0;font-weight:680}
  .prog{color:var(--mut);font-size:12.5px;margin-top:2px}
  .tabs{display:flex;gap:5px;margin-top:10px}
  .tabs button{flex:1;background:#0c0e13;border:1px solid var(--line);color:var(--mut);
       padding:9px;border-radius:9px;font-size:13px}
  .tabs button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  input,select{background:#0c0e13;border:1px solid var(--line);color:var(--ink);
       border-radius:9px;padding:11px;font-size:16px;width:100%}
  .search{margin-top:9px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 14px;margin:11px 0}
  .card.done{border-color:var(--good);opacity:.5}
  .m{font-weight:650;font-size:15.5px}
  .m .mix{color:var(--warn);font-size:10.5px;border:1px solid var(--warn);border-radius:5px;padding:1px 6px;margin-left:6px;vertical-align:1px}
  .meta{color:var(--mut);font-size:12.5px;margin-top:3px}
  .amt{font-variant-numeric:tabular-nums;font-weight:650}
  .neg{color:var(--bad)}.pos{color:var(--good)}
  .samples{color:#6f7890;font-size:11.5px;margin-top:6px;font-family:ui-monospace,Menlo,monospace;
       white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ctrls{margin-top:11px;display:flex;flex-direction:column;gap:8px}
  .ctrls .ev,.ctrls .no{display:none}
  .ctrls.open .ev,.ctrls.open .no{display:block}
  .crow{display:flex;gap:8px;align-items:center}
  .more{color:var(--accent);font-size:12.5px;background:none;border:0;padding:0;width:auto}
  .save{background:var(--accent);border:0;color:#fff;border-radius:9px;padding:11px 16px;font-weight:650;width:auto;min-width:84px}
  .expand{color:var(--accent);font-size:12.5px;margin-top:8px;background:none;border:0;padding:0;width:auto;display:block}
  .detail{margin-top:10px;border-top:1px dashed var(--line);padding-top:8px}
  .trow{padding:8px 0;border-bottom:1px solid #20252f}
  .trow .top{display:flex;justify-content:space-between;font-size:12.5px;color:var(--mut)}
  .trow .desc{font-size:11.5px;color:#7a8298;font-family:ui-monospace,Menlo,monospace;margin:2px 0 6px;
       white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .trow .trc{display:flex;gap:7px}
  .trow select{flex:2}.trow input{flex:3}
  .dirin{color:var(--good)}.dirout{color:var(--bad)}
  .empty{color:var(--mut);text-align:center;padding:50px 0}
  #bar{position:fixed;left:0;right:0;bottom:0;background:#11141bf2;backdrop-filter:blur(8px);
       border-top:1px solid var(--line);padding:11px 14px;display:flex;gap:10px;align-items:center}
  #bar .n{flex:1;font-size:13.5px;color:var(--mut)}
  #bar .n b{color:var(--ink)}
  #bar button{background:var(--good);border:0;color:#062;border-radius:9px;padding:11px 16px;font-weight:700;width:auto}
  #bar button.ghost{background:#0c0e13;border:1px solid var(--line);color:var(--mut);font-weight:600}
  #gate{display:none;position:fixed;inset:0;background:var(--bg);z-index:99;
        flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
  #gate .lk{font-size:40px;margin-bottom:8px}#gate h3{margin:0 0 4px}
  #gate p{color:var(--mut);font-size:13px;margin:0 0 16px}
  #gate input{width:240px;max-width:80vw;text-align:center}
  #gate button{margin-top:12px;background:var(--accent);border:0;color:#fff;border-radius:10px;padding:12px 26px;font-weight:650;width:auto}
  #gateMsg{color:var(--mut);font-size:13px;margin-top:10px;min-height:18px}
  iframe{border:0;width:100%;height:100vh;display:block}
</style></head><body>
  <div id="gate"><div class="lk">&#128274;</div><h3>Finance Review</h3>
    <p>Enter the family password.</p>
    <form id="gateForm" autocomplete="off"><input id="gatePw" type="password" placeholder="Password" autofocus>
    <div><button type="submit">Unlock</button></div></form><div id="gateMsg"></div></div>

  <header>
    <h1>Review transactions</h1>
    <div class="prog" id="prog"></div>
    <div class="tabs"><button data-f="needs" class="on">Needs review</button>
      <button data-f="all">All</button></div>
    <input class="search" id="q" placeholder="Search merchant…">
  </header>
  <div class="wrap"><div id="list"><div class="empty">Loading…</div></div></div>
  <div id="bar"><span class="n" id="barn">No changes yet</span>
    <button class="ghost" id="copy">Copy</button>
    <button id="export">Export</button></div>

function _b64(buf){var u=new Uint8Array(buf),b='';for(var i=0;i<u.length;i++)b+=String.fromCharCode(u[i]);return btoa(b);}
function _ub64(s){var bin=atob(s),u=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u;}
async function _key(pw,salt){var m=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt:salt,iterations:200000,hash:'SHA-256'},m,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);}
async function encryptData(pw,txt){var salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));
  var k=await _key(pw,salt);var ct=await crypto.subtle.encrypt({name:'AES-GCM',iv:iv},k,new TextEncoder().encode(txt));
  return {s:_b64(salt),i:_b64(iv),c:_b64(ct)};}
async function decryptData(pw,p){var k=await _key(pw,_ub64(p.s));
  var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:_ub64(p.i)},k,_ub64(p.c));return new TextDecoder('utf-8').decode(pt);}

var APP_CATS=["Income","Credit-Card Payment","Internal Transfer","Investments & Savings","Loan","Property Tax & Town Bills","Bank Fees & Interest","Fuel & Auto","Alcohol & Cannabis","Subscriptions & Digital","Utilities & Telecom","Insurance","Pets","Health & Personal Care","Kids & Activities","Recreation & Entertainment","Travel","Donations & Gifts","Home & Furniture","Clothing & Beauty","Groceries","Dining & Takeout","Transit & Parking","Shopping - General"];
var APP_SNAP="20260612-1513";
function runApp(DATA){
  // rows: [id,date,amount,category,event,notes,mkey,account,desc]
  var KEY="frev_"+APP_SNAP, deltas={};
  try{ deltas=JSON.parse(localStorage.getItem(KEY)||"{}"); }catch(e){ deltas={}; }
  function persist(){ try{ localStorage.setItem(KEY,JSON.stringify(deltas)); }catch(e){} bar(); }
  function dd(id){ return deltas[id]||null; }
  function effCat(r){ var d=dd(r[0]); return (d&&d.category!=null)?d.category:(r[3]||""); }
  function effEv(r){ var d=dd(r[0]); return (d&&d.event!=null)?d.event:(r[4]||""); }
  function effNo(r){ var d=dd(r[0]); return (d&&d.notes!=null)?d.notes:(r[5]||""); }
  function money(n){var neg=n<0;n=Math.abs(n);return (neg?"-$":"$")+(n>=1000?Math.round(n).toLocaleString():n.toFixed(2));}
  function opts(sel){var o='<option value="">— pick category —</option>';
    APP_CATS.forEach(function(c){o+='<option '+(c===sel?'selected':'')+'>'+c+'</option>';});return o;}
  var FILTER="needs",Q="";
  function groups(){
    var g={};
    DATA.forEach(function(r){var k=r[6];if(!g[k])g[k]={key:k,rows:[],total:0,hasin:false,hasout:false};
      g[k].rows.push(r);g[k].total+=r[2];if(r[2]>0)g[k].hasin=true;else if(r[2]<0)g[k].hasout=true;});
    var out=[];
    Object.keys(g).forEach(function(k){var gr=g[k];
      gr.uncat=gr.rows.filter(function(r){return !effCat(r);}).length;
      gr.needs=gr.uncat>0; gr.bidir=gr.hasin&&gr.hasout;
      var cats={};gr.rows.forEach(function(r){var c=effCat(r);if(c)cats[c]=1;});
      gr.cat=Object.keys(cats).length===1?Object.keys(cats)[0]:"";
      gr.mixed=Object.keys(cats).length>1;
      if(Q&&k.toLowerCase().indexOf(Q)<0)return;
      if(FILTER==="needs"&&!gr.needs)return;
      out.push(gr);});
    out.sort(function(a,b){return (a.needs===b.needs)?(b.rows.length-a.rows.length):(a.needs?-1:1);});
    return out;
  }
  function bar(){
    var n=Object.keys(deltas).length;
    document.getElementById("barn").innerHTML=n?('<b>'+n+'</b> change'+(n>1?'s':'')+' ready to export'):'No changes yet';
    var need=DATA.filter(function(r){return !effCat(r);}).length;
    document.getElementById("prog").innerHTML='<b>'+need+'</b> of '+DATA.length+' still uncategorized';
  }
  function rowDetail(box,gr){
    var d=document.createElement("div");d.className="detail";
    gr.rows.slice().sort(function(a,b){return Math.abs(b[2])-Math.abs(a[2]);}).forEach(function(r){
      var tr=document.createElement("div");tr.className="trow";
      tr.innerHTML='<div class="top"><span>'+r[1]+' &middot; <span class="'+(r[2]>0?'dirin':'dirout')+'">'+money(r[2])+'</span></span></div>'+
        '<div class="desc">'+r[8].trim()+'</div>'+
        '<div class="trc"><select class="rc">'+opts(effCat(r))+'</select>'+
        '<input class="re" placeholder="event" value="'+effEv(r)+'"><input class="rn" placeholder="notes" value="'+effNo(r)+'"></div>';
      function sv(){var c=tr.querySelector(".rc").value;
        deltas[r[0]]=deltas[r[0]]||{};
        if(c)deltas[r[0]].category=c;
        deltas[r[0]].event=tr.querySelector(".re").value.trim();
        deltas[r[0]].notes=tr.querySelector(".rn").value.trim();
        persist();}
      tr.querySelector(".rc").onchange=sv;tr.querySelector(".re").onchange=sv;tr.querySelector(".rn").onchange=sv;
      d.appendChild(tr);
    });
    box.appendChild(d);
  }
  function card(gr){
    var el=document.createElement("div");el.className="card";
    var neg=gr.total<0;
    var samp=gr.rows.slice(0,2).map(function(r){return r[1]+'  '+money(r[2]);}).join(' · ');
    el.innerHTML='<div class="m">'+gr.key+(gr.mixed?'<span class="mix">mixed</span>':'')+'</div>'+
      '<div class="meta">'+gr.rows.length+' txn'+(gr.rows.length>1?'s':'')+' · <span class="amt '+(neg?'neg':'pos')+'">'+money(gr.total)+'</span>'+
      (gr.bidir?' · <span class="mix" style="border-color:var(--warn);color:var(--warn)">in&amp;out</span>':'')+'</div>'+
      '<div class="samples">'+samp+'</div>'+
      '<div class="ctrls"><div class="crow"><select class="cat">'+opts(gr.cat)+'</select>'+
      '<button class="save">Save</button></div>'+
      '<button class="more">+ event / notes</button>'+
      '<input class="ev" placeholder="exception? e.g. toronto-2026" value="'+(gr.rows.length===1?effEv(gr.rows[0]):'')+'">'+
      '<input class="no" placeholder="notes" value="'+(gr.rows.length===1?effNo(gr.rows[0]):'')+'"></div>'+
      (gr.rows.length>1?'<button class="expand">▸ handle individually</button>':'');
    var ctrls=el.querySelector(".ctrls");
    el.querySelector(".more").onclick=function(){ctrls.classList.toggle("open");
      this.textContent=ctrls.classList.contains("open")?'– hide event / notes':'+ event / notes';};
    el.querySelector(".save").onclick=function(){
      var c=el.querySelector(".cat").value, ev=el.querySelector(".ev").value.trim(), no=el.querySelector(".no").value.trim();
      gr.rows.forEach(function(r){deltas[r[0]]=deltas[r[0]]||{};
        if(c)deltas[r[0]].category=c; if(ev)deltas[r[0]].event=ev; if(no)deltas[r[0]].notes=no;});
      persist(); el.classList.add("done");
      if(FILTER==="needs")setTimeout(function(){el.remove();},450);
    };
    var ex=el.querySelector(".expand");
    if(ex)ex.onclick=function(){if(el.querySelector(".detail")){el.querySelector(".detail").remove();ex.textContent="▸ handle individually";}
      else{rowDetail(el,gr);ex.textContent="▾ hide";}};
    return el;
  }
  function render(){
    var list=document.getElementById("list"), gs=groups();
    list.innerHTML="";
    if(!gs.length){list.innerHTML='<div class="empty">Nothing here. 🎉</div>';return;}
    gs.forEach(function(g){list.appendChild(card(g));});
  }
  document.querySelectorAll(".tabs button").forEach(function(b){b.onclick=function(){
    FILTER=b.dataset.f;document.querySelectorAll(".tabs button").forEach(function(x){x.classList.toggle("on",x===b);});render();};});
  var t;document.getElementById("q").oninput=function(e){Q=e.target.value.toLowerCase();clearTimeout(t);t=setTimeout(render,200);};
  function exportText(){return JSON.stringify({snapshot:APP_SNAP,generated:new Date().toISOString(),
    count:Object.keys(deltas).length,changes:deltas});}
  document.getElementById("export").onclick=function(){
    if(!Object.keys(deltas).length){alert("No changes to export yet.");return;}
    var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([exportText()],{type:"application/json"}));
    a.download="review-changes-"+APP_SNAP+".json";a.click();
    alert("Saved review-changes-"+APP_SNAP+".json — put it in your shared Drive folder, then run apply_changes.py at home.");
  };
  document.getElementById("copy").onclick=function(){
    if(!Object.keys(deltas).length){alert("No changes yet.");return;}
    navigator.clipboard.writeText(exportText()).then(function(){alert("Changes copied. Paste into a note to yourself, or save as a .json at home.");},
      function(){alert("Copy failed — use Export instead.");});
  };
  bar(); render();
}
