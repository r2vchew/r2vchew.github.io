e coming soon. Zuckerberg separately said industry-wide AI agent progress \"hasn't really accelerated in the way that we expected.\"", "link": "https://www.businessinsider.com/meta-ai-model-catches-up-openai-gpt-5-says-2026-7", "sources": ["The Rundown AI"], "source_date": "Jul 6", "tags": ["ai"]}, {"id": "cloudflare-ai-crawler-rules-2026-07-06", "section": "news", "headline": "Cloudflare is splitting AI bot traffic into search, agent and training lanes", "summary": "Starting September 15, new domains on Cloudflare will block AI agent and training crawlers by default while still allowing search bots - giving every site owner, including free-tier users, a lever over whether their content gets read, acted on, or trained on. Worth a look if you manage anything with public docs or a blog.", "link": "https://blog.cloudflare.com/content-independence-day-ai-options/", "sources": ["The Neuron"], "source_date": "Jul 6", "tags": ["ai", "governance"]}, {"id": "zero-agent-native-language-2026-07-06", "section": "news", "headline": "Vercel Labs built a programming language designed for AI agents, not humans", "summary": "Zero stores code as a structured graph database instead of text, so an agent queries and patches nodes directly and the compiler validates each change before it lands - no more guessing at diffs. It's early (v0.2.1, no package registry yet) and really only works for small greenfield builds so far.", "link": "https://zerolang.ai/", "sources": ["Staying Ahead of AI"], "source_date": "Jul 6", "tags": ["ai", "tooling"]}, {"id": "retail-real-estate-roundup-2026-07-06", "section": "news", "headline": "McEwan takes over the old Pusateri's space at Bayview Village as First Capital's REIT sale closes", "summary": "Mark McEwan is opening a 9,300 sq ft gourmet grocery store in Toronto's Bayview Village in 2027, part of a wider luxury-district push there. Meanwhile First Capital REIT's sale to KingSett and Choice Properties has been approved, and St. John Knits closed its last Canadian boutique in Vancouver.", "link": null, "sources": ["Retail Insider"], "source_date": "Jul 6", "tags": ["retail"]}, {"id": "canadians-reading-again-2026-07-06", "section": "news", "headline": "Canadians are reading more, especially younger ones", "summary": "BookNet Canada found 79% of Canadians read at least one book last year, with over 90% of 18-to-29-year-olds reading - the highest share for that age group in six years. Book sales rose over 4% and independent bookstores are seeing their first real rebound in two decades.", "link": "https://www.booknetcanada.ca/press-room/2026/5/5/canadians-are-reading-canadian-authors-in-2025", "sources": ["The Peak"], "source_date": "Jul 6", "tags": ["culture", "canada"]}, {"id": "cochrane-local-roundup-2026-07-06", "section": "news", "headline": "Cochrane roundup: first-ever Ironman 70.3 countdown, Stampede weekend picks, and a weed/pest push from Rocky View", "summary": "Cochrane is gearing up to host its first Ironman 70.3, Rocky View County kicked off seasonal weed and pest control, and Found Books is running free concerts this month alongside the usual Stampede spillover coverage.", "link": "https://cochranenow.com/articles/countdown-cochrane-gets-set-for-its-first-ever-ironman-703", "sources": ["CochraneNow"], "source_date": "Jul 5", "tags": ["news", "cochrane"]}, {"id": "cursor-mobile-bugfix-2026-07-06", "section": "training", "headline": "Fix a bug from your phone: screenshot to merged PR with Cursor Mobile", "summary": "Install Cursor's iOS app plus GitHub Mobile, screenshot the broken page with a note on what should happen instead, then prompt a Cursor Cloud agent to investigate, fix, and open the PR - review and merge before you're back at your desk. Enable Remote Agents on desktop so it can prep local changes in the background too.", "link": "https://app.therundown.ai/guides/how-to-go-from-screenshot-to-bug-fix-with-cursor-mobile", "sources": ["The Rundown AI"], "source_date": "Jul 6", "tags": ["ai", "training", "tools"]}, {"id": "nyt-chicken-salad-2026-07-06", "section": "regulars", "headline": "NYT Cooking: Andy Baraghani's crunchy chicken salad", "summary": "Flagged, not read in full - a mayo-free chicken salad built for crunch and summer heat.", "link": null, "sources": ["NYT"], "source_date": "Jul 5", "tags": ["regulars", "cooking"]}, {"id": "costco-new-savings-2026-07-06", "section": "deals", "headline": "Costco: new savings cycle starts today (through Aug 2)", "summary": "Routine Costco warehouse flyer refresh covering electronics, grocery and treasure-hunt items - no standout deal flagged this cycle.", "link": "https://www.costco.ca", "sources": ["Costco"], "source_date": "Jul 6", "tags": ["deals"]}, {"id": "nespresso-subscription-push-2026-07-06", "section": "deals", "headline": "Nespresso: subscription sign-up push with summer accessory gifts", "summary": "Marketing push to set up a recurring coffee-pod subscription in exchange for limited-edition summer gear - the \"last hours\" urgency is marketing theatre, not a real deadline.", "link": "https://www.nespresso.com/ca/en/", "sources": ["Nespresso"], "source_date": "Jul 5", "tags": ["deals"]}, {"id": "ctc-cadence-2026-07-06", "section": "ctc", "headline": "CTC sends: steady cadence, Mark's BOGO 50% jeans is the one worth a look", "summary": "Sportchek pushed running/casual/skate and hiking shoes, Canadian Tire sent tool-storage and backyard-hangout flyers - routine frequency. Mark's \"Can't Miss Summer Event\" BOGO 50% off jeans, jean crops/skirts/shorts and jackets is the standout if you need denim.", "link": null, "sources": ["Sportchek", "Canadian Tire", "Mark's"], "source_date": "Jul 4-6", "tags": ["ctc", "deals"]}]}, {"build_date": "2026-07-05", "build_label": "Sunday, July 5", "entries": [{"id": "ai-release-pattern-frontier-2026-07-05", "section": "news", "headline": "The strongest AI models are starting to reach governments and enterprises before regular users see them", "summary": "OpenAI's GPT-5.6 and Anthropic's Fable 5/Mythos 5 are rolling out through government review, cloud partners, and enterprise deals first, while public chatbots already cover most everyday tasks fine. The read: frontier AI is becoming infrastructure, with access shaped by policy and contracts rather than one clean public launch.", "link": null, "sources": ["The Daily AI Show"], "source_date": "Jul 5", "tags": ["ai", "policy"]}, {"id": "ai-botsitting-hidden-labor-2026-07-05", "section": "news", "headline": "The hidden cost of AI at work: someone still has to check its homework", "summary": "Glean's Work AI Index found workers spend 6.4 hours a week \"botsitting\" - fixing, fact-checking and cleaning up AI output that looks finished but isn't. Separately, BetterUp/Stanford research found 40% of desk workers received AI-generated \"workslop\" last month, costing roughly $186 per employee per month in cleanup time.", "link": null, "sources": ["The Daily AI Show"], "source_date": "Jul 5", "tags": ["ai", "work"]}, {"id": "ai-agent-harness-matters-2026-07-05", "section": "news", "headline": "For AI coding agents, where you run the model matters as much as which model it is", "summary": "A terminal agent, a parallel cloud workspace, and a persistent memory-based agent each demand different supervision habits from the person running them - the same model can look brilliant or erratic depending on the harness around it. Useful framing for anyone building multi-agent workflows.", "link": null, "sources": ["The Daily AI Show"], "source_date": "Jul 5", "tags": ["ai", "training"]}, {"id": "ai-voice-clone-scam-2026-07-05", "section": "news", "headline": "An AI voice clone convinced a father his daughter was in jail - he lost $18,000", "summary": "Scammers posing as police combined a childhood medical detail with a crying AI-cloned voice of his daughter to pressure a San Diego-area man into wiring $18K before he reached the real her.", "link": "https://fox5sandiego.com/news/local-news/poway-man-scammed-ai-voice", "sources": ["There's An AI For That"], "source_date": "Jul 4", "tags": ["ai", "scam"]}, {"id": "ai-chip-independence-push-2026-07-05", "section": "news", "headline": "Anthropic in early talks with Samsung for a custom AI chip", "summary": "Anthropic is discussing a custom Samsung-built processor, joining OpenAI (Broadcom) and others racing to cut Nvidia dependence. No decision yet on scope.", "link": "https://techcrunch.com/2026/07/02/anthropic-is-discussing-a-new-custom-chip-with-samsung/", "sources": ["There's An AI For That", "The Daily AI Show"], "source_date": "Jul 4-5", "tags": ["ai"]}, {"id": "tesla-ai-spend-cap-2026-07-05", "section": "news", "headline": "Tesla caps staff AI tool spending - but exempts Musk's own xAI products", "summary": "Starting July 6, Tesla engineers get $200/week for outside AI tools, while Grok and Composer face no limit. Staff mostly reach for Claude today, so the policy reads as a budget lever aimed at Musk's rivals.", "link": "https://www.telegraph.co.uk/business/2026/07/03/elon-musk-caps-tesla-staffs-ai-spending", "sources": ["There's An AI For That"], "source_date": "Jul 4", "tags": ["ai", "business"]}, {"id": "calgary-retail-roundup-2026-07-05", "section": "news", "headline": "Calgary's Marlborough Mall changes hands as Costco keeps expanding across Canada", "summary": "RYCO Properties acquired Calgary's Marlborough Mall with plans to invest in tenant mix and community programming. Elsewhere, Costco confirmed more new Canadian warehouses are coming, and Walmart is moving into a former Hudson's Bay space at an Ottawa-area mall.", "link": null, "sources": ["Retail Insider"], "source_date": "Jul 4", "tags": ["retail", "calgary"]}, {"id": "cochrane-local-roundup-2026-07-05", "section": "news", "headline": "Cochrane roundup: new part-time firefighters, Stampede spillover, and the Eastern Slopes coal fight continues", "summary": "Rocky View County welcomed a new class of part-time firefighters, CochraneNow flagged what ark's"], "source_date": "Jul 4-5", "tags": ["ctc", "deals"]}]}, {"build_date": "2026-07-04", "build_label": "Saturday, July 4", "entries": [{"id": "ai-june-recap-2026-07-04", "section": "news", "headline": "AI Daily Brief's June wrap: token caps, a government-ordered shutdown, and open-weight models closing the gap", "summary": "June opened with enterprises like Walmart and Uber capping internal AI spend as pricing shifted from subscriptions to pay-per-token, then Anthropic's new Fable 5/Mythos 5 models got cut off from foreign users under a US export-control directive - reportedly triggered by an Amazon jailbreak report - before access returned days later. The pause pushed companies to take open-weight alternatives more seriously (Z.ai's GLM 5.2 is being called the first real \"DeepSeek moment\" since January 2025), while compute itself became a tradeable commodity, with Google agreeing to pay SpaceX $920M a month for data-centre capacity.", "link": "https://www.cnbc.com/2026/06/12/anthropic-disables-access-to-fable-5-and-mythos-5-to-comply-with-government-directive.html", "sources": ["AI Daily Brief"], "source_date": "Jul 4", "tags": ["ai", "policy"]}, {"id": "midjourney-hollywood-discovery-2026-07-04", "section": "news", "headline": "Sued by Hollywood over AI-generated characters, Midjourney demands the studios show their own AI use", "summary": "Disney, Universal, and Warner Bros. are suing Midjourney over character infringement; Midjourney's defence is that the studios already use AI extensively behind the scenes too, and it wants that use disclosed in discovery.", "link": "https://variety.com/2026/film/news/midjourney-studios-ai-copyright-discovery-1236800902/", "sources": ["There's An AI For That"], "source_date": "Jul 3", "tags": ["ai", "media"]}, {"id": "nuclear-ai-factory-demo-2026-07-04", "section": "news", "headline": "A startup ran an Nvidia AI cluster off a nuclear microreactor, live on stage", "summary": "Valar Atomics powered an Nvidia Blackwell system with a microreactor in a live demo and is now building a 30MW closed-loop AI data centre that uses no local water - part of the broader scramble for power to run AI factories.", "link": "https://www.linkedin.com/posts/today-valar-atomics-became-the-first-nuclear-ugcPost-7478266211940708352-guWM/", "sources": ["There's An AI For That"], "source_date": "Jul 3", "tags": ["ai", "energy"]}, {"id": "claude-physics-proof-2026-07-04", "section": "news", "headline": "Claude helped crack a physics problem researchers had been stuck on for years", "summary": "Physicists working on the long-unsolved \"jamming problem\" got a first idea from Claude that turned out to be essentially correct, and used it to finish the proof.", "link": "https://iopscience.iop.org/article/10.1088/1742-5468/ae7bd7", "sources": ["There's An AI For That"], "source_date": "Jul 3", "tags": ["ai"]}, {"id": "cochrane-local-roundup-2026-07-04", "section": "news", "headline": "Cochrane launches 24/7 bylaw dispatch as Springbank Road reopens and Stampede kicks off", "summary": "A new round-the-clock Municipal Enforcement dispatch line went live, Springbank Road has reopened with water now being released from the SR1 reservoir, and Calgary Stampede opened with over 32,000 at Sneak-a-Peek before full programming started today. Also this week: CN moved record June grain volumes despite Prairie flooding, and an Eastern Slopes coal-mining petition failed to qualify with Elections Alberta.", "link": null, "sources": ["CochraneNow"], "source_date": "Jul 3", "tags": ["news", "cochrane"]}, {"id": "alberta-pipeline-route-followup-2026-07-04", "section": "news", "headline": "Why Alberta's new coastal pipeline runs south, not north", "summary": "Despite Premier Danielle Smith's monthslong push for a northern BC route, the pipeline Carney announced this week will run alongside TMX and exit near Vancouver instead - reportedly because a northern route meant fighting coastal First Nations opposition and lifting the tanker eadline": "McDonald's: collectible cups with World Cup meal purchase", "summary": "Routine tie-in promo around Canada's World Cup run - no discount, just collectibles.", "link": null, "sources": ["McDonald's Canada"], "source_date": "Jul 3", "tags": ["deals"]}, {"id": "ctc-cadence-2026-07-04", "section": "ctc", "headline": "CTC frequency check: one more day-only CT Money push, plus the usual roundup", "summary": "Canadian Tire ran a \"Final Week\" 30x CT Money day, Triangle sent its weekend rewards email plus a $10 bonus CT Money offer, and SportChek pitched bike gear - same cadence as recent weeks, no standout deal beyond what's already been flagged this week.", "link": null, "sources": ["Canadian Tire", "Triangle", "Sport Chek"], "source_date": "Jul 3-4", "tags": ["ctc"]}]}, {"build_date": "2026-07-03", "build_label": "Friday, July 3", "entries": [{"id": "ctc-moneytoday-2026-07-03", "section": "now", "headline": "Triangle: 50x CT Money today only on vacuums, kitchen appliances, and cookware", "summary": "Today (July 3) only - 30x everyday plus a 20x bonus on vacuum, kitchen appliance, or cookware purchases paid with a Triangle Mastercard, in-store and online. Needs activation through Triangle Rewards before you buy.", "link": "https://triangle.canadiantire.ca/en/email-offer-activation.html", "sources": ["Triangle"], "source_date": "Jul 3", "tags": ["ctc", "deals"]}, {"id": "openai-govt-stake-2026-07-03", "section": "news", "headline": "OpenAI floats giving the US government a 5% stake", "summary": "OpenAI has held early talks about handing Washington a stake worth tens of billions, structured like Alaska's sovereign wealth fund, and wants Anthropic, Google, and Meta to each kick in 5% of their own equity too - though none have agreed. The pitch is meant to defuse political backlash on AI; critics point out it would also give regulators a financial stake in the companies they're supposed to police.", "link": "https://www.cnbc.com/2026/07/02/openai-proposes-us-government-own-5percent-stake-to-address-political-blowback.html", "sources": ["The Rundown AI", "The Neuron", "The Peak", "AI Daily Brief", "Morning Brew"], "source_date": "Jul 2-3", "tags": ["ai", "policy"]}, {"id": "world-models-vs-llms-2026-07-03", "section": "news", "headline": "Why some AI leaders think language models alone won't reach AGI", "summary": "With text-only training data running low, a wave of well-funded \"world model\" startups (Yann LeCun's AMI Labs, Fei-Fei Li's World Labs, Runway, Luma) is betting real progress needs models that understand physical space and video, not just words. They're chasing the same compute and data bottlenecks as LLMs, just at a bigger scale.", "link": "https://archive.thedeepview.com/p/how-world-models-became-ai-s-next-frontier", "sources": ["The Deep View"], "source_date": "Jul 3", "tags": ["ai"]}, {"id": "sonnet-vs-opus-test-2026-07-03", "section": "news", "headline": "A hands-on test suggests the 'downgraded' default Claude model may be the sharper one", "summary": "After Sonnet 5 became Claude's new default and drew online backlash over cost, a side-by-side test against Opus 4.8 on real tasks - itinerary planning, a policy doc with planted contradictions, misleading stats - found Sonnet matched or beat Opus, including on the skill that matters most for real work: not trusting numbers at face value.", "link": "https://newsletter.stayingahead.com/p/i-lied-to-claude", "sources": ["Staying Ahead of AI"], "source_date": "Jul 3", "tags": ["ai"]}, {"id": "spacex-ai-device-2026-07-03", "section": "news", "headline": "SpaceX reportedly previewed a phone-like AI device to IPO investors", "summary": "The prototype is said to run a proprietary OS and integrate xAI tech, landing days after OpenAI's own hardware ambitions made headlines. Musk has called the report \"utterly false,\" so treat it as unconfirmed.", "link": "https://www.wsj.com/tech/ai/spacex-showed-investors-prototype-of-elon-musks-new-ai-device-b445c57b", "sources": ["The Peak", "AI Daily Brief", "Morning Brew"], "source_date": "Jul 2-3", "tags": ["ai"]}, {"id": "ab-bc-pipeline-tanker-deal-2026-07-03", "section": "news", "headline": "Alberta and BC each claimed a win on energy this week - just not the same one", "summary": "Alberta and Ottawa unveiled a proposed one-million-barrel-a-day pipeline from Bruderheim to BC's southwest coast, with Pembina Pipeline taking a stake and Trans Mountain Corp leading it. Hours earlier, BC and the feds signed a separate deal preserving the North Coast tanker ban, calling it \"generational.\" Both sides calling it a win suggests the real fight is still ahead.", "link": null, "sources": ["The Peak"], "source_date": "Jul 3", "tags": ["news", "alberta"]}, {"id": "calgary-retail-roundup-2026-07-03", "section": "news", "headline": "Calgary's Marlborough Mall changes hands as Costco keeps expanding across Canada", "summary": "RYCO Properties acquired the 385,000-sq-ft northeast Calgary mall from Primaris, with plans to reinvest in tenants and community programming. Elsewhere, Costco confirmed more new Canadian warehouses are coming and Olive Garden opened its first Ontario location as part of a national push.", "link": null, "sources": ["Retail Insider"], "source_date": "Jul 3", "tags": ["retail", "calgary"]}, {"id": "jobs-report-miss-2026-07-03", "section": "news", "headline": "US job growth came in at about half what economists expected", "summary": "The US added just 57,000 jobs in June versus forecasts near double that, with April and May both revised down. Restaurant and hotel hiring actually shrank despite World Cup hopes, while healthcare and construction carried the month. Markets shrugged it off - weaker hiring lowers the odds of a near-term rate hike.", "link": null, "sources": ["Morning Brew", "The Peak"], "source_date": "Jul 3", "tags": ["economy"]}, {"id": "costco-hot-dog-feature-2026-07-03", "section": "news", "headline": "The oral history of Costco's $1.50 hot dog", "summary": "The Ring sources": ["The Deep View", "AI Daily Brief"], "source_date": "Jul 2", "tags": ["ai", "enterprise"]}, {"id": "meta-cloud-business-2026-07-02", "section": "news", "headline": "Meta looks to rent out its spare AI computing power", "summary": "Meta is reportedly building a cloud business to sell excess data-centre capacity and access to its own models - a hedge as its $182.9B AI infrastructure bet has yet to show a clear return. The stock jumped on the news; SpaceX and xAI set the template earlier this year by leasing spare compute to Anthropic and Google.", "link": "https://www.bloomberg.com/news/articles/2026-07-01/meta-is-building-a-cloud-business-to-sell-excess-ai-compute", "sources": ["The Rundown AI", "The Neuron", "Morning Brew", "The Deep View"], "source_date": "Jul 2", "tags": ["ai", "meta"]}, {"id": "walmart-hbc-space-2026-07-02", "section": "news", "headline": "Walmart takes over a former Hudson's Bay store as malls rework empty anchor space", "summary": "Walmart Canada is opening a 115,500-square-foot Supercentre in the old HBC store at Ottawa's Place d'Orléans, an early example of Primaris REIT's strategy for its former Bay locations. Primaris also says it could unlock up to $375M by redeveloping over 100 acres of excess mall land for housing, hotels, and seniors residences.", "link": null, "sources": ["Retail Insider"], "source_date": "Jul 2", "tags": ["retail", "canada"]}, {"id": "cusma-review-2026-07-02", "section": "news", "headline": "US declines to renew CUSMA, starting a decade of annual reviews instead", "summary": "The trade pact stays in force, but Canada, Mexico, and the US now face rolling annual reviews with a 2036 expiry if no long-term deal is reached. Expected, but it keeps trade uncertainty hanging over cross-border retail, auto, and agri-food businesses.", "link": null, "sources": ["The Peak", "Morning Brew"], "source_date": "Jul 2", "tags": ["news", "trade"]}, {"id": "design-md-guide-2026-07-02", "section": "training", "headline": "Guide: use Google's Design.md standard to keep AI-built sites on-brand", "summary": "Install Google's open-source Stitch skills into Claude Code, then have it generate a DESIGN.md brief from a simple site idea (or extract one from an existing site) so every future page or prototype it builds stays consistent with the brand.", "link": "https://app.therundown.ai/guides/use-googles-design-md-standard-to-build-a-consistent-brand", "sources": ["The Rundown AI"], "source_date": "Jul 2", "tags": ["ai", "training"]}, {"id": "nyt-well-digest-2026-07-02", "section": "regulars", "headline": "NYT Well sent its usual lifestyle digest", "summary": "A piece on when it's fine to leave the AC running while you're out - flagged, not read in full.", "link": null, "sources": ["NYT Well"], "source_date": "Jul 1", "tags": ["regulars"]}, {"id": "safeway-liquor-flyer-2026-07-02", "section": "deals", "headline": "Safeway Liquor: weekly flyer, July 2-8", "summary": "Spend $150, get 1,000 Scene+ points, plus BC-focused offers all week - routine flyer cadence.", "link": null, "sources": ["Safeway Liquor"], "source_date": "Jul 2", "tags": ["deals"]}, {"id": "skipthedishes-summer-savings-2026-07-02", "section": "deals", "headline": "SkipTheDishes: up to 50% off, plus a small points balance expiring", "summary": "Same routine promo cadence as recent weeks, order-size-dependent discounts.", "link": null, "sources": ["SkipTheDishes"], "source_date": "Jul 1", "tags": ["deals"]}, {"id": "joe-fresh-summer-savings-2026-07-02", "section": "deals", "headline": "Joe Fresh: apparel sale plus bonus PC Optimum points, framed as a final call", "summary": "20K PC Optimum points per $75 spent on apparel - routine promo, 'final call' framing discounted.", "link": null, "sources": ["Joe Fresh"], "source_date": "Jul 1", "tags": ["deals"]}, {"id": "ctc-cadence-2026-07-02", "section": "ctc", "headline": "CTC frequency check: Sport Chek, Canadian Tire, and Triangle kept up their usual cadence", "summary": "Sport Chek sent a weekly deals roundup, Canadian Tire previewed fresh summer markdowns, and Triangle offered bonus CT Money on Canada Day fuel-ups. A Canadian Tire Financial Services email also pitched a balance-transfer offer on the credit card - no specifics published here.", "link": null, "sources": ["Sport Chek", "Canadian Tire", "Triangle", "CTFS"], "source_date": "Jul 1-2", "tags": ["ctc"]}]}]</script>
<script>
const NTFY_CURATE = "https://ntfy.sh/emarifeed-k7f3qx9m2p-curate";
const SECTIONS = {
  now:      { label: "Now",      icon: "⚡" },
  news:     { label: "News",     icon: "📰" },
  training: { label: "AI Training", icon: "🎓" },
  regulars: { label: "Regulars", icon: "📬" },
  deals:    { label: "Deals",    icon: "🛍️" },
  ctc:      { label: "CTC",      icon: "🔺" }
};
const SECTION_ORDER = ["now", "news", "training", "regulars", "deals", "ctc"];
const DAYS = JSON.parse(document.getElementById("data").textContent); // newest first
const state = { tab: "today", sec: "all", q: "" };
const votes = JSON.parse(localStorage.getItem("eo-votes") || "{}");

function setTab(t) {
  state.tab = t;
  document.getElementById("tab-today").classList.toggle("on", t === "today");
  document.getElementById("tab-week").classList.toggle("on", t === "week");
  render();
}
function setSec(s) { state.sec = s; render(); }

function matches(e) {
  if (state.sec !== "all" && e.section !== state.sec) return false;
  if (!state.q) return true;
  const hay = (e.headline + " " + e.summary + " " + (e.tags || []).join(" ") + " " + e.sources.join(" ")).toLowerCase();
  return state.q.toLowerCase().split(/\s+/).every(w => hay.includes(w));
}

function esc(s) { return s.replace(/&/g, "&amp;").replace(/</g, "&lt;"); }

function card(e) {
  const v = votes[e.id] || "";
  const link = e.link ? `<a class="more" href="${e.link}" target="_blank" rel="noopener">Read more →</a>` : "";
  return `<div class="card${e.section === "now" ? " urgent" : ""}">
    <p class="hl">${esc(e.headline)}</p>
    <div class="sum-wrap">
      <p class="sum clamp">${esc(e.summary)}</p>
      <button class="more-toggle" onclick="toggleMore(this)">&hellip;more</button>
    </div>
    <div class="meta">
      <span class="src"><span class="badge">${SECTIONS[e.section].icon} ${SECTIONS[e.section].label}</span>${esc(e.sources.join(" + "))} · ${esc(e.source_date)}</span>
      <span class="actions">${link}
        <button class="thumb${v === "up" ? " on" : ""}" onclick="vote('${e.id}','up',this)">👍</button>
        <button class="thumb${v === "down" ? " on" : ""}" onclick="vote('${e.id}','down',this)">👎</button>
      </span>
    </div>
  </div>`;
}

function render() {
  // chips with counts for current tab scope
  const scope = state.tab === "today" ? DAYS.slice(0, 1) : DAYS;
  const all = scope.flatMap(d => d.entries);
  let chips = `<button class="chip${state.sec === "all" ? " on" : ""}" onclick="setSec('all')">All</button>`;
  for (const s of SECTION_ORDER) {
    const n = all.filter(e => e.section === s).length;
    if (!n) continue;
    chips += `<button class="chip${state.sec === s ? " on" : ""}" onclick="setSec('${s}')">${SECTIONS[s].icon} ${SECTIONS[s].label}</button>`;
  }
  document.getElementById("chips").innerHTML = chips;

  let html = "";
  if (state.tab === "today") {
    const day = DAYS[0];
    for (const s of SECTION_ORDER) {
      const items = day.entries.filter(e => e.section === s && matches(e));
      if (!items.length) continue;
      html += `<div class="sec-h">${SECTIONS[s].icon} ${SECTIONS[s].label} <span class="count">${items.length}</span></div>`;
      html += items.map(card).join("");
    }
  } else {
    for (const day of DAYS) {
      const items = day.entries.filter(matches);
      if (!items.length) continue;
      html += `<div class="day-h">${esc(day.build_label)}</div>`;
      html += items.map(card).join("");
    }
  }
  document.getElementById("main").innerHTML = html || `<div class="empty">Nothing matches. Try clearing the search or filter.</div>`;
  // Only reveal the "…more" toggle on summaries that actually overflow two lines.
  document.querySelectorAll(".sum.clamp").forEach(s => {
    if (s.scrollHeight - s.clientHeight > 2) s.nextElementSibling.classList.add("show");
  });
}

function toggleMore(btn) {
  const sum = btn.previousElementSibling;
  const collapsed = sum.classList.toggle("clamp"); // true = now clamped
  btn.classList.toggle("open", !collapsed);
  btn.innerHTML = collapsed ? "&hellip;more" : "less";
}

function vote(id, dir, btn) {
  const prev = votes[id];
  const action = prev === dir ? "retract" : dir;
  if (action === "retract") delete votes[id]; else votes[id] = dir;
  localStorage.setItem("eo-votes", JSON.stringify(votes));
  const entry = DAYS.flatMap(d => d.entries).find(e => e.id === id);
  fetch(NTFY_CURATE, {
    method: "POST",
    headers: { "X-Title": "Email Overview feedback" },
    body: `${action.toUpperCase()} | ${id} | ${entry ? entry.headline : ""}`
  }).then(() => toast(action === "retract" ? "Feedback removed" : (dir === "up" ? "More like this 👍" : "Less of this 👎")))
    .catch(() => toast("Couldn't send - no connection?"));
  render();
}

let toastTimer;
function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 1800);
}

render();
</script>
