<script type="application/json" id="data">[{"build_date": "2026-06-18", "build_label": "Thursday, June 18", "entries": [{"id": "now-ct-30x-2026-06-18", "section": "now", "headline": "Today only: 30x CT Money at Canadian Tire", "summary": "Canadian Tire is running a one-day 30x Total CT Money event on June 18. Worth timing a planned purchase to today rather than tomorrow if you've got something in the cart.", "link": "https://www.canadiantire.ca/", "sources": ["Canadian Tire"], "source_date": "Jun 18", "tags": ["ctc", "deals", "now"]}, {"id": "ai-governance-g7-equity-2026-06-18", "section": "news", "headline": "At the G7, AI leaders push a US-led coalition - while Washington quietly weighs taking equity in AI companies", "summary": "Two threads converged this week. At the G7 in France, Anthropic's Dario Amodei and Google DeepMind's Demis Hassabis (backed by Sam Altman and PM Mark Carney) called for a US-led international coalition to set rules on model access, chip exports, and safety - this against the backdrop of the ongoing standoff over Washington's export restrictions that took Anthropic's top models (Mythos 5 and Fable 5) offline. Separately, Semafor reported senior Trump officials had discussed the government taking equity stakes in major AI firms - via 'Trump Accounts' or a sovereign wealth fund - before the export fight. The shift worth noting: Washington is moving from regulating AI to negotiating leverage and ownership over it. Macron and Modi both warned that a US 'off switch' on frontier models is a risk for everyone.", "link": "https://www.semafor.com/article/06/17/2026/trump-advisers-weigh-structure-of-potential-ai-stakes", "sources": ["The Rundown AI", "The Deep View", "The Neuron"], "source_date": "Jun 18", "tags": ["ai", "policy", "anthropic", "g7"]}, {"id": "databricks-genie-2026-06-18", "section": "news", "headline": "Databricks pitches 'open ecosystems' as the fix for enterprise agent sprawl", "summary": "At its Data + AI Summit, Databricks CEO Ali Ghodsi called the current state of enterprise AI a 'complete mess' - every SaaS vendor now ships its own agent, builder, and MCP server, creating lock-in and cross-platform chaos on top of the cost overruns and data-leakage problems agents already cause. Databricks' answer is its own agent suite, Genie (One, Ontology, App Builder, Agent, Code), but its real bet is openness: customers say they value not being trapped. Directly relevant to your multi-agent and SharePoint-grounded work - this is the lock-in-vs-open debate playing out at the platform level.", "link": "https://www.thedeepview.com/articles/why-databricks-may-have-answer-for-agent-chaos", "sources": ["The Deep View"], "source_date": "Jun 18", "tags": ["ai", "enterprise", "databricks", "strategy"]}, {"id": "pew-ai-2026-2026-06-18", "section": "news", "headline": "Pew: half of US adults now use AI chatbots, but trust keeps sliding", "summary": "Pew's 2026 survey of 5,000+ US adults shows adoption and optimism running in opposite directions. About half now use a chatbot (a quarter daily), up from a third in 2024 - yet nearly 40% expect AI to make society worse over 20 years and just 16% expect better. The under-30 group leans on AI hardest but trusts it least. On platform share: ChatGPT 44%, Gemini 24%, Claude just 6% - a reminder that Anthropic dominates industry chatter while barely registering with the average American.", "link": "https://www.pewresearch.org/internet/2026/06/17/americans-and-ai-2026-chatbots-smart-devices-and-views-on-impact/", "sources": ["The Rundown AI", "The Neuron"], "source_date": "Jun 18", "tags": ["ai", "data", "adoption"]}, {"id": "claude-code-expertise-2026-06-18", "section": "news", "headline": "Anthropic study: your domain expertise matters more than your coding skill when working with AI", "summary": "Anthropic analyzed 400K Claude Code sessions and found a user's expertise in their own field drives success more than general coding ability. Users made ~70% of planning decisions; Claude handled ~80% of execution. Experts pulled far more out of each prompt (12 actions / 3,200 words vs a beginner's 5 actions / 600 words), and lawyers, managers, and scientists with no coding title nearly matched software engineers on coding tasks. The throughline for your AI-fluency-as-complement-to-data-skills thesis: the value of agents is capped less by the model than by how well the user understands the actual job.", "link": "https://www.anthropic.com/research/claude-code-expertise", "sources": ["The Rundown AI"], "source_date": "Jun 18", "tags": ["ai", "research", "skills", "work"]}, {"id": "review-code-by-risk-2026-06-18", "section": "news", "headline": "A useful mental model: review AI-written code by risk, not by size", "summary": "Ramp's head of applied AI, Rahul Sengottuvelu, argues a 12-line change to login code can be more dangerous than a 1,200-line settings-page change. The rule: classify changes as high risk (auth, payments, data access, PII), medium (business logic), or low (UI, plumbing), then keep high-risk diffs small enough for line-by-line human review while verifying low-risk ones with tests, feature flags, or shadow mode. The forward-looking workflow Anthropic's Boris Cherny added: model + verifier in a loop - but with humans flagging what to inspect, not the AI approving its own work. A clean governance pattern as you scale agent workflows.", "link": "https://x.com/rahulgs/status/2067257255825686880", "sources": ["The Neuron"], "source_date": "Jun 18", "tags": ["ai", "workflow", "governance"]}, {"id": "midjourney-medical-2026-06-18", "section": "news", "headline": "Midjourney pivots into medical imaging with a 60-second full-body scanner", "summary": "The AI image company introduced Midjourney Medical and the Midjourney Scanner - a full-body ultrasound that fires millions of sound waves through water to build a detailed internal scan in about 60 seconds. The first 'Midjourney Spa' is planned for San Francisco in 2027, with a long-term goal of 50,000 scanners worldwide. Odd, ambitious, and a sign of how far AI-native companies are wandering from their lanes.", "link": "https://www.midjourney.com/medical/blogpost", "sources": ["The Neuron"], "source_date": "Jun 18", "tags": ["ai", "health", "hardware"]}, {"id": "allbirds-smartbird-2026-06-18", "section": "news", "headline": "Allbirds finishes its pivot, rebranding as 'Smartbird' and selling off the shoe business", "summary": "The sneaker brand once favoured by tech workers completed its turn into an AI infrastructure company, rebranding as Smartbird Inc. (after an April stint as NewBird AI) and naming former Danish AI-infrastructure exec Nadia Carlsten CEO. Its footwear assets are sold and gone; the stock jumped 39%. A small, strange marker of how hard companies are willing to chase the AI label.", "link": "https://www.reuters.com/business/retail-consumer/allbirds-rebrands-smartbird-ai-pivot-hires-former-aws-executive-ceo-2026-06-17/", "sources": ["Morning Brew", "The Deep View"], "source_date": "Jun 18", "tags": ["ai", "retail", "markets"]}, {"id": "fed-warsh-2026-06-18", "section": "news", "headline": "Warsh's first Fed meeting: rates held, but hikes now on the table for 2026", "summary": "New Fed Chair Kevin Warsh held the benchmark rate steady at 3.50-3.75%, but officials signalled rate hikes are likely this year - nine of 19 projected a hike (up from none in March), pushing markets down sharply. Despite being nominated by Trump with an expectation he'd cut quickly, hot inflation from the Iran war has flipped the script. Warsh is also standing up five task forces to review Fed data methods, communications, and AI's effect on growth.", "link": "https://www.bbc.com/news/articles/cdjkl78vd7lo", "sources": ["Morning Brew", "Read The Peak"], "source_date": "Jun 18", "tags": ["markets", "economy", "fed"]}, {"id": "us-iran-mou-2026-06-18", "section": "news", "headline": "US and Iran sign a 14-point memorandum to end hostilities", "summary": "Washington released the memorandum of understanding with Iran, signed by both presidents, kicking off final negotiations in Switzerland. In exchange for reopening the Strait of Hormuz and pledging no nuclear weapons, Iran can sell oil immediately and would see sanctions waived if it meets nuclear terms; a $300B rebuilding fund is established (the US says it won't contribute). The two sides have 60 days to finalize - the inflation backdrop behind this week's Fed caution.", "link": null, "sources": ["Morning Brew"], "source_date": "Jun 18", "tags": ["world", "iran", "oil"]}, {"id": "canada-psychedelics-2026-06-18", "section": "news", "headline": "Conservative MP tables a bill to partially legalize medical psychedelics in Canada", "summary": "MP Corey Tochor's bill would reclassify psychedelics like psilocybin (currently treated like heroin) so doctors could prescribe them for depression, PTSD, and other mental-health conditions. Comparisons cited: Oregon (~17,000 clients since 2023, few complications) and Australia's psychiatrist-led system. The catch is cost - clinical psychedelic therapy runs expensive, and a third of Oregon's licensed centres have already closed.", "link": "https://www.cbc.ca/news/politics/magic-mushrooms-drug-legalization-conservatives-9.7236254", "sources": ["Read The Peak"], "source_date": "Jun 18", "tags": ["canada", "health", "policy"]}, {"id": "lululemon-china-2026-06-18", "section": "news", "headline": "Lululemon apologizes after a Great Wall yoga event used a Japanese drum", "summary": "Lululemon issued an apology after its May yoga festival on the Great Wall featured what looked like a Japanese taiko drum - poorly timed given current China-Japan tensions, and badly received on Chinese social media. The stakes are real: mainland China (revenue up 29% last year) has been the lifeline as Lulu's Americas sales slip and shares hit a seven-year low. A clean cautionary tale on cultural-fit risk in a market Western brands increasingly depend on.", "link": "https://www.theguardian.com/media/2026/jun/17/lululemon-apologises-japanese-drum-great-wall-china-yoga-event", "sources": ["Read The Peak"], "source_date": "Jun 18", "tags": ["retail", "china", "brand"]}, {"id": "calgary-mcdonalds-taza-2026-06-18", "section": "news", "headline": "A new McDonald's at Taza's Buffalo Run will be Alberta's first designed with Tsuut'ina cultural guidance", "summary": "The Calgary-area Taza development announced a McDonald's at Buffalo Run that's the first in Alberta shaped by guidance from the Tsuut'ina-Taza Cultural Advisory Working Group. A small but notable local example of retail design built with Indigenous community input.", "link": "https://retail-insider.com/", "sources": ["Retail Insider"], "source_date": "Jun 18", "tags": ["retail", "calgary", "local"]}, {"id": "retail-canada-roundup-2026-06-18", "section": "news", "headline": "Canadian retail roundup: Playdium's biggest location, a grocery anchor for CF Richmond, and loyalty programs everywhere", "summary": "Also in the Canadian retail pile: Cineplex opened a 24,000 sq ft Playdium at Vaughan Mills with the most attractions of any in Canada; Fresh St. Market will anchor the CF Richmond Centre redevelopment in 2027; Dollarama joined the Blue Rewards program (and Pharmasave launched it across its stores) as loyalty becomes a cost-of-living tool; Groupe Dynamite posted 37% revenue growth and a four-year-high margin; and A&W brought back its Root Beer Float for a limited run.", "link": "https://retail-insider.com/", "sources": ["Retail Insider"], "source_date": "Jun 18", "tags": ["retail", "canada", "loyalty"]}, {"id": "canada-population-datacentre-2026-06-18", "section": "news", "headline": "Canada's population fell for a third straight quarter; Hamilton may pause a big data centre", "summary": "Two Canadian data points worth a glance: StatCan estimates the population dropped 55,000 in Q1, driven by 118,000 fewer temporary residents (Ottawa is steering the temporary-resident share from 6.1% toward a 5% target). And Hamilton is on the verge of pausing a proposed data centre after public backlash over the rapid AI buildout - an early sign of local pushback on AI infrastructure.", "link": "https://globalnews.ca/news/11909502/hamilton-advances-proposed-data-centre-moratorium-in-pushback-to-rapid-ai-buildout/", "sources": ["Read The Peak"], "source_date": "Jun 18", "tags": ["canada", "economy", "ai-infrastructure"]}, {"id": "cochrane-local-2026-06-18", "section": "news", "headline": "Around Cochrane: Banff-area closure for hungry bears, longer pharmacy refills, and a $100K lottery win", "summary": "From CochraneNow: a Banff-area trail closure after bears were spotted feeding (worth knowing if you're planning a hike), a new Alberta pharmacy deal bringing longer prescription refills and rural pilot projects, and a local couple's $100,000 Lotto Max Extra win. Also in the mix: a UCP nomination meet-and-greet and Country Thunder act Brettyn Rose.", "link": "https://cochranenow.com/articles/hungry-bears-prompt-banff-area-closure", "sources": ["CochraneNow"], "source_date": "Jun 17", "tags": ["local", "cochrane", "alberta"]}, {"id": "training-antigravity-crm-2026-06-18", "section": "training", "headline": "AI Training: build and host a custom CRM with Google Antigravity", "summary": "The Rundown's walkthrough turns a plain-English spec into a hosted full-stack CRM. The key move: make the agent plan first, then build on Firebase so the app gets real login, saved data, search, and a live URL. Steps: (1) download and open Google Antigravity; (2) create a clean folder and open it in the app; (3) sign in with Google; (4) give it a two-line prompt naming the features and stack (React, Vite, TypeScript, Firebase Auth, Firestore, Hosting; 'plan first'); (5) review the plan and cut any scope creep like billing or teams; (6) have it walk you through installing Firebase, then deploy and test the live URL. Going further: add Google login, auto-set-up Analytics, or connect a custom domain.", "link": "https://app.therundown.ai/guides/build-and-host-a-custom-crm-with-google-antigravity", "sources": ["The Rundown AI"], "source_date": "Jun 18", "tags": ["training", "google-antigravity", "build"]}, {"id": "nyt-sneakers-2026-06-18", "section": "regulars", "headline": "NYT Wirecutter: sneakers that look like dress shoes", "summary": "The Recommendation's pick on sneakers dressy enough to pass as dress shoes, plus flight-comfortable pants. Body not read - a quick scroll if you want a versatile shoe. Also in the pile: Google announced a new Gemini-powered Google Home Speaker.", "link": "https://www.nytimes.com/wirecutter", "sources": ["NYT Wirecutter", "Google"], "source_date": "Jun 17", "tags": ["wirecutter", "style"]}, {"id": "deals-fathers-day-2026-06-18", "section": "deals", "headline": "Father's Day deals landing ahead of Sunday (June 21)", "summary": "A wave of dad-targeted promos this week: Nespresso is offering a free limited-edition cooler bag with a coffee order, and Costco pushed Father's Day cell phone offers (Apple, Samsung) plus last-minute cruise deals. Nothing must-buy, but worth a look if you're sorting a gift before Sunday.", "link": "https://www.nespresso.com/ca/en/", "sources": ["Nespresso", "Costco"], "source_date": "Jun 17", "tags": ["deals", "fathers-day"]}, {"id": "deals-safeway-flyer-2026-06-18", "section": "deals", "headline": "Safeway weekly flyer: spend $125, get 1,000 points (June 18-24)", "summary": "This week's Safeway/liquor flyer runs June 18-24 with an all-week spend-$125-get-1,000-points offer. Routine weekly cycle - flag it if your shop lands above that threshold anyway.", "link": "https://www.safeway.ca/", "sources": ["Safeway"], "source_date": "Jun 17", "tags": ["deals", "grocery"]}, {"id": "ctc-tracker-2026-06-18", "section": "ctc", "headline": "CTC banners: heavy promo week - SportChek and Mark's both running 'Big' events, plus a CT super sale incoming", "summary": "Cadence note - it's a loud week across the banners. SportChek's Big Chek Event runs through June 24 with a weekend-only spend-$125-get-$30-code offer; Mark's This. Is. Big. Event includes 25% off Columbia; and Canadian Tire teased a 'Great Canadian Super Sale' in its next weekly flyer, on top of today's one-day 30x CT Money. SportChek and Mark's are your banners - the back-to-back event stacking is the pattern worth watching.", "link": "https://www.sportchek.ca/", "sources": ["SportChek", "Mark's", "Canadian Tire"], "source_date": "Jun 18", "tags": ["ctc", "sportchek", "marks", "deals"]}]}, {"build_date": "2026-06-17", "build_label": "Wednesday, June 17", "entries": [{"id": "spacex-cursor-2026-06-17", "section": "news", "headline": "SpaceX passes Amazon in value after its IPO surge, then buys AI coding startup Cursor for $60B", "summary": "After listing Friday at $135, SpaceX stock has rocketed nearly 49%, briefly making it the fourth-largest US company (around $2.65T) and Elon Musk the world's first trillionaire. It used the windfall to exercise a $60B all-stock option to acquire Cursor, the fast-growing AI coding startup, to help its struggling xAI/Grok catch up to Anthropic and OpenAI on enterprise coding. The skeptic's footnote: SpaceX is the only company in the top seven that lost money last year (on $18.7B revenue), and on Monday it made up roughly 75% of all retail single-stock buys.", "link": "https://techcrunch.com/2026/06/16/spacex-to-acquire-cursor-for-60b-in-stock-days-after-blockbuster-ipo/", "sources": ["The Rundown AI", "The Deep View", "Morning Brew", "Read The Peak"], "source_date": "Jun 17", "tags": ["ai", "markets", "spacex", "m-and-a"]}, {"id": "token-panic-2026-06-17", "section": "news", "headline": "Enterprises hit 'token panic' as AI inference bills blow past budgets", "summary": "At Databricks' Data + AI Summit, executives described AI inference costs running so far over budget it has become a crisis - one put it as 'the coding agents have run our token bills out of control,' another as last year letting every flower bloom, now coming in with a lawnmower. Two fixes are emerging: smarter model selection (stop routing simple tasks to frontier models like Claude, GPT, and Gemini) and hybrid compute (running cheaper open models on your own hardware). It's bad news for OpenAI and Anthropic, the biggest beneficiaries of unlimited-token access, and a growing line of vendors - Databricks' Unity AI Gateway among them - now want to help companies meter and route it. This is the enterprise-AI cost story playing out in real time.", "link": "https://www.thedeepview.com/articles/why-token-panic-is-reshaping-ai", "sources": ["The Deep View"], "source_date": "Jun 17", "tags": ["ai", "enterprise", "cost", "strategy"]}, {"id": "glm-52-2026-06-17", "section": "news", "headline": "China's Z AI releases GLM-5.2, an open-weights model that rivals GPT-5.5 and nears Claude Opus 4.8 on coding", "summary": "GLM-5.2 (MIT licence, 1M-token context) beats GPT-5.5 on real-world coding, reasoning, and math benchmarks and lands just below Claude Opus 4.8 - the closest an open model has come to the top closed systems, and at a fraction of the price. The timing matters: it arrives exactly as enterprises hunt for cheaper alternatives to frontier models.", "link": "https://z.ai/blog/glm-5.2", "sources": ["The Rundown AI", "The Deep View"], "source_date": "Jun 17", "tags": ["ai", "open-models", "china"]}, {"id": "chatgpt-share-2026-06-17", "section": "news", "headline": "ChatGPT's market share slips below 50% for the first time, with Claude gaining", "summary": "OpenAI's ChatGPT dropped below 50% market share for the first time since its launch, largely thanks to Anthropic's Claude. Context worth holding alongside it: OpenAI spent about US$34B last year against roughly $13B in revenue.", "link": "https://techcrunch.com/2026/06/16/chatgpts-market-share-slips-below-50-for-first-time/", "sources": ["The Deep View", "Read The Peak"], "source_date": "Jun 17", "tags": ["ai", "openai"]}, {"id": "copilot-cowork-ga-2026-06-17", "section": "news", "headline": "Microsoft makes Copilot Cowork generally available - on usage-based pricing", "summary": "Microsoft launched Copilot Cowork worldwide, an AI agent that runs multi-step tasks across M365 apps, and put it on usage-based pricing - a direct nod to the same token-cost pressure enterprises are wrestling with. Directly relevant to your Copilot and SharePoint-grounded agent work.", "link": "https://www.microsoft.com/en-us/microsoft-365/blog/2026/06/16/copilot-cowork-is-now-generally-available/", "sources": ["The Rundown AI", "The Deep View"], "source_date": "Jun 17", "tags": ["ai", "microsoft", "enterprise"]}, {"id": "anthropic-g7-ban-2026-06-17", "section": "news", "headline": "Trump administration rejects UK request to exempt G7 allies from the Anthropic model export ban", "summary": "Following the US restriction on Anthropic's top models, the administration reportedly turned down UK PM Keir Starmer's request to exempt G7 allies from the export ban - keeping even close partners locked out of the frontier models. A continuation of yesterday's Fable 5 ban story.", "link": "https://nypost.com/2026/06/16/business/trump-admin-open-to-talks-with-anthropic-over-foreigner-ban/", "sources": ["The Rundown AI"], "source_date": "Jun 17", "tags": ["ai", "policy", "anthropic"]}, {"id": "snap-specs-2026-06-17", "section": "news", "headline": "Snap unveils $2,195 SPECS AR glasses, pitched as a 'wearable computer'", "summary": "Snap revealed SPECS at the Augmented World Expo - lightweight AR glasses with a 51-degree display (roughly a 24-inch monitor in your field of view), about four hours of battery, shipping this fall for US$2,195. Snap frames them as replacing screens rather than supplementing them, joining Meta and Apple in the race to sell computers for your face. The catch reviewers flagged: at ~135g they may be heavier than is comfortable for all-day wear.", "link": "https://www.thedeepview.com/articles/snap-s-usd2k-ar-glasses-want-to-compete-with-pcs", "sources": ["The Deep View", "Morning Brew", "Read The Peak"], "source_date": "Jun 17", "tags": ["tech", "ar", "hardware"]}, {"id": "meta-ai-morale-2026-06-17", "section": "news", "headline": "Meta promises a culture reset as morale in its AI unit craters", "summary": "Meta CTO Andrew Bosworth pledged manager caps, fewer forced transfers, internal mobility, and better perks after reports that thousands of employees were shoved into AI 'grunt work' supporting model training - one called the unit 'the gulag.' He admitted Meta 'did an atrocious job explaining the vision' of its March AI reorg. The backlash also hit mandatory employee mouse-tracking used to collect AI training data.", "link": "https://www.wired.com/story/andrew-bosworth-meta-employees-unrest/", "sources": ["The Rundown AI"], "source_date": "Jun 17", "tags": ["ai", "meta", "workplace"]}, {"id": "cbc-hockey-night-2026-06-17", "section": "news", "headline": "CBC drops Hockey Night in Canada after 74 years", "summary": "CBC will no longer broadcast NHL games starting next season after failing to renew its sublicensing deal with Rogers Sportsnet, the league's Canadian rightsholder. It plans to replace the Saturday night block with programming on Canadian Olympic athletes - which, as The Peak dryly noted, is unlikely to pull the same numbers as Saturday hockey.", "link": "https://www.cbc.ca/sports/cbc-nhl-hockey-night-in-canada-ends-9.7236977", "sources": ["Read The Peak"], "source_date": "Jun 17", "tags": ["canada", "sports", "media"]}, {"id": "gofundme-essentials-2026-06-17", "section": "news", "headline": "More Canadians are turning to GoFundMe to cover groceries and bills", "summary": "Over 15,000 Canadian fundraisers for 'essential needs' - bills, groceries, housing - were launched in the first five months of 2026, a 274% jump since 2020. It tracks a widening wealth gap: the top 20% of households now hold 65.5% of net worth, the bottom 40% just 3.1%. Shelter costs are up 28.5% and groceries over 30% since before the pandemic. Most of these emergency campaigns don't hit their targets.", "link": "https://www.cbc.ca/radio/costofliving/cost-of-living-canadian-crownfunding-bills-expensive-9.7235630", "sources": ["Read The Peak"], "source_date": "Jun 17", "tags": ["canada", "economy", "cost-of-living"]}, {"id": "competition-bureau-grocery-2026-06-17", "section": "news", "headline": "Competition Bureau opens a probe into whether weak competition is inflating Canadian grocery prices", "summary": "Canada's Competition Bureau is investigating competition factors across the food supply chain and is seeking input from Canadians and industry. It lands amid survey data showing rising costs have hit roughly 95% of Canadians' finances, with solo households feeling grocery inflation hardest.", "link": "https://www.cbc.ca/news/business/competition-bureau-canada-food-supply-chain-grocery-prices-9.7237172", "sources": ["Read The Peak", "Retail Insider"], "source_date": "Jun 17", "tags": ["canada", "retail", "grocery"]}, {"id": "g7-summit-2026-06-17", "section": "news", "headline": "G7 leaders meet in France with Ukraine, Iran, and AI on the agenda", "summary": "Leaders of the G7 gathered in Evian-les-Bains. With the US and Iran tentatively agreeing to halt hostilities, attendees pushed to refocus on Ukraine's defence - several, including Trump, signalled they could reimpose Russian oil sanctions, though Trump sent mixed messages on US involvement. PM Mark Carney announced new sanctions on Russia and held talks with Italy about a possible trainer-jet purchase.", "link": "https://www.cbc.ca/news/politics/carney-zelenskyy-sanctions-meeting-9.7236829", "sources": ["Morning Brew", "Read The Peak"], "source_date": "Jun 17", "tags": ["world", "g7", "canada"]}, {"id": "pizza-hut-sale-2026-06-17", "section": "news", "headline": "Yum Brands sells Pizza Hut for $2.7B", "summary": "Yum Brands is offloading Pizza Hut in two deals - private equity firm LongRange Capital takes operations outside mainland China for $1.5B, and Yum China takes the rest for $1.2B. The chain's share of Yum revenue has shrunk every year since 2019 as Domino's and delivery apps ate into it. Yum keeps KFC and Taco Bell.", "link": "https://www.morningbrew.com/daily", "sources": ["Morning Brew"], "source_date": "Jun 17", "tags": ["retail", "food", "m-and-a"]}, {"id": "zellers-diner-2026-06-17", "section": "news", "headline": "Zellers to bring back diner food and kiddie rides as it preps a Toronto store", "summary": "Zellers is reviving diner-inspired food, kiddie rides, and a giant Zeddy Bear for its upcoming Toronto location, building on the Edmonton store's success, with COO Joey Benitah pointing to expansion plans across Canada. A nostalgia play aimed squarely at families.", "link": "https://retail-insider.com/", "sources": ["Retail Insider"], "source_date": "Jun 17", "tags": ["retail", "canada", "nostalgia"]}, {"id": "retail-canada-roundup-2026-06-17", "section": "news", "headline": "Canadian retail roundup: AI-shopping appetite outpaces trust, Dollarama loyalty with BMO, Canada Goose's new luxury concept", "summary": "A Checkout.com report finds 33% of consumers expect at least 10% of their purchases to be AI-driven within a year - well ahead of where trust and merchant readiness sit (worth a flag given the agentic-commerce angle at work). Also in the pile: Dollarama launched a loyalty program with BMO; Canada Goose opened its new global retail concept at Oakridge Park in Vancouver; Planet Fitness is opening inside a Medicine Hat Walmart; and Calgary's CF Chinook Centre added Gem Studio, a hands-on jewelry-making experience.", "link": "https://retail-insider.com/", "sources": ["Retail Insider"], "source_date": "Jun 17", "tags": ["retail", "canada", "ai", "calgary"]}, {"id": "training-perplexity-finance-2026-06-17", "section": "training", "headline": "AI Training: Use Perplexity Finance as a free AI stock-research hub", "summary": "The Rundown's walkthrough for researching any stock with AI without juggling tabs or paid tools. Steps: (1) install Perplexity's Comet browser and open the Finance tab; (2) use the Screener with plain-English queries, kept broad ('find energy stocks with low PE ratios'); (3) drill into a ticker's Overview, Financials, Earnings, and Analysis tabs; (4) ask follow-ups via the Comet assistant button at top-right, not the bottom chat box (which hides the stock data); (5) prompt 'Explain the stock move today in plain English - the most likely drivers and the sources that support each one,' then click through and verify the dates. Going further: set price alerts, build a watchlist, and connect a brokerage via Plaid to analyze your own portfolio.", "link": "https://app.therundown.ai/guides/conduct-better-stock-research-with-perplexity-finances-free-features", "sources": ["The Rundown AI"], "source_date": "Jun 17", "tags": ["training", "perplexity", "finance", "research"]}, {"id": "nyt-prime-day-2026-06-17", "section": "regulars", "headline": "NYT Wirecutter: the best early Prime Day deals", "summary": "The Recommendation's roundup of early Prime Day deals Wirecutter editors are actually excited about, ahead of the main event. Body not read - worth a scroll if you've got a purchase in mind.", "link": "https://www.nytimes.com/wirecutter", "sources": ["NYT Wirecutter"], "source_date": "Jun 17", "tags": ["wirecutter", "deals", "prime-day"]}, {"id": "ctc-sportchek-bigchek-2026-06-17", "section": "ctc", "headline": "SportChek: Big Chek Event continues with casual clothing and footwear", "summary": "SportChek is still pushing its Big Chek Event - today's send features casual clothing and shoes (including 20% off Nike casual). Cadence note: that's another Big Chek send this week, consistent with an event in its final stretch. Worth a look if you want summer casual pieces before it wraps.", "link": "https://www.sportchek.ca/", "sources": ["SportChek"], "source_date": "Jun 17", "tags": ["ctc", "sportchek", "deals"]}]}, {"build_date": "2026-06-16", "build_label": "Monday, June 16", "entries": [{"id": "fable-ban-2026-06-16", "section": "news", "headline": "100+ security experts push back on the Fable 5 export ban, calling it a threat to defenders", "summary": "The US Commerce Dept restricted Anthropic's Fable 5 and Mythos 5 to US citizens only, citing cybersecurity risks; Anthropic pulled both models and dispatched senior staff to DC to negotiate. A 'Free Fable' open letter signed by 100+ security leaders from Adobe, Nvidia, Zoom, and Stanford argues the ban handcuffs defenders while doing nothing to stop attackers who can pull the same capability from GPT-5.5 or Kimi 2.7. Background reporting pins part of the problem on a comms breakdown — Anthropic says it was given a 90-minute deadline with no specifics on the actual threat.", "link": "https://freefable.org/", "sources": ["The Rundown AI", "The Deep View", "Morning Brew", "Read The Peak"], "source_date": "Jun 16", "tags": ["ai", "policy", "anthropic"]}, {"id": "agent-governance-2026-06-16", "section": "news", "headline": "1Password and Cursor: enterprises need to 'govern the stay,' not just govern access for AI agents", "summary": "In a Deep View exclusive, 1Password CTO Nancy Wang and Cursor security lead Travis McPeak outline what safe agent deployment looks like: continuous monitoring of what agents do with their access (not just whether they have it), a separate intelligent model for high-stakes approvals, and never pasting credentials into an agent context window. Both cite real incidents — Amazon's Kiro deleting a production environment, OpenClaw mass-deleting emails despite being told to stop — as examples of what happens when agents spiral.", "link": "https://www.thedeepview.com/articles/exclusive-govern-the-stay-is-new-agent-mantra", "sources": ["The Deep View"], "source_date": "Jun 16", "tags": ["ai", "agents", "enterprise", "security"]}, {"id": "nadella-learning-loop-2026-06-16", "section": "news", "headline": "Nadella: a company's AI edge is its own learning loop, not whichever model it's currently renting", "summary": "A new Satya Nadella memo argues that the real competitive moat in AI isn't picking the best frontier model — it's building a system where the company's own workflows and judgment improve over time so expertise stays in-house. His litmus test: swap out one model for another and your 'company veteran' knowledge should remain intact, living in the system rather than the model.", "link": "https://x.com/satyanadella/status/2066182223213293753", "sources": ["The Rundown AI"], "source_date": "Jun 16", "tags": ["ai", "enterprise", "strategy"]}, {"id": "china-ai-perception-2026-06-16", "section": "news", "headline": "Global poll: France, UK, and Canada now see China — not the US — as the AI leader", "summary": "A 15-country survey of 18,000 people found public perception has shifted toward China as the AI frontrunner in 11 of those countries; France, the UK, and Canada all lean China. Meanwhile US sentiment toward AI itself is souring — the share believing AI will have a positive societal outcome dropped from 39% in 2024 to 31% in 2026. Stanford's HAI 2026 index found China's open models have nearly closed the capability gap with US proprietary ones.", "link": "https://www.thedeepview.com/articles/why-china-s-ai-perception-may-be-outpacing-the-us", "sources": ["The Deep View"], "source_date": "Jun 16", "tags": ["ai", "geopolitics", "china"]}, {"id": "facebook-ai-mode-2026-06-16", "section": "news", "headline": "Meta launches AI Mode in Facebook search, pulling from public Groups and Reels to answer questions", "summary": "Facebook's new AI Mode puts Meta AI inside its search bar, using public Group posts and Reels to answer queries — essentially running Google's AI search playbook on its own messy ecosystem of unvetted user content. Meta is also rolling out AI photo presets and reportedly preparing paid AI tiers at $7.99 and $19.99/month.", "link": "https://about.fb.com/news/2026/06/new-ai-tools-to-help-you-make-things-happen-on-facebook/", "sources": ["The Rundown AI", "The Deep View"], "source_date": "Jun 16", "tags": ["ai", "meta", "social-media"]}, {"id": "starbucks-korea-2026-06-16", "section": "news", "headline": "Starbucks Korea picked an AI-generated slogan that echoed a massacre — CEO fired, stores closing for history lessons", "summary": "Starbucks Korea's 'Tank Day' promo for new tumblers landed on May 18 — the anniversary of the 1980 Gwangju pro-democracy crackdown that killed hundreds — and the AI-suggested slogan mirrored a phrase from a notorious police cover-up. The CEO was fired within hours, card payment volumes dropped 26% in a week at Korean stores, and locations are now closing early for mandatory history and sensitivity training. The AI produced the slogan; no one checked it against the cultural calendar.", "link": "https://www.morningbrew.com/daily", "sources": ["Morning Brew"], "source_date": "Jun 16", "tags": ["retail", "ai", "marketing"]}, {"id": "fox-roku-2026-06-16", "section": "news", "headline": "Fox buys Roku for US$22B, combining its content with Roku's 100 million connected TV households", "summary": "Fox Corp has agreed to acquire Roku at $160/share, joining it with Fox's sports, news, and Tubi streaming (which already has ~100 million monthly users). Roku's OS runs on millions of smart TVs globally, making this one of the largest free streaming platforms in the world when merged.", "link": "https://www.axios.com/2026/06/15/fox-roku-22-billion", "sources": ["Morning Brew", "Read The Peak"], "source_date": "Jun 16", "tags": ["media", "streaming", "m-and-a"]}, {"id": "1password-apono-ipo-2026-06-16", "section": "news", "headline": "Canadian unicorn 1Password acquires Apono, laying groundwork for a major Canadian tech IPO", "summary": "1Password's fifth acquisition — New York-based Apono, which manages time-limited and conditional access to corporate credentials — bolsters its AI agent security platform. CEO David Faugno said last fall the company 'could be public today' but wanted the product in better shape first. 1Password sits among ~80 Canadian private tech companies with $100M+ ARR that investors are hoping will reignite Canada's long-cold IPO market.", "link": "https://betakit.com/1password-acquires-apono-to-become-the-control-pane-for-businesses-using-agentic-ai/", "sources": ["Read The Peak"], "source_date": "Jun 16", "tags": ["canada", "tech", "ipo", "security"]}, {"id": "salesforce-fin-2026-06-16", "section": "news", "headline": "Salesforce acquires Fin (formerly Intercom) for $3.6B to bolster its Agentforce AI support lineup", "summary": "Salesforce bought AI customer support platform Fin and its 30,000 customers for $3.6 billion, adding them to Agentforce. The deal reflects the accelerating consolidation of enterprise AI tooling into the big CRM players.", "link": "https://www.cnbc.com/2026/06/15/salesforce-ai-customer-service-fin-acquistion.html", "sources": ["The Rundown AI", "The Deep View"], "source_date": "Jun 16", "tags": ["ai", "crm", "m-and-a"]}, {"id": "uk-social-media-ban-2026-06-16", "section": "news", "headline": "UK bans anyone under 16 from social media — and age verification is everyone's problem now", "summary": "PM Keir Starmer announced the UK will ban under-16s from Snapchat, TikTok, YouTube, X, Facebook, and Instagram, backed by 74% public support. Australia led this wave in December 2025; Canada, France, Spain, Brazil, Malaysia, and South Korea are all exploring similar laws. The catch: surveys show 7 in 10 Australian under-16s still have accounts, because age verification is genuinely hard to enforce.", "link": "https://www.morningbrew.com/daily", "sources": ["Morning Brew"], "source_date": "Jun 16", "tags": ["social-media", "policy", "kids"]}, {"id": "ottawa-chinese-ev-2026-06-16", "section": "news", "headline": "Ottawa invites Chinese EV makers including BYD to manufacture vehicles at Canadian plants", "summary": "Industry Minister Melanie Joly is in China meeting with BYD, Chery, and two other EV makers about Canadian plant investment. Canada's conditions: Canadian parts, Canadian labour standards, majority Canadian ownership. Any deal would almost certainly irritate the US.", "link": "https://www.theglobeandmail.com/politics/article-joly-chinese-ev-makers-shanghai-auto-industry-investment/", "sources": ["Read The Peak"], "source_date": "Jun 16", "tags": ["canada", "policy", "ev", "trade"]}, {"id": "canada-opioid-2026-06-16", "section": "news", "headline": "Canadian opioid deaths fell 23% last year — second consecutive year of decline", "summary": "Canada's chief public health officer credited a crackdown on the illegal drug supply and broader naloxone access for the second straight year of declining opioid deaths.", "link": "https://www.cbc.ca/news/politics/deaths-drop-latest-opioid-data-health-canada-9.7235894", "sources": ["Read The Peak"], "source_date": "Jun 16", "tags": ["canada", "health"]}, {"id": "retail-canada-roundup-2026-06-16", "section": "news", "headline": "Canadian retail: Canada Goose opens experiential concept store; Toys R Us Canada brand split among three buyers; SportChek launches floating futsal pitch", "summary": "Canada Goose unveiled its new global retail concept at Oakridge Park in Vancouver. Toys R Us Canada's brand, leases, and assets are being divided among three buyers, leaving store network continuity unclear. SportChek opened a floating futsal pitch on the Toronto waterfront as a World Cup activation. Also in the mix: Mondetta expanding Modern Ambition menswear to Calgary/Toronto/Vancouver, Dollarama surpassing 1,700 Canadian stores.", "link": "https://retail-insider.com/", "sources": ["Retail Insider"], "source_date": "Jun 16", "tags": ["retail", "canada", "sportchek", "ctc"]}, {"id": "cochrane-jun15-2026-06-16", "section": "news", "headline": "Cochrane: Lions Club Hurricanes win the CochraneNow Cup; food bank returning home; Black Henbane weed alert", "summary": "The Lions Club Hurricanes defeated the Golden Knights to win the Cochrane Nissan CochraneNow Cup. The Cochrane Food Bank is returning to its home location next week. Noxious weed Black Henbane has returned to Cochrane — worth flagging if you have access to natural areas. Local political note: Guthrie (Progressive Tory) says his party is gaining momentum and accuses the UCP of 'gaslighting' Albertans.", "link": "https://cochranenow.com/", "sources": ["CochraneNow"], "source_date": "Jun 15", "tags": ["cochrane", "local"]}, {"id": "training-notebooklm-2026-06-16", "section": "training", "headline": "AI Training: Build a repeatable business-opportunity research system with NotebookLM (5 steps)", "summary": "Workflow: (1) Ask Claude or ChatGPT to write a one-page decision memo with options, constraints, and questions. (2) Upload it to NotebookLM and ask it to surface what source categories you need before trusting the analysis — no recommendation yet. (3) Use NotebookLM's source discovery to research each option. (4) Generate a structured brief per option: best fit, proof points, pricing, implementation effort, risks. (5) Ask for a comparison table with a winner, runner-up, avoid pick, fragile assumptions, and a 30-day validation plan. The example is choosing an AI receptionist; the system works for any structured decision.", "link": "https://app.therundown.ai/guides/vet-business-opportunities-with-this-notebooklm-research-system", "sources": ["The Rundown AI"], "source_date": "Jun 16", "tags": ["training", "notebooklm", "research", "workflow"]}, {"id": "wirecutter-fathers-day-2026-06-16", "section": "regulars", "headline": "NYT Wirecutter: Last-minute Father's Day gift picks", "summary": "Wirecutter's Father's Day roundup is live, featuring a Stanley growler, a Rubik's Cube, and more last-minute options. Body not read; worth a scroll if you're still looking.", "link": "https://www.nytimes.com/wirecutter", "sources": ["NYT Wirecutter"], "source_date": "Jun 16", "tags": ["wirecutter", "fathers-day", "gifts"]}, {"id": "wirecutter-condiments-2026-06-16", "section": "regulars", "headline": "NYT Wirecutter: Best condiments, non-ugly reclining chairs, and eye creams", "summary": "Body not read. Wirecutter's Sunday edition covers their top condiment picks — ketchup, mustard, mayo — plus a handful of home and lifestyle categories.", "link": "https://www.nytimes.com/wirecutter", "sources": ["NYT Wirecutter"], "source_date": "Jun 15", "tags": ["wirecutter", "cooking"]}, {"id": "coop-fathers-day-beer-2026-06-16", "section": "deals", "headline": "Co-op: Father's Day beer and whisky deals this week", "summary": "Co-op Calgary is running Father's Day specials on brews and whiskies. Check the app or flyer if you're planning something for Sunday.", "link": "https://www.calgaryco-op.ca/", "sources": ["Co-op Calgary"], "source_date": "Jun 15", "tags": ["deals", "fathers-day", "coop"]}, {"id": "costco-weekly-2026-06-16", "section": "deals", "headline": "Costco: weekly warehouse savings running through July 5", "summary": "Routine Costco savings cycle — centre pork loin and boneless rib among the featured warehouse items. Valid through July 5.", "link": "https://www.costco.ca/", "sources": ["Costco Canada"], "source_date": "Jun 15", "tags": ["deals", "costco"]}, {"id": "ctc-big-chek-sportchek-2026-06-16", "section": "ctc", "headline": "SportChek Big Chek Event: two sends today — clothing, footwear, Nike athletic gear", "summary": "SportChek sent two Big Chek Event emails today, a cadence uptick that suggests the event is in its final stretch. Features clothing, jackets, shoes, and Nike men's athletic gear. Worth checking if you need summer athletic pieces before it wraps.", "link": "https://www.sportchek.ca/", "sources": ["SportChek"], "source_date": "Jun 16", "tags": ["ctc", "sportchek", "deals"]}, {"id": "marks-levis-2026-06-16", "section": "ctc", "headline": "Mark's: 40% off Levi's clothing e", "work"]}, {"id": "shadow-ai-2026-06-12", "section": "news", "headline": "Two-thirds of office workers use AI tools their company never approved", "summary": "New PagerDuty/Wakefield survey: 88% have pasted work info into public chatbots - a third of those involving customer data - and most think leadership plays by different AI rules. The gap is governance, not adoption. Useful ammo for the AI-fluency pitch.", "link": "https://www.thedeepview.com/articles/enterprise-ai-gaps-are-fueling-shadow-ai", "sources": ["The Deep View"], "source_date": "Jun 12", "tags": ["ai", "enterprise", "work"]}, {"id": "google-aio-liability-2026-06-12", "section": "news", "headline": "German court: Google owns what its AI Overviews say", "summary": "A Munich court held Google directly liable for false AI Overview claims about two publishers, calling AI summaries 'the defendant's own statements.' First time a court has treated AI output as the company's own speech - a big precedent if it travels.", "link": "https://arstechnica.com/tech-policy/2026/06/nobody-needs-ai-to-search-the-internet-court-says-in-ruling-against-google/", "sources": ["The Deep View"], "source_date": "Jun 11", "tags": ["ai", "legal"]}, {"id": "anthropic-policy-2026-06-12", "section": "news", "headline": "Anthropic pairs its newest models with policy frameworks and $350M", "summary": "Two proposals: catastrophic-risk rules for frontier labs, and an economic framework with staged responses up to wage insurance and basic income. Amodei's accompanying essay argues regulation can't move at congressional speed.", "link": "https://darioamodei.com/post/policy-on-the-ai-exponential", "sources": ["The Deep View"], "source_date": "Jun 11", "tags": ["ai", "policy"]}, {"id": "bezos-prometheus-2026-06-12", "section": "news", "headline": "Bezos's Prometheus hits a $41B valuation to build an 'artificial general engineer'", "summary": "$12B in new funding for AI aimed at designing and manufacturing physical products. Bezos is reportedly looking to raise $100B more to buy industrial companies that would feed it data.", "link": null, "sources": ["Morning Brew"], "source_date": "Jun 12", "tags": ["ai", "business"]}, {"id": "ecb-rates-2026-06-12", "section": "news", "headline": "ECB raises rates for the first time in almost three years", "summary": "2% to 2.25%, driven by war-related energy inflation - the first major central bank to hike since the Iran war began. The Fed is expected to hold next week despite pressure to cut.", "link": null, "sources": ["Morning Brew"], "source_date": "Jun 12", "tags": ["markets", "economy"]}, {"id": "worldcup-betting-2026-06-12", "section": "news", "headline": "This World Cup is on track to be the biggest betting event in history", "summary": "An estimated $50B+ in global wagers (vs $35B in 2022), driven by the 48-team format and US legalization reaching 65% of the population. Polymarket's winner market alone has $1.8B riding on it.", "link": null, "sources": ["Morning Brew"], "source_date": "Jun 12", "tags": ["sports", "business"]}, {"id": "quick-hits-2026-06-12", "section": "news", "headline": "Quick hits: Koho becomes a unicorn, Canada Post cuts more home delivery, solar passes coal", "summary": "Koho raised $130M (~$1.3B valuation) and is near a banking licence; Canada Post moves 485K more homes to community mailboxes next year; Quebec banned energy drink sales to under-16s; and US solar out-generated coal for the first time ever.", "link": "https://betakit.com/koho-becomes-canadas-latest-unicorn-following-130-million-series-e-round/", "sources": ["The Peak", "Morning Brew"], "source_date": "Jun 12", "tags": ["canada", "business", "energy"]}, {"id": "cochrane-rodeo-2026-06-12", "section": "news", "headline": "Cochrane: First Nations Rodeo & Relay debuts at GMC Stadium Saturday", "summary": "A first-of-its-kind local event this Saturday (Jun 13) - candidate for a family outing if the rain holds off (forecast says 5-10mm Friday).", "link": "https://cochranenow const SECTIONS = {
  now:      { label: "Now",      icon: "⚡" },
  news:     { label: "News",     icon: "📰" },
  training: { label: "AI Training", icon: "🎓" },
  regulars: { label: "Regulars", icon: "📬" },
  deals:    { label: "Deals",    icon: "🛍️" },
  ctc:      { label: "CTC",      icon: "🔺" }
};
const SECTION_ORDER = ["now", "news", "training", "regulars", "deals", "ctc"];
const DAYS = JSON.parse(document.getElementById("data").textContent); // newest first
const state = { tab: "today", sec: "all", q: "" };
const votes = JSON.parse(localStorage.getItem("eo-votes") || "{}");

function setTab(t) {
  state.tab = t;
  document.getElementById("tab-today").classList.toggle("on", t === "today");
  document.getElementById("tab-week").classList.toggle("on", t === "week");
  render();
}
function setSec(s) { state.sec = s; render(); }

function matches(e) {
  if (state.sec !== "all" && e.section !== state.sec) return false;
  if (!state.q) return true;
  const hay = (e.headline + " " + e.summary + " " + (e.tags || []).join(" ") + " " + e.sources.join(" ")).toLowerCase();
  return state.q.toLowerCase().split(/\s+/).every(w => hay.includes(w));
}

function esc(s) { return s.replace(/&/g, "&amp;").replace(/</g, "&lt;"); }

function card(e) {
  const v = votes[e.id] || "";
  const link = e.link ? `<a class="more" href="${e.link}" target="_blank" rel="noopener">Read more →</a>` : "";
  return `<div class="card${e.section === "now" ? " urgent" : ""}">
    <p class="hl">${esc(e.headline)}</p>
    <div class="sum-wrap">
      <p class="sum clamp">${esc(e.summary)}</p>
      <button class="more-toggle" onclick="toggleMore(this)">&hellip;more</button>
    </div>
    <div class="meta">
      <span class="src"><span class="badge">${SECTIONS[e.section].icon} ${SECTIONS[e.section].label}</span>${esc(e.sources.join(" + "))} · ${esc(e.source_date)}</span>
      <span class="actions">${link}
        <button class="thumb${v === "up" ? " on" : ""}" onclick="vote('${e.id}','up',this)">👍</button>
        <button class="thumb${v === "down" ? " on" : ""}" onclick="vote('${e.id}','down',this)">👎</button>
      </span>
    </div>
  </div>`;
}

function render() {
  // chips with counts for current tab scope
  const scope = state.tab === "today" ? DAYS.slice(0, 1) : DAYS;
  const all = scope.flatMap(d => d.entries);
  let chips = `<button class="chip${state.sec === "all" ? " on" : ""}" onclick="setSec('all')">All</button>`;
  for (const s of SECTION_ORDER) {
    const n = all.filter(e => e.section === s).length;
    if (!n) continue;
    chips += `<button class="chip${state.sec === s ? " on" : ""}" onclick="setSec('${s}')">${SECTIONS[s].icon} ${SECTIONS[s].label}</button>`;
  }
  document.getElementById("chips").innerHTML = chips;

  let html = "";
  if (state.tab === "today") {
    const day = DAYS[0];
    for (const s of SECTION_ORDER) {
      const items = day.entries.filter(e => e.section === s && matches(e));
      if (!items.length) continue;
      html += `<div class="sec-h">${SECTIONS[s].icon} ${SECTIONS[s].label} <span class="count">${items.length}</span></div>`;
      html += items.map(card).join("");
    }
  } else {
    for (const day of DAYS) {
      const items = day.entries.filter(matches);
      if (!items.length) continue;
      html += `<div class="day-h">${esc(day.build_label)}</div>`;
      html += items.map(card).join("");
    }
  }
  document.getElementById("main").innerHTML = html || `<div class="empty">Nothing matches. Try clearing the search or filter.</div>`;
  // Only reveal the "…more" toggle on summaries that actually overflow two lines.
  document.querySelectorAll(".sum.clamp").forEach(s => {
    if (s.scrollHeight - s.clientHeight > 2) s.nextElementSibling.classList.add("show");
  });
}

function toggleMore(btn) {
  const sum = btn.previousElementSibling;
  const collapsed = sum.classList.toggle("clamp"); // true = now clamped
  btn.classList.toggle("open", !collapsed);
  btn.innerHTML = collapsed ? "&hellip;more" : "less";
}

function vote(id, dir, btn) {
  const prev = votes[id];
  const action = prev === dir ? "retract" : dir;
  if (action === "retract") delete votes[id]; else votes[id] = dir;
  localStorage.setItem("eo-votes", JSON.stringify(votes));
  const entry = DAYS.flatMap(d => d.entries).find(e => e.id === id);
  fetch(NTFY_CURATE, {
    method: "POST",
    headers: { "X-Title": "Email Overview feedback" },
    body: `${action.toUpperCase()} | ${id} | ${entry ? entry.headline : ""}`
  }).then(() => toast(action === "retract" ? "Feedback removed" : (dir === "up" ? "More like this 👍" : "Less of this 👎")))
    .catch(() => toast("Couldn't send - no connection?"));
  render();
}

let toastTimer;
function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 1800);
}

render();
</script>
</body>
</html>
