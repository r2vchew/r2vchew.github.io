ls — bolsters its AI agent security platform. CEO David Faugno said last fall the company 'could be public today' but wanted the product in better shape first. 1Password sits among ~80 Canadian private tech companies with $100M+ ARR that investors are hoping will reignite Canada's long-cold IPO market.", "link": "https://betakit.com/1password-acquires-apono-to-become-the-control-pane-for-businesses-using-agentic-ai/", "sources": ["Read The Peak"], "source_date": "Jun 16", "tags": ["canada", "tech", "ipo", "security"]}, {"id": "salesforce-fin-2026-06-16", "section": "news", "headline": "Salesforce acquires Fin (formerly Intercom) for $3.6B to bolster its Agentforce AI support lineup", "summary": "Salesforce bought AI customer support platform Fin and its 30,000 customers for $3.6 billion, adding them to Agentforce. The deal reflects the accelerating consolidation of enterprise AI tooling into the big CRM players.", "link": "https://www.cnbc.com/2026/06/15/salesforce-ai-customer-service-fin-acquistion.html", "sources": ["The Rundown AI", "The Deep View"], "source_date": "Jun 16", "tags": ["ai", "crm", "m-and-a"]}, {"id": "uk-social-media-ban-2026-06-16", "section": "news", "headline": "UK bans anyone under 16 from social media — and age verification is everyone's problem now", "summary": "PM Keir Starmer announced the UK will ban under-16s from Snapchat, TikTok, YouTube, X, Facebook, and Instagram, backed by 74% public support. Australia led this wave in December 2025; Canada, France, Spain, Brazil, Malaysia, and South Korea are all exploring similar laws. The catch: surveys show 7 in 10 Australian under-16s still have accounts, because age verification is genuinely hard to enforce.", "link": "https://www.morningbrew.com/daily", "sources": ["Morning Brew"], "source_date": "Jun 16", "tags": ["social-media", "policy", "kids"]}, {"id": "ottawa-chinese-ev-2026-06-16", "section": "news", "headline": "Ottawa invites Chinese EV makers including BYD to manufacture vehicles at nt-style Bormioli Rocco stackable glasses are 50%+ off in a 12-set; they crowned winners after testing 44 non-alcoholic beers; and they recommend turning OFF motion smoothing before watching the World Cup.", "link": "https://www.nytimes.com/wirecutter/", "sources": ["NYT Wirecutter"], "source_date": "Jun 10-11", "tags": ["products", "kitchen", "sports"]}, {"id": "spark-sue-2026-06-12", "section": "regulars", "headline": "SUE the T. rex lands at Telus Spark June 27", "summary": "The most complete T. rex ever found, on display through Nov 29 - prime Lily material. Also on the calendar: a Roar & Snore overnight sleepover Aug 8-9 (spots limited) and a sensory-friendly day Jun 22.", "link": "https://www.sparkscience.ca", "sources": ["TELUS Spark"], "source_date": "Jun 11", "tags": ["family", "calgary", "events"]}, {"id": "nyt-well-sleep-2026-06-12", "section": "regulars", "headline": "NYT Well: a sleep trick, plus weight-loss drugs and alcohol-risk explainers", "summary": "Part two of their sleep series landed Thursday night. Flagging rather than summarizing - open it if sleep's been a thing lately.", "link": "https://www.nytimes.com/section/well", "sources": ["NYT Well"], "source_date": "Jun 11", "tags": ["health"]}, {"id": "regulars-also-2026-06-12", "section": "regulars", "headline": "Also in the pile: Nest monthly report, Google Gemini check-in", "summary": "Your Nest May home report and a 'thanks for your feedback' note from the Google Home team. Nothing actionable in either.", "link": null, "sources": ["Nest", "Google"], "source_date": "Jun 11", "tags": ["routine"]}, {"id": "costco-dad-2026-06-12", "section": "deals", "headline": "Costco's Father's Day push is on (Jun 21 is the day)", "summary": "Gift-focused promos in both Wednesday and Thursday sends, while-quantities-last. Useful only if you're shopping for your dad - or dropping hints.", "link": "https://www.costco.ca", "sources": ["Costco"], "source_date": "Jun 10-11", "tags": ["deal", "fathers-day"]}, {"id": "safeway-liquor-2026-06-12", "section": "deals", "headline": "Safeway: weekly liquor flyer (Jun 11-17) + Scene+ grocery offers to load", "summary": "Summer-drinks themed flyer plus the usual load-to-card Scene+ offers (one flagged 5,600+ points). Routine weekly cycle - check before a Safeway run, otherwise skip.", "link": "https://www.safeway.ca", "sources": ["Safeway Liquor", "Scene+"], "source_date": "Jun 10-11", "tags": ["deal", "grocery", "weekly"]}, {"id": "coop-flyer-2026-06-12", "section": "deals", "headline": "Calgary Co-op weekly flyer is out (wine-leaning this week)", "summary": "Standard weekly savings cycle. Nothing screamed must-buy from the preview.", "link": "https://www.calgarycoop.com", "sources": ["Calgary Co-op"], "source_date": "Jun 11", "tags": ["deal", "grocery", "weekly"]}, {"id": "nespresso-cooler-2026-06-12", "section": "deals", "headline": "Nespresso: free limited-edition cooler bag with 140 capsules", "summary": "Gift-with-purchase, not a discount - only worth it if a capsule restock was already coming.", "link": "https://www.nespresso.com/ca/en/", "sources": ["Nespresso"], "source_date": "Jun 10", "tags": ["deal", "coffee"]}, {"id": "deals-also-2026-06-12", "section": "deals", "headline": "Also arrived: Joe Fresh women's swim 25% off, Papa John's youth-hockey promo", "summary": "Joe Fresh's second email pushes $7 tanks / $12 dresses and 25% off women's swim; Papa John's is running a buy-supports-youth-hockey angle. Low urgency on both.", "link": null, "sources": ["Joe Fresh", "Papa John's"], "source_date": "Jun 10-11", "tags": ["deal"]}, {"id": "ctc-bigchek-2026-06-12", "section": "ctc", "headline": "SportChek's Big Chek Event is live", "summary": "Teased Wednesday ('flyer sneak peek'), launched Thursday - banner-wide event with Father's Day positioning and a DoorDash tie-in in the header. Skechers/PUMA/Merrell/Columbia/Saucony shoe deals featured in Friday's Mark's-adjacent send.", "link": "https://www.sportchek.ca", "sources": ["SportChek x2"], "source_date": "Jun 10-11", "tags": ["ctc", "sportchek", "event"]}, {"id": "ctc-marks-2026-06-12", "section": "ctc", "headline": "Mark's launches 'This. Is. Big.' - Jun 11-24, up to 60% off", "summary": "Two-week event with 40x bonus CT Money on Carhartt as the hero offer. Conveniently spans Father's Day. Of everything in the CTC pile this week, this is the one with genuine deal potential.", "link": "https://www.marks.com", "sources": ["Mark's x2"], "source_date": "Jun 11-12", "tags": ["ctc", "marks", "deal"]}, {"id": "ctc-ct-cadence-2026-06-12", "section": "ctc", "headline": "Canadian Tire: Big Red Sale ended Thursday; Hanes and EGO pushes followed same-day", "summary": "Three CT-banner emails inside 24 hours: an 'ending soon' for the Big Red Sale (now expired), then Hanes summer basics and EGO outdoor tools. Cadence watch: 8 total CTC-family sends in 48 hours across 4 senders.", "link": "https://www.canadiantire.ca", "sources": ["Canadian Tire x3"], "source_date": "Jun 10-11", "tags": ["ctc", "canadian-tire", "frequency"]}]}]</script>
<script>
const NTFY_CURATE = "https://ntfy.sh/emarifeed-k7f3qx9m2p-curate";
const SECTIONS = {
  now:      { label: "Now",      icon: "⚡" },
  news:     { label: "News",     icon: "📰" },
  training: { label: "AI Training", icon: "🎓" },
  regulars: { label: "Regulars", icon: "📬" },
  deals:    { label: "Deals",    icon: "🛍️" },
  ctc:      { label: "CTC",      icon: "🔺" }
};
const SECTION_ORDER = ["now", "news", "training", "regulars", "deals", "ctc"];
const DAYS = JSON.parse(document.getElementById("data").textContent); // newest first
const state = { tab: "today", sec: "all", q: "" };
const votes = JSON.parse(localStorage.getItem("eo-votes") || "{}");

function setTab(t) {
  state.tab = t;
  document.getElementById("tab-today").classList.toggle("on", t === "today");
  document.getElementById("tab-week").classList.toggle("on", t === "week");
  render();
}
function setSec(s) { state.sec = s; render(); }

function matches(e) {
  if (state.sec !== "all" && e.section !== state.sec) return false;
  if (!state.q) return true;
  const hay = (e.headline + " " + e.summary + " " + (e.tags || []).join(" ") + " " + e.sources.join(" ")).toLowerCase();
  return state.q.toLowerCase().split(/\s+/).every(w => hay.includes(w));
}

function esc(s) { return s.replace(/&/g, "&amp;").replace(/</g, "&lt;"); }

function card(e) {
  const v = votes[e.id] || "";
  const link = e.link ? `<a class="more" href="${e.link}" target="_blank" rel="noopener">Read more →</a>` : "";
  return `<div class="card${e.section === "now" ? " urgent" : ""}">
    <p class="hl">${esc(e.headline)}</p>
    <p class="sum">${esc(e.summary)}</p>
    <div class="meta">
      <span class="src"><span class="badge">${SECTIONS[e.section].icon} ${SECTIONS[e.section].label}</span>${esc(e.sources.join(" + "))} · ${esc(e.source_date)}</span>
      <span class="actions">${link}
        <button class="thumb${v === "up" ? " on" : ""}" onclick="vote('${e.id}','up',this)">👍</button>
        <button class="thumb${v === "down" ? " on" : ""}" onclick="vote('${e.id}','down',this)">👎</button>
      </span>
    </div>
  </div>`;
}

function render() {
  // chips with counts for current tab scope
  const scope = state.tab === "today" ? DAYS.slice(0, 1) : DAYS;
  const all = scope.flatMap(d => d.entries);
  let chips = `<button class="chip${state.sec === "all" ? " on" : ""}" onclick="setSec('all')">All</button>`;
  for (const s of SECTION_ORDER) {
    const n = all.filter(e => e.section === s).length;
    if (!n) continue;
    chips += `<button class="chip${state.sec === s ? " on" : ""}" onclick="setSec('${s}')">${SECTIONS[s].icon} ${SECTIONS[s].label}</button>`;
  }
  document.getElementById("chips").innerHTML = chips;

  let html = "";
  if (state.tab === "today") {
    const day = DAYS[0];
    for (const s of SECTION_ORDER) {
      const items = day.entries.filter(e => e.section === s && matches(e));
      if (!items.length) continue;
      html += `<div class="sec-h">${SECTIONS[s].icon} ${SECTIONS[s].label} <span class="count">${items.length}</span></div>`;
      html += items.map(card).join("");
    }
  } else {
    for (const day of DAYS) {
      const items = day.entries.filter(matches);
      if (!items.length) continue;
      html += `<div class="day-h">${esc(day.build_label)}</div>`;
      html += items.map(card).join("");
    }
  }
  document.getElementById("main").innerHTML = html || `<div class="empty">Nothing matches. Try clearing the search or filter.</div>`;
}

function vote(id, dir, btn) {
  const prev = votes[id];
  const action = prev === dir ? "retract" : dir;
  if (action === "retract") delete votes[id]; else votes[id] = dir;
  localStorage.setItem("eo-votes", JSON.stringify(votes));
  const entry = DAYS.flatMap(d => d.entries).find(e => e.id === id);
  fetch(NTFY_CURATE, {
    method: "POST",
    headers: { "X-Title": "Email Overview feedback" },
    body: `${action.toUpperCase()} | ${id} | ${entry ? entry.headline : ""}`
  }).then(() => toast(action === "retract" ? "Feedback removed" : (dir === "up" ? "More like this 👍" : "Less of this 👎")))
    .catch(() => toast("Couldn't send - no connection?"));
  render();
}

let toastTimer;
function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 1800);
}

render();
</script>
