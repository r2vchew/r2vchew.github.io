r gear) and Mark's 'This Is Big' event continuing. CT Money balance unchanged at $352.13 - mostly routine cadence today.", "link": "https://www.sportchek.ca/", "sources": ["SportChek", "Canadian Tire", "Mark's"], "source_date": "Jun 25", "tags": ["ctc", "sportchek", "canadian-tire", "marks"]}]}, {"build_date": "2026-06-24", "build_label": "Wednesday, June 24", "entries": [{"id": "now-sportchek-bigchek-2026-06-24", "section": "now", "headline": "SportChek's Big Chek Event ends tonight", "summary": "Training gear from Nike, Under Armour and adidas - if you needed an excuse for new running shoes or a yoga mat, tonight's the deadline.", "link": "https://www.sportchek.ca/", "sources": ["SportChek"], "source_date": "Jun 24", "tags": ["now", "deals", "sportchek"]}, {"id": "now-ct-bonus-moneyexpires-2026-06-24", "section": "now", "headline": "Canadian Tire's $30 bonus CT Money offer ends today", "summary": "Spend $200+ online at Canadian Tire, Mark's or SportChek today and get $30 bonus CT Money - the window closes tonight.", "link": "https://www.canadiantire.ca/", "sources": ["Canadian Tire", "Triangle Rewards"], "source_date": "Jun 24", "tags": ["now", "deals", "canadian-tire"]}, {"id": "news-claude-tag-2026-06-24", "section": "news", "headline": "Anthropic puts Claude into Slack as a tagged-in teammate", "summary": "Claude Tag lets teams @-mention Claude in any Slack channel to hand off real work - it builds context from the channel over time, works asynchronously in the background, and can proactively flag things it thinks you need to know. Anthropic frames it as the natural next step after Claude Code (65% of its own code is now written by it), and Andrej Karpathy called it the 'third major redesign of LLM UI/UX.' It's live now on Slack Team/Enterprise plans, alongside Microsoft's Claude-powered Copilot Cowork, now generally available inside Microsoft 365 for half the Fortune 500.", "link": "https://www.anthropic.com/news/introducing-claude-tag", "sources": ["The Deep View", "The Neuron", "The Rundown", "There's An AI For That", "MultiplAI Weekly Brief"], "source_date": "Jun 23-24", "tags": ["ai", "anthropic", "claude", "work", "enterprise"]}, {"id": "news-meta-glasses-2026-06-24", "section": "news", "headline": "Meta's cheapest AI glasses yet land at $299", "summary": "Meta Glasses ditch the Ray-Ban/Oakley branding for a standalone, $80-cheaper line (three styles, including a Kylie Jenner edition), running Meta's new in-house Muse Spark AI for hands-free translation and navigation. Meta already holds roughly 70-80% of the smart-glasses market and says daily users have tripled year over year; Google (with Warby Parker) and Apple are both racing to ship rivals.", "link": "https://about.fb.com/news/2026/06/meta-essilorluxottica-partner-launch-meta-glasses/", "sources": ["The Neuron", "The Peak", "The Rundown", "Morning Brew", "There's An AI For That"], "source_date": "Jun 23-24", "tags": ["ai", "meta", "hardware", "wearables"]}, {"id": "news-tech-selloff-2026-06-24", "section": "news", "headline": "The AI stock selloff spread to Asia, then came back", "summary": "A US tech selloff that started Monday hit South Korea hardest - the Kospi fell as much as 10% on a 12%+ drop in chipmakers Samsung and SK Hynix, both up huge this year on AI hype - before resuming in the US. Opinions are split on whether it's a healthy correction for an overheated chip sector or an early sign of an AI bubble; either way, several newsletters are framing volatile swings as the new normal rather than a one-off.", "link": "https://www.readthepeak.com/p/the-chips-are-down", "sources": ["The Peak", "Morning Brew"], "source_date": "Jun 23-24", "tags": ["ai", "markets", "economy"]}, {"id": "news-meta-prediction-markets-2026-06-24", "section": "news", "headline": "Meta is reportedly building its own prediction-markets app", "summary": "Zuckerberg has directed engineers to build 'Arena,' a Kalshi/Polymarket-style app that would start with play-money points before possibly allowing real wagers, aimed at Meta's 3.6 billion daily users. Critics note Ontario's gambling-helpline calls are up over 300% among young men since online gambling was legalized in 2022.", "link": "https://www.nytimes.com/2026/06/23/technology/meta-prediction-markets-app.html", "sources": ["The Peak", "Morning Brew"], "source_date": "Jun 23", "tags": ["business", "meta", "gambling"]}, {"id": "news-spacex-aiempire-2026-06-24", "section": "news", "headline": "SpaceX is buying its way into software with a $60B Cursor deal", "summary": "Days after its IPO, SpaceX agreed to acquire coding-assistant startup Cursor for $60 billion in stock, and separately signed a $6.3 billion, multi-year compute deal renting out its Colossus II data centre to open-source AI startup Reflection AI. Between the IPO pop, Cursor, and the compute deals, SpaceX is fast becoming as much an AI infrastructure and software player as a rocket company.", "link": "https://techcrunch.com/2026/06/22/spacex-inks-compute-deal-with-reflection-ai-an-open-source-ai-lab/", "sources": ["MultiplAI Weekly Brief", "AI Daily Brief", "The Neuron"], "source_date": "Jun 22-23", "tags": ["ai", "spacex", "business", "ma"]}, {"id": "news-datacenter-mythbusting-2026-06-24", "section": "news", "headline": "The data on AI data centres doesn't back up the loudest complaints", "summary": "A deep dive on the bipartisan backlash against data centres found the water numbers are wildly overstated (Amazon's entire global fleet uses about as much water annually as one day of US golf-course irrigation), and state-level data shows no clear link between data centre density and rising electricity prices overall, though some local pockets near big clusters have seen real price spikes. The more useful framing: communities sitting in the path of new data centres have real negotiating leverage, and most haven't used it - one Louisiana parish is paying teachers $50,000 bonuses off the resulting tax revenue.", "link": "https://www.theinformation.com/newsletters/ai-infrastructure/debunking-myths-ai-data-center-critics-believe", "sources": ["AI Daily Brief"], "source_date": "Jun 23", "tags": ["ai", "energy", "policy", "data"]}, {"id": "news-confidential-computing-2026-06-24", "section": "news", "headline": "A coalition of big tech wants to keep AI data out of one or two providers' hands", "summary": "At the Confidential Computing Summit, Google, Microsoft, AMD, Intel and others (notably not OpenAI or Anthropic) called for hardware-enforced trust, verified identities and audit trails for AI agents, and encryption keys companies control themselves, aimed at stopping a future where a handful of AI providers hold all the leverage. The Linux Foundation also announced an 'Agent Name Service,' a DNS-style system for giving AI agents verifiable identities.", "link": "https://www.thedeepview.com/articles/why-ai-s-decentralization-movement-has-arrived", "sources": ["The Deep View"], "source_date": "Jun 23", "tags": ["ai", "governance", "enterprise", "security"]}, {"id": "news-nsa-mythos-correction-2026-06-24", "section": "news", "headline": "The 'AI broke into the NSA' story was a stress test working as designed", "summary": "Last week's viral claim that Anthropic's Mythos model breached classified NSA systems 'in hours' turns out to be a misreading of Senate testimony - it described an authorized red-team exercise where the team already had pre-established access, not an outside hack. The detail that got buried: the NSA's red teams have now lost access to Mythos entirely, after the export-control suspension pulled it from public use worldwide.", "link": "https://aidailybrief.beehiiv.com/p/the-right-way-to-deal-with-ai-data-centers", "sources": ["AI Daily Brief", "Ultrathink"], "source_date": "Jun 23", "tags": ["ai", "security", "correction"]}, {"id": "news-tesla-megapod-2026-06-24", "section": "news", "headline": "Tesla's quietly betting it already owns the AI boom's scarcest resource - permitted power", "summary": "While OpenAI and Oracle spend $500B and years building data centres from scratch, Tesla filed a trademark for 'MEGAPOD' - a modular data centre it can bolt directly onto its Supercharger sites, where it already has roughly 7 gigawatts of grid-connected power sitting idle. Musk's bigger (and shakier) idea is 'distributed inference' - renting out the idle self-driving chips in parked Teslas - but the Supercharger play alone gives Tesla a real head start while everyone else waits years for a grid connection.", "link": "https://electrek.co/2026/06/21/tesla-megapod-ai-data-center-hardware/", "sources": ["Ultrathink"], "source_date": "Jun 23", "tags": ["ai", "tesla", "energy", "strategy"]}, {"id": "news-retail-canada-2026-06-24", "section": "news", "headline": "RH takes over the old Club Monaco flagship on Bloor Street", "summary": "Home-furnishings retailer RH is moving into the former Club Monaco building at 157 Bloor St W in Toronto, one of the country's top luxury retail addresses. Elsewhere: the Competition Bureau is expanding its multi-year probe into Sobeys' use of property controls to limit competing grocers, and Canadians are expected to spend $5.4B this Prime Day, with participation up from 52% to 65% in a year.", "link": "https://retail-insider.com/", "sources": ["Retail Insider"], "source_date": "Jun 24", "tags": ["retail", "canada", "strategy"]}, {"id": "news-cochrane-local-2026-06-24", "section": "news", "headline": "Cochrane's Grand Parade fundraiser for seniors is coming together", "summary": "Local prep is underway for the Grand Parade fundraiser supporting seniors; elsewhere around town, the Rage close out their home schedule Friday, Snap Dance wrapped its season with trophies and a world-stage berth, and a bear warning is in effect at Camp Chief Hector.", "link": "https://cochranenow.com/", "sources": ["CochraneNow"], "source_date": "Jun 22-23", "tags": ["cochrane", "local", "community"]}, {"id": "news-rogers-charity-classic-2026-06-24", "section": "news", "headline": "TC Energy's CEO joins the patron group behind Calgary's PGA Tour Champions stop", "summary": "François Poirier is the latest Calgary business leader to join the Rogers Charity Classic's patron group, the volunteer leadership behind Canada's only PGA Tour Champions event, which has raised over $164 million for kids' charities in Alberta since 2012.", "link": "https://rogerscharityclassic.com/", "sources": ["Rogers Charity Classic"], "source_date": "Jun 24", "tags": ["calgary", "golf", "community"]}, {"id": "training-codex-pet-2026-06-24", "section": "training", "headline": "Build a Clippy-style desktop pet for Codex", "summary": "The Rundown's hands-on guide: ask Codex for a few simple mascot concepts, prompt it with '@hatch-pet' to generate the pet pack and overlay assets, then activate it in Settings to get an animated sidekick that shows progress while Codex works in the background. Keep the design simple - clean shapes generate more consistent sprite packs than busy ones.", "link": "https://app.therundown.ai/guides/create-a-custom-codex-pet-no-code-required", "sources": ["The Rundown"], "source_date": "Jun 24", "tags": ["training", "ai", "codex"]}, {"id": "regulars-nyt-wirecutter-2026-06-24", "section": "regulars", "headline": "NYT/Wirecutter: more Prime Day picks, 30 budget dinners, a trash can Wirecutter's excited about", "summary": "Wirecutter kept curating Prime Day deals (a dozen handpicked, plus apparently a trash can worth getting excited about), NYT Cooking ran 30 budget-friendly weeknight dinners, and NYT Well rounded up health stories you might've missed. Flag only - bodies not read in full.", "link": null, "sources": ["NYT", "Wirecutter"], "source_date": "Jun 23-24", "tags": ["regulars", "deals", "household", "cooking"]}, {"id": "deals-costco-2026-06-24", "section": "deals", "headline": "Costco: Member Appreciation Days continue, new Apple lineup featured", "summary": "Costco's Executive-member savings event runs alongside a fresh push on Apple products online. Routine - browse if you're already going.", "link": "https://www.costco.ca/", "sources": ["Costco"], "source_date": "Jun 23-24", "tags": ["deals", "costco", "routine"]}, {"id": "deals-joefresh-2026-06-24", "section": "deals", "headline": "Joe Fresh: summer menswear plus Pooh, Moana and Mickey for the kids", "summary": "New men's summer styles and a licensed-character kids' lineup (Winnie-the-Pooh, Moana, Mickey) - worth a look if Lily would go for any of those.", "link": "https://www.joefresh.com/", "sources": ["Joe Fresh"], "source_date": "Jun 23-24", "tags": ["deals", "kids", "joefresh"]}, {"id": "deals-familyfood-2026-06-24", "section": "deals", "headline": "Pizza night discounts: Papa John's at 40% off, $10 off Mary Brown's", "summary": "Papa John's has 40% off pizzas, and SkipTheDishes is offering $10 off a $30+ Mary Brown's order. Both routine delivery-app promos - easy enough to redeem yourself.", "link": null, "sources": ["Papa John's", "SkipTheDishes"], "source_date": "Jun 23-24", "tags": ["deals", "food", "family"]}, {"id": "ctc-cadence-2026-06-24", "section": "ctc", "headline": "CTC banners: heavy flyer cadence, Mark's clothing sale is the one worth a look", "summary": "All three banners sent multiple emails today and yesterday - SportChek's Big Chek Event and the $30 bonus CT Money offer both expire tonight (see top of page), Canadian Tire has clearance on kitchen appliances and tires, and Mark's is running up to 60% off men's Denver Hayes Comfort Dry polos.", "link": "https://www.marks.com/", "sources": ["Canadian Tire", "Mark's", "SportChek"], "source_date": "Jun 23-24", "tags": ["ctc", "marks", "canadian-tire", "sportchek"]}]}, {"build_date": "2026-06-23", "build_label": "Tuesday, June 23", "entries": [{"id": "now-prime-day-live-2026-06-23", "section": "now", "headline": "Amazon Prime Day is live now through Friday", "summary": "The early Prime Day window opened today. If anything's been sitting in your cart, this is the window - Wirecutter says it's already vetted thousands of the deals down to the ones actually worth buying.", "link": "https://www.amazon.ca/", "sources": ["Morning Brew", "Wirecutter"], "source_date": "Jun 23", "tags": ["now", "deals", "amazon"]}, {"id": "five-eyes-ai-cyber-2026-06-23", "section": "news", "headline": "Five Eyes intelligence agencies warn AI-powered cyberattacks are months away, not years", "summary": "In a rare joint statement, intelligence agencies from the US, UK, Canada, Australia and New Zealand said frontier AI models capable of taking down governments and major businesses are close, and urged leaders to harden defences now rather than wait. OpenAI responded the same day by expanding its 'Daybreak' cyber program (a security-focused Codex plugin, a dedicated cyber model, and an effort to patch vulnerable open-source code at scale); Anthropic's own research said its newest model can find software exploits fast enough to cut both ways for attackers and defenders.", "link": "https://www.ncsc.gov.uk/news/the-ai-shift-in-cyber-risk-why-leaders-must-act-now", "sources": ["The Deep View", "The Neuron", "There's An AI For That", "The Rundown", "The Peak"], "source_date": "Jun 22-23", "tags": ["ai", "cybersecurity", "governance", "enterprise"]}, {"id": "sakana-fugu-2026-06-23", "section": "news", "headline": "A Japanese lab is betting that routing between AI models beats picking the smartest one", "summary": "Sakana AI launched Fugu, a system that takes one request and farms it out to a pool of specialized models behind a single API, pitched partly as a hedge for labs locked out of US export-controlled models. Early benchmarks looked frontier-competitive, but hands-on reviewers say the real-world experience doesn't quite match the scoreboard yet - file under wait-and-see.", "link": "https://sakana.ai/fugu-release/", "sources": ["The Neuron", "The Rundown", "The Deep View"], "source_date": "Jun 22-23", "tags": ["ai", "tools", "agents"]}, {"id": "glm-5-2-followup-2026-06-23", "section": "news", "headline": "GLM 5.2 is holding up under real use, but self-hosting it is its own project", "summary": "A weekend of hands-on testing from credible names (Vercel's CEO, Jeremy Howard, others) is calling this the open-weights model that actually lived up to its benchmarks - genuinely close to Opus/GPT-class coding quality, and it beat Fable 5 specifically at website design. The catch if you want to self-host: it's a 744-billion-parameter model that needs the full thing in memory regardless of how few parameters fire per token, which in practice means roughly 8 H200 GPUs (~$370K to buy, ~$20K/month to rent) for the standard build. For almost everyone the sane move is renting it through OpenRouter (about $4.40/M output tokens) rather than buying hardware - self-hosting only pencils out if your code legally can't leave the building.", "link": "https://newsletter.stayingahead.com/p/glm-5-2", "sources": ["AI Daily Brief", "Staying Ahead"], "source_date": "Jun 22-23", "tags": ["ai", "open-models", "local", "cost"]}, {"id": "ai-talent-model-wars-2026-06-23", "section": "news", "headline": "Two Nobel-adjacent departures and a noisy week of model rumours", "summary": "Nobel laureate John Jumper (AlphaFold) is leaving Google DeepMind for Anthropic, days after Noam Shazeer's exit - reporting cites low morale and four months without a flagship Gemini release (3.5 Pro is reportedly due June 30). Meanwhile OpenAI's Barret Zoph left for the second time in five months, and the rumour mill has GPT-5.6, a returned Fable/Mythos, and a new Sonnet all possibly landing the same week. Background noise for now, but the competitive picture between labs is genuinely shifting, not just Twitter chatter.", "link": "https://techcrunch.com/2026/06/20/nobel-laureate-john-jumper-is-leaving-deepmind-for-rival-anthropic/", "sources": ["AI Daily Brief", "The Neuron"], "source_date": "Jun 19-23", "tags": ["ai", "talent", "industry"]}, {"id": "a24-google-deepmind-2026-06-23", "section": "news", "headline": "Google is putting $75M into A24 to build film tools, not films", "summary": "The indie studio behind Backrooms and Civil War is partnering with Google DeepMind on AI tooling for production - storyboards and workflow support, explicitly not AI-generated movies. A24's own Backrooms director has called AI 'cultural and economic rot,' so this is a real gamble on the studio's indie-cred audience. Comes the same week SpaceX signed a $6.3B compute deal with startup Reflection AI, renting out data centres it originally built for Grok.", "link": "https://blog.google/innovation-and-ai/models-and-research/google-deepmind/deepmind-a24-research-partnership/", "sources": ["The Deep View", "The Rundown", "Morning Brew"], "source_date": "Jun 22-23", "tags": ["ai", "film", "business"]}, {"id": "ai-workplace-burnout-2026-06-23", "section": "news", "headline": "A panel of execs and a psychiatrist say AI is adding stress, not removing it", "summary": "At a Paris tech conference, business leaders and a psychiatrist argued AI is increasing workplace anxiety by piling on new tools to learn and uncertainty about job security - a Headspace study found 9 in 10 US workers are feeling cognitive strain, with a third saying it's gotten worse over the past year. The sharper point raised: if the underlying process was already broken, bolting AI onto it just speeds up the broken process.", "link": "https://www.thedeepview.com/articles/why-ai-at-work-is-coming-at-a-mental-health-cost", "sources": ["The Deep View"], "source_date": "Jun 23", "tags": ["ai", "work", "wellness"]}, {"id": "retail-roundup-2026-06-23", "section": "news", "headline": "Shake Shack picks Calgary for its first Canadian drive-thru", "summary": "Shake Shack Canada is opening the country's first Shake Shack drive-thru in Calgary this fall. Elsewhere in retail: an Ontario court approved splitting Toys 'R' Us Canada's brand from its stores between separate buyers (the fate of remaining stores past Jan 2027 is unclear), and a new survey found 96% of Canadian households shopped at Dollarama in the past 60 days - a level of penetration most retailers would kill for.", "link": "https://retail-insider.com/", "sources": ["Retail Insider"], "source_date": "Jun 23", "tags": ["retail", "calgary", "strategy", "canada"]}, {"id": "canada-roundup-2026-06-23", "section": "news", "headline": "Inflation ticks up to 3.2%, Ottawa floats a Kingston stop for the high-speed rail", "summary": "May's headline inflation rate hit 3.2% - higher than expected, mostly gas prices tied to the Iran conflict - though core inflation (excluding energy) is a calmer 2.2%. Ottawa asked the Alto high-speed rail project to study adding a Kingston stop after consultation showed demand there, which could help politically but complicates the straight-line speed the project needs. Separately, Ottawa unveiled plans to boost nuclear power 50% with up to 10 new Candu reactors, partly to meet AI-data-centre demand. And three people, including a police officer, were killed in a Montreal shooting; the RCMP has warned of possible copycat attacks.", "link": "https://www.cbc.ca/news/business/cpi-may-2026-9.7244063", "sources": ["The Peak"], "source_date": "Jun 23", "tags": ["canada", "economy", "infrastructure"]}, {"id": "training-typeless-voice-2026-06-23", "section": "training", "headline": "Build a voice-dump-to-clean-prompt workflow with AI dictation", "summary": "The Rundown's hands-on guide: use a dictation tool (Typeless, or the built-in mic in ChatGPT/Claude) to ramble through an idea with all its caveats and constraints, then have the model reconstruct your actual intent into a clean, reusable prompt before answering. Useful if 'perfect prompt formatting' has ever been the thing stopping you from starting.", "link": "https://app.therundown.ai/guides/cut-typing-time-in-half-with-ai-voice-commands-typeless-tutorial", "sources": ["The Rundown"], "source_date": "Jun 23", "tags": ["training", "ai", "prompting"]}, {"id": "regulars-wirecutter-2026-06-23", "section": "regulars", "headline": "Wirecutter: Prime Day picks plus the best ice cube trays", "summary": "Wirecutter's already vetted the Prime Day pile down to ones it actually recommends, and separately ran down the best ice cube trays and drinking glasses. Flagging, not summarizing - no clean non-tracking link.", "link": null, "sources": ["Wirecutter"], "source_date": "Jun 22-23", "tags": ["regulars", "deals", "household"]}, {"id": "regulars-canadaland-2026-06-23", "section": "regulars", "headline": "Canadaland: World Cup visa bans, a bill-passing sprint, Robert Fife's retirement", "summary": "This week's pods cover the politics of co-hosting the World Cup while ~25% of competing nations face US travel restrictions, the Liberals racing bills through before Parliament's summer break, and a look back at Robert Fife's 48 years of access journalism as he retires. Flag only - body not read in full.", "link": null, "sources": ["Canadaland"], "source_date": "Jun 22", "tags": ["regulars", "canada", "podcast"]}, {"id": "deals-costco-2026-06-23", "section": "deals", "headline": "Costco: Treasure Hunt still running, Executive member event teased", "summary": "Costco's Treasure Hunt warehouse-savings event continues through July 5, and a new email is teasing extra Executive-membership perks. Routine - browse if you're already going.", "link": "https://www.costco.ca/", "sources": ["Costco"], "source_date": "Jun 23", "tags": ["deals", "costco", "routine"]}, {"id": "deals-ikea-2026-06-23", "section": "deals", "headline": "IKEA Family: 15% off picture frames until July 2", "summary": "Standard IKEA Family member discount on frames and gallery-wall pieces. Minor, but cheap enough to be worth a glance if you've got a wall that needs filling.", "link": "https://www.ikea.com/ca/en/", "sources": ["IKEA"], "source_date": "Jun 23", "tags": ["deals", "ikea", "home"]}, {"id": "ctc-cadence-2026-06-23", "section": "ctc", "headline": "CTC banners: training-gear sale at SportChek, a 'coming soon' teaser, the usual CT flyer", "summary": "Cadence note - SportChek pushed a training-gear sale (Nike, Evoke and others, no specifics on the size of the discount), a separate 'coming soon, online only' teaser hit all three banners, and Canadian Tire's flyer led with Tims K-Cup pods and the ChillMate iced-coffee maker. Nothing here clears the bar as a standout.", "link": "https://www.sportchek.ca/", "sources": ["SportChek", "Canadian Tire"], "source_date": "Jun 23", "tags": ["ctc", "sportchek", "canadian-tire"]}]}, {"build_date": "2026-06-22", "build_label": "Monday, June 22", "entries": [{"id": "now-prime-day-2026-06-22", "section": "now", "headline": "Amazon Prime Day runs Tuesday through Friday this week", "summary": "Amazon pulled its big sale event a month early this year (to line up with the World Cup and the US 250th), so it lands this week, Tue-Fri, rather than July. Worth a look if anything's been sitting in your cart.", "link": "https://www.amazon.ca/", "sources": ["Morning Brew"], "source_date": "Jun 22", "tags": ["now", "deals", "amazon"]}, {"id": "now-iran-talks-2026-06-22", "section": "now", "headline": "US-Iran ceasefire looks shaky as Trump threatens fresh strikes", "summary": "A week after the two sides signed a ceasefire, negotiators met through the night in Switzerland while Trump posted that the US would 'hit Iran very hard again' if it doesn't rein in Hezbollah. Mediators from Qatar and Pakistan reported 'encouraging progress' and talks continue this week. The Strait of Hormuz has reopened, but 800+ vessels are still backed up and freight rates may take months to settle.", "link": "https://www.reuters.com/world/asia-pacific/us-disputes-iranian-claims-about-closing-strait-hormuz-negotiators-head-2026-06-20/", "sources": ["Morning Brew", "The Peak", "Retail Insider"], "source_date": "Jun 22", "tags": ["now", "world", "iran"]}, {"id": "glm-open-models-2026-06-22", "section": "news", "headline": "A Chinese open model just made 'rent vs. run your own' a real question", "summary": "Z.ai released GLM 5.2, an open-weights model with a 1M-token context window that early testers put in the same conversation as far pricier closed models on coding and reasoning - at roughly $4.40 per million output tokens (about a sixth of GPT-5.5). Because the weights are downloadable, you can quantize, fine-tune, or run it locally. The strategic backdrop: DeepSeek just raised $7.4B with the Chinese state holding the only voting equity, and Anthropic's 'Mythos' export saga has Washington rethinking which models can leave the country - all of which makes cheaper open models look more attractive, not less. The practical takeaway for your stack: model choice is becoming an architecture decision (expensive flagship for the hard calls, cheap open model for the repeatable work, local when data can't leave the building).", "link": "https://z.ai/blog/glm-5.2", "sources": ["The Neuron", "The Rundown", "The Daily AI Show"], "source_date": "Jun 21-22", "tags": ["ai", "open-models", "local", "cost", "strategy"]}, {"id": "medical-ai-wave-2026-06-22", "section": "news", "headline": "AI in medicine had a real week - 18 families finally got a diagnosis", "summary": "Boston Children's and Harvard ran 376 unsolved pediatric genetic cases (all prior specialist dead-ends) through OpenAI's o3 Deep Research and confirmed 18 new diagnoses - cracking ~4.8% of a backlog no one had the bandwidth to revisit. Separately, Midjourney unveiled a full-body ultrasound scanner (first 'spa' site planned for SF in 2027) and Google pushed its AMIE model from diagnosis into ongoing care. The pattern worth noting: AI companies are moving off the screen to capture medical data the internet never had.", "link": "https://openai.com/index/diagnose-rare-childhood-diseases/", "sources": ["The Rundown", "The Daily AI Show", "There's An AI For That"], "source_date": "Jun 21-22", "tags": ["ai", "health", "research"]}, {"id": "ai-skill-erosion-2026-06-22", "section": "news", "headline": "Mounting evidence that leaning on AI quietly erodes your skills", "summary": "Three studies in the pile: experienced physicians' ability to read colonoscopy images degraded within months of using an AI tool (Lancet); frequent AI use correlated with lower critical-thinking scores; and Anthropic's own researchers found AI use 'impairs conceptual understanding, code reading, and debugging.' The counterpoint is the GPS/phone-number argument - we've offloaded skills before without much harm. The difference is that AI is aimed at the thinking itself, not just rote recall, which is a different kind of bet.", "link": "https://arxiv.org/abs/2601.20245", "sources": ["The Peak"], "source_date": "Jun 22", "tags": ["ai", "work", "research"]}, {"id": "td-worker-monitoring-2026-06-22", "section": "news", "headline": "TD will start monitoring how some staff spend their workday", "summary": "TD is rolling out WorkiQ, software that tracks how much time employees spend in meetings, on the web, and in internal apps - starting with its financial-crimes and risk team. The bank frames it as restoring transparency lost to remote work. It's part of a broader surveillance creep (Burger King's headset 'Patty,' US banks scanning staff chat for bullying), and roughly a third of remote-working Canadians already report some monitoring. One to file under how 'productivity' gets defined and measured.", "link": "https://www.reuters.com/world/canadian-lender-td-tells-some-employees-it-will-use-software-monitor-their-work-2026-06-19/", "sources": ["The Peak"], "source_date": "Jun 22", "tags": ["work", "ai", "canada", "surveillance"]}, {"id": "agent-control-2026-06-22", "section": "news", "headline": "AI safety is starting to look like IT security - permissions, logs, kill switches", "summary": "Google DeepMind published an AI Control Roadmap that treats powerful internal agents like insider threats: trusted AI supervisors watching an agent's reasoning and actions, controls that scale by risk (delayed review for low-stakes, real-time blocking for dangerous), and hard metrics like coverage, recall, and time-to-response. The reason it's urgent: agents now read files, call tools, and take actions, so a wrong action - not just a wrong answer - can delete data or approve a payment. Anthropic made the shift concrete from the other side, reporting Claude completed shared robotics tasks 18-37x faster than earlier human teams. Useful framing for any AI-governance conversation at work.", "link": "https://deepmind.google/blog/securing-the-future-of-ai-agents/", "sources": ["The Neuron"], "source_date": "Jun 21", "tags": ["ai", "governance", "agents", "enterprise"]}, {"id": "retail-calgary-2026-06-22", "section": "news", "headline": "Retail intel: Hermes coming to Stephen Avenue, Sobeys leans hard into discount, AI creeps into the cart", "summary": "Three from Retail Insider that land in your lane. Hermes is planning its first standalone Alberta store on Calgary's Stephen Avenue, exiting Holt Renfrew and reinforcing downtown's luxury build-out. Empire (Sobeys) laid out a discount-first growth plan - 70 new stores over three years, 75%+ of them discount banners like FreshCo - a clear read on where the grocery battle is heading. And a National Bank survey found 39% of Canadians have used generative AI to help with a purchase decision in the past year, so the 'AI in the shopping journey' theme keeps building.", "link": "https://retail-insider.com/", "sources": ["Retail Insider"], "source_date": "Jun 22", "tags": ["retail", "calgary", "strategy", "ai", "canada"]}, {"id": "musk-merger-2026-06-22", "section": "news", "headline": "The Tesla-SpaceX merger chatter is really an embodied-AI play", "summary": "After SpaceX absorbed xAI and bought Cursor-maker Anysphere for ~$60B, the long-rumoured Tesla-SpaceX merger is being read less as a car-meets-rocket deal and more as an attempt to own the whole embodied-AI stack: chips, launch, Starlink connectivity, models, coding agents, robotaxis, and Optimus robots - one industrial loop where physical-world data improves the next generation of machines. Regulators would have a very long list of questions. More 'where the puck is going' than actionable, but a sharp strategy case study.", "link": "https://www.reuters.com/legal/transactional/spacex-buy-anysphere-60-billion-2026-06-16/", "sources": ["The Daily AI Show", "The Neuron"], "source_date": "Jun 21", "tags": ["ai", "tech", "strategy"]}, {"id": "codex-record-replay-2026-06-22", "section": "news", "headline": "Codex can now learn a repetitive task by watching you do it once", "summary": "OpenAI's new Record & Replay for Codex lets you perform a recurring workflow once - filing an expense, pulling the same report every Monday, working through clunky software with no API - and turns the demo into a reusable, editable skill it can run again with new inputs. The 'record once, replay forever' pattern is exactly the kind of grunt-work automation worth keeping in mind for the agent workflows you build.", "link": "https://developers.openai.com/codex/record-and-replay", "sources": ["The Neuron", "There's An AI For That"], "source_date": "Jun 21-22", "tags": ["ai", "tools", "building", "automation"]}, {"id": "starmer-resigns-2026-06-22", "section": "news", "headline": "UK PM Keir Starmer announced his resignation", "summary": "Standing outside 10 Downing Street this morning, Starmer said he'd told King Charles he intends to step down and will back an orderly handover. Labour lost confidence in him after a scandal tied to his former US ambassador's Epstein links and the rise of rival Andy Burnham, now the frontrunner. A successor is expected by the time Parliament returns in September - the UK's seventh PM in 10 years.", "link": "https://www.theguardian.com/politics/2026/jun/21/keir-starmer-expected-to-announce-departure-as-prime-minister-on-monday", "sources": ["Morning Brew", "The Peak"], "source_date": "Jun 22", "tags": ["world", "uk", "politics"]}, {"id": "canada-roundup-2026-06-22", "section": "news", "headline": "Around Canada: World Cup berth in reach, EV sales jumping, inflation read today", "summary": "Canada is on the verge of advancing out of the World Cup group stage for the first time ever - a win or tie against Switzerland on Wednesday does it. Higher gas prices (Iran war) and renewed federal incentives pushed EV sales up nearly 21% over last year. And May CPI lands this morning, expected to tick up on energy costs, with little the Bank of Canada can do about the cause.", "link": null, "sources": ["The Peak"], "source_date": "Jun 22", "tags": ["canada", "world-cup", "economy"]}, {"id": "lighter-side-2026-06-22", "section": "news", "headline": "Lighter side: Serena's back at Wimbledon, Toy Story 5 owns the box office", "summary": "Serena Williams (44) accepted a wild-card and will return to Wimbledon singles next week, nearly four years after stepping away, plus doubles with sister Venus. And Toy Story 5 notched the biggest opening of 2026 - $160M domestic, a franchise best - so it may be a strong matinee bet with Lily.", "link": null, "sources": ["Morning Brew", "The Peak"], "source_date": "Jun 22", "tags": ["sports", "movies", "family"]}, {"id": "training-reddit-pain-radar-2026-06-22", "section": "training", "headline": "Build an AI 'pain radar' that mines Reddit complaints into business ideas", "summary": "The Rundown's hands-on guide: wire up Codex and Airtable to scan subreddits for complaints about slow, expensive, confusing, or repetitive work, log the evidence, and generate ranked business ideas linked to the posts that support them. You describe the workflow in plain language instead of building a schema, then add a weekly automation that drafts a landing page or test for the strongest idea. Squarely your kind of build.", "link": "https://app.therundown.ai/guides/mine-reddit-complaints-into-business-ideas-with-an-ai-pain-radar", "sources": ["The Rundown"], "source_date": "Jun 22", "tags": ["training", "ai", "codex", "airtable"]}, {"id": "regulars-2026-06-22", "section": "regulars", "headline": "NYT Five Weeknight Dishes: smashed chicken meatballs and a spicy sardine pasta", "summary": "This week's lineup leans fast and punchy - smashed chicken meatballs and a spicy sardine pasta headline the five. Flagging, not summarizing (no clean non-tracking link). Also in the pile: a Lumino/Dialogue virtual-care benefits nudge, routine.", "link": null, "sources": ["NYT Cooking", "Lumino Health"], "source_date": "Jun 21", "tags": ["regulars", "cooking"]}, {"id": "deals-2026-06-22", "section": "deals", "headline": "Deals pile: Costco Treasure Hunt running to July 5, routine Tims and Joe Fresh", "summary": "Costco's Treasure Hunt warehouse-savings event is live through July 5 - the one worth a browse. Otherwise routine: Tim Hortons pushed its usual personalized app offers (incl. a $6 breakfast deal), and Joe Fresh is running 20% off that it says ends tonight. Glance only if you were already buying.", "link": "https://www.costco.ca/", "sources": ["Costco", "Tim Hortons", "Joe Fresh"], "source_date": "Jun 22", "tags": ["deals", "costco", "routine"]}, {"id": "ctc-cadence-2026-06-22", "section": "ctc", "headline": "CTC banners: Big Chek Event winding down, Father's Day pushes now lapsed", "summary": "Cadence note - SportChek's Big Chek Event is in its final stretch (the Crocs feature ran Jun 14-22; Nike at 20% off), Canadian Tire sent a car/RV/boat batteries flyer, and Mark's pushed 'last-minute' Father's Day gifts plus a spend-$125-get-$30-bonus-card door-crasher. With Father's Day now past, expect the gift-timed messaging to taper this week.", "link": "https://www.sportchek.ca/", "sources": ["SportChek", "Canadian Tire", "Mark's"], "source_date": "Jun 22", "tags": ["ctc", "sportchek", "canadian-tire", "marks"]}]}, {"build_date": "2026-06-21", "build_label": "Sunday, June 21", "entries": [{"id": "now-fathers-day-2026-06-21", "section": "now", "headline": "It's Father's Day - a couple of clothing deals lapse with it", "summary": "Sunday is Father's Day, and the timed promos are winding down: Joe Fresh's 25% off men's styles is on its last day, and SportChek's spend-$125-get-$30 weekend offer closes today (the broader Big Chek Event runs on to June 24). Nothing else this morning needs acting on before tonight.", "link": "https://www.joefresh.com/", "sources": ["Joe Fresh", "SportChek"], "source_date": "Jun 21", "tags": ["now", "deals", "fathers-day"]}, {"id": "sportchek-floating-futsal-2026-06-21", "section": "news", "headline": "SportChek built Canada's first floating futsal pitch on the Toronto waterfront", "summary": "Timed to the World Cup, your banner opened the country's first-ever floating futsal pitch on Toronto's waterfront - the kind of experiential retail stunt that earns press well beyond the cost of building it. Worth having in your back pocket as a SportChek brand-moment example when the True North 'experience' conversation comes up.", "link": "https://retail-insider.com/retail-insider/2026/06/sportchek-opens-canadas-first-ever-floating-futsal-pitch-on-toronto-waterfront/", "sources": ["Retail Insider"], "source_date": "Jun 15", "tags": ["retail", "sportchek", "ctc", "experiential"]}, {"id": "retail-intel-roundup-2026-06-21", "section": "news", "headline": "Retail intelligence pile: shoppers want AI to help but don't trust it yet, and they're craving in-store connection", "summary": "Three threads from Retail Insider's week that land in your lane. A Checkout.com report finds consumer interest in AI shopping is running ahead of both trust and merchant readiness - the gap is the opportunity. A HumanKind study says Canadians increasingly want connection and community from physical retail, not just transactions. And on the macro side, RBC says cardholder spending is holding up but momentum is easing, while the Competition Bureau has opened a probe into competition factors behind food affordability. Zellers also drew opening-day crowds to its new Toronto store - nostalgia retail is clearly still a draw.", "link": "https://retail-insider.com/retail-insider/2026/06/checkout-com-report-finds-consumer-interest-in-ai-shopping-outpacing-trust-and-merchant-readiness/", "sources": ["Retail Insider"], "source_date": "Jun 15-19", "tags": ["retail", "ai", "insights", "canada", "strategy"]}, {"id": "prediction-markets-boom-2026-06-21", "section": "news", "headline": "Prediction markets exploded into a $24B-a-month business - and almost everyone loses money", "summary": "Morning Brew did a full issue on Kalshi and Polymarket: combined monthly trading volume jumped from $4.5B last September to ~$24B this April, Kalshi's valuation doubled to $22B in six months, and the platforms now have deals with the NHL, MLB, CNN and the WSJ's parent. But the surface number hides the real one - a WSJ analysis found 67% of Polymarket's profits go to just 0.1% of accounts, the average user is down money, and the bottom 10% have lost about $4,000 each. The growth story and the player-outcomes story point in opposite directions, which is exactly the kind of split you'd pull apart for a living. Insider-trading scandals (a soldier, a Google employee, a MrBeast editor) are the recurring headache.", "link": null, "sources": ["Morning Brew"], "source_date": "Jun 21", "tags": ["data", "markets", "betting"]}, {"id": "jumper-anthropic-2026-06-21", "section": "news", "headline": "AlphaFold's Nobel-winning architect is leaving DeepMind for Anthropic", "summary": "John Jumper, who shared a Nobel for AlphaFold, announced he's leaving Google DeepMind after nine years to build at Anthropic - a notable senior-talent move in the AI race, and one to file given how much your AI stack already leans on Anthropic's models.", "link": "https://x.com/JohnJumperSci/status/2068001285173834106", "sources": ["There's An AI For That"], "source_date": "Jun 20", "tags": ["ai", "anthropic", "deepmind"]}, {"id": "ai-building-bits-2026-06-21", "section": "news", "headline": "Three building-relevant AI drops: Claude Code ships shareable pages, agents that learn overnight, and throwaway agent logins", "summary": "Directly useful for the stuff you build: Claude Code can now publish a session as a live, shareable page (a PR walkthrough or a self-filling dashboard) so people check a link instead of asking for status. Perplexity gave its agents a 'self-improving memory' that reviews each session overnight and starts the next day's tasks faster. And Cloudflare now lets a coding agent spin up a throwaway account, ship a live Worker for 60 minutes, and hand you a claim link - killing the signup wall that used to stall background agents. Also notable on the governance side: NVIDIA's open-source SkillSpector scans agent skills for prompt injection and malicious code before you install them.", "link": "https://claude.com/blog/artifacts-in-claude-code", "sources": ["There's An AI For That"], "source_date": "Jun 20", "tags": ["ai", "tools", "agents", "building"]}, {"id": "cochrane-local-2026-06-21", "section": "news", "headline": "Around Cochrane: charges laid after a worker died in a fall, plus a music-education push", "summary": "From CochraneNow's weekend edition: an employer and supervisor are facing charges over alleged safety lapses after a worker was killed in a fall - the serious item in the pile. Lighter side: a local story on growing music education in town, and the Cochrane Rage notched a decisive win over the Spurs.", "link": "https://cochranenow.com/articles/employer-supervisor-accused-of-safety-lapses-after-worker-killed-in-fall", "sources": ["CochraneNow"], "source_date": "Jun 20", "tags": ["local", "cochrane"]}, {"id": "wirecutter-camping-crossover-2026-06-21", "section": "regulars", "headline": "NYT Wirecutter: camping gear that earns its keep the other 51 weekends a year", "summary": "This issue makes the case for camping kit you'll actually use at home: hiking shoes as everyday walkers, headlamps for night grilling and DIY, multitools and carabiners for everyday carry, and a packable chair small enough to live in a tote. There's also a fresh best-tents roundup if real camping is on the summer list. Body skimmed; no clean non-tracking link, so no link attached.", "link": null, "sources": ["NYT Wirecutter"], "source_date": "Jun 21", "tags": ["wirecutter", "shopping", "outdoors"]}, {"id": "deals-thin-2026-06-21", "section": "deals", "headline": "Deals pile is thin today: Father's Day promos closing, routine Skip and Tims offers", "summary": "Not much new beyond the Father's Day clothing deals up top. Skip and Tim Hortons both pushed their usual personalized points/savings offers - routine, nothing standout. Worth a glance only if you were already planning to order.", "link": null, "sources": ["Skip", "Tim Hortons", "Joe Fresh"], "source_date": "Jun 21", "tags": ["deals", "routine"]}, {"id": "ctc-cadence-2026-06-21", "section": "ctc", "headline": "CTC banners: Canadian Tire mailing daily, with a couple of real offers running", "summary": "Cadence note - Canadian Tire sent three flyer blasts in a day (Braun small appliances, a pools/spas/trampolines push, and a Rain-X feature). The offers actually worth acting on: SportChek's Big Chek Event has Nike at 20% off (event runs to June 24), and Mark's is running a spend-$125-get-a-$30-bonus-card door-crasher. The Triangle spend-$200-collect-$10-bonus-CT-Money offer from the weekend is valid to June 25.", "link": "https://www.canadiantire.ca/", "sources": ["Canadian Tire", "SportChek", "Mark's"], "source_date": "Jun 21", "tags": ["ctc", "canadian-tire", "sportchek", "marks"]}]}, {"build_date": "2026-06-20", "build_label": "Saturday, June 20", "entries": [{"id": "now-sportchek-weekend-2026-06-20", "section": "now", "headline": "Last day for the SportChek $30 weekend offer - and it's a golf push", "summary": "If you've had your eye on golf gear, the spend-$125-get-a-$30-promo-card weekend deal closes Sunday (the broader Big Chek Event runs to June 24). Separately, the Triangle spend-$200-collect-$10-bonus-CT-Money offer is valid through June 25. Nothing else urgent in the pile this morning.", "link": "https://www.sportchek.ca/", "sources": ["SportChek", "Canadian Tire"], "source_date": "Jun 20", "tags": ["now", "ctc", "sportchek", "golf", "deals"]}, {"id": "tim-hortons-pricing-2026-06-20", "section": "news", "headline": "A court case cracks open how Tim Hortons actually sets its prices", "summary": "A Montreal lawsuit by 15 Quebec franchisees (suing for $27M) forced Tim Hortons to reveal its pricing machinery in a court filing, and it's a clinic in dynamic retail pricing. The chain splits Canada into 62 'price clusters' and constantly re-prices each one against local competition, labour costs, income, and foot traffic - testing prices four times a year, set as high as it can go before customers walk to McDonald's. It also confirmed Tims Rewards became 'self-funded' within a year of its 2019 launch via price hikes and trimmed perks (loyal members are effectively paying for their own rewards). Franchisee margins run ~9-14%, short of the 15% they want but well above the industry, where 36% of restaurants are losing money or breaking even. Directly in your wheelhouse - this is the surface-vs-real-numbers read you do for a living.", "link": "https://www.nytimes.com/international/section/world/canada", "sources": ["NYT Canada Letter"], "source_date": "Jun 20", "tags": ["retail", "pricing", "loyalty", "canada", "strategy"]}, {"id": "sphinx-enterprise-ai-2026-06-20", "section": "news", "headline": "A startup is selling enterprises an 'accuracy layer' that sits between their AI and their data", "summary": "Sphinx.ai (seed-stage, backed by Lightspeed and Bessemer) just shipped Sphinx 2.0, which filters every AI query through an institutional-knowledge layer instead of trying to clean a company's data first - 'getting your AI ready for your data,' rather than the reverse. It monitors outputs, catches answers that drift from reality, and flags discrepancies for human review when what the model says disagrees with what the business already believes. The pitch names the exact problem you wrestle with: models reason fine on public knowledge but miss the 'tribal knowledge' of how an org actually works, and bolting raw data straight into AI sacrifices governance and observability. Worth tracking as enterprise AI accuracy/governance keeps maturing.", "link": "https://archive.thedeepview.com/p/how-sphinx-built-an-enterprise-ai-accuracy-layer", "sources": ["The Deep View"], "source_date": "Jun 20", "tags": ["ai", "enterprise", "governance", "data"]}, {"id": "iran-talks-delayed-2026-06-20", "section": "news", "headline": "The US-Iran peace deal wobbles: nuclear talks postponed as Lebanon flares", "summary": "A week after the war officially ended, the follow-up talks hit a snag. VP JD Vance postponed a Switzerland trip for nuclear negotiations (slated to start Friday) after Iran insisted Israel's strikes on Hezbollah in Lebanon stop first. It escalated overnight - a Hezbollah drone attack killed four Israeli soldiers and Israel hit back with 150+ strikes - before US officials said the Israel-Hezbollah ceasefire was back on. A reminder that the deal you flagged as 'done' last week is still fragile at the edges.", "link": null, "sources": ["Morning Brew"], "source_date": "Jun 20", "tags": ["world", "iran", "middle-east"]}, {"id": "amazon-altman-movie-2026-06-20", "section": "news", "headline": "Amazon is dumping its own Sam Altman biopic - months after a $50B OpenAI deal", "summary": "Amazon MGM has dropped 'Artificial,' Luca Guadagnino's nearly-finished film with Andrew Garfield as Altman (covering OpenAI's chaotic 2023 firing), and is shopping it to other studios. Studios rarely offload their own prestige films, so the timing raised eyebrows: it lands months after Amazon agreed to invest $50B in OpenAI. Make of that what you will - a drama kid's read is that the more interesting story might be why they're letting it go.", "link": "https://deadline.com/2026/06/luca-guadagnino-artificial-amazon-jeff-bezos-1236962694/", "sources": ["Morning Brew", "There's An AI For That"], "source_date": "Jun 20", "tags": ["ai", "openai", "hollywood"]}, {"id": "pinterest-ask-2026-06-20", "section": "news", "headline": "Pinterest is retiring the keyword search bar for a conversational 'Ask Pinterest'", "summary": "At Cannes, Pinterest leaned into taste-over-keywords: Ask Pinterest turns shopping into a conversation, and a new Business Assistant plus an MCP layer pipe the platform's taste-and-intent signals straight into advertisers' tools. The retail-strategy angle worth noting - it's another big consumer platform betting that intent signals delivered via AI agents (and MCP specifically) are the product advertisers will actually pay for.", "link": "https://newsroom.pinterest.com/news/cannes-2026/", "sources": ["There's An AI For That"], "source_date": "Jun 20", "tags": ["ai", "retail", "marketing", "mcp"]}, {"id": "ai-quick-hits-2026-06-20", "section": "news", "headline": "Two AI bits worth a glance: Codex learns by watching, Claude drives a robodog", "summary": "Building-relevant: OpenAI's Codex now does 'record and replay' - record yourself doing a task on your Mac (filing an expense, pulling a report) and it packages the demo into a reusable skill it runs later with new inputs. And for the highlight reel: Anthropic's Project Fetch phase two had Claude set up and drive a robot dog solo, 20x faster than the humans who wrestled with it last year.", "link": "https://developers.openai.com/codex/record-and-replay", "sources": ["There's An AI For That"], "source_date": "Jun 20", "tags": ["ai", "openai", "anthropic", "tools"]}, {"id": "pew-dual-income-2026-06-20", "section": "news", "headline": "For the first time, most US two-parent households have both parents working full-time", "summary": "A new Pew report finds 52% of two-parent US households now have mom and dad both on full-time paychecks - up from 46% a decade ago and 31% in 1975, driven largely by women out-earning men in college degrees. The texture is familiar to any working parent: 70% handle parenting tasks during work hours, 59% do work tasks while with their kids, and 54% call the balance hard. Only 24% say they have 'a lot' of telework flexibility, and most who don't say it would help a lot. A clean data story - the kind where the headline number hides the real one (degree attainment) underneath.", "link": "https://www.pewresearch.org/social-trends/", "sources": ["Morning Brew"], "source_date": "Jun 20", "tags": ["data", "work", "family"]}, {"id": "world-cup-update-2026-06-20", "section": "news", "headline": "World Cup roundup: US advances, Canada's next test is Switzerland, and the host country goes viral", "summary": "The US men beat Australia 2-0 to reach the knockout stage; Canada (fresh off Thursday's 6-0 rout of Qatar) faces Switzerland next. The lighter side: foreign fans are going viral marvelling at everyday Americana - Buc-ee's, Waffle House, ranch dip (the TSA had to ask travellers to check oversized ranch bottles) - and Boston signed a sister-city letter with Glasgow amid the kilted 'Tartan Army.' Hotel gouging is easing too, with the steepest nightly-rate drops in Vancouver and Monterrey.", "link": null, "sources": ["Morning Brew", "NYT Canada Letter"], "source_date": "Jun 20", "tags": ["sports", "world-cup", "canada"]}, {"id": "cochrane-local-2026-06-20", "section": "news", "headline": "Around Cochrane: 5 weekend events, an RCMP K9 hurt in a robbery, and pushback on Alberta's $100 rebate", "summary": "From CochraneNow's Friday roundup: there's a 5-events weekend guide (plus an Indigenous Peoples Day celebration Sunday - both good Lily-friendly options), an RCMP police dog was injured in an armed robbery, and the town logged another $100K lottery winner. On the policy side, MLA Guthrie, the NDP and taxpayer advocates are all knocking Alberta's one-time $100 energy rebate - relevant to the energy-tracking you do at home - and the province plans to launch a dual-practice surgery model in September.", "link": "https://cochranenow.com/articles/looking-for-something-to-do-in-cochrane-this-weekend-here-are-5-great-events-to-check-out", "sources": ["CochraneNow"], "source_date": "Jun 19", "tags": ["local", "cochrane", "alberta", "energy"]}, {"id": "wirecutter-summer-2026-06-20", "section": "regulars", "headline": "NYT Wirecutter: hot-weather picks - antiperspirants, a packable grill, and a neck fan", "summary": "Wirecutter's summer-heat run: the best antiperspirants for scorching days, a grill you can take (almost) anywhere, an itty-bitty camping chair, and an on-sale neck fan they're calling genuinely fun. Bodies skimmed. The packable grill could be worth a look heading into patio/camping season.", "link": "https://www.nytimes.com/wirecutter", "sources": ["NYT Wirecutter"], "source_date": "Jun 20", "tags": ["wirecutter", "shopping", "summer"]}, {"id": "sports-pile-2026-06-20", "section": "regulars", "headline": "Also in the sports pile: the Knicks win their first NBA title in 53 years", "summary": "New York secured its first NBA championship since 1972 and heads into an offseason full of questions. Also kicking around the inbox: a profile of the Packers' history-making punter. Flag-only - bodies not read.", "link": null, "sources": ["Sports newsletters"], "source_date": "Jun 19", "tags": ["sports", "nba"]}, {"id": "deals-weekend-2026-06-20", "section": "deals", "headline": "Weekend deals: Costco Frame TV $300 off, a Nespresso accessory sale, and Joe Fresh 20% off", "summary": "Routine weekly cycles: Costco's What's New has a Samsung 65\" Frame QLED for $300 off (plus Philips shaver and online essentials), Nespresso has accessories and milk frothers from $9 and is throwing in a free limited-edition cooler bag with 140 Original capsules, and Joe Fresh is running a Stampede-themed 20% off. Family note: Toy Story 5 is now in theatres if you're after a Lily outing.", "link": "https://www.costco.ca/", "sources": ["Costco", "Nespresso", "Joe Fresh", "Cineplex"], "source_date": "Jun 20", "tags": ["deals", "shopping", "family"]}, {"id": "ctc-cadence-2026-06-20", "section": "ctc", "headline": "CTC banners: relentless flyer cadence into the weekend, with a couple of real offers", "summary": "Cadence note - your banners are still mailing daily. The two worth acting on: Triangle's spend-$200-collect-$10-bonus-CT-Money (valid to June 25) and up to 40% off power tools and camping gear at Canadian Tire. The SportChek Big Chek Event and Mark's spend-$125-get-$30 bonus card both run on (Big Chek to June 24). Canadian Tire is also peppering in product-review and Q&A requests off recent purchases (a patio chair, lawn weed killer). Nothing beyond the weekend SportChek deadline is time-sensitive.", "link": "https://www.canadiantire.ca/", "sources": ["Canadian Tire", "SportChek", "Mark's"], "source_date": "Jun 20", "tags": ["ctc", "canadian-tire", "sportchek", "marks"]}]}]</script>
<script>
const NTFY_CURATE = "https://ntfy.sh/emarifeed-k7f3qx9m2p-curate";
const SECTIONS = {
  now:      { label: "Now",      icon: "⚡" },
  news:     { label: "News",     icon: "📰" },
  training: { label: "AI Training", icon: "🎓" },
  regulars: { label: "Regulars", icon: "📬" },
  deals:    { label: "Deals",    icon: "🛍️" },
  ctc:      { label: "CTC",      icon: "🔺" }
};
const SECTION_ORDER = ["now", "news", "training", "regulars", "deals", "ctc"];
const DAYS = JSON.parse(document.getElementById("data").textContent); // newest first
const state = { tab: "today", sec: "all", q: "" };
const votes = JSON.parse(localStorage.getItem("eo-votes") || "{}");

function setTab(t) {
  state.tab = t;
  document.getElementById("tab-today").classList.toggle("on", t === "today");
  document.getElementById("tab-week").classList.toggle("on", t === "week");
  render();
}
function setSec(s) { state.sec = s; render(); }

function matches(e) {
  if (state.sec !== "all" && e.section !== state.sec) return false;
  if (!state.q) return true;
  const hay = (e.headline + " " + e.summary + " " + (e.tags || []).join(" ") + " " + e.sources.join(" ")).toLowerCase();
  return state.q.toLowerCase().split(/\s+/).every(w => hay.includes(w));
}

function esc(s) { return s.replace(/&/g, "&amp;").replace(/</g, "&lt;"); }

function card(e) {
  const v = votes[e.id] || "";
  const link = e.link ? `<a class="more" href="${e.link}" target="_blank" rel="noopener">Read more →</a>` : "";
  return `<div class="card${e.section === "now" ? " urgent" : ""}">
    <p class="hl">${esc(e.headline)}</p>
    <div class="sum-wrap">
      <p class="sum clamp">${esc(e.summary)}</p>
      <button class="more-toggle" onclick="toggleMore(this)">&hellip;more</button>
    </div>
    <div class="meta">
      <span class="src"><span class="badge">${SECTIONS[e.section].icon} ${SECTIONS[e.section].label}</span>${esc(e.sources.join(" + "))} · ${esc(e.source_date)}</span>
      <span class="actions">${link}
        <button class="thumb${v === "up" ? " on" : ""}" onclick="vote('${e.id}','up',this)">👍</button>
        <button class="thumb${v === "down" ? " on" : ""}" onclick="vote('${e.id}','down',this)">👎</button>
      </span>
    </div>
  </div>`;
}

function render() {
  // chips with counts for current tab scope
  const scope = state.tab === "today" ? DAYS.slice(0, 1) : DAYS;
  const all = scope.flatMap(d => d.entries);
  let chips = `<button class="chip${state.sec === "all" ? " on" : ""}" onclick="setSec('all')">All</button>`;
  for (const s of SECTION_ORDER) {
    const n = all.filter(e => e.section === s).length;
    if (!n) continue;
    chips += `<button class="chip${state.sec === s ? " on" : ""}" onclick="setSec('${s}')">${SECTIONS[s].icon} ${SECTIONS[s].label}</button>`;
  }
  document.getElementById("chips").innerHTML = chips;

  let html = "";
  if (state.tab === "today") {
    const day = DAYS[0];
    for (const s of SECTION_ORDER) {
      const items = day.entries.filter(e => e.section === s && matches(e));
      if (!items.length) continue;
      html += `<div class="sec-h">${SECTIONS[s].icon} ${SECTIONS[s].label} <span class="count">${items.length}</span></div>`;
      html += items.map(card).join("");
    }
  } else {
    for (const day of DAYS) {
      const items = day.entries.filter(matches);
      if (!items.length) continue;
      html += `<div class="day-h">${esc(day.build_label)}</div>`;
      html += items.map(card).join("");
    }
  }
  document.getElementById("main").innerHTML = html || `<div class="empty">Nothing matches. Try clearing the search or filter.</div>`;
  // Only reveal the "…more" toggle on summaries that actually overflow two lines.
  document.querySelectorAll(".sum.clamp").forEach(s => {
    if (s.scrollHeight - s.clientHeight > 2) s.nextElementSibling.classList.add("show");
  });
}

function toggleMore(btn) {
  const sum = btn.previousElementSibling;
  const collapsed = sum.classList.toggle("clamp"); // true = now clamped
  btn.classList.toggle("open", !collapsed);
  btn.innerHTML = collapsed ? "&hellip;more" : "less";
}

function vote(id, dir, btn) {
  const prev = votes[id];
  const action = prev === dir ? "retract" : dir;
  if (action === "retract") delete votes[id]; else votes[id] = dir;
  localStorage.setItem("eo-votes", JSON.stringify(votes));
  const entry = DAYS.flatMap(d => d.entries).find(e => e.id === id);
  fetch(NTFY_CURATE, {
    method: "POST",
    headers: { "X-Title": "Email Overview feedback" },
    body: `${action.toUpperCase()} | ${id} | ${entry ? entry.headline : ""}`
  }).then(() => toast(action === "retract" ? "Feedback removed" : (dir === "up" ? "More like this 👍" : "Less of this 👎")))
    .catch(() => toast("Couldn't send - no connection?"));
  render();
}

let toastTimer;
function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 1800);
}

render();
</script>
</body>
