View", "AI Daily Brief"], "source_date": "Jul 2", "tags": ["ai", "enterprise"]}, {"id": "meta-cloud-business-2026-07-02", "section": "news", "headline": "Meta looks to rent out its spare AI computing power", "summary": "Meta is reportedly building a cloud business to sell excess data-centre capacity and access to its own models - a hedge as its $182.9B AI infrastructure bet has yet to show a clear return. The stock jumped on the news; SpaceX and xAI set the template earlier this year by leasing spare compute to Anthropic and Google.", "link": "https://www.bloomberg.com/news/articles/2026-07-01/meta-is-building-a-cloud-business-to-sell-excess-ai-compute", "sources": ["The Rundown AI", "The Neuron", "Morning Brew", "The Deep View"], "source_date": "Jul 2", "tags": ["ai", "meta"]}, {"id": "walmart-hbc-space-2026-07-02", "section": "news", "headline": "Walmart takes over a former Hudson's Bay store as malls rework empty anchor space", "summary": "Walmart Canada is opening a 115,500-square-foot Supercentre in the old HBC store at Ottawa's Place d'Orléans, an early example of Primaris REIT's strategy for its former Bay locations. Primaris also says it could unlock up to $375M by redeveloping over 100 acres of excess mall land for housing, hotels, and seniors residences.", "link": null, "sources": ["Retail Insider"], "source_date": "Jul 2", "tags": ["retail", "canada"]}, {"id": "cusma-review-2026-07-02", "section": "news", "headline": "US declines to renew CUSMA, starting a decade of annual reviews instead", "summary": "The trade pact stays in force, but Canada, Mexico, and the US now face rolling annual reviews with a 2036 expiry if no long-term deal is reached. Expected, but it keeps trade uncertainty hanging over cross-border retail, auto, and agri-food businesses.", "link": null, "sources": ["The Peak", "Morning Brew"], "source_date": "Jul 2", "tags": ["news", "trade"]}, {"id": "design-md-guide-2026-07-02", "section": "training", "headline": "Guide: use Google's Design.md standard to keep AI-built sites on-brand", "summary": "Install Google's open-source Stitch skills into Claude Code, then have it generate a DESIGN.md brief from a simple site idea (or extract one from an existing site) so every future page or prototype it builds stays consistent with the brand.", "link": "https://app.therundown.ai/guides/use-googles-design-md-standard-to-build-a-consistent-brand", "sources": ["The Rundown AI"], "source_date": "Jul 2", "tags": ["ai", "training"]}, {"id": "nyt-well-digest-2026-07-02", "section": "regulars", "headline": "NYT Well sent its usual lifestyle digest", "summary": "A piece on when it's fine to leave the AC running while you're out - flagged, not read in full.", "link": null, "sources": ["NYT Well"], "source_date": "Jul 1", "tags": ["regulars"]}, {"id": "safeway-liquor-flyer-2026-07-02", "section": "deals", "headline": "Safeway Liquor: weekly flyer, July 2-8", "summary": "Spend $150, get 1,000 Scene+ points, plus BC-focused offers all week - routine flyer cadence.", "link": null, "sources": ["Safeway Liquor"], "source_date": "Jul 2", "tags": ["deals"]}, {"id": "skipthedishes-summer-savings-2026-07-02", "section": "deals", "headline": "SkipTheDishes: up to 50% off, plus a small points balance expiring", "summary": "Same routine promo cadence as recent weeks, order-size-dependent discounts.", "link": null, "sources": ["SkipTheDishes"], "source_date": "Jul 1", "tags": ["deals"]}, {"id": "joe-fresh-summer-savings-2026-07-02", "section": "deals", "headline": "Joe Fresh: apparel sale plus bonus PC Optimum points, framed as a final call", "summary": "20K PC Optimum points per $75 spent on apparel - routine promo, 'final call' framing discounted.", "link": null, "sources": ["Joe Fresh"], "source_date": "Jul 1", "tags": ["deals"]}, {"id": "ctc-cadence-2026-07-02", "section": "ctc", "headline": "CTC frequency check: Sport Chek, Canadian Tire, and Triangle kept up their usual cadence", "summary": "Sport Chek sent a weekly deals roundup, Canadian Tire previewed fresh summer markdowns, and Triangle offered bonus CT Money on Canada Day fuel-ups. A Canadian Tire Financial Services email also pitched a balance-transfer offer on the credit card - no specifics published here.", "link": null, "sources": ["Sport Chek", "Canadian Tire", "Triangle", "CTFS"], "source_date": "Jul 1-2", "tags": ["ctc"]}]}, {"build_date": "2026-07-01", "build_label": "Wednesday, July 1", "entries": [{"id": "sonnet-5-launch-2026-07-01", "section": "news", "headline": "Anthropic ships Sonnet 5 as a cheaper, more agentic default model", "summary": "Sonnet 5 replaces 4.6 as the free/Pro default, with near-Opus agentic performance (planning, browser/terminal use) at a lower cost - part of an industry-wide pullback from expensive 'tokenmaxxing' toward efficiency. Early testers (Cursor, Rakuten) praised its follow-through, though some flag weaker cybersecurity safeguards and real-world costs that can exceed Opus once actual token usage is counted.", "link": "https://www.anthropic.com/news/claude-sonnet-5", "sources": ["The Deep View", "The Rundown AI", "The Neuron", "There's An AI For That"], "source_date": "Jul 1", "tags": ["ai", "anthropic"]}, {"id": "fable-mythos-return-2026-07-01", "section": "news", "headline": "Claude's restricted Fable 5 and Mythos 5 models are back online - with new ID checks", "summary": "The US lifted the export-control order that pulled Fable 5 and Mythos 5 offline three weeks ago; both return this week, reportedly gated behind credit-based pricing and identity verification rather than normal subscriptions. It's part of a broader shift where Washington now reviews frontier models before release (OpenAI's GPT-5.6 Sol got the same treatment) - a policy that may hand the advantage to ungated open-weight models from labs like DeepSeek.", "link": "https://www.anthropic.com/news/redeploying-fable-5", "sources": ["The Neuron", "The Rundown AI", "AI Daily Brief", "Ultrathink"], "source_date": "Jul 1", "tags": ["ai", "anthropic", "policy"]}, {"id": "claude-science-2026-07-01", "section": "news", "headline": "Anthropic launches an AI workbench for scientists, plus its own drug discovery push", "summary": "Claude Science runs locally on a lab's own machines, connects 60+ research databases, and traces every result back to its source data. Anthropic also announced a preclinical drug discovery program targeting diseases pharma companies typically skip.", "link": "https://www.anthropic.com/news/claude-science-ai-workbench", "sources": ["The Deep View", "The Rundown AI", "The Neuron"], "source_date": "Jul 1", "tags": ["ai", "anthropic", "science"]}, {"id": "google-creative-ai-2026-07-01", "section": "news", "headline": "Google pushes cheaper, faster creative AI tools as it courts Hollywood", "summary": "Nano Banana 2 Lite generates images in about four seconds at a fraction of the usual cost, and Gemini Omni Flash brings AI video generation and editing to developers - both aimed at speed and cost over raw capability. The launch follows Google's $75M investment in film studio A24, a partnership that's drawn backlash from filmmakers.", "link": "https://blog.google/innovation-and-ai/models-and-research/gemini-models/gemini-omni-flash-nano-banana-2-lite", "sources": ["The Deep View", "The Rundown AI", "The Neuron", "There's An AI For That"], "source_date": "Jul 1", "tags": ["ai", "google"]}, {"id": "ai-economy-numbers-2026-07-01", "section": "news", "headline": "AI industry revenue is growing 90x faster than it did two years ago", "summary": "A rigorous new tally (Exponential View, 1,000+ companies) puts AI revenue at $175B annualized - still under half a percent of US GDP, so there's a lot of runway left. Separately, a Ramp/Revelio Labs study found companies that spend heavily on AI are hiring faster than laggards, including at the entry level, complicating the 'AI kills jobs' narrative.", "link": "https://intelligence.exponentialview.co/assets/ev-state-of-ai-economy-2026.pdf", "sources": ["AI Daily Brief", "The Deep View", "The Neuron", "Morning Brew"], "source_date": "Jul 1", "tags": ["ai", "economy"]}, {"id": "ramageddon-2026-07-01", "section": "news", "headline": "Memory chip shortages ('RAMageddon') are pushing up prices on phones, consoles, and PCs", "summary": "AI's hunger for memory chips has driven Micron's margins toward 84% and already forced Apple and Microsoft to raise prices, with Lenovo calling the new pricing permanent. Apple has reportedly asked Washington for an exemption to buy from a blacklisted Chinese supplier just to keep up.", "link": null, "sources": ["AI Daily Brief"], "source_date": "Jul 1", "tags": ["ai", "consumer-tech"]}, {"id": "california-claude-deal-2026-07-01", "section": "news", "headline": "California strikes a deal for half-price Claude access across state government", "summary": "Governor Newsom announced all California state departments and local governments get Claude at 50% off plus free training - a first-of-its-kind government AI deal, with timing that lands right in the middle of Anthropic's ongoing tension with Washington.", "link": null, "sources": ["AI Daily Brief"], "source_date": "Jul 1", "tags": ["ai", "policy"]}, {"id": "scotus-birthright-citizenship-2026-07-01", "section": "news", "headline": "Supreme Court upholds birthright citizenship, rejecting Trump's executive order", "summary": "In a 6-3 ruling, the Court struck down the administration's attempt to deny citizenship to US-born children of undocumented or nonpermanent residents. The Court separately upheld state bans on transgender girls in school sports.", "link": null, "sources": ["Morning Brew"], "source_date": "Jul 1", "tags": ["news", "politics"]}, {"id": "cochrane-canada-day-2026-07-01", "section": "news", "headline": "Cochrane gears up for Canada Day, while a wildfire smoke advisory and trail flooding linger", "summary": "Local coverage rounds up Canada Day events (Legion pancake breakfast, ranch rodeo) alongside a wildfire smoke air quality warning and a flooded section of trail near the Hwy 22 overpass.", "link": null, "sources": ["CochraneNow"], "source_date": "Jun 30", "tags": ["local", "cochrane"]}, {"id": "claude-ad-creation-guide-2026-07-01", "section": "training", "headline": "Guide: build ad creatives with Claude in one command", "summary": "The Rundown's tutorial walks through installing the Goose Ads skill, then prompting Claude to scan a brand's website and generate ad concepts across templates - a draft-then-refine workflow (generate low-quality drafts, polish the winners with a dedicated image model).", "link": "https://app.therundown.ai/guides/create-winning-ads-with-claude-in-one-command", "sources": ["The Rundown AI"], "source_date": "Jul 1", "tags": ["ai", "training"]}, {"id": "nyt-well-digest-2026-07-01", "section": "regulars", "headline": "NYT Well/Food sent their usual round of lifestyle digests", "summary": "A skincare primer for mature skin, five curated wellness stories, and food pieces on ketchup storage and cooler-packing - flagged, not read in full.", "link": null, "sources": ["NYT Well", "NYT Cooking"], "source_date": "Jun 30", "tags": ["regulars"]}, {"id": "costco-canada-day-2026-07-01", "section": "deals", "headline": "Costco.ca: one-day Canada Day online sale", "summary": "Costco's usual weekly online deals, timed to July 1 - no standout items called out.", "link": null, "sources": ["Costco"], "source_date": "Jul 1", "tags": ["deals", "costco"]}, {"id": "skipthedishes-summer-savings-2026-07-01", "section": "deals", "headline": "SkipTheDishes: up to 50% off, order-dependent", "summary": "Routine promo cadence continues - discount tiers depend on order size, no specific restaurant callouts.", "link": null, "sources": ["SkipTheDishes"], "source_date": "Jun 30", "tags": ["deals"]}, {"id": "petro-canada-ctmoney-2026-07-01", "section": "deals", "headline": "Petro-Canada: bonus CT Money on fill-ups July 1-5", "summary": "Fuel up at Petro-Canada or Gas+ over the Canada Day long weekend for extra CT Money - standard loyalty bonus, nothing that needs acting on urgently.", "link": null, "sources": ["Petro-Canada"], "source_date": "Jun 30", "tags": ["deals", "ctc"]}, {"id": "joe-fresh-jays-2026-07-01", "section": "deals", "headline": "Joe Fresh: 20% off apparel + Blue Jays gear, bonus PC Optimum points", "summary": "20% off everything plus 20K PC Optimum points per $75 spent on apparel - routine promo.", "link": null, "sources": ["Joe Fresh"], "source_date": "Jun 30", "tags": ["deals"]}, {"id": "papa-johns-tuesday-deal-2026-07-01", "section": "deals", "headline": "Papa John's: Tuesday pizza deal, 40% off", "summary": "Standard weekly promo cadence continues.", "link": null, "sources": ["Papa John's"], "source_date": "Jun 30", "tags": ["deals"]}, {"id": "ctc-cadence-2026-07-01", "section": "ctc", "headline": "CTC frequency check: Sport Chek and Canadian Tire kept up their usual daily cadence", "summary": "Sport Chek sent hiking, rain-gear, and new-arrivals blasts; Canadian Tire sent 'hurry' and clearance nudges - no specifics worth acting on beyond the standout below.", "link": null, "sources": ["Sport Chek", "Canadian Tire"], "source_date": "Jun 30-Jul 1", "tags": ["ctc"]}, {"id": "marks-bogo-2026-07-01", "section": "ctc", "headline": "Mark's: BOGO free on Denver Hayes, WindRiver, FarWest + Shambhala jackets", "summary": "Buy-one-get-one-free during Mark's 'Can't Miss Summer Event' on several house brands plus outerwear - one of the stronger CTC-banner deals this week.", "link": null, "sources": ["Mark's"], "source_date": "Jun 30", "tags": ["ctc", "deals"]}]}, {"build_date": "2026-06-30", "build_label": "Tuesday, June 30", "entries": [{"id": "now-kananaskis-emergency-2026-06-30", "section": "now", "headline": "Kananaskis and Canmore still under states of emergency heading into Canada Day", "summary": "Both communities remain under emergency orders as of Monday. If Canada Day plans involve the mountains, check conditions before heading out - Banff has also put out its own 'Before You Go' guidance for tomorrow.", "link": "https://cochranenow.com/articles/kananaskis-canmore-remain-under-states-of-emergency", "sources": ["CochraneNow"], "source_date": "Jun 29", "tags": ["local", "alert"]}, {"id": "now-elbow-river-flood-2026-06-30", "section": "now", "headline": "Elbow River flood alert active in the region", "summary": "High flows have triggered a flood alert for the Elbow River. Relevant if you're near river access points or planning outdoor activity along it this week.", "link": "https://cochranenow.com/articles/highflows-trigger-elbow-river-flood-alert", "sources": ["CochraneNow"], "source_date": "Jun 29", "tags": ["local", "alert"]}, {"id": "now-nespresso-last-day-2026-06-30", "section": "now", "headline": "Nespresso 30-free-capsules offer: today is actually the last day", "summary": "Surfaced yesterday as expiring June 30 - that's today. Order in-store or online before end of day to get 30 free capsules with a coffee order.", "link": "https://www.nespresso.com/ca/en/", "sources": ["Nespresso"], "source_date": "Jun 28", "tags": ["deal", "expiring"]}, {"id": "news-ford-ai-engineers-2026-06-30", "section": "news", "headline": "Ford rehired 350 veteran engineers after its AI quality inspection tools fell short", "summary": "The company had replaced experienced quality inspectors with automated AI systems and found the AI couldn't catch failure points before parts hit the plant floor. It brought back 'gray beard' engineers to train both younger staff and the AI tools themselves - and says it's saving hundreds of millions in warranty and recall costs as a result. PwC data backs this up: companies using AI to augment workers are outperforming those that simply swap people out.", "link": "https://www.thedeepview.com/articles/ford-discovers-ai-can-t-replace-deeper-expertise", "sources": ["Rundown AI", "Morning Brew", "The Deep View"], "source_date": "Jun 30", "tags": ["ai", "workforce"]}, {"id": "news-meta-brain2qwerty-v2-2026-06-30", "section": "news", "headline": "Meta's non-invasive brain-to-text AI now decodes full sentences at 61% word accuracy", "summary": "Brain2Qwerty v2 is a meaningful jump from v1 (letter-by-letter, 8% accuracy for rivals) - nine volunteers each spent 10 hours in a brain scanner generating 22,000 training sentences, and the top scorer hit 78%. Meta is open-sourcing both v1 and v2, and says the gap with surgical implants 'could be further narrowed through data scaling alone.' First non-invasive system to seriously challenge what previously required brain surgery.", "link": "https://ai.meta.com/blog/brain2qwerty-brain-ai-human-communication", "sources": ["Rundown AI", "The Neuron", "There's An AI For That"], "source_date": "Jun 30", "tags": ["ai", "research"]}, {"id": "news-scotus-fed-agencies-2026-06-30", "section": "news", "headline": "SCOTUS blocked Trump from firing a Fed governor, but gave him more power to fire other agency heads", "summary": "A 5-4 ruling said Trump violated due process when he tried to remove Federal Reserve Governor Lisa Cook - she keeps her job for now, with the court explicitly noting that the 'appearance of independence is key to the Federal Reserve's design.' A separate 6-3 ruling went the other way: Trump's firing of an FTC commissioner stands, broadening his removal power at other independent agencies. The court still has today's rulings pending on birthright citizenship, trans athlete bans, and campaign finance.", "link": "https://www.morningbrew.com", "sources": ["Morning Brew"], "source_date": "Jun 30", "tags": ["us-politics", "economy"]}, {"id": "news-comcast-spinout-2026-06-30", "section": "news", "headline": "Comcast is spinning off NBCUniversal and Sky into a separate public company", "summary": "The move unwinds Comcast's 2011 acquisition from GE and packages NBCUniversal (Peacock, Universal studios/parks, NBC, Telemundo) with European broadcaster Sky into a new standalone company. Comcast keeps cable, broadband, and mobile. Analysts widely expect the spun-out entity to become an acquisition target for Netflix or Apple. Comcast stock rose 4.5% on the announcement.", "link": "https://www.morningbrew.com", "sources": ["Morning Brew", "The Peak"], "source_date": "Jun 30", "tags": ["business", "media"]}, {"id": "news-ai-frontier-licensing-2026-06-30", "section": "news", "headline": "The informal US AI licensing regime is now a real structural shift - not just a news cycle", "summary": "Mythos is back for roughly 100 vetted partners, but under a letter from Commerce Secretary Lutnick that he explicitly runs on his own discretion with no congressional or executive-order basis. GPT-5.6 (Sol/Terra/Luna) launched under similar restrictions the same week. The deeper story from AI Daily Brief: companies aren't waiting - Coinbase halved its AI bill by switching defaults to Chinese open-weight models (GLM-5.2, Kimi), and OpenRouter data shows open-weight models have held a consistent 3-6 month gap behind the frontier for 18 months. The export controls meant to limit China's AI access may be accelerating adoption of the models they were meant to limit.", "link": "https://aidailybrief.beehiiv.com/p/mythos-comes-back-but-not-for-everyone", "sources": ["AI Daily Brief"], "source_date": "Jun 29", "tags": ["ai", "governance"]}, {"id": "news-anthropic-california-2026-06-30", "section": "news", "headline": "Anthropic signed a deal with California: half-price Claude for state and local agencies", "summary": "Governor Newsom and Anthropic agreed to give California government agencies Claude at 50% of normal cost, plus free workforce AI training. Claude was already being used for some tasks including code patching. The strategic upside for Anthropic is bigger than the contract value: California drives US tech regulation, and being embedded in state systems gives Anthropic a natural seat at the policy table.", "link": "https://www.thedeepview.com/articles/anthropic-cuts-california-s-ai-bill-in-strategic-move", "sources": ["Rundown AI", "The Deep View"], "source_date": "Jun 30", "tags": ["ai", "governance"]}, {"id": "news-qualcomm-ai-datacenter-2026-06-30", "section": "news", "headline": "Qualcomm is making a serious play in AI data centers with an open alternative to Nvidia's CUDA", "summary": "This week it launched the Dragonfly data center brand (C1000 CPU + AI300 accelerator), acquired Modular - software that runs AI workloads on any chip type rather than locking into Nvidia's ecosystem - and signed Meta as its first server customer starting 2028. Nvidia controls roughly 80-90% of the AI GPU market; Modular's 'multi-silicon token factory' pitch is the most credible open-platform challenge to CUDA lock-in that's emerged yet.", "link": "https://thedeepview.com/articles/how-qualcomm-could-ease-the-ai-hardware-crisis", "sources": ["The Deep View"], "source_date": "Jun 30", "tags": ["ai", "chips"]}, {"id": "news-consulting-billing-shift-2026-06-30", "section": "news", "headline": "Consulting firms are moving to outcome-based billing because AI makes hourly work hard to justify", "summary": "When AI cuts a 40-hour project to 10, clients ask why they're still paying for 40. McKinsey now pulls 30%+ of fees from outcome-based pricing. The Neuron's take is worth sitting with: outcome models tend to chase the easiest-to-measure results, and in consulting that's often headcount cuts. Without guardrails, AI productivity gains get absorbed by firms rather than shared with workers or clients - and the outcome-based model is the tidy package that makes that palatable.", "link": "https://www.theneurondaily.com/p/june-30-tuesday", "sources": ["The Neuron"], "source_date": "Jun 30", "tags": ["ai", "workforce", "business"]}, {"id": "news-deep-sky-carbon-credits-2026-06-30", "section": "news", "headline": "Montreal company became the first in North America to deliver direct air capture carbon credits", "summary": "Deep Sky stored 14 tonnes of carbon underground at its Alberta pilot facility and issued the resulting credits to RBC and Microsoft - first in North America, second globally for direct air capture (DAC). Unlike point-source capture, DAC can operate anywhere, making it more scalable in theory. The real test is the planned $500M Manitoba plant, targeting 500,000 tonnes per year. These first credits are a meaningful proof point, even at a tiny scale.", "link": "https://www.bnnbloomberg.ca/business/company-news/2026/06/29/canadian-company-delivers-north-americas-first-direct-air-capture-carbon-credits/", "sources": ["The Peak"], "source_date": "Jun 30", "tags": ["canada", "climate", "tech"]}, {"id": "news-tidal-ai-music-2026-06-30", "section": "news", "headline": "Tidal is cutting off all royalty payments for AI-generated music - the first major platform to go this far", "summary": "Tidal will label AI-generated tracks, remove any that mimic real artists, and demonetize AI 'artists' entirely. Apple Music and Spotify both label AI content but haven't moved to cut payments. This is the first full demonetization from a major streaming platform.", "link": "https://techcrunch.com/2026/06/29/tidal-cracks-down-on-ai-music-by-cutting-off-monetization/", "sources": ["The Neuron", "The Peak"], "source_date": "Jun 30", "tags": ["ai", "music"]}, {"id": "news-canadian-retail-jun30-2026-06-30", "section": "news", "headline": "Cadillac Fairview is putting CF Shops at Don Mills on the market; retail inventory stress is real", "summary": "CF is selling one of Toronto's pioneering open-air shopping centres as part of a strategy to concentrate capital in fewer flagship assets - creating a rare redevelopment opportunity for whoever buys it. On the operations side: a DOSS study found 75% of retail professionals have lost sleep over inventory decisions, with tariffs, TikTok-driven demand spikes, and AI planning gaps all making it worse.", "link": "https://retail-insider.com/", "sources": ["Retail Insider"], "source_date": "Jun 30", "tags": ews", "headline": "Dow hit 52,000 for the first time; the Mag 7 are down 13%+ from their May peak", "summary": "Alphabet joined the Dow and jumped almost 5% today, helping push the index to a first-ever close above 52K. Meanwhile the Magnificent Seven collectively have shed over 13% since mid-May as investors wait for AI infrastructure spend ($650B+ this year among four companies alone) to show returns. Canada's TSX is tracking its eighth consecutive quarter of gains - longest streak since 1996.", "link": "https://www.readthepeak.com/p/extra-credit", "sources": ["Morning Brew", "The Peak"], "source_date": "Jun 30", "tags": ["markets"]}, {"id": "training-codex-record-replay-2026-06-30", "section": "training", "headline": "AI training: record yourself doing a task once and Codex runs it forever after", "summary": "OpenAI's Codex (macOS) has a Record and Replay feature: install the app, add Record & Replay and Computer Use plugins, then record yourself doing any repetitive workflow - uploading a file, exporting a report, anything. Codex watches, drafts a named 'skill,' and you can replay it on demand or schedule it. The guide recommends testing in the same thread with /skill-name, then scheduling for recurring runs (monthly reports, etc.).", "link": "https://app.therundown.ai/guides/automate-any-manual-task-with-this-openai-feature", "sources": ["The Rundown AI"], "source_date": "Jun 30", "tags": ["ai", "training", "guide"]}, {"id": "regulars-nyt-stampede-comedy-2026-06-30", "section": "regulars", "headline": "Also in the pile: NYT on packing a cooler, Stampede stand-up comedy nights", "summary": "NYT Well/Cooking sent a timely piece on the right way to pack a cooler for summer - body not read, flagging it. Also: a two-night Stampede stand-up comedy event from hahaha.com, 1 host and 3 comedians. Subject line: 'Calgary get ready for 2 exclusive nights of Stampede Stand-Up!'", "link": null, "sources": ["NYT", "hahaha.com"], "source_date": "Jun 29-30", "tags": ["regulars"]}, {"id": "deals-canada-day-jun30-2026-06-30", "section": "deals", "headline": "Canada Day-adjacent deals: Co-op local brews promo, Costco weekly, Tim Hortons Crispy Chicken", "summary": "Calgary Co-op is running a Canada Day push on local beers, Canadian Classics, and Cal & Gary's Spirits - no end date in the snippet but clearly seasonal. Costco has its usual online weekly savings and warehouse rotation (nothing standout in the snippet). Tim Hortons has the Crispy Chicken Sandwich back at $5.99, good through July 6.", "link": null, "sources": ["Calgary Co-op", "Costco", "Tim Hortons"], "source_date": "Jun 29-30", "tags": ["deals", "canada-day"]}, {"id": "ctc-marks-bogo-jun30-2026-06-30", "section": "ctc", "headline": "Mark's Can't Miss Summer Event: BOGO free on Denver Hayes, WindRiver, FarWest, and Shambhala", "summary": "Mark's sent two emails in two days leading into Canada Day - today's is the deal one: buy one, get one free on Denver Hayes, WindRiver, FarWest, and Shambhala clothing and jackets. SportChek sent three emails in the same window (New Balance, Blue Jays merch timed to the World Cup knockout stage, and running shoes) - high cadence for the holiday stretch. Canadian Tire sends from this cycle (garage storage, BLACK+DECKER appliances, reorder reminder) were processed yesterday.", "link": "https://www.marks.com", "sources": ["Mark's", "SportChek"], "source_date": "Jun 30", "tags": ["ctc", "deal"]}]}, {"build_date": "2026-06-29", "build_label": "Monday, June 29", "entries": [{"id": "now-nespresso-free-capsules-2026-06-29", "section": "now", "headline": "Nespresso's 30-free-capsules offer ends tomorrow", "summary": "Place a coffee order in-store or online by June 30 and get 30 free capsules. Last call if you're due for a restock.", "link": "https://www.nespresso.com/ca/en/", "sources": ["Nespresso"], "source_date": "Jun 28", "tags": ["deal", "expiring"]}, {"id": "news-ai-frontier-access-2026-06-29", "section": "news", "headline": "OpenAI's newest model leapfrogs Anthropic - but almost nobody can use it yet", "summary": "OpenAI previewed GPT-5.6 (three tiers: Sol, Terra, Luna), claiming Sol edges out Claude Mythos on coding/agent benchmarks - but it's locked to ~20 government-vetted partners while Washington decides on broader release, mirroring the gating already applied to Anthropic's models. China's open-source GLM 5.2 is meanwhile drawing real praise from developers for coding work, and US firms are increasingly turning to cheaper Chinese models. Austria is now lobbying the EU to host Anthropic outright. The throughline: frontier AI access is becoming a geopolitical bargaining chip, not a product launch.", "link": "https://openai.com/index/previewing-gpt-5-6-sol/", "sources": ["The Deep View", "The Neuron", "The Rundown AI", "The Peak", "Morning Brew"], "source_date": "Jun 28-29", "tags": ["ai", "governance"]}, {"id": "news-ai-adoption-gap-2026-06-29", "section": "news", "headline": "Most companies are telling staff to use AI without giving them a plan", "summary": "A new ResumeNow survey: 41% of workers get zero employer guidance on AI use, and 76% have started using personal AI tools to fill the gap ('bring your own AI'). The risk cuts both ways - poor adoption hurts morale, but ungoverned use creates compliance and security exposure no one's tracking.", "link": "https://www.resume-now.com/job-resources/careers/byo-ai-report", "sources": ["The Deep View"], "source_date": "Jun 29", "tags": ["ai", "enterprise"]}, {"id": "news-apple-openai-talent-2026-06-29", "section": "news", "headline": "Apple's Vision Pro chief is leaving for OpenAI's hardware team", "summary": "Paul Meade, who ran Vision Pro hardware engineering for 7 of his 15 years at Apple and was steering its upcoming smart glasses, is joining OpenAI to build AI-native consumer devices - the latest in a string of ex-Apple hardware hires there. Apple's smart glasses, already late to market, lose their lead just as CEO transition turmoil (John Ternus take claude-video-editing-2026-06-29", "section": "training", "headline": "AI training: cut your own video with a free Claude-connected editor", "summary": "Today's Rundown AI guide walks through Palmier Pro, a free AI video editor that connects to your Anthropic API key - drag in raw footage, ask it to cut to ~1 minute keeping the strongest moments, then iterate on captions and pacing. Can also run as an MCP server for Claude Code/Codex for more automated workflows.", "link": "https://app.therundown.ai/guides/ai-powered-movie-production-with-claude", "sources": ["The Rundown AI"], "source_date": "Jun 29", "tags": ["ai", "training", "guide"]}, {"id": "regulars-nyt-cooking-2026-06-29", "section": "regulars", "headline": "Also in the pile: NYT cold noodles, NYT life hacks for empty toilet paper rolls", "summary": "Two NYT sends. Flag only - bodies not read.", "link": null, "sources": ["NYT"], "source_date": "Jun 28", "tags": ["regulars"]}, {"id": "deals-costco-ace-2026-06-29", "section": "deals", "headline": "Costco and Ace Liquor's usual weekly rotation", "summary": "Costco's running its standard warehouse featured-savings cycle plus member-only online savings through July 5; Ace Liquor has its usual weekly deals push. Nothing standout beyond the routine flyer cycle.", "link": null, "sources": ["Costco", "Ace Liquor"], "source_date": "Jun 28-29", "tags": ["deals", "routine"]}, {"id": "ctc-cadence-2026-06-29", "section": "ctc", "headline": "CTC banners: 3 sends this cycle, nothing standout", "summary": "Two routine Canadian Tire flyer e-blasts (garage storage, BLACK+DECKER kitchen appliances) plus a product review request. No deal worth flagging today.", "link": null, "sources": ["Canadian Tire"], "source_date": "Jun 28", "tags": ["ctc"]}]}, {"build_date": "2026-06-28", "build_label": "Sunday, June 28", "entries": [{"id": "now-costco-member-appreciation-2026-06-28", "section": "now", "headline": "Costco's Member Appreciation Days end today", "summary": "Online-only at Costco.ca: spend $75 on qualifying clothing/footwear and save $20, scaling up to a $500 max per membership. Today (Sunday) is the last day.", "link": "https://www.costco.ca/f/-/member-appreciation", "sources": ["Costco"], "source_date": "Jun 27", "tags": ["deal", "expiring"]}, {"id": "news-ai-frontier-access-2026-06-28", "section": "news", "headline": "Governments are starting to gatekeep who gets the newest AI models first", "summary": "OpenAI is previewing GPT-5.6 in stages, sharing its early-access partner list with government reviewers before anyone else gets a look. The same week, the US partially lifted export controls on Anthropic's most powerful model, clearing Mythos for 100+ US institutions while Fable 5 stays locked. Two separate stories pointing the same direction: access to frontier AI is becoming something you're granted, not something you buy.", "link": "https://www.semafor.com/article/06/27/2026/us-releases-powerful-anthropic-model-mythos-to-some-us-companies", "sources": ["Staying Ahead", "There's An AI For That", "The Daily AI Show"], "source_date": "Jun 27-28", "tags": ["ai", "governance"]}, {"id": "news-claude-tag-slack-2026-06-28", "section": "news", "headline": "Anthropic puts an always-on Claude inside Slack", "summary": "Claude Tag lets you @-tag a standing Claude teammate in any Slack channel, with its own memory and tool access; it replaces the older Claude-in-Slack app, which retires August 3. The sharper read from AI commentators: it's less a productivity boost than a stress test - Claude can't fix a process the company never bothered to define in the first place.", "link": "https://www.anthropic.com/news/introducing-claude-tag", "sources": ["The Daily AI Show", "Staying Ahead"], "source_date": "Jun 27-28", "tags": ["ai", "enterprise"]}, {"id": "news-workday-ai-lawsuit-2026-06-28", "section": "news", "headline": "Workday ordered to face trial over its AI hiring screens", "summary": "A federal judge ruled Workday must answer claims that its AI recruiting software screened out applicants in ways that may violate disability and anti-discrimination law - an early test of who's on the hook when an algorithm makes the rejection call instead of a person.", "link": null, "sources": ["The Daily AI Show"], "source_date": "Jun 28", "tags": ["ai", "governance"]}, {"id": "news-google-ai-exodus-2026-06-28", "section": "news", "headline": "Google loses two AI heavyweights to rivals in one week", "summary": "Transformer co-author Noam Shazeer left Google for OpenAI's architecture research team, and AlphaFold Nobel laureate John Jumper is reportedly headed to Anthropic - a rough stretch for Google's AI bench strength. Separately, SpaceX agreed to buy Anysphere, the maker of the Cursor coding tool, in a roughly $60B all-stock deal.", "link": null, "sources": ["The Daily AI Show", "Staying Ahead"], "source_date": "Jun 27-28", "tags": ["ai", "business"]}, {"id": "news-retail-calgary-hermes-2026-06-28", "section": "news", "headline": "Hermès is opening its first standalone Alberta store, on Stephen Avenue", "summary": "Hermès is leaving Holt Renfrew for its own standalone Calgary location - another marker of downtown Calgary's growing luxury retail pull. Also this week: RH is taking over the former Club Monaco flagship on Toronto's Bloor Street, and Dollarama says it now reaches 96% of Canadian households.", "link": "https://retail-insider.com/retail-insider/2026/06/hermes-to-open-standalone-store-on-calgarys-stephen-avenue/", "sources": ["Retail Insider"], "source_date": "Jun 22-26", "tags": ["retail", "calgary"]}, {"id": "news-cochrane-library-2026-06-28", "section": "news", "headline": "Cochrane Public Library's free summer programs are back", "summary": "Light on detail in today's local roundup, but the library's free summer programming is the seasonal kickoff worth knowing about if you're planning out Lily's summer.", "link": "https://cochranenow.com/articles/free-summer-fun-returns-to-the-cochrane-public-library", "sources": ["CochraneNow"], "source_date": "Jun 27", "tags": ["local", "cochrane", "family"]}, {"id": "regulars-nyt-flames-2026-06-28", "section": "regulars", "headline": "Also in the pile: NYT life hacks, Flames post-draft report", "summary": "NYT's advice columnist shares 4 life hacks; Calgary Flames Insider sent a Day 2 post-draft recap. Flag only - bodies not read.", "link": null, "sources": ["NYT", "Calgary Flames"], "source_date": "Jun 27-28", "tags": ["regulars"]}, {"id": "ctc-cadence-marks-event-2026-06-28", "section": "ctc", "headline": "CTC banners: 6 sends this cycle, one worth a look", "summary": "Usual multi-email cadence from Canadian Tire, Mark's and Triangle Rewards (four CT flyers, two Mark's/Triangle pushes). The standout: Mark's 'Can't Miss Summer Event' runs June 25 - July 8 with 20x bonus CT Money on almost everything - worth a look if you need workwear or shoes.", "link": "https://www.marks.com/", "sources": ["Canadian Tire", "Mark's", "Triangle Rewards"], "source_date": "Jun 26-28", "tags": ["ctc", "deal"]}]}]</script>
<script>
const NTFY_CURATE = "https://ntfy.sh/emarifeed-k7f3qx9m2p-curate";
const SECTIONS = {
  now:      { label: "Now",      icon: "⚡" },
  news:     { label: "News",     icon: "📰" },
  training: { label: "AI Training", icon: "🎓" },
  regulars: { label: "Regulars", icon: "📬" },
  deals:    { label: "Deals",    icon: "🛍️" },
  ctc:      { label: "CTC",      icon: "🔺" }
};
const SECTION_ORDER = ["now", "news", "training", "regulars", "deals", "ctc"];
const DAYS = JSON.parse(document.getElementById("data").textContent); // newest first
const state = { tab: "today", sec: "all", q: "" };
const votes = JSON.parse(localStorage.getItem("eo-votes") || "{}");

function setTab(t) {
  state.tab = t;
  document.getElementById("tab-today").classList.toggle("on", t === "today");
  document.getElementById("tab-week").classList.toggle("on", t === "week");
  render();
}
function setSec(s) { state.sec = s; render(); }

function matches(e) {
  if (state.sec !== "all" && e.section !== state.sec) return false;
  if (!state.q) return true;
  const hay = (e.headline + " " + e.summary + " " + (e.tags || []).join(" ") + " " + e.sources.join(" ")).toLowerCase();
  return state.q.toLowerCase().split(/\s+/).every(w => hay.includes(w));
}

function esc(s) { return s.replace(/&/g, "&amp;").replace(/</g, "&lt;"); }

function card(e) {
  const v = votes[e.id] || "";
  const link = e.link ? `<a class="more" href="${e.link}" target="_blank" rel="noopener">Read more →</a>` : "";
  return `<div class="card${e.section === "now" ? " urgent" : ""}">
    <p class="hl">${esc(e.headline)}</p>
    <div class="sum-wrap">
      <p class="sum clamp">${esc(e.summary)}</p>
      <button class="more-toggle" onclick="toggleMore(this)">&hellip;more</button>
    </div>
    <div class="meta">
      <span class="src"><span class="badge">${SECTIONS[e.section].icon} ${SECTIONS[e.section].label}</span>${esc(e.sources.join(" + "))} · ${esc(e.source_date)}</span>
      <span class="actions">${link}
        <button class="thumb${v === "up" ? " on" : ""}" onclick="vote('${e.id}','up',this)">👍</button>
        <button class="thumb${v === "down" ? " on" : ""}" onclick="vote('${e.id}','down',this)">👎</button>
      </span>
    </div>
  </div>`;
}

function render() {
  // chips with counts for current tab scope
  const scope = state.tab === "today" ? DAYS.slice(0, 1) : DAYS;
  const all = scope.flatMap(d => d.entries);
  let chips = `<button class="chip${state.sec === "all" ? " on" : ""}" onclick="setSec('all')">All</button>`;
  for (const s of SECTION_ORDER) {
    const n = all.filter(e => e.section === s).length;
    if (!n) continue;
    chips += `<button class="chip${state.sec === s ? " on" : ""}" onclick="setSec('${s}')">${SECTIONS[s].icon} ${SECTIONS[s].label}</button>`;
  }
  document.getElementById("chips").innerHTML = chips;

  let html = "";
  if (state.tab === "today") {
    const day = DAYS[0];
    for (const s of SECTION_ORDER) {
      const items = day.entries.filter(e => e.section === s && matches(e));
      if (!items.length) continue;
      html += `<div class="sec-h">${SECTIONS[s].icon} ${SECTIONS[s].label} <span class="count">${items.length}</span></div>`;
      html += items.map(card).join("");
    }
  } else {
    for (const day of DAYS) {
      const items = day.entries.filter(matches);
      if (!items.length) continue;
      html += `<div class="day-h">${esc(day.build_label)}</div>`;
      html += items.map(card).join("");
    }
  }
  document.getElementById("main").innerHTML = html || `<div class="empty">Nothing matches. Try clearing the search or filter.</div>`;
  // Only reveal the "…more" toggle on summaries that actually overflow two lines.
  document.querySelectorAll(".sum.clamp").forEach(s => {
    if (s.scrollHeight - s.clientHeight > 2) s.nextElementSibling.classList.add("show");
  });
}

function toggleMore(btn) {
  const sum = btn.previousElementSibling;
  const collapsed = sum.classList.toggle("clamp"); // true = now clamped
  btn.classList.toggle("open", !collapsed);
  btn.innerHTML = collapsed ? "&hellip;more" : "less";
}

function vote(id, dir, btn) {
  const prev = votes[id];
  const action = prev === dir ? "retract" : dir;
  if (action === "retract") delete votes[id]; else votes[id] = dir;
  localStorage.setItem("eo-votes", JSON.stringify(votes));
  const entry = DAYS.flatMap(d => d.entries).find(e => e.id === id);
  fetch(NTFY_CURATE, {
    method: "POST",
    headers: { "X-Title": "Email Overview feedback" },
    body: `${action.toUpperCase()} | ${id} | ${entry ? entry.headline : ""}`
  }).then(() => toast(action === "retract" ? "Feedback removed" : (dir === "up" ? "More like this 👍" : "Less of this 👎")))
    .catch(() => toast("Couldn't send - no connection?"));
  render();
}

let toastTimer;
function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 1800);
}

render();
</script>
</body>
