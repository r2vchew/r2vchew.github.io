ork and prompted camper evacuations in Minnesota. A heat dome over the region means little wind to clear it out, so it's expected to stick around.", "link": "https://www.cbc.ca/news/canada/toronto/near-record-temperature-toronto-heat-wave-9.7270071", "sources": ["The Peak", "Morning Brew"], "source_date": "Jul 15", "tags": ["weather"]}, {"id": "hyundai-robot-strike-2026-07-16", "section": "news", "headline": "Hyundai workers strike over incoming humanoid robots - an auto-industry first", "summary": "Workers at Hyundai's main South Korean plant launched a partial strike seeking job-protection guarantees ahead of the planned rollout of Boston Dynamics' Atlas robots on the assembly line. Toyota already has humanoids working at its Woodstock, Ontario plant, so this is likely the first of several labour flashpoints as automakers move on robotics.", "link": "https://www.wsj.com/business/autos/the-fight-over-humanoid-robots-has-shut-down-a-car-factory-for-the-first-time-d45ac3e1", "sources": ["The Peak"], "source_date": "Jul 15", "tags": ["ai", "labour"]}, {"id": "ai-engineering-trends-2026-07-16", "section": "news", "headline": "What AI engineers were actually talking about at this year's World's Fair", "summary": "Five themes from the AI Engineer World's Fair: teams are shifting focus from the agent itself to the \"harness\" around it, coding agents are starting to replace IDEs outright (Anthropic says roughly 65% of new code now starts in a Claude chat), and \"skills\" - packaged judgment senior engineers already have - are becoming the standard way to make agents reliable.", "link": "https://www.latent.space/p/aiewf26trends", "sources": ["AI Daily Brief"], "source_date": "Jul 15", "tags": ["ai"]}, {"id": "retail-insider-roundup-2026-07-16", "section": "news", "headline": "A BC startup is bringing tap-to-pay to kids' lemonade stands", "summary": "Lemonade Lab gives young entrepreneurs a parent-supervised digital storefront and card-payment setup for run-your-own-business projects. Elsewhere in Canadian retail: BC's House of Q built a North American BBQ brand out of competition wins and specialty-retail shelf space, and Loblaw's Maxi banner is opening a 13,000-sq-ft store at Montreal's former Forum in 2027.", "link": "https://retail-insider.com/retail-insider/2026/07/b-c-built-lemonade-lab-brings-tap-payments-to-kid-run-businesses/", "sources": ["Retail Insider"], "source_date": "Jul 16", "tags": ["retail"]}, {"id": "cochrane-local-2026-07-16", "section": "news", "headline": "Cochrane looking to speed up approvals for non-residential development", "summary": "The town is reviewing its process for commercial/industrial development approvals to cut timelines. Also in local news: Cochrane's Baker picked up All-American baseball honours plus academic recognition.", "link": "https://cochranenow.com/articles/cochrane-looking-to-speed-up-non-residential-development-approvals", "sources": ["CochraneNow"], "source_date": "Jul 15", "tags": ["cochrane"]}, {"id": "training-manus-linkedin-2026-07-16", "section": "training", "headline": "AI Training: build a Manus workflow that writes LinkedIn posts in your voice", "summary": "The Rundown's guide has you interview yourself through Manus (dictate a brain dump, no polish needed) so it extracts your real ideas and phrasing into a reusable voice profile, then drafts posts from that. Pro tip from the guide: save it as a reusable skill and re-run a short voice interview weekly to keep the profile current.", "link": "https://app.therundown.ai/guides/use-manus-to-write-better-linkedin-posts-that-actually-sound-like-you", "sources": ["The Rundown"], "source_date": "Jul 16", "tags": ["ai", "training"]}, {"id": "nyt-air-purifier-2026-07-16", "section": "regulars", "headline": "NYT Wirecutter's new top-pick air purifier - useful timing with the wildfire smoke", "summary": "After 12 years with the same top pick, Wirecutter says its new favourite is more energy-efficient, quieter and easier to maintain - and air purifiers are specifically good at cutting wildfire smoke indoors, relevant given the smoke story above. Also in the issue: a favourite vacuum, fan and dehumidifier.", "link": null, "sources": ["NYT Wirecutter"], "source_date": "Jul 15", "tags": ["home"]}, {"id": "safeway-liquor-flyer-2026-07-16", "section": "deals", "headline": "Safeway Liquor's weekly flyer is out (prices valid Jul 16-22)", "summary": "Routine weekly liquor flyer plus a two-week Western Canadian promo running through Jul 22 - nothing that clears the bar as a standout, just the regular cycle.", "link": null, "sources": ["Safeway"], "source_date": "Jul 15", "tags": []}, {"id": "costco-travel-caribbean-2026-07-16", "section": "deals", "headline": "Costco Travel: $200+ off Cancun/Riviera Maya packages, book by Jul 19", "summary": "This week's Hot Buys include US$200+ instant savings on 4+ night all-inclusive packages to Cancun or Riviera Maya, plus a US$100 bonus shop card on select Princess cruises - both need to be booked by July 19.", "link": "https://www.costcotravel.ca/travel-offers/travel-hot-buys", "sources": ["Costco Travel"], "source_date": "Jul 15", "tags": ["travel"]}, {"id": "ikea-storage-2026-07-16", "section": "deals", "headline": "IKEA: 15% off storage and organization when you spend $300+", "summary": "A decent discount if you're already planning a storage/organization run - standard threshold-based promo, no catch beyond the spend minimum.", "link": "https://www.ikea.com/ca/en/", "sources": ["IKEA"], "source_date": "Jul 15", "tags": []}, {"id": "ctc-cadence-2026-07-16", "section": "ctc", "headline": "CTC send volume: light day, but SportChek's Friends & Family sale is worth a look", "summary": "SportChek is running 25% off select full-priced items online-only through July 20 for its Friends & Family event - a real discount, not the usual noise. The only other CTC send was a flyer preview teasing this week's deals.", "link": null, "sources": ["SportChek", "Canadian Tire"], "source_date": "Jul 15-16", "tags": []}]}, {"build_date": "2026-07-15", "build_label": "Wednesday, July 15", "entries": [{"id": "ai-safety-watchdog-2026-07-15", "section": "news", "headline": "Google DeepMind's CEO wants a US body to test AI models before release", "summary": "Demis Hassabis published a plan for an independent, FINRA-style body to vet frontier AI models for cyber, bio and deception risks before launch, aiming to have it running before year-end. Labs would submit models 30 days ahead of release; reaction is split on whether an industry-funded watchdog can really say no to its own funders.", "link": "https://archive.thedeepview.com/p/demis-hassabis-outlines-ambitious-ai-safety-plan", "sources": ["The Deep View", "The Neuron", "The Rundown", "The Peak"], "source_date": "Jul 14", "tags": ["ai", "regulation"]}, {"id": "ny-data-center-moratorium-2026-07-15", "section": "news", "headline": "New York pauses new mega data-center permits for up to a year", "summary": "Governor Hochul signed an executive order freezing permits for new data centers over 50 megawatts while regulators write rules on power, water and noise impacts - the first state-level pause of its kind. Unions warn it costs construction jobs; several other states are weighing similar moves.", "link": "https://www.governor.ny.gov/news/first-statewide-moratorium-new-hyperscale-data-centers-launched-governor-kathy-hochul", "sources": ["The Neuron", "The Rundown", "Morning Brew"], "source_date": "Jul 14", "tags": ["ai", "energy"]}, {"id": "grok-build-repo-upload-2026-07-15", "section": "news", "headline": "xAI's coding assistant was quietly uploading developers' entire codebases", "summary": "A security researcher found Grok Build CLI syncing whole git repos - including .env files with live API keys - to xAI's cloud, even when told not to touch a file. xAI disabled the upload feature and Musk promised deletion; if you've run it recently, rotate your keys.", "link": "https://cybernews.com/ai-news/grok-build count and a phone number to test the transfer flow.", "link": "https://app.therundown.ai/guides/build-a-no-code-voice-agent-for-customer-intake-with-grok", "sources": ["The Rundown"], "source_date": "Jul 15", "tags": ["ai", "training"]}, {"id": "nyt-pillow-2026-07-15", "section": "regulars", "headline": "NYT: your pillow is probably too soft", "summary": "Flagged, not read - a pillow-shopping guide plus 4 iPhone security settings worth turning on.", "link": null, "sources": ["NYT"], "source_date": "Jul 14", "tags": []}, {"id": "nyt-well-roundup-2026-07-15", "section": "regulars", "headline": "NYT Well: 5 health stories you might have missed", "summary": "Flagged, not read - includes tick-bite prevention among this week's picks.", "link": null, "sources": ["NYT Well"], "source_date": "Jul 14", "tags": []}, {"id": "nest-report-2026-07-15", "section": "regulars", "headline": "Also in the pile: Nest's June home report for Casa de Chew", "summary": "Routine monthly Nest activity summary - nothing flagged as unusual.", "link": null, "sources": ["Nest"], "source_date": "Jul 14", "tags": []}, {"id": "nyt-recipes-2026-07-15", "section": "regulars", "headline": "NYT's 25 most popular recipes of 2026 so far", "summary": "Flagged, not read - a weeknight-dinner roundup, worth a look given the cooking interest.", "link": null, "sources": ["NYT"], "source_date": "Jul 14", "tags": ["cooking"]}, {"id": "sportsnet-derby-2026-07-15", "section": "regulars", "headline": "MLB Home Run Derby aired last night", "summary": "Flagged, not read - Sportsnet's Home Run Derby / All-Star hype email; the game's already happened by the time this build runs.", "link": null, "sources": ["Sportsnet"], "source_date": "Jul 13", "tags": ["sports"]}, {"id": "rogers-charity-classic-2026-07-15", "section": "regulars", "headline": "Bernhard Langer and Miguel Angel Jimenez headline Calgary's Rogers Charity Classic, Aug 17-23", "summary": "The PGA Tour Champions' only Canadian stop returns to Calgary with 47-time-winner Langer (still winning tournaments in his late 60s) and fan-favourite Jimenez headlining. Tickets are on sale now via Showpass.", "link": "https://rogerscharityclassic.com/", "sources": ["Rogers Charity Classic"], "source_date": "Jul 14", "tags": ["golf", "calgary"]}, {"id": "costco-weekly-2026-07-15", "section": "deals", "headline": "Costco's weekly savings: Kirkland sheets and Dove shampoo", "summary": "Routine weekly Costco.ca flyer - Kirkland Signature sheet sets and Dove shampoo among this week's picks.", "link": "https://www.costco.ca", "sources": ["Costco"], "source_date": "Jul 13-14", "tags": []}, {"id": "skipthedishes-summer-2026-07-15", "section": "deals", "headline": "SkipTheDishes' summer savings push", "summary": "Routine seasonal promo email - no standout offer worth flagging.", "link": null, "sources": ["SkipTheDishes"], "source_date": "Jul 14", "tags": []}, {"id": "papa-johns-deals-2026-07-15", "section": "deals", "headline": "Papa John's running its usual pizza-deal cycle", "summary": "A standing 2-for-$24.99 offer and a Tuesday 40% off special (likely expired by the time you read this) - routine cadence, nothing new.", "link": null, "sources": ["Papa John's"], "source_date": "Jul 13-14", "tags": []}, {"id": "tims-offers-2026-07-15", "section": "deals", "headline": "Tim Hortons' app offers include a $5.99 crispy chicken sandwich through July 20", "summary": "Activated-offer email tied to your points balance - the chicken sandwich deal runs through July 20 if you're in the app anyway.", "link": null, "sources": ["Tim Hortons"], "source_date": "Jul 13", "tags": []}, {"id": "petro-canada-topup-2026-07-15", "section": "deals", "headline": "Petro-Canada's Top Up Tuesday: bonus CT Money on 25L+ fills", "summary": "Routine weekly bonus-CT-Money promo - small value, standing offer.", "link": null, "sources": ["Petro-Canada"], "source_date": "Jul 14", "tags": []}, {"id": "ctc-cadence-2026-07-15", "section": "ctc", "headline": "CTC send volume: 8 emails in 2 days, nothing standout", "summary": "SportChek (running shoes, soccer gear), the CT flyer (grass & garden, clearance, a vague 'something you wanted is on sale'), a Triangle CT-Money nudge, and two CTFS notices (a payment confirmation and a balance-transfer offer) - all routine, no deal worth calling out over the noise.", "link": null, "sources": ["SportChek", "Canadian Tire", "Triangle", "CTFS"], "source_date": "Jul 13-14", "tags": []}]}, {"build_date": "2026-07-14", "build_label": "Tuesday, July 14", "entries": [{"id": "ai-jobs-warning-2026-07-14", "section": "news", "headline": "200+ economists and 16 Nobel laureates warn governments aren't ready for AI's economic disruption", "summary": "A Stanford-organized statement called \"We Must Act Now\" argues AI could reshape the economy on the scale of the Industrial Revolution but in a fraction of the time - a decade instead of a century - and is light on specifics but heavy on signatories, including OpenAI and Anthropic's own chief economists, Google's Jeff Dean, and Anthropic co-founder Jack Clark. The ask: build labour policy and safety nets before the disruption lands, not after.", "link": "https://www.wemustactnow.ai", "sources": ["The Deep View", "The Rundown AI", "There's An AI For That"], "source_date": "Jul 14", "tags": ["ai", "work"]}, {"id": "apple-openai-musk-altman-2026-07-14", "section": "news", "headline": "Apple's OpenAI lawsuit reignites the Musk-Altman feud", "summary": "Apple's trade-secret suit against OpenAI (an ex-Apple engineer allegedly walked out with hardware IP) gave Musk fresh ammunition - he spent the weekend accusing Altman of stealing \"all of Apple's phone technology,\" Altman fired back about Musk's \"short-term space datacenters,\" and both sides traded barbs on X all weekend. Entertaining, low on new facts about the actual case.", "link": "https://www.therundown.ai/p/apple-takes-openai-to-court", "sources": ["AI Daily Brief", "The Rundown AI"], "source_date": "Jul 14", "tags": ["ai"]}, {"id": "ai-pricing-wars-2026-07-14", "section": "news", "headline": "Anthropic and OpenAI are burning cash to keep you hooked on their newest models", "summary": "Anthropic extended free access to its top-tier Claude Fable 5 through July 19 (its third extension) and bumped Claude Code's weekly limits 50%, responding to OpenAI's GPT-5.6 launch and a rough week of Anthropic outages. OpenAI, meanwhile, reset usage caps repeatedly and handed out bonus quota after crossing 6-7 million active users. The economics: a loss-leader play to build the usage habits that make switching AI assistants painful later.", "link": "https://www.thedeepview.com/articles/why-the-summer-of-ai-price-wars-is-here", "sources": ["The Deep View", "The Neuron", "AI Daily Brief", "The Rundown AI"], "source_date": "Jul 14", "tags": ["ai", "work"]}, {"id": "claude-personality-language-2026-07-14", "section": "news", "headline": "Anthropic found Claude has a different personality depending on what language you speak to it in", "summary": "New Anthropic research scored 300K+ conversations across 3 models and 20 languages on four personality axes (warmth, candour, depth, caution) and found real, measurable shifts - Hindi conversations get a warmer, more encouraging Claude, English gets a sharper critic, Dutch speakers get more admissions of error. Anthropic says the effect is real but modest (explains ~15% of the variation) and openly admits it doesn't know why - training-data imbalances and cultural-norm-matching are both live theories.", "link": "https://www.anthropic.com/research/claude-values-models-languages", "sources": ["Staying Ahead with AI", "There's An AI For That", "The Rundown AI"], "source_date": "Jul 14", "tags": ["ai"]}, {"id": "ai-distillation-nadella-2026-07-14", "section": "news", "headline": "Microsoft's CEO says AI labs can't have it both ways on training data", "summary": "Satya Nadella called out the double standard: frontier labs trained on the whole internet without _date": "Jul 14", "tags": ["retail", "work"]}, {"id": "cochrane-roundup-2026-07-14", "section": "news", "headline": "Cochrane: IRONMAN 70.3 brings road closures this weekend, blue-green algae risk rises with the heat", "summary": "CochraneNow has traffic and parking details out ahead of the IRONMAN 70.3 race this weekend, the Cochrane Lions fed thousands during a busy Stampede run, and health officials are flagging rising blue-green algae risk in local water bodies as hot weather sets in.", "link": "https://cochranenow.com/articles/cochrane-releases-traffic-parking-details-for-ironman-703-weekend", "sources": ["CochraneNow"], "source_date": "Jul 13", "tags": ["cochrane", "local"]}, {"id": "canada-roundup-2026-07-14", "section": "news", "headline": "Canada's General Fusion goes public and pops 40%; Ottawa and oilsands producers strike a carbon-capture deal", "summary": "B.C.-based General Fusion became the first nuclear fusion company to go public, debuting on the Nasdaq and jumping as much as 40% on day one, though it's still pre-revenue with a 2035 target for a working reactor. Separately, Ottawa and Alberta struck a deal with the five largest oilsands producers to build the Pathways carbon-capture project by 2035, in exchange for looser environmental rules and a new pipeline to the BC coast. Also: Trump says the US will charge ships a 20% toll to escort them through the Strait of Hormuz, pushing oil back above $80/barrel.", "link": "https://betakit.com/general-fusion-begins-trading-on-nasdaq-becomes-first-nuclear-fusion-company-to-go-public/", "sources": ["The Peak", "Morning Brew"], "source_date": "Jul 14", "tags": ["canada", "energy"]}, {"id": "training-meta-ad-angles-2026-07-14", "section": "training", "headline": "AI Training: audit your Meta ad angles with Claude Cowork", "summary": "The Rundown's guide: export your Meta campaign CSV into a Claude project alongside your live Ad Library link, have Claude match ad performance to active creative and flag the hig eam was built on stolen Apple trade secrets", "summary": "Apple filed suit Friday against OpenAI, hardware chief Tang Tan (a 24-year Apple veteran) and engineer Chang Liu, alleging a coordinated campaign to lift confidential device designs, supplier info and manufacturing details as part of OpenAI's Jony Ive-designed hardware push - and that OpenAI coached departing staff on how to keep systems access for a few extra weeks. Apple wants stolen material destroyed, damages, and a guarantee future OpenAI devices aren't built on its plans. OpenAI denies wrongdoing, saying it has \"no interest in other companies' trade secrets.\" With 400+ ex-Apple staff now at OpenAI and the device expected in 2027, this could meaningfully delay or reshape it.", "link": "https://archive.thedeepview.com/p/apple-lawsuit-threatens-openai-s-hardware-plans", "sources": ["The Deep View", "The Rundown AI", "Morning Brew", "The Neuron"], "source_date": "Jul 12-13", "tags": ["ai", "work"]}, {"id": "ai-roundup-2026-07-13", "section": "news", "headline": "Also in AI: the memory chip shortage could run to 2030, OpenAI's safety chief is leaving, and Claude will now show you your own usage patterns", "summary": "SK Hynix warned the AI hardware crunch - the specialized memory chips that feed GPUs - could peak in 2027 and last until 2030, a physical bottleneck underneath all the model-layer hype. Microsoft is reportedly routing some Excel/Outlook Copilot prompts to cheaper internal models to cut reliance on OpenAI and Anthropic, even as GPT-5.6 becomes the preferred model elsewhere in 365 Copilot. OpenAI's head of safety is exiting as the company folds safety into its research org, the second senior safety departure in two weeks. Separately, Anthropic launched a beta dashboard that shows you what you actually use Claude for and lets you set quiet hours or usage nudges - and Meta fully pulled its Instagram \"tag anyone into an AI image\" feature after the opt-out-by-default backlash.", "link": "https://www.theneurondaily.com/p/july-13-monday", "sources": ["The Neuron", "The Deep View", "There's An AI For That"], "source_date": "Jul 12-13", "tags": ["ai", "work"]}, {"id": "gordie-howe-bridge-2026-07-13", "section": "news", "headline": "The Gordie Howe Bridge finally has an opening date - July 27 - but Canada gave up revenue to get there", "summary": "After fronting the entire $6.4B cost of the Windsor-Detroit bridge, Canada agreed to hand over 50% of toll revenue for the next 15 years to a US-controlled fund, and now needs US sign-off to raise tolls more than 10%. In exchange, six lanes of new border capacity opens July 27, expected to save trucking an estimated 850,000 hours a year.", "link": "https://www.readthepeak.com/p/bridging-the-gap", "sources": ["The Peak"], "source_date": "Jul 13", "tags": ["canada", "trade"]}, {"id": "world-roundup-2026-07-13", "section": "news", "headline": "Two killed in a Toronto street festival shooting; Alberta opens the door to private online sportsbooks", "summary": "Multiple shooters exchanged gunfire at Toronto's Salsa on St. Clair festival Saturday night, killing two and hospitalizing four, with no arrests so far. Separately, Alberta became the second Canadian province (after Ontario) to open its market to private online sportsbooks like DraftKings and FanDuel, taking a 20% cut of operator revenue. Also this week: the Seattle Seahawks sold for a record US$9.6B, and long-time US Senator Lindsey Graham died at 71.", "link": "https://www.cbc.ca/news/canada/livestory/toronto-shooting-st-clair-9.7267199", "sources": ["The Peak", "Morning Brew"], "source_date": "Jul 13", "tags": ["news"]}, {"id": "retail-roundup-2026-07-13", "section": "news", "headline": "Retail Insider: Knix founder steps down after 14 years, Italian Centre Shop expands into Calgary's Northland, MTY closing 68 locations", "summary": "Knix founder Joanna Griffiths is handing leadership to Chief Commercial Officer Nicole Tapscott after 14 years building the brand. Locally, Italian Centre Shop opens a new 22,000 sq ft Calgary location (Northland) on July 16. Elsewhere: Toronto menswear brand Modern Ambition opened in Yorkville with a dozen+ stores planned nationally, Aritzia's latest filings show an expanding store and distribution footprint, Costco Canada's comparable sales growth moderated in June, and MTY Food Group is closing 68 corporate locations at an estimated $10-12M cost.", "link": "https://retail-insider.com", "sources": ["Retail Insider"], "source_date": "Jul 13", "tags": ["retail", "work", "calgary"]}, {"id": "cochrane-roundup-2026-07-13", "section": "news", "headline": "Cochrane: free ice cream with local police this summer, a power outage after a pole crash, Stampede weekend picks", "summary": "Flagged, not read in full - local law enforcement is handing out free ice cream around town this summer, a vehicle crash into a power pole caused an outage, the PWHL's Ottawa Charge re-signed Sarah Wozniewicz to a three-year deal, and CochraneNow has a guide to what's worth catching at Stampede.", "link": "https://cochranenow.com/articles/free-ice-cream-on-the-menu-with-local-law-enforcement-this-summer", "sources": ["CochraneNow"], "source_date": "Jul 12", "tags": ["cochrane", "local"]}, {"id": "training-chatgpt-work-website-2026-07-13", "section": "training", "headline": "AI Training: turn an idea into a live website with ChatGPT Work + Codex", "summary": "The Rundown's guide: plan the build and write a one-page PRD in ChatGPT Work, hand it to Codex to build with sub-agents against that PRD, then ask Codex to fix the biggest visible issue and (if available) publish straight from the app via the Sites skill.", "link": "https://app.therundown.ai/guides/turn-any-idea-into-a-working-website-with-chatgpt-work-codex", "sources": ["The Rundown AI"], "source_date": "Jul 13", "tags": ["ai", "training"]}, {"id": "nyt-regulars-roundup-2026-07-13", "section": "regulars", "headline": "NYT Cooking: five-ingredient skillet pork chops with buttered corn", "summary": "Flagged, not read in full - this week's Five Weeknight Dishes centers on Ali Slagle's skillet pork chops with buttered corn, plus a greens soup, slow cooker whole chicken, and a fettuccine alfredo.", "link": "https://cooking.nytimes.com", "sources": ["NYT Cooking"], "source_date": "Jul 12", "tags": ["regulars", "cooking"]}, {"id": "weekly-deals-roundup-2026-07-13", "section": "deals", "headline": "Routine week: Costco's biweekly warehouse flyer, Joe Fresh's spend-$75 offer, Nespresso's towel promo winding down", "summary": "Costco's usual two-week warehouse savings flyer is out, Joe Fresh is running its recurring $20-off-$75 promo, and Nespresso's free beach towel with a summer capsule purchase is in its \"last chance\" window - nothing here clears the bar for a standout.", "link": null, "sources": ["Costco", "Joe Fresh", "Nespresso"], "source_date": "Jul 12-13", "tags": ["deals"]}, {"id": "ctc-frequency-2026-07-13", "section": "ctc", "headline": "CTC sends: 3 marketing emails since yesterday, Mark's clearance Levi's is the standout", "summary": "Sport Chek (running shoes) and Canadian Tire (pro tools) both sent routine flyers. Mark's clearance on Levi's clothing - up to 40% off original price - is the one worth a look.", "link": null, "sources": ["Canadian Tire", "Sport Chek", "Mark's"], "source_date": "Jul 12-13", "tags": ["ctc", "deals"]}]}]</script>
<script>
const NTFY_CURATE = "https://ntfy.sh/emarifeed-k7f3qx9m2p-curate";
const SECTIONS = {
  now:      { label: "Now",      icon: "⚡" },
  news:     { label: "News",     icon: "📰" },
  training: { label: "AI Training", icon: "🎓" },
  regulars: { label: "Regulars", icon: "📬" },
  deals:    { label: "Deals",    icon: "🛍️" },
  ctc:      { label: "CTC",      icon: "🔺" }
};
const SECTION_ORDER = ["now", "news", "training", "regulars", "deals", "ctc"];
const DAYS = JSON.parse(document.getElementById("data").textContent); // newest first
const state = { tab: "today", sec: "all", q: "" };
const votes = JSON.parse(localStorage.getItem("eo-votes") || "{}");

function setTab(t) {
  state.tab = t;
  document.getElementById("tab-today").classList.toggle("on", t === "today");
  document.getElementById("tab-week").classList.toggle("on", t === "week");
  render();
}
function setSec(s) { state.sec = s; render(); }

function matches(e) {
  if (state.sec !== "all" && e.section !== state.sec) return false;
  if (!state.q) return true;
  const hay = (e.headline + " " + e.summary + " " + (e.tags || []).join(" ") + " " + e.sources.join(" ")).toLowerCase();
  return state.q.toLowerCase().split(/\s+/).every(w => hay.includes(w));
}

function esc(s) { return s.replace(/&/g, "&amp;").replace(/</g, "&lt;"); }

function card(e) {
  const v = votes[e.id] || "";
  const link = e.link ? `<a class="more" href="${e.link}" target="_blank" rel="noopener">Read more →</a>` : "";
  return `<div class="card${e.section === "now" ? " urgent" : ""}">
    <p class="hl">${esc(e.headline)}</p>
    <div class="sum-wrap">
      <p class="sum clamp">${esc(e.summary)}</p>
      <button class="more-toggle" onclick="toggleMore(this)">&hellip;more</button>
    </div>
    <div class="meta">
      <span class="src"><span class="badge">${SECTIONS[e.section].icon} ${SECTIONS[e.section].label}</span>${esc(e.sources.join(" + "))} · ${esc(e.source_date)}</span>
      <span class="actions">${link}
        <button class="thumb${v === "up" ? " on" : ""}" onclick="vote('${e.id}','up',this)">👍</button>
        <button class="thumb${v === "down" ? " on" : ""}" onclick="vote('${e.id}','down',this)">👎</button>
      </span>
    </div>
  </div>`;
}

function render() {
  // chips with counts for current tab scope
  const scope = state.tab === "today" ? DAYS.slice(0, 1) : DAYS;
  const all = scope.flatMap(d => d.entries);
  let chips = `<button class="chip${state.sec === "all" ? " on" : ""}" onclick="setSec('all')">All</button>`;
  for (const s of SECTION_ORDER) {
    const n = all.filter(e => e.section === s).length;
    if (!n) continue;
    chips += `<button class="chip${state.sec === s ? " on" : ""}" onclick="setSec('${s}')">${SECTIONS[s].icon} ${SECTIONS[s].label}</button>`;
  }
  document.getElementById("chips").innerHTML = chips;

  let html = "";
  if (state.tab === "today") {
    const day = DAYS[0];
    for (const s of SECTION_ORDER) {
      const items = day.entries.filter(e => e.section === s && matches(e));
      if (!items.length) continue;
      html += `<div class="sec-h">${SECTIONS[s].icon} ${SECTIONS[s].label} <span class="count">${items.length}</span></div>`;
      html += items.map(card).join("");
    }
  } else {
    for (const day of DAYS) {
      const items = day.entries.filter(matches);
      if (!items.length) continue;
      html += `<div class="day-h">${esc(day.build_label)}</div>`;
      html += items.map(card).join("");
    }
  }
  document.getElementById("main").innerHTML = html || `<div class="empty">Nothing matches. Try clearing the search or filter.</div>`;
  // Only reveal the "…more" toggle on summaries that actually overflow two lines.
  document.querySelectorAll(".sum.clamp").forEach(s => {
    if (s.scrollHeight - s.clientHeight > 2) s.nextElementSibling.classList.add("show");
  });
}

function toggleMore(btn) {
  const sum = btn.previousElementSibling;
  const collapsed = sum.classList.toggle("clamp"); // true = now clamped
  btn.classList.toggle("open", !collapsed);
  btn.innerHTML = collapsed ? "&hellip;more" : "less";
}

function vote(id, dir, btn) {
  const prev = votes[id];
  const action = prev === dir ? "retract" : dir;
  if (action === "retract") delete votes[id]; else votes[id] = dir;
  localStorage.setItem("eo-votes", JSON.stringify(votes));
  const entry = DAYS.flatMap(d => d.entries).find(e => e.id === id);
  fetch(NTFY_CURATE, {
    method: "POST",
    headers: { "X-Title": "Email Overview feedback" },
    body: `${action.toUpperCase()} | ${id} | ${entry ? entry.headline : ""}`
  }).then(() => toast(action === "retract" ? "Feedback removed" : (dir === "up" ? "More like this 👍" : "Less of this 👎")))
    .catch(() => toast("Couldn't send - no connection?"));
  render();
}

let toastTimer;
function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 1800);
}

render();
</script>
