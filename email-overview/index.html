rs - augmenting workers, not just replacing them, is what's paying off so far.", "link": "https://www.thedeepview.com/articles/ai-layoffs-expose-us-tech-s-efficiency-gamble", "sources": ["The Deep View"], "source_date": "Jul 21", "tags": ["ai", "work"]}, {"id": "ai-porn-teens-survey-2026-07-21", "section": "news", "headline": "Survey: 44% of teens think they've seen AI-generated sexual content, most of it by accident", "summary": "A Common Sense Media survey of 1,300+ teens found the exposure is happening mostly on mainstream platforms (TikTok, Instagram, X) rather than fringe sites, and a quarter say they've seen deepfakes of themselves or people they know. San Francisco's city attorney has since sent cease-and-desist letters demanding Apple and Google pull 13 'nudify' apps from their app stores.", "link": "https://www.thedeepview.com/articles/study-how-ai-porn-distorts-teens-reality", "sources": ["The Deep View"], "source_date": "Jul 21", "tags": ["ai"]}, {"id": "flex-ai-shutdown-2026-07-21", "section": "news", "headline": "A Vancouver 'AI personal trainer' app is shutting down - an early look at what vibecoding does to copycat-able apps", "summary": "Flex AI, which had nearly a million users by 2022, ran out of money after failing to find a buyer. The likely culprit is market saturation, and the trend cuts both ways: vibecoding tools have made it trivial to spin up a personalized fitness app yourself, which is exactly the kind of product with no real moat left to defend.", "link": "https://betakit.com/personal-training-app-flex-ai-is-shutting-down/", "sources": ["The Peak"], "source_date": "Jul 21", "tags": ["ai"]}, {"id": "trump-canada-tariff-2026-07-21", "section": "news", "headline": "Trump slaps a 50% tariff on a wide range of Canadian goods, effective in 30 days", "summary": "The new duties - five times the current rate - hit food items, cement and hockey sticks among other goods, though energy, critical minerals, potash and fish are exempt. The White House ay's notes, produce an end-of-day summary, and keep a running task list - set up as a skill that runs automatically at 7pm.", "link": "https://app.therundown.ai/guides/make-ai-note-taking-easier-with-this-chatgpt-granola-captains-log-setup", "sources": ["The Rundown AI"], "source_date": "Jul 21", "tags": ["ai", "work"]}, {"id": "nyt-earbuds-2026-07-21", "section": "regulars", "headline": "NYT: noise-blocking earbuds roundup, plus best skin care for mature skin", "summary": "Flagging, not summarizing - body wasn't read.", "link": null, "sources": ["NYT"], "source_date": "Jul 20", "tags": []}, {"id": "costco-flyer-2026-07-21", "section": "deals", "headline": "Costco: weekly warehouse savings flyer (through Aug 2)", "summary": "Routine treasure-hunt and grocery savings cycle - nothing that clears the bar for a standout callout.", "link": null, "sources": ["Costco"], "source_date": "Jul 20", "tags": []}, {"id": "ctc-cadence-2026-07-21", "section": "ctc", "headline": "CTC send volume: seven emails - Mark's 25% flash sale is the standout, rest is routine flyer/engagement cadence", "summary": "Mark's 3-day Summer Cyber Sale (25% off full-priced items, online only, through Jul 22) is worth a look if you need anything. Everything else was routine: three CT flyers (tires, clearance, a cooling gadget), a generic 'CT Money is waiting' nudge, a World Cup-themed Sportchek send, and CT Money balance sitting at $377.31.", "link": null, "sources": ["Canadian Tire", "Sportchek", "Mark's"], "source_date": "Jul 19-21", "tags": []}]}, {"build_date": "2026-07-20", "build_label": "Monday, July 20", "entries": [{"id": "kimi-k3-benchmark-catch-2026-07-20", "section": "news", "headline": "Kimi K3's benchmark lead comes with an asterisk: possible distillation from US models", "summary": "Moonshot's open-weight Kimi K3 topped Arena's frontend leaderboard and rattled the industry (open weights land July 27), but analysts note Moonshot is one of three Chinese labs Anthropic accused of large-scal ator sentiment is warming up", "summary": "Netflix co-CEO Ted Sarandos says AI helped build crowd and battle scenes on nearly 300 titles, including 17 minutes of AI-assisted footage in one film made twice as fast at half the cost. A new Adobe survey of 16,000 creators found 87% say AI accelerated their business growth, though 57% say the output still needs heavy editing - adoption is running fastest in tedious pre-production work, not the creative core.", "link": "https://www.thedeepview.com/articles/how-ai-may-be-gradually-winning-over-creatives", "sources": ["The Deep View", "The Neuron"], "source_date": "Jul 18-20", "tags": ["ai"]}, {"id": "ai-tech-sovereignty-2026-07-20", "section": "news", "headline": "Forrester: most countries are becoming dependent on US or Chinese AI, with no catch-up in sight", "summary": "Only the US (79%) and China (82%) score well on Forrester's tech-sovereignty index; the other 12 countries surveyed - including Canada - average 39% and are forecast to gain just 1 point by 2030. Analysts frame it as more than a capability gap: choosing a US or Chinese AI vendor is becoming a geopolitical signal, not just a procurement decision.", "link": "https://www.thedeepview.com/articles/most-nations-risk-becoming-ai-dependents", "sources": ["The Deep View"], "source_date": "Jul 20", "tags": ["ai", "work"]}, {"id": "canadian-retail-roundup-2026-07-20", "section": "news", "headline": "Mercedes-Benz opens a Holt Renfrew 'studio' blending cars with fashion; Aritzia keeps outperforming", "summary": "Mercedes-Benz's 2,230 sq ft Toronto space (in the old Saint Laurent spot on the Mink Mile) mixes vehicles, fashion and customization under one roof - its own bet on experiential retail. Elsewhere in Canadian retail this week: Aritzia and Group Dynamite continue to outperform the sector by chasing affluent shoppers, Costco Canada's sales growth is moderating even as it keeps expanding warehouses, and Splitsville Bowl is taking over part of the former Nordstrom wear", "summary": "Sportchek's Friends & Family event wraps today, but the email is light on specifics beyond the countdown - discount the urgency. Otherwise routine: CT's outdoor-DIY and road-trip-gear flyers, plus Mark's promoting summer footwear.", "link": null, "sources": ["Sportchek", "Canadian Tire", "Mark's"], "source_date": "Jul 19-20", "tags": []}]}, {"build_date": "2026-07-19", "build_label": "Sunday, July 19", "entries": [{"id": "brown-ai-exam-assessment-2026-07-19", "section": "news", "headline": "A Brown University take-home exam averaged 96% with AI help - the in-person retest averaged 48%", "summary": "The class had swelled to 86 students and a midterm average that historically ran 65-80% hit 96%. Once the final exam moved into a proctored room, 18 students dropped the course and the average fell to 48.6%. Brown opened an academic-integrity review, but the bigger argument is that schools need to separate unaided reasoning from AI-assisted work in how they test and grade, not just chase cheaters.", "link": "https://thedailyaishow.beehiiv.com/p/the-daily-ai-show-issued-110", "sources": ["The Daily AI Show"], "source_date": "Jul 19", "tags": ["ai"]}, {"id": "databricks-ai-governance-2026-07-19", "section": "news", "headline": "Databricks' chief AI scientist: agent governance is 'one of the key problems of our time'", "summary": "Jonathan Frankle explains why Databricks avoids any customer lock-in (you can walk with your data any day) and why handing AI agents human-level permissions is riskier than it sounds - agents can act at a scale and speed no person would. The company's new Unity AI Gateway is built to track and control agent costs and access org-wide.", "link": "https://archive.thedeepview.com/p/why-databricks-rejects-ai-lock-in", "sources": ["The Deep View"], "source_date": "Jul 19", "tags": ["ai", "work"]}, {"id": "china-ai-companion-crackdown-2026-07-19", "section": "news", "headline": "China's new AI-companion rules go beyond disclosure - to monitoring for dependency", "summary": "New rules restrict virtual relationships for minors and require providers to intervene on self-harm signals; Alibaba and ByteDance are already disabling companion features. The more interesting finding cited: emotional dependency on AI often builds inside ordinary task conversations (scheduling, coding, venting) rather than dedicated companion apps - a cited 28-day study found daily 5-minute AI chats about personal issues measurably shifted preference toward AI support over human support.", "link": null, "sources": ["The Daily AI Show", "There's An AI For That"], "source_date": "Jul 18-19", "tags": ["ai"]}, {"id": "kimi-k3-open-source-2026-07-19", "section": "news", "headline": "Kimi K3 update: China's model tops a blind coding test, open-sourcing July 27", "summary": "A week after its debut rattled markets, Moonshot's 3-trillion-parameter Kimi K3 is ranking above GPT 5.6 Sol and Claude Fable 5 in a blind coding comparison, with open weights due July 27.", "link": null, "sources": ["The Daily AI Show", "There's An AI For That"], "source_date": "Jul 18-19", "tags": ["ai"]}, {"id": "light-bites-ai-2026-07-19", "section": "news", "headline": "MLB pulls AI pitch-calling tablets from dugouts; SpaceX reportedly courting the Pentagon for AI cloud capacity", "summary": "The league wants coaches calling pitches again, not custom AI tabs. Separately, SpaceX is in early talks to provide the Defense Department AI computing capacity, muscling in on cloud turf held by CoreWeave and Amazon - nothing signed yet.", "link": null, "sources": ["There's An AI For That"], "source_date": "Jul 18", "tags": ["ai"]}, {"id": "cochrane-local-2026-07-19", "section": "news", "headline": "Cochrane: Labour Day parade marshal nominations are open; Rocky View Residents' Day is coming up", "summary": "Local community notices from this weekend's CochraneNow roundup.", "link": "https://cochranenow.com/articles/cochrane-labour-day-parade-marshal-nominations-open", ire", "Mark's"], "source_date": "Jul 17-19", "tags": []}]}, {"build_date": "2026-07-18", "build_label": "Saturday, July 18", "entries": [{"id": "kimi-k3-followup-2026-07-18", "section": "news", "headline": "Kimi K3 follow-up: markets flinch, skeptics push back on the hype", "summary": "A day after Moonshot's Kimi K3 launched, the market reaction landed - AI jitters helped tank chip stocks hard enough that Apple briefly overtook Nvidia as the world's most valuable company. Early testers are also cooling on the loudest claims: K3 is genuinely strong but runs 2-3x slower than Claude/GPT, ships with far fewer safety guardrails, and several skeptics say the flashy demos don't equal real engineering parity.", "link": "https://aidailybrief.beehiiv.com/p/is-k3-really-fable-class", "sources": ["Morning Brew", "AI Daily Brief"], "source_date": "Jul 17-18", "tags": ["ai"]}, {"id": "netflix-ai-notebooklm-rename-2026-07-18", "section": "news", "headline": "Netflix used generative AI in about 300 shows this year", "summary": "Netflix's Q2 earnings call revealed AI filled in crowd scenes and battle sequences across roughly 300 titles - one docuseries used 17 minutes of AI footage, finishing twice as fast at half the cost. Separately, Google renamed NotebookLM to Gemini Notebook and gave it a secure cloud computer for deeper data analysis.", "link": "https://variety.com/2026/biz/news/about-300-netflix-programs-used-ai-this-year-q2-earnings-1236812914/", "sources": ["There's An AI For That"], "source_date": "Jul 17", "tags": ["ai"]}, {"id": "cochrane-local-2026-07-18", "section": "news", "headline": "Calgary and Bearspaw First Nation eye an MOU; speed limits return to Hwy 1A/22", "summary": "Local headlines: Calgary is moving to sign a memorandum of understanding with Bearspaw First Nation, and permanent speed limits are back in effect today on Hwy 1A and 22. Also this weekend: Bragg Creek Days wraps up with family programming, and over 2,000 people turned out for the SLS Centre's quarter-century celebration.", "link": "https://cochranenow.com/articles/calgary-wants-to-sign-mou-with-bearspaw-first-nation", "sources": ["CochraneNow"], "source_date": "Jul 17", "tags": ["cochrane"]}, {"id": "canada-wildfire-tariffs-lich-2026-07-18", "section": "news", "headline": "Wildfire smoke reignites a Trump-Carney tariff spat; convoy leader seeks OK to visit the White House", "summary": "Smoke from Ontario wildfires blanketed Toronto, Chicago, Detroit and New York this week; Trump threatened Canadian tariffs over what he called poor forest management, drawing pushback from PM Carney and Ontario's Doug Ford. Separately, Freedom Convoy organizer Tamara Lich - serving house arrest for the 2022 Ottawa blockade - is asking a court to loosen her conditions so she can do White House press and a Rebel News cruise; prosecutors call it an attempt to monetize her sentence.", "link": null, "sources": ["NYT Canada Letter"], "source_date": "Jul 18", "tags": ["canada"]}, {"id": "alberta-meta-data-centre-2026-07-18", "section": "news", "headline": "Alberta lands Meta's first Canadian data centre - a $13B build with its own gas plant", "summary": "Premier Danielle Smith announced a $13 billion Meta data centre breaking ground in Sturgeon County, paired with a dedicated natural gas plant she's branding a \"digital refinery.\" A Canadaland segment flags the tension with PM Carney's promise of a clean, ethical federal AI strategy.", "link": null, "sources": ["Canadaland"], "source_date": "Jul 17", "tags": ["alberta", "ai"]}, {"id": "sun-life-cyber-tips-2026-07-18", "section": "regulars", "headline": "Sun Life: seasonal cybersecurity reminder", "summary": "Routine summer email with generic online-safety tips - nothing account-specific worth flagging.", "link": null, "sources": ["Sun Life"], "source_date": "Jul 17", "tags": []}, {"id": "regulars-also-in-the-pile-2026-07-18", "section": "regulars", "headline": "Also in the regulars pile", "summary": "Flagging, not summarizing - bodies weren't read. NYT's cheap joy-sparking picks and a favourite pair of shorts, Crave's World Cup Final lineup, The Ringer on a possible Vegas NBA franchise, Lambeau Field's 70th season, and TELUS Spark's free access days for Grade 7 students.", "link": null, "sources": ["NYT", "Crave", "The Ringer", "Green Bay Packers", "TELUS Spark"], "source_date": "Jul 17-18", "tags": []}, {"id": "joe-fresh-lego-2026-07-18", "section": "deals", "headline": "Joe Fresh adds a LEGO collection alongside its back-to-school push", "summary": "A new LEGO collection joins the back-to-school kids' essentials from $10 flagged yesterday, plus a broader summer clearance up to 50% off.", "link": "https://www.joefresh.com", "sources": ["Joe Fresh"], "source_date": "Jul 17", "tags": ["family"]}, {"id": "routine-flyer-cycle-2026-07-18", "section": "deals", "headline": "This week's routine flyer cycle: Costco, Tim Hortons", "summary": "Costco's Treasure Hunt and warehouse savings rotate as usual; Tim Hortons app offers expire Sunday. Nothing standout.", "link": null, "sources": ["Costco", "Tim Hortons"], "source_date": "Jul 17-18", "tags": []}, {"id": "ctc-cadence-2026-07-18", "section": "ctc", "headline": "CTC send volume: four emails, Sportchek's F&F event still running", "summary": "Sportchek's Friends & Family online-only footwear event (25% off running/hiking/walking shoes, flagged yesterday) continues through Monday. Otherwise: Triangle Rewards weekend offers, Mark's summer linen picks, and a product-review nudge - routine cadence.", "link": null, "sources": ["Sportchek", "Triangle Rewards", "Mark's", "Canadian Tire"], "source_date": "Jul 17-18", "tags": []}]}, {"build_date": "2026-07-17", "build_label": "Friday, July 17", "entries": [{"id": "kimi-k3-frontier-gap-2026-07-17", "section": "news", "headline": "A Chinese open-source model just pulled within striking distance of Claude and GPT", "summary": "Moonshot AI released Kimi K3, a 2.8-3 trillion parameter open-weights model that beats or matches Claude Fable 5 and GPT-5.6 Sol on several benchmarks (research, spreadsheets, coding) at a fraction of the price - full weights land July 27. Companies like DoorDash and Airbnb are already tiering their AI spend, routing routine work to cheaper models like this and saving the expensive frontier models for high-stakes tasks.", "link": "https://www.kimi.com/blog/kimi-k3", "sources": ["The Neuron", "The Rundown", "The Peak"], "source_date": "Jul 17", "tags": ["ai"]}, {"id": "thinking-machines-inkling-2026-07-17", "section": "news", "headline": "Mira Murati's startup shipped its first model - and it's not trying to win benchmarks", "summary": "Thinking Machines Lab released Inkling, an open-weights model that's solidly mid-pack on performance, paired with Tinker, its fine-tuning platform. The bet: enterprises worried about data sovereignty and ballooning AI token bills will pay to fine-tune their own version of an American, largely non-distilled model rather than trust a closed one - a different pitch than Microsoft's competing enterprise fine-tuning push.", "link": "https://thinkingmachines.ai/news/introducing-inkling/", "sources": ["The Deep View", "AI Daily Brief", "The Neuron"], "source_date": "Jul 16", "tags": ["ai"]}, {"id": "eu-google-android-2026-07-17", "section": "news", "headline": "EU forces Google to let rival AI assistants onto Android", "summary": "The European Commission ordered Google to open 11 Android features to competing AI assistants (OpenAI, Anthropic, etc.) so they can be activated by voice the way \"Hey Google\" is now, plus share anonymized search data with rivals. The Android changes land in 2027; Google's calling it a security risk, the EU's calling it a level playing field. Given how these rulings tend to ripple globally, don't be surprised if it shapes how AI assistants work outside Europe too.", "link": "https://ec.europa.eu/commission/presscorner/detail/en/ip_26_1634", "sources": ["The Deep View", "The Neuron", "Morning Brew"], "source_date": "Jul 16", "tags": ["ai", "regulation"]}, {"id": "anthropic-1password-credentials-2026-07-17", "section": "news", "headline": "Anthropic and 1Password built a way for Claude to use your passwords without seeing them", "summary": "1Password for Claude lets Claude log into sites and pull one-time codes on your behalf without the credentials ever being exposed to the model or Anthropic - permissions are scoped to the task, require biometric approval, and lock down automatically once an agent takes over the browser. Available now for Mac users with both apps installed; useful context if you're expanding what you let Claude touch.", "link": "https://1password.com/blog/1password-for-claude", "sources": ["The Deep View", "The Neuron"], "source_date": "Jul 16", "tags": ["ai"]}, {"id": "anthropic-ipo-spacex-dip-2026-07-17", "section": "news", "headline": "Anthropic is lining up IPO investor meetings for a targeted fall listing", "summary": "Anthropic has appointed banks, scheduled investor meetings, and padded its credit line ahead of a fall IPO, while OpenAI is reportedly leaning toward waiting until next year after advisors said a trillion-dollar valuation looks unlikely right now. Meanwhile SpaceX's stock dipped below its $135 IPO price for the first time this week - a reminder that even hyped AI-adjacent listings aren't guaranteed a smooth ride.", "link": "https://www.bloomberg.com/news/articles/2026-07-15/anthropic-is-said-to-plan-ipo-investor-meetings-as-listing-nears", "sources": ["AI Daily Brief"], "source_date": "Jul 16", "tags": ["ai", "markets"]}, {"id": "claude-fable-pricing-2026-07-17", "section": "news", "headline": "Heads up if you're on Claude: free access to the top model may be tightening soon", "summary": "An AI newsletter (Staying Ahead) reports that Claude Fable 5 access included in paid Claude plans is set to end around July 19 - a date Anthropic has reportedly moved before - after which it bills per token at Anthropic's highest listed rate. Worth confirming directly in your Claude billing settings rather than taking the date as gospel. Same newsletter ran a head-to-head design test and found GPT-5.6 Sol edged out Claude 2-1 on creative/visual tasks, while Claude still won on the practical, actually-usable build.", "link": "https://newsletter.stayingahead.com/p/sol-cooked", "sources": ["Staying Ahead"], "source_date": "Jul 17", "tags": ["ai"]}, {"id": "retail-insider-roundup-2026-07-17", "section": "news", "headline": "Chrome Hearts is opening its first Canadian store, and a bowling alley is taking over a dead Nordstrom", "summary": "Luxury brand Chrome Hearts bought a building in Toronto's Yorkville for its first standalone Canadian store, while Splitsville Bowl will open a 34,000-sq-ft flagship at CF Sherway Gardens in 2027 in part of the former Nordstrom space - another data point in the entertainment-over-department-store redevelopment trend at Canadian malls.", "link": "https://retail-insider.com/retail-insider/2026/07/chrome-hearts-buys-yorkville-building-for-first-canadian-store/", "sources": ["Retail Insider"], "source_date": "Jul 17", "tags": ["retail"]}, {"id": "cochrane-local-2026-07-17", "section": "news", "headline": "Cochrane RCMP detachment gets a new leader; Bragg Creek Days wraps up this weekend", "summary": "Cochrane's RCMP leadership is transitioning to a new commander. Also worth knowing if you're around this weekend: Bragg Creek Days continues with live music, and CochraneNow has a roundup of top local events happening through Sunday.", "link": "https://cochranenow.com/articles/top-events-happening-in-cochrane-this-weekend", "sources": ["CochraneNow"], "source_date": "Jul 16", "tags": ["cochrane"]}, {"id": "training-gpt-live-trip-2026-07-17", "section": "training", "headline": "AI Training: plan a full weekend trip out loud with GPT-Live", "summary": "The Rundown's guide walks through using ChatGPT's voice mode to talk through a trip - give it the destination and dates, let it research hotels/restaurants/activities in the background, then interrupt to adjust budget or add a work block. Pro tip: set your iPhone's Action Button to open a new GPT-Live thread for faster access.", "link": "https://app.therundown.ai/guides/use-openais-new-gpt-live-to-plan-any-trip-fast", "sources": ["The Rundown"], "source_date": "Jul 17", "tags": ["ai", "training"]}, {"id": "nyt-well-wirecutter-2026-07-17", "section": "regulars", "headline": "NYT Well on how couples therapists fight with their own partners; Wirecutter's belt and lip-stain picks", "summary": "Flagging, not summarizing - bodies weren't read. Well's piece looks at how relationship therapists handle their own conflicts; Wirecutter's issue covers best men's belts and long-wear lip stains.", "link": null, "sources": ["NYT Well", "NYT Wirecutter"], "source_date": "Jul 16", "tags": []}, {"id": "spark-science-2026-07-17", "section": "regulars", "headline": "TELUS Spark's Dino Summer runs through September; a Burgess Shale fossil talk lands July 29", "summary": "Spark's dinosaur-themed activities and exhibits run all summer through Sept 1 - solid family outing territory with Lily. Separately, paleontologist Dr. Jean-Bernard Caron gives an evening talk on the Burgess Shale (the 500-million-year-old Rockies fossil site) on July 29, 7:15-9pm - more of an adult/older-kid event given the timing.", "link": "https://www.sparkscience.ca", "sources": ["TELUS Spark"], "source_date": "Jul 16", "tags": ["family", "cochrane"]}, {"id": "scene-safeway-flyer-2026-07-17", "section": "deals", "headline": "Safeway/Scene+ weekly grocery offers are out", "summary": "Routine weekly personalized offers cycle - nothing that clears the bar as a standout this week.", "link": null, "sources": ["Scene+", "Safeway"], "source_date": "Jul 16", "tags": []}, {"id": "joe-fresh-back-to-school-2026-07-17", "section": "deals", "headline": "Joe Fresh kids' back-to-school styles start at $10", "summary": "Early back-to-school push on kids' essentials - worth a look if you're getting ahead of it for Lily before the September rush.", "link": "https://www.joefresh.com", "sources": ["Joe Fresh"], "source_date": "Jul 16", "tags": ["family"]}, {"id": "ctc-cadence-2026-07-17", "section": "ctc", "headline": "CTC send volume: seven emails in a day, mostly flyer previews", "summary": "Canadian Tire/Sportchek/Mark's sent flyer previews (pet food, soccer gear, patio cooking, ice cream makers), a product-review request, and Mark's \"top deals of the week.\" The one repeat worth noting: SportChek's Friends & Family event (flagged yesterday) narrowed its online-only push to 25% off running/walking/hiking shoes specifically, still running through July 20.", "link": null, "sources": ["Canadian Tire", "SportChek", "Mark's"], "source_date": "Jul 16-17", "tags": []}]}, {"build_date": "2026-07-16", "build_label": "Thursday, July 16", "entries": [{"id": "openai-speaker-2026-07-16", "section": "news", "headline": "OpenAI's first hardware device is reportedly a screen-free smart speaker, not a wearable", "summary": "Bloomberg reports OpenAI's first consumer device will be a portable, camera-equipped speaker that runs ChatGPT's voice mode, controls smart-home gear, and has moving parts meant to make it feel \"alive\" - expected to be unveiled this year for a 2027 launch. The timing lands right after Apple sued OpenAI over alleged trade-secret theft tied to its own unreleased hardware, so the legal fight could delay the whole roadmap.", "link": "https://www.theverge.com/ai-artificial-intelligence/965670/openai-chatgpt-ai-smart-speaker-hardware-device", "sources": ["The Deep View", "The Neuron", "The Rundown", "The Peak", "AI Daily Brief", "There's An AI For That", "Morning Brew"], "source_date": "Jul 16", "tags": ["ai"]}, {"id": "codex-micro-keyboard-2026-07-16", "section": "news", "headline": "OpenAI's actual first shipped product: a $230 keyboard for coding agents", "summary": "Codex Micro is a niche mechanical macropad (built with keyboard maker Work Louder) that lets developers steer AI coding agents with colour-coded status keys, a joystick and a reasoning-effort dial - a dev toy, not the rumoured smart speaker. It's the first hardware OpenAI has put its logo on, dropping a week after Apple's lawsuit.", "link": "https://openai.com/supply/co-lab/work-louder/", "sources": ["The Neuron", "The Rundown", "There's An AI For That"], "source_date": "Jul 16", "tags": ["ai"]}, {"id": "china-chatbot-ban-2026-07-16", "section": "news", "headline": "China bans AI companion chatbots, citing both safety and its shrinking birthrate", "summary": "New rules make virtual romantic relationships with chatbots illegal for minors and ban companies from designing bots to be virtual companions at all - Alibaba and ByteDance have already started disabling features. It's partly an AI-safety move and partly population policy: China's birthrate hit a record low in 2025, and officials want people forming real relationships instead.", "link": "https://www.thedeepview.com/articles/china-s-chatbot-love-ban-goes-beyond-ai-safety", "sources": ["The Deep View", "Morning Brew"], "source_date": "Jul 15", "tags": ["ai", "regulation"]}, {"id": "stripe-paypal-boc-2026-07-16", "section": "news", "headline": "Stripe offers $53B for PayPal; Bank of Canada holds rates for a sixth straight time", "summary": "Stripe and PE firm Advent bid $60.50/share for PayPal, a 28% premium that would create the largest fintech deal ever and give Stripe a foothold in consumer payments via Venmo. Separately, the Bank of Canada held its benchmark rate at 2.25%, citing renewed Q2 growth and expecting inflation to ease despite gas prices ticking up from the Iran conflict.", "link": "https://www.reuters.com/business/finance/stripe-advent-offer-buy-paypal-more-than-53-billion-sources-say-2026-07-15/", "sources": ["The Peak", "Morning Brew"], "source_date": "Jul 15", "tags": ["markets"]}, {"id": "wildfire-smoke-2026-07-16", "section": "news", "headline": "Wildfire smoke from northern Ontario is fouling air quality across the US Midwest and Northeast", "summary": "Almost 200 wildfires are burning in northern Ontario, forcing evacuations and giving Toronto the worst air quality of any city in the world for parts of yesterday; the smoke has since drifted into New York and prompted camper evacuations in Minnesota. A heat dome over the region means little wind to clear it out, so it's expected to stick around.", "link": "https://www.cbc.ca/news/canada/toronto/near-record-temperature-toronto-heat-wave-9.7270071", "sources": ["The Peak", "Morning Brew"], "source_date": "Jul 15", "tags": ["weather"]}, {"id": "hyundai-robot-strike-2026-07-16", "section": "news", "headline": "Hyundai workers strike over incoming humanoid robots - an auto-industry first", "summary": "Workers at Hyundai's main South Korean plant launched a partial strike seeking job-protection guarantees ahead of the planned rollout of Boston Dynamics' Atlas robots on the assembly line. Toyota already has humanoids working at its Woodstock, Ontario plant, so this is likely the first of several labour flashpoints as automakers move on robotics.", "link": "https://www.wsj.com/business/autos/the-fight-over-humanoid-robots-has-shut-down-a-car-factory-for-the-first-time-d45ac3e1", "sources": ["The Peak"], "source_date": "Jul 15", "tags": ["ai", "labour"]}, {"id": "ai-engineering-trends-2026-07-16", "section": "news", "headline": "What AI engineers were actually talking about at this year's World's Fair", "summary": "Five themes from the AI Engineer World's Fair: teams are shifting focus from the agent itself to the \"harness\" around it, coding agents are starting to replace IDEs outright (Anthropic says roughly 65% of new code now starts in a Claude chat), and \"skills\" - packaged judgment senior engineers already have - are becoming the standard way to make agents reliable.", "link": "https://www.latent.space/p/aiewf26trends", "sources": ["AI Daily Brief"], "source_date": "Jul 15", "tags": ["ai"]}, {"id": "retail-insider-roundup-2026-07-16", "section": "news", "headline": "A BC startup is bringing tap-to-pay to kids' lemonade stands", "summary": "Lemonade Lab gives young entrepreneurs a parent-supervised digital storefront and card-payment setup for run-your-own-business projects. Elsewhere in Canadian retail: BC's House of Q built a North American BBQ brand out of competition wins and specialty-retail shelf space, and Loblaw's Maxi banner is opening a 13,000-sq-ft store at Montreal's former Forum in 2027.", "link": "https://retail-insider.com/retail-insider/2026/07/b-c-built-lemonade-lab-brings-tap-payments-to-kid-run-businesses/", "sources": ["Retail Insider"], "source_date": "Jul 16", "tags": ["retail"]}, {"id": "cochrane-local-2026-07-16", "section": "news", "headline": "Cochrane looking to speed up approvals for non-residential development", "summary": "The town is reviewing its process for commercial/industrial development approvals to cut timelines. Also in local news: Cochrane's Baker picked up All-American baseball honours plus academic recognition.", "link": "https://cochranenow.com/articles/cochrane-looking-to-speed-up-non-residential-development-approvals", "sources": ["CochraneNow"], "source_date": "Jul 15", "tags": ["cochrane"]}, {"id": "training-manus-linkedin-2026-07-16", "section": "training", "headline": "AI Training: build a Manus workflow that writes LinkedIn posts in your voice", "summary": "The Rundown's guide has you interview yourself through Manus (dictate a brain dump, no polish needed) so it extracts your real ideas and phrasing into a reusable voice profile, then drafts posts from that. Pro tip from the guide: save it as a reusable skill and re-run a short voice interview weekly to keep the profile current.", "link": "https://app.therundown.ai/guides/use-manus-to-write-better-linkedin-posts-that-actually-sound-like-you", "sources": ["The Rundown"], "source_date": "Jul 16", "tags": ["ai", "t A security researcher found Grok Build CLI syncing whole git repos - including .env files with live API keys - to xAI's cloud, even when told not to touch a file. xAI disabled the upload feature and Musk promised deletion; if you've run it recently, rotate your keys.", "link": "https://cybernews.com/ai-news/grok-build-git-repository-upload/", "sources": ["The Neuron", "The Rundown", "Ultrathink"], "source_date": "Jul 14", "tags": ["ai", "security"]}, {"id": "ibm-stock-plunge-2026-07-15", "section": "news", "headline": "IBM stock has its worst trading day in 115 years", "summary": "IBM shares fell 25% after weaker-than-expected Q2 earnings showed corporate customers redirecting budgets to AI infrastructure instead of IBM's traditional hardware and software. The drop dragged down Canadian software peers OpenText, CGI and Constellation Software.", "link": "https://www.wsj.com/finance/stocks/ibm-shares-sink-18-on-earnings-warning-d115d564", "sources": ["The Peak", "Morning Brew"], "source_date": "Jul 14", "tags": ["markets", "ai"]}, {"id": "claude-values-shift-2026-07-15", "section": "news", "headline": "Anthropic finds Claude's answers reflect different values depending on the model and language you use", "summary": "New Anthropic research tracked four value axes (deference vs. caution, warmth vs. rigor, and others) and found real variation - Claude leans warmer in Arabic and Hindi, more rigorous in English and Russian, and different model versions have distinct personalities. The takeaway for anyone using AI for advice: outputs aren't values-neutral.", "link": "https://www.anthropic.com/research/claude-values-models-languages", "sources": ["The Deep View"], "source_date": "Jul 14", "tags": ["ai"]}, {"id": "frontier-model-race-2026-07-15", "section": "news", "headline": "Three frontier AI models shipped in 72 hours, and prices keep falling", "summary": "Grok 4.5, GPT-5.6 and an extended free run of Fable 5 all landed within days of each other, with frontier-class pricing down sharply. The X-discourse read is that open source is eating the frontier labs, but Anthropic's own numbers (it confidentially filed to go public at a $47B revenue run rate) say otherwise - open models are catching up, not there yet, and still take real infrastructure investment to run seriously.", "link": null, "sources": ["Ultrathink", "MultiplAI"], "source_date": "Jul 14", "tags": ["ai"]}, {"id": "aritzia-dynamite-outperform-2026-07-15", "section": "news", "headline": "Aritzia and Group Dynamite are outgrowing the rest of Canadian retail", "summary": "Both Canadian retailers posted double-digit sales growth and improved margins by targeting affluent shoppers, standing out at a time when most retailers are dealing with cautious spending, according to a Retail Insider analyst read.", "link": "https://retail-insider.com", "sources": ["Retail Insider"], "source_date": "Jul 15", "tags": ["retail"]}, {"id": "retail-theft-sentencing-2026-07-15", "section": "news", "headline": "New federal retail-theft sentencing rules take effect today", "summary": "Reforms effective July 15 add an aggravating factor for theft intended for resale, barter or fraudulent return - relevant for loss-prevention planning across Canadian retail.", "link": "https://retail-insider.com", "sources": ["Retail Insider"], "source_date": "Jul 15", "tags": ["retail"]}, {"id": "vatican-ai-summit-2026-07-15", "section": "news", "headline": "The Vatican is hosting a Nobel-laureate summit on AI and nuclear weapons this week", "summary": "Thirty Nobel laureates, former heads of state and AI leaders from OpenAI, DeepMind and Anthropic are meeting for a Conclave-style debate to draft a declaration on AI, nuclear and autonomous-weapons risk.", "link": "https://www.vaticannews.va/en/church/news/2026-07/world-leaders-and-ai-experts-to-convene-on-disarmament-at-borgo.html", "sources": ["There's An AI For That", "AI Daily Brief"], "source_date": "Jul 14", "tags": ["ai"]}, {"id": "training-voice-agent-grok-2026-07-15", "section": "training", "headline": "Build a no-code voice agent for customer intake (with Grok)", "summary": "The Rundown's guide walks through setting up a Grok voice agent that answers inbound calls, qualifies leads and transfers the right callers to your phone - no code needed. You'll need an xAI Grok account and a phone number to test the transfer flow.", "link": "https://app.therundown.ai/guides/build-a-no-code-voice-agent-for-customer-intake-with-grok", "sources": ["The Rundown"], "source_date": "Jul 15", "tags": ["ai", "training"]}, {"id": "nyt-pillow-2026-07-15", "section": "regulars", "headline": "NYT: your pillow is probably too soft", "summary": "Flagged, not read - a pillow-shopping guide plus 4 iPhone security settings worth turning on.", "link": null, "sources": ["NYT"], "source_date": "Jul 14", "tags": []}, {"id": "nyt-well-roundup-2026-07-15", "section": "regulars", "headline": "NYT Well: 5 health stories you might have missed", "summary": "Flagged, not read - includes tick-bite prevention among this week's picks.", "link": null, "sources": ["NYT Well"], "source_date": "Jul 14", "tags": []}, {"id": "nest-report-2026-07-15", "section": "regulars", "headline": "Also in the pile: Nest's June home report for Casa de Chew", "summary": "Routine monthly Nest activity summary - nothing flagged as unusual.", "link": null, "sources": ["Nest"], "source_date": "Jul 14", "tags": []}, {"id": "nyt-recipes-2026-07-15", "section": "regulars", "headline": "NYT's 25 most popular recipes of 2026 so far", "summary": "Flagged, not read - a weeknight-dinner roundup, worth a look given the cooking interest.", "link": null, "sources": ["NYT"], "source_date": "Jul 14", "tags": ["cooking"]}, {"id": "sportsnet-derby-2026-07-15", "section": "regulars", "headline": "MLB Home Run Derby aired last night", "summary": "Flagged, not read - Sportsnet's Home Run Derby / All-Star hype email; the game's already happened by the time this build runs.", "link": null, "sources": ["Sportsnet"], "source_date": "Jul 13", "tags": ["sports"]}, {"id": "rogers-charity-classic-2026-07-15", "section": "regulars", "headline": "Bernhard Langer and Miguel Angel Jimenez headline Calgary's Rogers Charity Classic, Aug 17-23", "summary": "The PGA Tour Champions' only Canadian stop returns to Calgary with 47-time-winner Langer (still winning tournaments in his late 60s) and fan-favourite Jimenez headlining. Tickets are on sale now via Showpass.", "link": "https://rogerscharityclassic.com/", "sources": ["Rogers Charity Classic"], "source_date": "Jul 14", "tags": ["golf", "calgary"]}, {"id": "costco-weekly-2026-07-15", "section": "deals", "headline": "Costco's weekly savings: Kirkland sheets and Dove shampoo", "summary": "Routine weekly Costco.ca flyer - Kirkland Signature sheet sets and Dove shampoo among this week's picks.", "link": "https://www.costco.ca", "sources": ["Costco"], "source_date": "Jul 13-14", "tags": []}, {"id": "skipthedishes-summer-2026-07-15", "section": "deals", "headline": "SkipTheDishes' summer savings push", "summary": "Routine seasonal promo email - no standout offer worth flagging.", "link": null, "sources": ["SkipTheDishes"], "source_date": "Jul 14", "tags": []}, {"id": "papa-johns-deals-2026-07-15", "section": "deals", "headline": "Papa John's running its usual pizza-deal cycle", "summary": "A standing 2-for-$24.99 offer and a Tuesday 40% off special (likely expired by the time you read this) - routine cadence, nothing new.", "link": null, "sources": ["Papa John's"], "source_date": "Jul 13-14", "tags": []}, {"id": "tims-offers-2026-07-15", "section": "deals", "headline": "Tim Hortons' app offers include a $5.99 crispy chicken sandwich through July 20", "summary": "Activated-offer email tied to your points balance - the chicken sandwich deal runs through July 20 if you're in the app anyway.", "link": null, "sources": ["Tim Hortons"], "source_date": "Jul 13", "tags": []}, {"id": "petro-canada-topup-2026-07-15", "section": "deals", "headline": "Petro-Canada's Top Up Tuesday: bonus CT Money on 25L+ fills", "summary": "Routine weekly bonus-CT-Money promo - small value, standing offer.", "link": null, "sources": ["Petro-Canada"], "source_date": "Jul 14", "tags": []}, {"id": "ctc-cadence-2026-07-15", "section": "ctc", "headline": "CTC send volume: 8 emails in 2 days, nothing standout", "summary": "SportChek (running shoes, soccer gear), the CT flyer (grass & garden, clearance, a vague 'something you wanted is on sale'), a Triangle CT-Money nudge, and two CTFS notices (a payment confirmation and a balance-transfer offer) - all routine, no deal worth calling out over the noise.", "link": null, "sources": ["SportChek", "Canadian Tire", "Triangle", "CTFS"], "source_date": "Jul 13-14", "tags": []}]}]</script>
<script>
const NTFY_CURATE = "https://ntfy.sh/emarifeed-k7f3qx9m2p-curate";
const SECTIONS = {
  now:      { label: "Now",      icon: "⚡" },
  news:     { label: "News",     icon: "📰" },
  training: { label: "AI Training", icon: "🎓" },
  regulars: { label: "Regulars", icon: "📬" },
  deals:    { label: "Deals",    icon: "🛍️" },
  ctc:      { label: "CTC",      icon: "🔺" }
};
const SECTION_ORDER = ["now", "news", "training", "regulars", "deals", "ctc"];
const DAYS = JSON.parse(document.getElementById("data").textContent); // newest first
const state = { tab: "today", sec: "all", q: "" };
const votes = JSON.parse(localStorage.getItem("eo-votes") || "{}");

function setTab(t) {
  state.tab = t;
  document.getElementById("tab-today").classList.toggle("on", t === "today");
  document.getElementById("tab-week").classList.toggle("on", t === "week");
  render();
}
function setSec(s) { state.sec = s; render(); }

function matches(e) {
  if (state.sec !== "all" && e.section !== state.sec) return false;
  if (!state.q) return true;
  const hay = (e.headline + " " + e.summary + " " + (e.tags || []).join(" ") + " " + e.sources.join(" ")).toLowerCase();
  return state.q.toLowerCase().split(/\s+/).every(w => hay.includes(w));
}

function esc(s) { return s.replace(/&/g, "&amp;").replace(/</g, "&lt;"); }

function card(e) {
  const v = votes[e.id] || "";
  const link = e.link ? `<a class="more" href="${e.link}" target="_blank" rel="noopener">Read more →</a>` : "";
  return `<div class="card${e.section === "now" ? " urgent" : ""}">
    <p class="hl">${esc(e.headline)}</p>
    <div class="sum-wrap">
      <p class="sum clamp">${esc(e.summary)}</p>
      <button class="more-toggle" onclick="toggleMore(this)">&hellip;more</button>
    </div>
    <div class="meta">
      <span class="src"><span class="badge">${SECTIONS[e.section].icon} ${SECTIONS[e.section].label}</span>${esc(e.sources.join(" + "))} · ${esc(e.source_date)}</span>
      <span class="actions">${link}
        <button class="thumb${v === "up" ? " on" : ""}" onclick="vote('${e.id}','up',this)">👍</button>
        <button class="thumb${v === "down" ? " on" : ""}" onclick="vote('${e.id}','down',this)">👎</button>
      </span>
    </div>
  </div>`;
}

function render() {
  // chips with counts for current tab scope
  const scope = state.tab === "today" ? DAYS.slice(0, 1) : DAYS;
  const all = scope.flatMap(d => d.entries);
  let chips = `<button class="chip${state.sec === "all" ? " on" : ""}" onclick="setSec('all')">All</button>`;
  for (const s of SECTION_ORDER) {
    const n = all.filter(e => e.section === s).length;
    if (!n) continue;
    chips += `<button class="chip${state.sec === s ? " on" : ""}" onclick="setSec('${s}')">${SECTIONS[s].icon} ${SECTIONS[s].label}</button>`;
  }
  document.getElementById("chips").innerHTML = chips;

  let html = "";
  if (state.tab === "today") {
    const day = DAYS[0];
    for (const s of SECTION_ORDER) {
      const items = day.entries.filter(e => e.section === s && matches(e));
      if (!items.length) continue;
      html += `<div class="sec-h">${SECTIONS[s].icon} ${SECTIONS[s].label} <span class="count">${items.length}</span></div>`;
      html += items.map(card).join("");
    }
  } else {
    for (const day of DAYS) {
      const items = day.entries.filter(matches);
      if (!items.length) continue;
      html += `<div class="day-h">${esc(day.build_label)}</div>`;
      html += items.map(card).join("");
    }
  }
  document.getElementById("main").innerHTML = html || `<div class="empty">Nothing matches. Try clearing the search or filter.</div>`;
  // Only reveal the "…more" toggle on summaries that actually overflow two lines.
  document.querySelectorAll(".sum.clamp").forEach(s => {
    if (s.scrollHeight - s.clientHeight > 2) s.nextElementSibling.classList.add("show");
  });
}

function toggleMore(btn) {
  const sum = btn.previousElementSibling;
  const collapsed = sum.classList.toggle("clamp"); // true = now clamped
  btn.classList.toggle("open", !collapsed);
  btn.innerHTML = collapsed ? "&hellip;more" : "less";
}

function vote(id, dir, btn) {
  const prev = votes[id];
  const action = prev === dir ? "retract" : dir;
  if (action === "retract") delete votes[id]; else votes[id] = dir;
  localStorage.setItem("eo-votes", JSON.stringify(votes));
  const entry = DAYS.flatMap(d => d.entries).find(e => e.id === id);
  fetch(NTFY_CURATE, {
    method: "POST",
    headers: { "X-Title": "Email Overview feedback" },
    body: `${action.toUpperCase()} | ${id} | ${entry ? entry.headline : ""}`
  }).then(() => toast(action === "retract" ? "Feedback removed" : (dir === "up" ? "More like this 👍" : "Less of this 👎")))
    .catch(() => toast("Couldn't send - no connection?"));
  render();
}

let toastTimer;
function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 1800);
}

render();
</script>
</body>
