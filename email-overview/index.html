": "2026-07-14", "build_label": "Tuesday, July 14", "entries": [{"id": "ai-jobs-warning-2026-07-14", "section": "news", "headline": "200+ economists and 16 Nobel laureates warn governments aren't ready for AI's economic disruption", "summary": "A Stanford-organized statement called \"We Must Act Now\" argues AI could reshape the economy on the scale of the Industrial Revolution but in a fraction of the time - a decade instead of a century - and is light on specifics but heavy on signatories, including OpenAI and Anthropic's own chief economists, Google's Jeff Dean, and Anthropic co-founder Jack Clark. The ask: build labour policy and safety nets before the disruption lands, not after.", "link": "https://www.wemustactnow.ai", "sources": ["The Deep View", "The Rundown AI", "There's An AI For That"], "source_date": "Jul 14", "tags": ["ai", "work"]}, {"id": "apple-openai-musk-altman-2026-07-14", "section": "news", "headline": "Apple's OpenAI lawsuit reignites the Musk-Altman feud", "summary": "Apple's trade-secret suit against OpenAI (an ex-Apple engineer allegedly walked out with hardware IP) gave Musk fresh ammunition - he spent the weekend accusing Altman of stealing \"all of Apple's phone technology,\" Altman fired back about Musk's \"short-term space datacenters,\" and both sides traded barbs on X all weekend. Entertaining, low on new facts about the actual case.", "link": "https://www.therundown.ai/p/apple-takes-openai-to-court", "sources": ["AI Daily Brief", "The Rundown AI"], "source_date": "Jul 14", "tags": ["ai"]}, {"id": "ai-pricing-wars-2026-07-14", "section": "news", "headline": "Anthropic and OpenAI are burning cash to keep you hooked on their newest models", "summary": "Anthropic extended free access to its top-tier Claude Fable 5 through July 19 (its third extension) and bumped Claude Code's weekly limits 50%, responding to OpenAI's GPT-5.6 launch and a rough week of Anthropic outages. OpenAI, meanwhile, reset usage caps repeatedly and handed out bonus quota after crossing 6-7 million active users. The economics: a loss-leader play to build the usage habits that make switching AI assistants painful later.", "link": "https://www.thedeepview.com/articles/why-the-summer-of-ai-price-wars-is-here", "sources": ["The Deep View", "The Neuron", "AI Daily Brief", "The Rundown AI"], "source_date": "Jul 14", "tags": ["ai", "work"]}, {"id": "claude-personality-language-2026-07-14", "section": "news", "headline": "Anthropic found Claude has a different personality depending on what language you speak to it in", "summary": "New Anthropic research scored 300K+ conversations across 3 models and 20 languages on four personality axes (warmth, candour, depth, caution) and found real, measurable shifts - Hindi conversations get a warmer, more encouraging Claude, English gets a sharper critic, Dutch speakers get more admissions of error. Anthropic says the effect is real but modest (explains ~15% of the variation) and openly admits it doesn't know why - training-data imbalances and cultural-norm-matching are both live theories.", "link": "https://www.anthropic.com/research/claude-values-models-languages", "sources": ["Staying Ahead with AI", "There's An AI For That", "The Rundown AI"], "source_date": "Jul 14", "tags": ["ai"]}, {"id": "ai-distillation-nadella-2026-07-14", "section": "news", "headline": "Microsoft's CEO says AI labs can't have it both ways on training data", "summary": "Satya Nadella called out the double standard: frontier labs trained on the whole internet without licensing it, then cry foul when competitors \"distill\" cheaper models from their outputs. Same week OpenAI and Anthropic told Washington that Chinese firms (Alibaba among them, via roughly 25,000 fraudulent accounts) are distilling US models at industrial scale - both things can be true at once, and the fight over who gets to learn from whom is just getting started.", "link": "https://www.theneuron.ai/news/the-china-ai-theft-claims-are-real-so-is-the-case-for-open-models/", "sources": ["The Neuron"], "source_date": "Jul 14", "tags": ["ai", "work"]}, {"id": "grok-vs-gpt-coding-2026-07-14", "section": "news", "headline": "Head-to-head coding test: Grok 4.5 beat GPT-5.6 Terra on speed and cost, tied on quality", "summary": "A hands-on test running identical bug-fix and dev tasks through both models found Grok 2.5x faster and roughly 3x cheaper per usable output, with neither model catching a distributed-systems bug that a human reviewer would still need to flag. Useful data point if you're picking a coding assistant on cost rather than vibes - though it's one repo, one session, worth running your own version before trusting it.", "link": "https://newsletter.stayingahead.com/p/grok-vs-terra-winner", "sources": ["Staying Ahead with AI"], "source_date": "Jul 14", "tags": ["ai", "work"]}, {"id": "retail-insider-roundup-2026-07-14", "section": "news", "headline": "Retail Insider: Mondetta returns to physical stores, new retail-theft sentencing rules take effect this week, Canadians shop by mission not channel", "summary": "Winnipeg's Mondetta opened a Holt Renfrew pop-up in Toronto with 20 permanent stores planned nationally. Federal retail-theft sentencing reforms - adding an aggravating factor for theft intended for resale - take effect July 15. And new Retail Council of Canada research finds shoppers mixing online and in-store tactics purely to chase the best price, not loyalty to a channel.", "link": "https://retail-insider.com", "sources": ["Retail Insider"], "source_date": "Jul 14", "tags": ["retail", "work"]}, {"id": "cochrane-roundup-2026-07-14", "section": "news", "headline": "Cochrane: IRONMAN 70.3 brings road closures this weekend, blue-green algae risk rises with the heat", "summary": "CochraneNow has traffic and parking details out ahead of the IRONMAN 70.3 race this weekend, the Cochrane Lions fed thousands during a busy Stampede run, and health officials are flagging rising blue-green algae risk in local water bodies as hot weather sets in.", "link": "https://cochranenow.com/articles/cochrane-releases-traffic-parking-details-for-ironman-703-weekend", "sources": ["CochraneNow"], "source_date": "Jul 13", "tags": ["cochrane", "local"]}, {"id": "canada-roundup-2026-07-14", "section": "news", "headline": "Canada's General Fusion goes public and pops 40%; Ottawa and oilsands producers strike a carbon-capture deal", "summary": "B.C.-based General Fusion became the first nuclear fusion company to go public, debuting on the Nasdaq and jumping as much as 40% on day one, though it's still pre-revenue with a 2035 target for a working reactor. Separately, Ottawa and Alberta struck a deal with the five largest oilsands producers to build the Pathways carbon-capture project by 2035, in exchange for looser environmental rules and a new pipeline to the BC coast. Also: Trump says the US will charge ships a 20% toll to escort them through the Strait of Hormuz, pushing oil back above $80/barrel.", "link": "https://betakit.com/general-fusion-begins-trading-on-nasdaq-becomes-first-nuclear-fusion-company-to-go-public/", "sources": ["The Peak", "Morning Brew"], "source_date": "Jul 14", "tags": ["canada", "energy"]}, {"id": "training-meta-ad-angles-2026-07-14", "section": "training", "headline": "AI Training: audit your Meta ad angles with Claude Cowork", "summary": "The Rundown's guide: export your Meta campaign CSV into a Claude project alongside your live Ad Library link, have Claude match ad performance to active creative and flag the highest-performing angles, then turn the findings into a report with three recommended tests. Rerun by platform (Instagram vs Facebook) to isolate what's working where.", "link": "https://app.therundown.ai/guides/find-your-winning-ad-angles-with-claude-and-meta-data", "sources": ["The Rundown AI"], "source_date": "Jul 14", "tags": ["ai", "training", "work"]}, {"id": "nyt-regulars-roundup-2026-07-14", "section": "regulars", "headline": "NYT: a 23-ice-cream taste test", "summary": "Flagged, not read in full - NYT's taste testers ranked 23 ice creams.", "link": "https://www.nytimes.com", "sources": ["NYT"], "source_date": "Jul 13", "tags": ["regulars"]}, {"id": "weekly-deals-roundup-2026-07-14", "section": "deals", "headline": "Routine week: Costco's biweekly flyer, Papa John's $24.99 two-pizza deal, Tim's chicken sandwich offers expiring July 20", "summary": "Costco's regular warehouse savings flyer is out, Papa John's has its usual two-pizza promo, and Tim Hortons app offers (including a $5.99 crispy chicken sandwich) expire July 20 - nothing here clears the bar for a standout.", "link": null, "sources": ["Costco", "Papa John's", "Tim Hortons"], "source_date": "Jul 13-14", "tags": ["deals"]}, {"id": "ctc-frequency-2026-07-14", "section": "ctc", "headline": "CTC sends: 5 marketing emails in under a day, a Sport Chek running-shoe promo is the only one with actual product in it", "summary": "Sport Chek (running shoes from New Balance/adidas), Canadian Tire (clearance, lawn & garden, tires) and Canadian Tire Financial (a balance-transfer offer) all sent routine promos - heavier volume than usual, nothing with a specific discount worth flagging.", "link": null, "sources": ["Sport Chek", "Canadian Tire", "Canadian Tire Financial"], "source_date": "Jul 13-14", "tags": ["ctc", "deals"]}]}, {"build_date": "2026-07-13", "build_label": "Monday, July 13", "entries": [{"id": "apple-openai-lawsuit-2026-07-13", "section": "news", "headline": "Apple sues OpenAI, alleging its hardware team was built on stolen Apple trade secrets", "summary": "Apple filed suit Friday against OpenAI, hardware chief Tang Tan (a 24-year Apple veteran) and engineer Chang Liu, alleging a coordinated campaign to lift confidential device designs, supplier info and manufacturing details as part of OpenAI's Jony Ive-designed hardware push - and that OpenAI coached departing staff on how to keep systems access for a few extra weeks. Apple wants stolen material destroyed, damages, and a guarantee future OpenAI devices aren't built on its plans. OpenAI denies wrongdoing, saying it has \"no interest in other companies' trade secrets.\" With 400+ ex-Apple staff now at OpenAI and the device expected in 2027, this could meaningfully delay or reshape it.", "link": "https://archive.thedeepview.com/p/apple-lawsuit-threatens-openai-s-hardware-plans", "sources": ["The Deep View", "The Rundown AI", "Morning Brew", "The Neuron"], "source_date": "Jul 12-13", "tags": ["ai", "work"]}, {"id": "ai-roundup-2026-07-13", "section": "news", "headline": "Also in AI: the memory chip shortage could run to 2030, OpenAI's safety chief is leaving, and Claude will now show you your own usage patterns", "summary": "SK Hynix warned the AI hardware crunch - the specialized memory chips that feed GPUs - could peak in 2027 and last until 2030, a physical bottleneck underneath all the model-layer hype. Microsoft is reportedly routing some Excel/Outlook Copilot prompts to cheaper internal models to cut reliance on OpenAI and Anthropic, even as GPT-5.6 becomes the preferred model elsewhere in 365 Copilot. OpenAI's head of safety is exiting as the company folds safety into its research org, the second senior safety departure in two weeks. Separately, Anthropic launched a beta dashboard that shows you what you actually use Claude for and lets you set quiet hours or usage nudges - and Meta fully pulled its Instagram \"tag anyone into an AI image\" feature after the opt-out-by-default backlash.", "link": "https://www.theneurondaily.com/p/july-13-monday", "sources": ["The Neuron", "The Deep View", "There's An AI For That"], "source_date": "Jul 12-13", "tags": ["ai", "work"]}, {"id": "gordie-howe-bridge-2026-07-13", "section": "news", "headline": "The Gordie Howe Bridge finally has an opening date - July 27 - but Canada gave up revenue to get there", "summary": "After fronting the entire $6.4B cost of the Windsor-Detroit bridge, Canada agreed to hand over 50% of toll revenue for the next 15 years to a US-controlled fund, and now needs US sign-off to raise tolls more than 10%. In exchange, six lanes of new border capacity opens July 27, expected to save trucking an estimated 850,000 hours a year.", "link": "https://www.readthepeak.com/p/bridging-the-gap", "sources": ["The Peak"], "source_date": "Jul 13", "tags": ["canada", "trade"]}, {"id": "world-roundup-2026-07-13", "section": "news", "headline": "Two killed in a Toronto street festival shooting; Alberta opens the door to private online sportsbooks", "summary": "Multiple shooters exchanged gunfire at Toronto's Salsa on St. Clair festival Saturday night, killing two and hospitalizing four, with no arrests so far. Separately, Alberta became the second Canadian province (after Ontario) to open its market to private online sportsbooks like DraftKings and FanDuel, taking a 20% cut of operator revenue. Also this week: the Seattle Seahawks sold for a record US$9.6B, and long-time US Senator Lindsey Graham died at 71.", "link": "https://www.cbc.ca/news/canada/livestory/toronto-shooting-st-clair-9.7267199", "sources": ["The Peak", "Morning Brew"], "source_date": "Jul 13", "tags": ["news"]}, {"id": "retail-roundup-2026-07-13", "section": "news", "headline": "Retail Insider: Knix founder steps down after 14 years, Italian Centre Shop expands into Calgary's Northland, MTY closing 68 locations", "summary": "Knix founder Joanna Griffiths is handing leadership to Chief Commercial Officer Nicole Tapscott after 14 years building the brand. Locally, Italian Centre Shop opens a new 22,000 sq ft Calgary location (Northland) on July 16. Elsewhere: Toronto menswear brand Modern Ambition opened in Yorkville with a dozen+ stores planned nationally, Aritzia's latest filings show an expanding store and distribution footprint, Costco Canada's comparable sales growth moderated in June, and MTY Food Group is closing 68 corporate locations at an estimated $10-12M cost.", "link": "https://retail-insider.com", "sources": ["Retail Insider"], "source_date": "Jul 13", "tags": ["retail", "work", "calgary"]}, {"id": "cochrane-roundup-2026-07-13", "section": "news", "headline": "Cochrane: free ice cream with local police this summer, a power outage after a pole crash, Stampede weekend picks", "summary": "Flagged, not read in full - local law enforcement is handing out free ice cream around town this summer, a vehicle crash into a power pole caused an outage, the PWHL's Ottawa Charge re-signed Sarah Wozniewicz to a three-year deal, and CochraneNow has a guide to what's worth catching at Stampede.", "link": "https://cochranenow.com/articles/free-ice-cream-on-the-menu-with-local-law-enforcement-this-summer", "sources": ["CochraneNow"], "source_date": "Jul 12", "tags": ["cochrane", "local"]}, {"id": "training-chatgpt-work-website-2026-07-13", "section": "training", "headline": "AI Training: turn an idea into a live website with ChatGPT Work + Codex", "summary": "The Rundown's guide: plan the build and write a one-page PRD in ChatGPT Work, hand it to Codex to build with sub-agents against that PRD, then ask Codex to fix the biggest visible issue and (if available) publish straight from the app via the Sites skill.", "link": "https://app.therundown.ai/guides/turn-any-idea-into-a-working-website-with-chatgpt-work-codex", "sources": ["The Rundown AI"], "source_date": "Jul 13", "tags": ["ai", "training"]}, {"id": "nyt-regulars-roundup-2026-07-13", "section": "regulars", "headline": "NYT Cooking: five-ingredient skillet pork chops with buttered corn", "summary": "Flagged, not read in full - this week's Five Weeknight Dishes centers on Ali Slagle's skillet pork chops with buttered corn, plus a greens soup, slow cooker whole chicken, and a fettuccine alfredo.", "link": "https://cooking.nytimes.com", "sources": ["NYT Cooking"], "source_date": "Jul 12", "tags": ["regulars", "cooking"]}, {"id": "weekly-deals-roundup-2026-07-13", "section": "deals", "headline": "Routine week: Costco's biweekly warehouse flyer, Joe Fresh's spend-$75 offer, Nespresso's towel promo winding down", "summary": "Costco's usual two-week warehouse savings flyer is out, Joe Fresh is running its recurring $20-off-$75 promo, and Nespresso's free beach towel with a summer capsule purchase is in its \"last chance\" window - nothing here clears the bar for a standout.", "link": null, "sources": ["Costco", "Joe Fresh", "Nespresso"], "source_date": "Jul 12-13", "tags": ["deals"]}, {"id": "ctc-frequency-2026-07-13", "section": "ctc", "headline": "CTC sends: 3 marketing emails since yesterday, Mark's clearance Levi's is the standout", "summary": "Sport Chek (running shoes) and Canadian Tire (pro tools) both sent routine flyers. Mark's clearance on Levi's clothing - up to 40% off original price - is the one worth a look.", "link": null, "sources": ["Canadian Tire", "Sport Chek", "Mark's"], "source_date": "Jul 12-13", "tags": ["ctc", "deals"]}]}, {"build_date": "2026-07-12", "build_label": "Sunday, July 12", "entries": [{"id": "triangle-payment-reminder-2026-07-12", "section": "now", "headline": "Triangle Mastercard minimum payment due soon", "summary": "A payment reminder came in from Triangle - worth a quick check of the account before the due date.", "link": null, "sources": ["Triangle"], "source_date": "Jul 11", "tags": ["finance", "reminder"]}, {"id": "brown-ai-cheating-2026-07-12", "section": "news", "headline": "A Brown class averaged 96% on a take-home exam - and 48% once it moved in-person", "summary": "A professor got suspicious of a suspiciously good take-home midterm average, reran the answers through ChatGPT and found a match, then moved the final in-person. Eighteen students dropped the course and nine skipped the final once they heard; the class average fell from 96% to 48.6%.", "link": "https://www.insidehighered.com/news/faculty/learning-assessment/2026/07/08/brown-professor-suspects-most-his-class-used-ai-cheat", "sources": ["The Daily AI Show", "There's An AI For That"], "source_date": "Jul 11-12", "tags": ["ai", "education"]}, {"id": "ai-roundup-2026-07-12", "section": "news", "headline": "Also in AI: Microsoft and AWS bet billions on hands-on deployment, voice becomes the new command layer, Apple sues OpenAI", "summary": "Microsoft ($2.5B) and AWS ($1B) are both standing up 'forward-deployed engineer' teams to actually wire AI into customer workflows - a sign licensing models was the easy part and implementation is where the real spend is going. Separately, OpenAI's new GPT-Live voice model is being pitched as a dispatcher that hands tasks off to other AI systems rather than just a chatbot with a better accent; Apple is suing OpenAI, alleging a former engineer took Apple trade secrets to its hardware team; and Meta yanked its Muse Image tool - which let anyone turn public Instagram photos into AI-altered images by default - within days of an actor/privacy-group backlash.", "link": null, "sources": ["The Daily AI Show", "There's An AI For That"], "source_date": "Jul 11-12", "tags": ["ai", "work"]}, {"id": "retail-roundup-2026-07-12", "section": "news", "headline": "Canadian shoppers are getting more tactical as grocery prices climb, but a new survey shows spending intentions ticking up", "summary": "Retail Insider flags Canadians hunting harder for deals as food inflation persists, even as a Stifel Canada survey found 57% expect to increase discretionary spending (apparel and dollar stores gaining, furniture lagging). In a smaller retail-history note, the former Hudson's Bay store at Windsor's Devonshire Mall - originally a 1974 Simpsons department store - is being demolished after its sale to Primaris REIT.", "link": "https://retail-insider.com/retail-insider/2026/07/food-inflation-creates-more-tactical-grocery-shoppers-in-canada/", "sources": ["Retail Insider"], "source_date": "Jul 6-10", "tags": ["retail", "work"]}, {"id": "alberta-heritage-fund-2026-07-12", "section": "news", "headline": "How Alberta missed its shot at a trillion-dollar wealth fund", "summary": "Canadaland traces the Alberta Heritage Savings Trust Fund from its founding after the 1974 oil crisis through the booms, busts, and policy choices that kept it a fraction of the size peer funds like Norway's became - a look at what governments do (and stop doing) with sudden oil wealth.", "link": null, "sources": ["Canadaland"], "source_date": "Jul 11", "tags": ["alberta", "economy"]}, {"id": "cochrane-roundup-2026-07-12", "section": "news", "headline": "Cochrane: a workplace lottery pool delivers $100K, plus a Stampede-weekend guide", "summary": "Flagged, not read in full - a Cochrane workplace lottery tradition paid out $100K to a group of friends, and CochraneNow has a rundown of what's worth checking out at Stampede on July 11.", "link": "https://cochranenow.com/articles/workplace-lottery-tradition-delivers-100k-for-cochrane-friends", "sources": ["CochraneNow"], "source_date": "Jul 11", "tags": ["cochrane", "local"]}, {"id": "nyt-regulars-roundup-2026-07-12", "section": "regulars", "headline": "NYT Wirecutter: tools to make your clothes last longer", "summary": "Flagged, not read in full - a Wirecutter roundup on extending clothing life (lint rollers, garment steamers, mesh laundry bags and the like).", "link": "https://www.nytimes.com/wirecutter/", "sources": ["NYT Wirecutter"], "source_date": "Jul 12", "tags": ["regulars"]}, {"id": "ctc-frequency-2026-07-12", "section": "ctc", "headline": "CTC sends: 4 marketing emails since Friday, Mark's BOGO jeans is the standout", "summary": "Canadian Tire (EV chargers, motor oil), Sport Chek (running shoes) and Mark's all sent flyers since Friday. Mark's buy-one-get-one 50% off on jeans and jean jackets across men's, women's and kids' is the one worth a look; the rest is routine seasonal push.", "link": null, "sources": ["Canadian Tire", "Sport Chek", "Mark's"], "source_date": "Jul 11-12", "tags": ["ctc", "deals"]}, {"id": "weekly-deals-roundup-2026-07-12", "section": "deals", "headline": , "alberta", "work"]}, {"id": "eu-meta-addictive-design-2026-07-11", "section": "news", "headline": "EU finds Meta's Facebook and Instagram apps are addictive enough to breach the law", "summary": "European regulators say Meta didn't adequately account for how autoplay, infinite scroll and its recommendation algorithm drive compulsive use, especially among younger users. Meta gets a chance to propose fixes before fines - up to 6% of global revenue - are decided.", "link": null, "sources": ["Morning Brew"], "source_date": "Jul 11", "tags": ["regulation", "tech"]}, {"id": "anthropic-bernanke-trust-2026-07-11", "section": "news", "headline": "Anthropic adds former Fed chair Ben Bernanke to its AI oversight board", "summary": "Bernanke joins Anthropic's Long-Term Benefit Trust, the independent board that's on track for majority board-appointment power next year - a notable, polarizing pick given his legacy from the 2008 financial crisis response.", "link": "https://www.anthropic.com/news/ben-bernanke", "sources": ["The AI Daily Brief"], "source_date": "Jul 11", "tags": ["ai", "governance"]}, {"id": "netflix-live-tv-2026-07-11", "section": "news", "headline": "Netflix reportedly weighing a move into live TV channels", "summary": "Facing declining engagement and shares down 40% over the past year, Netflix is considering 24/7 genre channels and bundling with rival streamers, per the WSJ - inching toward the cable model it once disrupted, largely to grow its ad business.", "link": null, "sources": ["Morning Brew"], "source_date": "Jul 11", "tags": ["business", "streaming"]}, {"id": "ai-roundup-2026-07-11", "section": "news", "headline": "Also in AI: Ollama raises $65M, companion robots ship, AI-designed molecules fool chemists", "summary": "Ollama landed a $65M Series B and 9M users; UBTech began mass-producing silicone-skinned companion robots; a new model designed synthetic molecules realistic enough to stump 121 chemists trying to spot fakes; and Google released a free AI certificate course covering research, planning and app-building.", "link": null, "sources": ["There's An AI For That"], "source_date": "Jul 11", "tags": ["ai"]}, {"id": "trump-iran-threat-2026-07-11", "section": "news", "headline": "Trump threatens a major strike on Iran if he's assassinated", "summary": "After banners calling for his assassination appeared at Iran's late Supreme Leader's funeral procession, Trump said he's directed a large-scale retaliatory strike if any attempt is made on his life - the latest flashpoint in ongoing US-Iran tensions. Separately, a bipartisan housing affordability bill became law after Trump let the signing window lapse in protest rather than veto it.", "link": null, "sources": ["Morning Brew"], "source_date": "Jul 11", "tags": ["world", "geopolitics"]}, {"id": "cochrane-roundup-2026-07-11", "section": "news", "headline": "Cochrane: RCMP's top officer retires after 35 years, plus a pup bus and a $40K accessibility grant", "summary": "Flagged, not read in full - local headlines include OIC Dave Brunner stepping down after 35 years of service, a $40K accessibility grant for the Railway Street Pavilion, Cochrane's first 'pup bus,' and Stampede-season community stories (Guthrie's BBQ, stolen-phone pings tied to Stampede crowds).", "link": "https://cochranenow.com/articles/cochrane-rcmp-oic-dave-brunner-retiring-after-35-years-of-service", "sources": ["CochraneNow"], "source_date": "Jul 10", "tags": ["cochrane", "local"]}, {"id": "nyt-regulars-roundup-2026-07-11", "section": "regulars", "headline": "NYT/Crave regulars: white jeans, mature-skin skincare, and a World Cup-heavy weekend watchlist", "summary": "Flagged, not read in full - Wirecutter's white jeans and mature-skin skincare picks, Crave's weekend watchlist (World Cup quarterfinals, Drag Race All Stars, Emmy nods), and Packers QB Jordan Love's No. 72 ranking in the NFL's Top 100.", "link": "https://www.nytimes.com/wirecutter/", "sources": ["NYT Wirecutter", "Crave", "Packers"], ll shipped new flagship AI models in the same 24 hours", "summary": "OpenAI took GPT-5.6 (Sol/Terra/Luna) fully public and paired it with ChatGPT Work - a Claude-Cowork-style agent that plans, browses, and builds docs/sheets/sites for ChatGPT's ~1B users - while folding Codex into a unified desktop app and sunsetting the standalone Atlas browser. Meta shipped Muse Spark 1.1 at roughly a quarter of rival pricing, and SpaceXAI (formerly xAI) released Grok 4.5, its first model built with Cursor, undercutting Claude on cost. Early reviews frame Sol as a relentless executor rather than a smarter model than Fable - Anthropic responded the same day by resetting Fable's weekly rate limits and launching a Claude usage-reflection dashboard.", "link": "https://openai.com/index/gpt-5-6/", "sources": ["Staying Ahead of AI", "The Deep View", "The Neuron", "The Rundown AI", "The Peak", "There's An AI For That", "AI Daily Brief"], "source_date": "Jul 9-10", "tags": ["ai", "work", "tech"]}, {"id": "ai-ceo-manager-gap-2026-07-10", "section": "news", "headline": "Executives think AI adoption is going well; the managers running teams disagree", "summary": "A Nitro survey of 1,300+ execs, managers, and directors found 85% of C-suite leaders say they've deployed AI, but only 54% of managers call it a real priority day-to-day - most teams still rely on copy-pasting into ChatGPT rather than AI built into their actual workflows, with security/trust concerns cited as the top blocker.", "link": "https://www.thedeepview.com/articles/ceos-think-ai-is-working-the-data-disagrees", "sources": ["The Deep View"], "source_date": "Jul 10", "tags": ["ai", "work", "governance"]}, {"id": "google-ai-overviews-accuracy-2026-07-10", "section": "news", "headline": "Google's AI Overviews are accurate about 90% of the time - at Google's scale, that's still a lot of wrong answers", "summary": "An NYT-commissioned analysis pegs AI Overview accuracy around 90%; Google disputes the methodology. But with Google processing trillions of searches a year, even a small error rate translates to a large volume of confidently-wrong answers, particularly since the models aren't built to distinguish what they know from what they're guessing.", "link": "https://archive.thedeepview.com/p/why-google-ai-overviews-expose-ai-s-biggest-problem", "sources": ["The Deep View"], "source_date": "Jul 10", "tags": ["ai", "research"]}, {"id": "sk-hynix-ipo-2026-07-10", "section": "news", "headline": "SK Hynix, a $1 trillion memory-chip maker, lists on the Nasdaq", "summary": "The South Korean company supplying the memory chips behind the AI data-centre boom went public in the US today, with preliminary orders reportedly outstripping supply sevenfold. Analysts expect the memory-chip crunch driving its profits to persist until at least 2027.", "link": null, "sources": ["Morning Brew"], "source_date": "Jul 10", "tags": ["ai", "markets"]}, {"id": "retail-canada-roundup-2026-07-10", "section": "news", "headline": "Aritzia's revenue jumped 43% as Canadian retail expansion keeps rolling", "summary": "Aritzia's Q1 net revenue rose 43.4% to $951M (Canada up 25% to $312.9M); Max Mara reopened at Vancouver's Oakridge Park under Vestis Fashion Group; Dollarama is eyeing convenience, consumables, and logistics investment as its next growth lever beyond store count; and 7-Eleven Canada marked the Slurpee's 60th anniversary with new products.", "link": "https://retail-insider.com", "sources": ["Retail Insider"], "source_date": "Jul 10", "tags": ["retail", "canada", "work"]}, {"id": "brown-university-ai-cheating-2026-07-10", "section": "news", "headline": "A Brown professor says his class used ChatGPT to ace a take-home exam - then bombed the in-person final", "summary": "Economics professor Roberto Serrano's class swelled from 30 to 86 students once take-home exams were announced, averaged 96% on the midterm, then scored a 'historic low' 48.6% once he moved the final in-person. The university says he hasn't provided enough evidence to act on it. A recent survey found nearly 30% of Princeton students admit to cheating with AI.", "link": null, "sources": ["Morning Brew"], "source_date": "Jul 10", "tags": ["ai", "education"]}, {"id": "cochrane-roundup-2026-07-10", "section": "news", "headline": "Cochrane: RCMP crack an online child-luring case, plus a full weekend of Stampede-adjacent events", "summary": "Flagged, not read in full - local headlines include Cochrane RCMP resolving an online child-luring investigation, a weekend events guide (Jul 10-12), and Stampede-season community stories (Spirit Trail ride, Stampede breakfasts, Sounds of Summer concert series).", "link": "https://cochranenow.com/articles/top-things-to-do-in-cochrane-this-weekend-july-10---12", "sources": ["CochraneNow"], "source_date": "Jul 9", "tags": ["cochrane", "local"]}, {"id": "rundown-training-orchestrator-2026-07-10", "section": "training", "headline": "Use 60% less Fable tokens with an orchestrator setup", "summary": "Keep Fable as the planner/reviewer and hand token-heavy execution (coding, browsing, research) to Codex or a cheaper Claude model - Anthropic's own benchmarks show ~92-96% of Fable's performance at 46-63% of the cost when it's used as an advisor or orchestrator rather than doing everything itself.", "link": "https://app.therundown.ai/guides/use-60-less-fable-tokens-with-this-orchestrator-setup", "sources": ["The Rundown AI"], "source_date": "Jul 10", "tags": ["ai", "training"]}, {"id": "spark-dino-summer-2026-07-10", "section": "regulars", "headline": "TELUS Spark's dinosaur summer runs through September 1", "summary": "Dino-themed hands-on activities and giant-screen shows run all summer at TELUS Spark, alongside a Burgess Shale fossils talk on July 29 and an Indigenous bow-making workshop in August - solid Lily-age options for a Calgary weekend.", "link": "https://www.sparksciencentre.ca", "sources": ["Spark Science"], "source_date": "Jul 9", "tags": ["family", "calgary", "regulars"]}, {"id": "nyt-regulars-roundup-2026-07-10", "section": "regulars", "headline": "NYT regulars: cutting screen time, and 16 picture frames worth displaying", "summary": "Flagged, not read in full - NYT Well's reader tips on cutting screen time, plus a Wirecutter picture-frame roundup.", "link": "https://www.nytimes.com/wirecutter/", "sources": ["NYT Well", "NYT Wirecutter"], "source_date": "Jul 9-10", "tags": ["regulars"]}, {"id": "weekly-deals-roundup-2026-07-10", "section": "deals", "headline": "Weekly deals: Safeway's grocery flyer via Scene+, plus the usual fast-food promo pile", "summary": "Safeway's routine weekly grocery offers landed via Scene+ - nothing standout this week. Also in the pile: Papa John's and Costco promo pushes, skippable unless useful to you.", "link": null, "sources": ["Scene+", "Safeway", "Costco"], "source_date": "Jul 9-10", "tags": ["deals"]}]}]</script>
<script>
const NTFY_CURATE = "https://ntfy.sh/emarifeed-k7f3qx9m2p-curate";
const SECTIONS = {
  now:      { label: "Now",      icon: "⚡" },
  news:     { label: "News",     icon: "📰" },
  training: { label: "AI Training", icon: "🎓" },
  regulars: { label: "Regulars", icon: "📬" },
  deals:    { label: "Deals",    icon: "🛍️" },
  ctc:      { label: "CTC",      icon: "🔺" }
};
const SECTION_ORDER = ["now", "news", "training", "regulars", "deals", "ctc"];
const DAYS = JSON.parse(document.getElementById("data").textContent); // newest first
const state = { tab: "today", sec: "all", q: "" };
const votes = JSON.parse(localStorage.getItem("eo-votes") || "{}");

function setTab(t) {
  state.tab = t;
  document.getElementById("tab-today").classList.toggle("on", t === "today");
  document.getElementById("tab-week").classList.toggle("on", t === "week");
  render();
}
function setSec(s) { state.sec = s; render(); }

function matches(e) {
  if (state.sec !== "all" && e.section !== state.sec) return false;
  if (!state.q) return true;
  const hay = (e.headline + " " + e.summary + " " + (e.tags || []).join(" ") + " " + e.sources.join(" ")).toLowerCase();
  return state.q.toLowerCase().split(/\s+/).every(w => hay.includes(w));
}

function esc(s) { return s.replace(/&/g, "&amp;").replace(/</g, "&lt;"); }

function card(e) {
  const v = votes[e.id] || "";
  const link = e.link ? `<a class="more" href="${e.link}" target="_blank" rel="noopener">Read more →</a>` : "";
  return `<div class="card${e.section === "now" ? " urgent" : ""}">
    <p class="hl">${esc(e.headline)}</p>
    <div class="sum-wrap">
      <p class="sum clamp">${esc(e.summary)}</p>
      <button class="more-toggle" onclick="toggleMore(this)">&hellip;more</button>
    </div>
    <div class="meta">
      <span class="src"><span class="badge">${SECTIONS[e.section].icon} ${SECTIONS[e.section].label}</span>${esc(e.sources.join(" + "))} · ${esc(e.source_date)}</span>
      <span class="actions">${link}
        <button class="thumb${v === "up" ? " on" : ""}" onclick="vote('${e.id}','up',this)">👍</button>
        <button class="thumb${v === "down" ? " on" : ""}" onclick="vote('${e.id}','down',this)">👎</button>
      </span>
    </div>
  </div>`;
}

function render() {
  // chips with counts for current tab scope
  const scope = state.tab === "today" ? DAYS.slice(0, 1) : DAYS;
  const all = scope.flatMap(d => d.entries);
  let chips = `<button class="chip${state.sec === "all" ? " on" : ""}" onclick="setSec('all')">All</button>`;
  for (const s of SECTION_ORDER) {
    const n = all.filter(e => e.section === s).length;
    if (!n) continue;
    chips += `<button class="chip${state.sec === s ? " on" : ""}" onclick="setSec('${s}')">${SECTIONS[s].icon} ${SECTIONS[s].label}</button>`;
  }
  document.getElementById("chips").innerHTML = chips;

  let html = "";
  if (state.tab === "today") {
    const day = DAYS[0];
    for (const s of SECTION_ORDER) {
      const items = day.entries.filter(e => e.section === s && matches(e));
      if (!items.length) continue;
      html += `<div class="sec-h">${SECTIONS[s].icon} ${SECTIONS[s].label} <span class="count">${items.length}</span></div>`;
      html += items.map(card).join("");
    }
  } else {
    for (const day of DAYS) {
      const items = day.entries.filter(matches);
      if (!items.length) continue;
      html += `<div class="day-h">${esc(day.build_label)}</div>`;
      html += items.map(card).join("");
    }
  }
  document.getElementById("main").innerHTML = html || `<div class="empty">Nothing matches. Try clearing the search or filter.</div>`;
  // Only reveal the "…more" toggle on summaries that actually overflow two lines.
  document.querySelectorAll(".sum.clamp").forEach(s => {
    if (s.scrollHeight - s.clientHeight > 2) s.nextElementSibling.classList.add("show");
  });
}

function toggleMore(btn) {
  const sum = btn.previousElementSibling;
  const collapsed = sum.classList.toggle("clamp"); // true = now clamped
  btn.classList.toggle("open", !collapsed);
  btn.innerHTML = collapsed ? "&hellip;more" : "less";
}

function vote(id, dir, btn) {
  const prev = votes[id];
  const action = prev === dir ? "retract" : dir;
  if (action === "retract") delete votes[id]; else votes[id] = dir;
  localStorage.setItem("eo-votes", JSON.stringify(votes));
  const entry = DAYS.flatMap(d => d.entries).find(e => e.id === id);
  fetch(NTFY_CURATE, {
    method: "POST",
    headers: { "X-Title": "Email Overview feedback" },
    body: `${action.toUpperCase()} | ${id} | ${entry ? entry.headline : ""}`
  }).then(() => toast(action === "retract" ? "Feedback removed" : (dir === "up" ? "More like this 👍" : "Less of this 👎")))
    .catch(() => toast("Couldn't send - no connection?"));
  render();
}

let toastTimer;
function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 1800);
}

render();
</script>
