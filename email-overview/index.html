enchmarks looked frontier-competitive, but hands-on reviewers say the real-world experience doesn't quite match the scoreboard yet - file under wait-and-see.", "link": "https://sakana.ai/fugu-release/", "sources": ["The Neuron", "The Rundown", "The Deep View"], "source_date": "Jun 22-23", "tags": ["ai", "tools", "agents"]}, {"id": "glm-5-2-followup-2026-06-23", "section": "news", "headline": "GLM 5.2 is holding up under real use, but self-hosting it is its own project", "summary": "A weekend of hands-on testing from credible names (Vercel's CEO, Jeremy Howard, others) is calling this the open-weights model that actually lived up to its benchmarks - genuinely close to Opus/GPT-class coding quality, and it beat Fable 5 specifically at website design. The catch if you want to self-host: it's a 744-billion-parameter model that needs the full thing in memory regardless of how few parameters fire per token, which in practice means roughly 8 H200 GPUs (~$370K to buy, ~$20K/month to rent) for the standard build. For almost everyone the sane move is renting it through OpenRouter (about $4.40/M output tokens) rather than buying hardware - self-hosting only pencils out if your code legally can't leave the building.", "link": "https://newsletter.stayingahead.com/p/glm-5-2", "sources": ["AI Daily Brief", "Staying Ahead"], "source_date": "Jun 22-23", "tags": ["ai", "open-models", "local", "cost"]}, {"id": "ai-talent-model-wars-2026-06-23", "section": "news", "headline": "Two Nobel-adjacent departures and a noisy week of model rumours", "summary": "Nobel laureate John Jumper (AlphaFold) is leaving Google DeepMind for Anthropic, days after Noam Shazeer's exit - reporting cites low morale and four months without a flagship Gemini release (3.5 Pro is reportedly due June 30). Meanwhile OpenAI's Barret Zoph left for the second time in five months, and the rumour mill has GPT-5.6, a returned Fable/Mythos, and a new Sonnet all possibly landing the same week. Background noise for now, but the competitive picture between labs is genuinely shifting, not just Twitter chatter.", "link": "https://techcrunch.com/2026/06/20/nobel-laureate-john-jumper-is-leaving-deepmind-for-rival-anthropic/", "sources": ["AI Daily Brief", "The Neuron"], "source_date": "Jun 19-23", "tags": ["ai", "talent", "industry"]}, {"id": "a24-google-deepmind-2026-06-23", "section": "news", "headline": "Google is putting $75M into A24 to build film tools, not films", "summary": "The indie studio behind Backrooms and Civil War is partnering with Google DeepMind on AI tooling for production - storyboards and workflow support, explicitly not AI-generated movies. A24's own Backrooms director has called AI 'cultural and economic rot,' so this is a real gamble on the studio's indie-cred audience. Comes the same week SpaceX signed a $6.3B compute deal with startup Reflection AI, renting out data centres it originally built for Grok.", "link": "https://blog.google/innovation-and-ai/models-and-research/google-deepmind/deepmind-a24-research-partnership/", "sources": ["The Deep View", "The Rundown", "Morning Brew"], "source_date": "Jun 22-23", "tags": ["ai", "film", "business"]}, {"id": "ai-workplace-burnout-2026-06-23", "section": "news", "headline": "A panel of execs and a psychiatrist say AI is adding stress, not removing it", "summary": "At a Paris tech conference, business leaders and a psychiatrist argued AI is increasing workplace anxiety by piling on new tools to learn and uncertainty about job security - a Headspace study found 9 in 10 US workers are feeling cognitive strain, with a third saying it's gotten worse over the past year. The sharper point raised: if the underlying process was already broken, bolting AI onto it just speeds up the broken process.", "link": "https://www.thedeepview.com/articles/why-ai-at-work-is-coming-at-a-mental-health-cost", "sources": ["The Deep View"], "source_date": "Jun 23", "tags": ["ai", "work", "wellness"]}, {"id": "retail-roundup-2026-06-23", "section": "news", "headline": "Shake Shack picks Calgary for its first Canadian drive-thru", "summary": "Shake Shack Canada is opening the country's first Shake Shack drive-thru in Calgary this fall. Elsewhere in retail: an Ontario court approved splitting Toys 'R' Us Canada's brand from its stores between separate buyers (the fate of remaining stores past Jan 2027 is unclear), and a new survey found 96% of Canadian households shopped at Dollarama in the past 60 days - a level of penetration most retailers would kill for.", "link": "https://retail-insider.com/", "sources": ["Retail Insider"], "source_date": "Jun 23", "tags": ["retail", "calgary", "strategy", "canada"]}, {"id": "canada-roundup-2026-06-23", "section": "news", "headline": "Inflation ticks up to 3.2%, Ottawa floats a Kingston stop for the high-speed rail", "summary": "May's headline inflation rate hit 3.2% - higher than expected, mostly gas prices tied to the Iran conflict - though core inflation (excluding energy) is a calmer 2.2%. Ottawa asked the Alto high-speed rail project to study adding a Kingston stop after consultation showed demand there, which could help politically but complicates the straight-line speed the project needs. Separately, Ottawa unveiled plans to boost nuclear power 50% with up to 10 new Candu reactors, partly to meet AI-data-centre demand. And three people, including a police officer, were killed in a Montreal shooting; the RCMP has warned of possible copycat attacks.", "link": "https://www.cbc.ca/news/business/cpi-may-2026-9.7244063", "sources": ["The Peak"], "source_date": "Jun 23", "tags": ["canada", "economy", "infrastructure"]}, {"id": "training-typeless-voice-2026-06-23", "section": "training", "headline": "Build a voice-dump-to-clean-prompt workflow with AI dictation", "summary": "The Rundown's hands-on guide: use a dictation tool (Typeless, or the built-in mic in ChatGPT/Claude) to ramble through an idea with all its caveats and constraints, then have the model reconstruct your actual intent into a clean, reusable prompt before answering. Useful if 'perfect prompt formatting' has ever been the thing stopping you from starting.", "link": "https://app.therundown.ai/guides/cut-typing-time-in-half-with-ai-voice-commands-typeless-tutorial", "sources": ["The Rundown"], "source_date": "Jun 23", "tags": ["training", "ai", "prompting"]}, {"id": "regulars-wirecutter-2026-06-23", "section": "regulars", "headline": "Wirecutter: Prime Day picks plus the best ice cube trays", "summary": "Wirecutter's already vetted the Prime Day pile down to ones it actually recommends, and separately ran down the best ice cube trays and drinking glasses. Flagging, not summarizing - no clean non-tracking link.", "link": null, "sources": ["Wirecutter"], "source_date": "Jun 22-23", "tags": ["regulars", "deals", "household"]}, {"id": "regulars-canadaland-2026-06-23", "section": "regulars", "headline": "Canadaland: World Cup visa bans, a bill-passing sprint, Robert Fife's retirement", "summary": "This week's pods cover the politics of co-hosting the World Cup while ~25% of competing nations face US travel restrictions, the Liberals racing bills through before Parliament's summer break, and a look back at Robert Fife's 48 years of access journalism as he retires. Flag only - body not read in full.", "link": null, "sources": ["Canadaland"], "source_date": "Jun 22", "tags": ["regulars", "canada", "podcast"]}, {"id": "deals-costco-2026-06-23", "section": "deals", "headline": "Costco: Treasure Hunt still running, Executive member event teased", "summary": "Costco's Treasure Hunt warehouse-savings event continues through July 5, and a new email is teasing extra Executive-membership perks. Routine - browse if you're already going.", "link": "https://www.costco.ca/", "sources": ["Costco"], "source_date": "Jun 23", "tags": ["deals", "costco", "routine"]}, {"id": "deals-ikea-2026-06-23", "section": "deals", "headline": "IKEA Family: 15% off picture frames until July 2", "summary": "Standard IKEA Family member discount on frames and gallery-wall pieces. Minor, but cheap enough to be worth a glance if you've got a wall that needs filling.", "link": "https://www.ikea.com/ca/en/", "sources": ["IKEA"], "source_date": "Jun 23", "tags": ["deals", "ikea", "home"]}, {"id": "ctc-cadence-2026-06-23", "section": "ctc", "headline": "CTC banners: training-gear sale at SportChek, a 'coming soon' teaser, the usual CT flyer", "summary": "Cadence note - SportChek pushed a training-gear sale (Nike, Evoke and others, no specifics on the size of the discount), a separate 'coming soon, online only' teaser hit all three banners, and Canadian Tire's flyer led with Tims K-Cup pods and the ChillMate iced-coffee maker. Nothing here clears the bar as a standout.", "link": "https://www.sportchek.ca/", "sources": ["SportChek", "Canadian Tire"], "source_date": "Jun 23", "tags": ["ctc", "sportchek", "canadian-tire"]}]}, {"build_date": "2026-06-22", "build_label": "Monday, June 22", "entries": [{"id": "now-prime-day-2026-06-22", "section": "now", "headline": "Amazon Prime Day runs Tuesday through Friday this week", "summary": "Amazon pulled its big sale event a month early this year (to line up with the World Cup and the US 250th), so it lands this week, Tue-Fri, rather than July. Worth a look if anything's been sitting in your cart.", "link": "https://www.amazon.ca/", "sources": ["Morning Brew"], "source_date": "Jun 22", "tags": ["now", "deals", "amazon"]}, {"id": "now-iran-talks-2026-06-22", "section": "now", "headline": "US-Iran ceasefire looks shaky as Trump threatens fresh strikes", "summary": "A week after the two sides signed a ceasefire, negotiators met through the night in Switzerland while Trump posted that the US would 'hit Iran very hard again' if it doesn't rein in Hezbollah. Mediators from Qatar and Pakistan reported 'encouraging progress' and talks continue this week. The Strait of Hormuz has reopened, but 800+ vessels are still backed up and freight rates may
