 ongoing care. The pattern worth noting: AI companies are moving off the screen to capture medical data the internet never had.", "link": "https://openai.com/index/diagnose-rare-childhood-diseases/", "sources": ["The Rundown", "The Daily AI Show", "There's An AI For That"], "source_date": "Jun 21-22", "tags": ["ai", "health", "research"]}, {"id": "ai-skill-erosion-2026-06-22", "section": "news", "headline": "Mounting evidence that leaning on AI quietly erodes your skills", "summary": "Three studies in the pile: experienced physicians' ability to read colonoscopy images degraded within months of using an AI tool (Lancet); frequent AI use correlated with lower critical-thinking scores; and Anthropic's own researchers found AI use 'impairs conceptual understanding, code reading, and debugging.' The counterpoint is the GPS/phone-number argument - we've offloaded skills before without much harm. The difference is that AI is aimed at the thinking itself, not just rote recall, which is a different kind of bet.", "link": "https://arxiv.org/abs/2601.20245", "sources": ["The Peak"], "source_date": "Jun 22", "tags": ["ai", "work", "research"]}, {"id": "td-worker-monitoring-2026-06-22", "section": "news", "headline": "TD will start monitoring how some staff spend their workday", "summary": "TD is rolling out WorkiQ, software that tracks how much time employees spend in meetings, on the web, and in internal apps - starting with its financial-crimes and risk team. The bank frames it as restoring transparency lost to remote work. It's part of a broader surveillance creep (Burger King's headset 'Patty,' US banks scanning staff chat for bullying), and roughly a third of remote-working Canadians already report some monitoring. One to file under how 'productivity' gets defined and measured.", "link": "https://www.reuters.com/world/canadian-lender-td-tells-some-employees-it-will-use-software-monitor-their-work-2026-06-19/", "sources": ["The Peak"], "source_date": "Jun 22", "tags": ["work", "ai", "canada", "surveillance"]}, {"id": "agent-control-2026-06-22", "section": "news", "headline": "AI safety is starting to look like IT security - permissions, logs, kill switches", "summary": "Google DeepMind published an AI Control Roadmap that treats powerful internal agents like insider threats: trusted AI supervisors watching an agent's reasoning and actions, controls that scale by risk (delayed review for low-stakes, real-time blocking for dangerous), and hard metrics like coverage, recall, and time-to-response. The reason it's urgent: agents now read files, call tools, and take actions, so a wrong action - not just a wrong answer - can delete data or approve a payment. Anthropic made the shift concrete from the other side, reporting Claude completed shared robotics tasks 18-37x faster than earlier human teams. Useful framing for any AI-governance conversation at work.", "link": "https://deepmind.google/blog/securing-the-future-of-ai-agents/", "sources": ["The Neuron"], "source_date": "Jun 21", "tags": ["ai", "governance", "agents", "enterprise"]}, {"id": "retail-calgary-2026-06-22", "section": "news", "headline": "Retail intel: Hermes coming to Stephen Avenue, Sobeys leans hard into discount, AI creeps into the cart", "summary": "Three from Retail Insider that land in your lane. Hermes is planning its first standalone Alberta store on Calgary's Stephen Avenue, exiting Holt Renfrew and reinforcing downtown's luxury build-out. Empire (Sobeys) laid out a discount-first growth plan - 70 new stores over three years, 75%+ of them discount banners like FreshCo - a clear read on where the grocery battle is heading. And a National Bank survey found 39% of Canadians have used generative AI to help with a purchase decision in the past year, so the 'AI in the shopping journey' theme keeps building.", "link": "https://retail-insider.com/", "sources": ["Retail Insider"], "source_date": "Jun 22", "tags": ["retail", "calgary", "strategy", "ai", "canada"]}, {"id": "musk-merger-2026-06-22", "section": "news", "headline": "The Tesla-SpaceX merger chatter is really an embodied-AI play", "summary": "After SpaceX absorbed xAI and bought Cursor-maker Anysphere for ~$60B, the long-rumoured Tesla-SpaceX merger is being read less as a car-meets-rocket deal and more as an attempt to own the whole embodied-AI stack: chips, launch, Starlink connectivity, models, coding agents, robotaxis, and Optimus robots - one industrial loop where physical-world data improves the next generation of machines. Regulators would have a very long list of questions. More 'where the puck is going' than actionable, but a sharp strategy case study.", "link": "https://www.reuters.com/legal/transactional/spacex-buy-anysphere-60-billion-2026-06-16/", "sources": ["The Daily AI Show", "The Neuron"], "source_date": "Jun 21", "tags": ["ai", "tech", "strategy"]}, {"id": "codex-record-replay-2026-06-22", "section": "news", "headline": "Codex can now learn a repetitive task by watching you do it once", "summary": "OpenAI's new Record & Replay for Codex lets you perform a recurring workflow once - filing an expense, pulling the same report every Monday, working through clunky software with no API - and turns the demo into a reusable, editable skill it can run again with new inputs. The 'record once, replay forever' pattern is exactly the kind of grunt-work automation worth keeping in mind for the agent workflows you build.", "link": "https://developers.openai.com/codex/record-and-replay", "sources": ["The Neuron", "There's An AI For That"], "source_date": "Jun 21-22", "tags": ["ai", "tools", "building", "automation"]}, {"id": "starmer-resigns-2026-06-22", "section": "news", "headline": "UK PM Keir Starmer announced his resignation", "summary": "Standing outside 10 Downing Street this morning, Starmer said he'd told King Charles he intends to step down and will back an orderly handover. Labour lost confidence in him after a scandal tied to his former US ambassador's Epstein links and the rise of rival Andy Burnham, now the frontrunner. A successor is expected by the time Parliament returns in September - the UK's seventh PM in 10 years.", "link": "https://www.theguardian.com/politics/2026/jun/21/keir-starmer-expected-to-announce-departure-as-prime-minister-on-monday", "sources": ["Morning Brew", "The Peak"], "source_date": "Jun 22", "tags": ["world", "uk", "politics"]}, {"id": "canada-roundup-2026-06-22", "section": "news", "headline": "Around Canada: World Cup berth in reach, EV sales jumping, inflation read today", "summary": "Canada is on the verge of advancing out of the World Cup group stage for the first time ever - a win or tie against Switzerland on Wednesday does it. Higher gas prices (Iran war) and renewed federal incentives pushed EV sales up nearly 21% over last year. And May CPI lands this morning, expected to tick up on energy costs, with little the Bank of Canada can do about the cause.", "link": null, "sources": ["The Peak"], "source_date": "Jun 22", "tags": ["canada", "world-cup", "economy"]}, {"id": "lighter-side-2026-06-22", "section": "news", "headline": "Lighter side: Serena's back at Wimbledon, Toy Story 5 owns the box office", "summary": "Serena Williams (44) accepted a wild-card and will return to Wimbledon singles next week, nearly four years after stepping away, plus doubles with sister Venus. And Toy Story 5 notched the biggest opening of 2026 - $160M domestic, a franchise best - so it may be a strong matinee bet with Lily.", "link": null, "sources": ["Morning Brew", "The Peak"], "source_date": "Jun 22", "tags": ["sports", "movies", "family"]}, {"id": "training-reddit-pain-radar-2026-06-22", "section": "training", "headline": "Build an AI 'pain radar' that mines Reddit complaints into business ideas", "summary": "The Rundown's hands-on guide: wire up Codex and Airtable to scan subreddits for complaints about slow, expensive, confusing, or repetitive work, log the evidence, and generate ranked business ideas linked to the posts that support them. You describe the workflow in plain language instead of building a schema, then add a weekly automation that drafts a landing page or test for the strongest idea. Squarely your kind of build.", "link": "https://app.therundown.ai/guides/mine-reddit-complaints-into-business-ideas-with-an-ai-pain-radar", "sources": ["The Rundown"], "source_date": "Jun 22", "tags": ["training", "ai", "codex", "airtable"]}, {"id": "regulars-2026-06-22", "section": "regulars", "headline": "NYT Five Weeknight Dishes: smashed chicken meatballs and a spicy sardine pasta", "summary": "This week's lineup leans fast and punchy - smashed chicken meatballs and a spicy sardine pasta headline the five. Flagging, not summarizing (no clean non-tracking link). Also in the pile: a Lumino/Dialogue virtual-care benefits nudge, routine.", "link": null, "sources": ["NYT Cooking", "Lumino Health"], "source_date": "Jun 21", "tags": ["regulars", "cooking"]}, {"id": "deals-2026-06-22", "section": "deals", "headline": "Deals pile: Costco Treasure Hunt running to July 5, routine Tims and Joe Fresh", "summary": "Costco's Treasure Hunt warehouse-savings event is live through July 5 - the one worth a browse. Otherwise routine: Tim Hortons pushed its usual personalized app offers (incl. a $6 breakfast deal), and Joe Fresh is running 20% off that it says ends tonight. Glance only if you were already buying.", "link": "https://www.costco.ca/", "sources": ["Costco", "Tim Hortons", "Joe Fresh"], "source_date": "Jun 22", "tags": ["deals", "costco", "routine"]}, {"id": "ctc-cadence-2026-06-22", "section": "ctc", "headline": "CTC banners: Big Chek Event winding down, Father's Day pushes now lapsed", "summary": "Cadence note - SportChek's Big Chek Event is in its final stretch (the Crocs feature ran Jun 14-22; Nike at 20% off), Canadian Tire sent a car/RV/boat batteries flyer, and Mark's pushed 'last-minute' Father's Day gifts plus a spend-$125-get-$30-bonus-card door-crasher. With Father's Day now past, expect the gift-timed messaging to taper this week.", "link": "https://www.sportchek.ca/", "sources": ["SportChek", "Canadian Tire", "Mark's"], "source_date": "Jun 22", "tags": ["ctc", "sportchek", "canadian-tire", "marks"]}]}, {"build_date": "2026-06-21", "build_label": "Sunday, June 21", "entries": [{"id": "now-fathers-day-2026-06-21", "section": "now", "headline": "It's Father's Day - a couple of clothing deals lapse with it", "summary": "Sunday is Father's Day, and the timed promos are winding down: Joe Fresh's 25% off men's styles is on its last day, and SportChek's spend-$125-get-$30 weekend offer closes today (the broader Big Chek Event runs on to June 24). Nothing else this morning needs acting on before tonight.", "link": "https://www.joefresh.com/", "sources": ["Joe Fresh", "SportChek"], "source_date": "Jun 21", "tags": ["now", "deals", "fathers-day"]}, {"id": "sportchek-floating-futsal-2026-06-21", "section": "news", "headline": "SportChek built Canada's first floating futsal pitch on the Toronto waterfront", "summary": "Timed to the World Cup, your banner opened the country's first-ever floating futsal pitch on Toronto's waterfront - the kind of experiential retail stunt that earns press well beyond the cost of building it. Worth having in your back pocket as a SportChek brand-moment example when the True North 'experience' conversation comes up.", "link": "https://retail-insider.com/retail-insider/2026/06/sportchek-opens-canadas-first-ever-floating-futsal-pitch-on-toronto-waterfront/", "sources": ["Retail Insider"], "source_date": "Jun 15", "tags": ["retail", "sportchek", "ctc", "experiential"]}, {"id": "retail-intel-roundup-2026-06-21", "section": "news", "headline": "Retail intelligence pile: shoppers want AI to help but don't trust it yet, and they're craving in-store connection", "summary": "Three threads from Retail Insider's week that land in your lane. A Checkout.com report finds consumer interest in AI shopping is running ahead of both trust and merchant readiness - the gap is the opportunity. A HumanKind study says Canadians increasingly want connection and community from physical retail, not just transactions. And on the macro side, RBC says cardholder spending is holding up but momentum is easing, while the Competition Bureau has opened a probe into competition factors behind food affordability. Zellers also drew opening-day crowds to its new Toronto store - nostalgia retail is clearly still a draw.", "link": "https://retail-insider.com/retail-insider/2026/06/checkout-com-report-finds-consumer-interest-in-ai-shopping-outpacing-trust-and-merchant-readiness/", "sources": ["Retail Insider"], "source_date": "Jun 15-19", "tags": ["retail", "ai", "insights", "canada", "strategy"]}, {"id": "prediction-markets-boom-2026-06-21", "section": "news", "headline": "Prediction markets exploded into a $24B-a-month business - and almost everyone loses money", "summary": "Morning Brew did a full issue on Kalshi and Polymarket: combined monthly trading volume jumped from $4.5B last September to ~$24B this April, Kalshi's valuation doubled to $22B in six months, and the platforms now have deals with the NHL, MLB, CNN and the WSJ's parent. But the surface number hides the real one - a WSJ analysis found 67% of Polymarket's profits go to just 0.1% of accounts, the average user is down money, and the bottom 10% have lost about $4,000 each. The growth story and the player-outcomes story point in opposite directions, which is exactly the kind of split you'd pull apart for a living. Insider-trading scandals (a soldier, a Google employee, a MrBeast editor) are the recurring headache.", "link": null, "sources": ["Morning Brew"], "source_date": "Jun 21", "tags": ["data", "markets", "betting"]}, {"id": "jumper-anthropic-2026-06-21", "section": "news", "headline": "AlphaFold's Nobel-winning architect is leaving DeepMind for Anthropic", "summary": "John Jumper, who shared a Nobel for AlphaFold, announced he's leaving Google DeepMind after nine years to build at Anthropic - a notable senior-talent move in the AI race, and one to file given how much your AI stack already leans on Anthropic's models.", "link": "https://x.com/JohnJumperSci/status/2068001285173834106", "sources": ["There's An AI For That"], "source_date": "Jun 20", "tags": ["ai", "anthropic", "deepmind"]}, {"id": "ai-building-bits-2026-06-21", "section": "news", "headline": "Three building-relevant AI drops: Claude Code ships shareable pages, agents that learn overnight, and throwaway agent logins", "summary": "Directly useful for the stuff you build: Claude Code can now publish a session as a live, shareable page (a PR walkthrough or a self-filling dashboard) so people check a link instead of asking for status. Perplexity gave its agents a 'self-improving memory' that reviews each session overnight and starts the next day's tasks faster. And Cloudflare now lets a coding agent spin up a throwaway account, ship a live Worker for 60 minutes, and hand you a claim link - killing the signup wall that used to stall background agents. Also notable on the governance side: NVIDIA's open-source SkillSpector scans agent skills for prompt injection and malicious code before you install them.", "link": "https://claude.com/blog/artifacts-in-claude-code", "sources": ["There's An AI For That"], "source_date": "Jun 20", "tags": ["ai", "tools", "agents", "building"]}, {"id": "cochrane-local-2026-06-21", "section": "news", "headline": "Around Cochrane: charges laid after a worker died in a fall, plus a music-education push", "summary": "From CochraneNow's weekend edition: an employer and supervisor are facing charges over alleged safety lapses after a worker was killed in a fall - the serious item in the pile. Lighter side: a local story on growing music education in town, and the Cochrane Rage notched a decisive win over the Spurs.", "link": "https://cochranenow.com/articles/employer-supervisor-accused-of-safety-lapses-after-worker-killed-in-fall", "sources": ["CochraneNow"], "source_date": "Jun 20", "tags": ["local", "cochrane"]}, {"id": "wirecutter-camping-crossover-2026-06-21", "section": "regulars", "headline": "NYT Wirecutter: camping gear that earns its keep the other 51 weekends a year", "summary": "This issue makes the case for camping kit you'll actually use at home: hiking shoes as everyday walkers, headlamps for night grilling and DIY, multitools and carabiners for everyday carry, and a packable chair small enough to live in a tote. There's also a fresh best-tents roundup if real camping is on the summer list. Body skimmed; no clean non-tracking link, so no link attached.", "link": null, "sources": ["NYT Wirecutter"], "source_date": "Jun 21", "tags": ["wirecutter", "shopping", "outdoors"]}, {"id": "deals-thin-2026-06-21", "section": "deals", "headline": "Deals pile is thin today: Father's Day promos closing, routine Skip and Tims offers", "summary": "Not much new beyond the Father's Day clothing deals up top. Skip and Tim Hortons both pushed their usual personalized points/savings offers - routine, nothing standout. Worth a glance only if you were already planning to order.", "link": null, "sources": ["Skip", "Tim Hortons", "Joe Fresh"], "source_date": "Jun 21", "tags": ["deals", "routine"]}, {"id": "ctc-cadence-2026-06-21", "section": "ctc", "headline": "CTC banners: Canadian Tire mailing daily, with a couple of real offers running", "summary": "Cadence note - Canadian Tire sent three flyer blasts in a day (Braun small appliances, a pools/spas/trampolines push, and a Rain-X feature). The offers actually worth acting on: SportChek's Big Chek Event has Nike at 20% off (event runs to June 24), and Mark's is running a spend-$125-get-a-$30-bonus-card door-crasher. The Triangle spend-$200-collect-$10-bonus-CT-Money offer from the weekend is valid to June 25.", "link": "https://www.canadiantire.ca/", "sources": ["Canadian Tire", "SportChek", "Mark's"], "source_date": "Jun 21", "tags": ["ctc", "canadian-tire", "sportchek", "marks"]}]}, {"build_date": "2026-06-20", "build_label": "Saturday, June 20", "entries": [{"id": "now-sportchek-weekend-2026-06-20", "section": "now", "headline": "Last day for the SportChek $30 weekend offer - and it's a golf push", "summary": "If you've had your eye on golf gear, the spend-$125-get-a-$30-promo-card weekend deal closes Sunday (the broader Big Chek Event runs to June 24). Separately, the Triangle spend-$200-collect-$10-bonus-CT-Money offer is valid through June 25. Nothing else urgent in the pile this morning.", "link": "https://www.sportchek.ca/", "sources": ["SportChek", "Canadian Tire"], "source_date": "Jun 20", "tags": ["now", "ctc", "sportchek", "golf", "deals"]}, {"id": "tim-hortons-pricing-2026-06-20", "section": "news", "headline": "A court case cracks open how Tim Hortons actually sets its prices", "summary": "A Montreal lawsuit by 15 Quebec franchisees (suing for $27M) forced Tim Hortons to reveal its pricing machinery in a court filing, and it's a clinic in dynamic retail pricing. The chain splits Canada into 62 'price clusters' and constantly re-prices each one against local competition, labour costs, income, and foot traffic - testing prices four times a year, set as high as it can go before customers walk to McDonald's. It also confirmed Tims Rewards became 'self-funded' within a year of its 2019 launch via price hikes and trimmed perks (loyal members are effectively paying for their own rewards). Franchisee margins run ~9-14%, short of the 15% they want but well above the industry, where 36% of restaurants are losing money or breaking even. Directly in your wheelhouse - this is the surface-vs-real-numbers read you do for a living.", "link": "https://www.nytimes.com/international/section/world/canada", "sources": ["NYT Canada Letter"], "source_date": "Jun 20", "tags": ["retail", "pricing", "loyalty", "canada", "strategy"]}, {"id": "sphinx-enterprise-ai-2026-06-20", "section": "news", "headline": "A startup is selling enterprises an 'accuracy layer' that sits between their AI and their data", "summary": "Sphinx.ai (seed-stage, backed by Lightspeed and Bessemer) just shipped Sphinx 2.0, which filters every AI query through an institutional-knowledge layer instead of trying to clean a company's data first - 'getting your AI ready for your data,' rather than the reverse. It monitors outputs, catches answers that drift from reality, and flags discrepancies for human review when what the model says disagrees with what the business already believes. The pitch names the exact problem you wrestle with: models reason fine on public knowledge but miss the 'tribal knowledge' of how an org actually works, and bolting raw data straight into AI sacrifices governance and observability. Worth tracking as enterprise AI accuracy/governance keeps maturing.", "link": "https://archive.thedeepview.com/p/how-sphinx-built-an-enterprise-ai-accuracy-layer", "sources": ["The Deep View"], "source_date": "Jun 20", "tags": ["ai", "enterprise", "governance", "data"]}, {"id": "iran-talks-delayed-2026-06-20", "section": "news", "headline": "The US-Iran peace deal wobbles: nuclear talks postponed as Lebanon flares", "summary": "A week after the war officially ended, the follow-up talks hit a snag. VP JD Vance postponed a Switzerland trip for nuclear negotiations (slated to start Friday) after Iran insisted Israel's strikes on Hezbollah in Lebanon stop first. It escalated overnight - a Hezbollah drone attack killed four Israeli soldiers and Israel hit back with 150+ strikes - before US officials said the Israel-Hezbollah ceasefire was back on. A reminder that the deal you flagged as 'done' last week is still fragile at the edges.", "link": null, "sources": ["Morning Brew"], "source_date": "Jun 20", "tags": ["world", "iran", "middle-east"]}, {"id": "amazon-altman-movie-2026-06-20", "section": "news", "headline": "Amazon is dumping its own Sam Altman biopic - months after a $50B OpenAI deal", "summary": "Amazon MGM has dropped 'Artificial,' Luca Guadagnino's nearly-finished film with Andrew Garfield as Altman (covering OpenAI's chaotic 2023 firing), and is shopping it to other studios. Studios rarely offload their own prestige films, so the timing raised eyebrows: it lands months after Amazon agreed to invest $50B in OpenAI. Make of that what you will - a drama kid's read is that the more interesting story might be why they're letting it go.", "link": "https://deadline.com/2026/06/luca-guadagnino-artificial-amazon-jeff-bezos-1236962694/", "sources": ["Morning Brew", "There's An AI For That"], "source_date": "Jun 20", "tags": ["ai", "openai", "hollywood"]}, {"id": "pinterest-ask-2026-06-20", "section": "news", "headline": "Pinterest is retiring the keyword search bar for a conversational 'Ask Pinterest'", "summary": "At Cannes, Pinterest leaned into taste-over-keywords: Ask Pinterest turns shopping into a conversation, and a new Business Assistant plus an MCP layer pipe the platform's taste-and-intent signals straight into advertisers' tools. The retail-strategy angle worth noting - it's another big consumer platform betting that intent signals delivered via AI agents (and MCP specifically) are the product advertisers will actually pay for.", "link": "https://newsroom.pinterest.com/news/cannes-2026/", "sources": ["There's An AI For That"], "source_date": "Jun 20", "tags": ["ai", "retail", "marketing", "mcp"]}, {"id": "ai-quick-hits-2026-06-20", "section": "news", "headline": "Two AI bits worth a glance: Codex learns by watching, Claude drives a robodog", "summary": "Building-relevant: OpenAI's Codex now does 'record and replay' - record yourself doing a task on your Mac (filing an expense, pulling a report) and it packages the demo into a reusable skill it runs later with new inputs. And for the highlight reel: Anthropic's Project Fetch phase two had Claude set up and drive a robot dog solo, 20x faster than the humans who wrestled with it last year.", "link": "https://developers.openai.com/codex/record-and-replay", "sources": ["There's An AI For That"], "source_date": "Jun 20", "tags": ["ai", "openai", "anthropic", "tools"]}, {"id": "pew-dual-income-2026-06-20", "section": "news", "headline": "For the first time, most US two-parent households have both parents working full-time", "summary": "A new Pew report finds 52% of two-parent US households now have mom and dad both on full-time paychecks - up from 46% a decade ago and 31% in 1975, driven largely by women out-earning men in college degrees. The texture is familiar to any working parent: 70% handle parenting tasks during work hours, 59% do work tasks while with their kids, and 54% call the balance hard. Only 24% say they have 'a lot' of telework flexibility, and most who don't say it would help a lot. A clean data story - the kind where the headline number hides the real one (degree attainment) underneath.", "link": "https://www.pewresearch.org/social-trends/", "sources": ["Morning Brew"], "source_date": "Jun 20", "tags": ["data", "work", "family"]}, {"id": "world-cup-update-2026-06-20", "section": "news", "headline": "World Cup roundup: US advances, Canada's next test is Switzerland, and the host country goes viral", "summary": "The US men beat Australia 2-0 to reach the knockout stage; Canada (fresh off Thursday's 6-0 rout of Qatar) faces Switzerland next. The lighter side: foreign fans are going viral marvelling at everyday Americana - Buc-ee's, Waffle House, ranch dip (the TSA had to ask travellers to check oversized ranch bottles) - and Boston signed a sister-city letter with Glasgow amid the kilted 'Tartan Army.' Hotel gouging is easing too, with the steepest nightly-rate drops in Vancouver and Monterrey.", "link": null, "sources": ["Morning Brew", "NYT Canada Letter"], "source_date": "Jun 20", "tags": ["sports", "world-cup", "canada"]}, {"id": "cochrane-local-2026-06-20", "section": "news", "headline": "Around Cochrane: 5 weekend events, an RCMP K9 hurt in a robbery, and pushback on Alberta's $100 rebate", "summary": "From CochraneNow's Friday roundup: there's a 5-events weekend guide (plus an Indigenous Peoples Day celebration Sunday - both good Lily-friendly options), an RCMP police dog was injured in an armed robbery, and the town logged another $100K lottery winner. On the policy side, MLA Guthrie, the NDP and taxpayer advocates are all knocking Alberta's one-time $100 energy rebate - relevant to the energy-tracking you do at home - and the province plans to launch a dual-practice surgery model in September.", "link": "https://cochranenow.com/articles/looking-for-something-to-do-in-cochrane-this-weekend-here-are-5-great-events-to-check-out", "sources": ["CochraneNow"], "source_date": "Jun 19", "tags": ["local", "cochrane", "alberta", "energy"]}, {"id": "wirecutter-summer-2026-06-20", "section": "regulars", "headline": "NYT Wirecutter: hot-weather picks - antiperspirants, a packable grill, and a neck fan", "summary": "Wirecutter's summer-heat run: the best antiperspirants for scorching days, a grill you can take (almost) anywhere, an itty-bitty camping chair, and an on-sale neck fan they're calling genuinely fun. Bodies skimmed. The packable grill could be worth a look heading into patio/camping season.", "link": "https://www.nytimes.com/wirecutter", "sources": ["NYT Wirecutter"], "source_date": "Jun 20", "tags": ["wirecutter", "shopping", "summer"]}, {"id": "sports-pile-2026-06-20", "section": "regulars", "headline": "Also in the sports pile: the Knicks win their first NBA title in 53 years", "summary": "New York secured its first NBA championship since 1972 and heads into an offseason full of questions. Also kicking around the inbox: a profile of the Packers' history-making punter. Flag-only - bodies not read.", "link": null, "sources": ["Sports newsletters"], "source_date": "Jun 19", "tags": ["sports", "nba"]}, {"id": "deals-weekend-2026-06-20", "section": "deals", "headline": "Weekend deals: Costco Frame TV $300 off, a Nespresso accessory sale, and Joe Fresh 20% off", "summary": "Routine weekly cycles: Costco's What's New has a Samsung 65\" Frame QLED for $300 off (plus Philips shaver and online essentials), Nespresso has accessories and milk frothers from $9 and is throwing in a free limited-edition cooler bag with 140 Original capsules, and Joe Fresh is running a Stampede-themed 20% off. Family note: Toy Story 5 is now in theatres if you're after a Lily outing.", "link": "https://www.costco.ca/", "sources": ["Costco", "Nespresso", "Joe Fresh", "Cineplex"], "source_date": "Jun 20", "tags": ["deals", "shopping", "family"]}, {"id": "ctc-cadence-2026-06-20", "section": "ctc", "headline": "CTC banners: relentless flyer cadence into the weekend, with a couple of real offers", "summary": "Cadence note - your banners are still mailing daily. The two worth acting on: Triangle's spend-$200-collect-$10-bonus-CT-Money (valid to June 25) and up to 40% off power tools and camping gear at Canadian Tire. The SportChek Big Chek Event and Mark's spend-$125-get-$30 bonus card both run on (Big Chek to June 24). Canadian Tire is also peppering in product-review and Q&A requests off recent purchases (a patio chair, lawn weed killer). Nothing beyond the weekend SportChek deadline is time-sensitive.", "link": "https://www.canadiantire.ca/", "sources": ["Canadian Tire", "SportChek", "Mark's"], "source_date": "Jun 20", "tags": ["ctc", "canadian-tire", "sportchek", "marks"]}]}, {"build_date": "2026-06-19", "build_label": "Friday, June 19", "entries": [{"id": "now-iran-war-over-2026-06-19", "section": "now", "headline": "It's official: the US-Iran war is over and the Strait of Hormuz has reopened", "summary": "Both presidents signed the peace agreement ending the nearly four-month conflict, reopening the Strait of Hormuz for oil shipments and lifting sanctions on Tehran. Markets reacted fast - oil fell to its lowest level since before the war, and Canada's index slid a second straight session. One local upside: Alberta is sending one-time $100 cheques to roughly 3.4 million residents (household income under $225K) on the back of the oil-revenue surge.", "link": "https://apnews.com/article/iran-us-israel-war-oil-deal-june-17-2026-19652f4611b704c0a991bf1f5bc9a4b9", "sources": ["Read The Peak"], "source_date": "Jun 19", "tags": ["now", "world", "oil", "alberta"]}, {"id": "now-sportchek-golf-2026-06-19", "section": "now", "headline": "SportChek: spend $125 by Sunday, get a $30 card - and it's a golf push", "summary": "The Big Chek Event is leaning into Father's Day golf. The weekend offer (spend $124.95 before tax, June 18-21) gets you a $30 promo card or online code, emailed/redeemable in July. Worth timing if you've had your eye on golf gear anyway - the weekend window closes Sunday, though the broader Big Chek Event runs to June 24 with a separate spend-$250-get-$10 deal valid to June 25.", "link": "https://www.sportchek.ca/", "sources": ["SportChek"], "source_date": "Jun 19", "tags": ["now", "ctc", "sportchek", "golf", "deals"]}, {"id": "canada-world-cup-2026-06-19", "section": "news", "headline": "Canada wins its first-ever men's World Cup match, thumping Qatar 6-0", "summary": "On home soil, Canada secured its first men's World Cup win in style, with Jonathan David scoring a hat trick - the first player from a host nation to do so since 1966. One sour note: starting midfielder Ismael Kone left with a worrying injury. A genuinely good morning for Canadian soccer.", "link": "https://www.tsn.ca/soccer/fifa-world-cup/article/canada-earns-first-ever-world-cup-win-with-rout-of-qatar-jump-to-top-of-group-b/", "sources": ["Read The Peak"], "source_date": "Jun 19", "tags": ["canada", "sports", "world-cup"]}, {"id": "pwc-ai-jobs-2026-06-19", "section": "news", "headline": "PwC: companies that use AI to amplify workers are outgrowing those that automate them away", "summary": "PwC's 2026 AI Jobs Barometer found firms using AI to augment expert workers (a 'force multiplier') are seeing more headcount and wage growth than those replacing staff with automation. AI-exposed companies grew headcount 52% vs 36%, and demand for AI skills is rising 8x faster than for non-AI roles. The catch for the bottom of the ladder: entry-level postings dropped 10% since 2019 while 'seniorized' roles needing judgment and leadership grew 35%. Squarely on-thesis for your AI-fluency-as-complement-to-data-skills bet - the returns are going to the people who pair domain expertise with AI, not the ones who treat it as a headcount cut.", "link": "https://www.thedeepview.com/articles/why-tech-companies-jumped-the-gun-on-ai-layoffs", "sources": ["The Deep View"], "source_date": "Jun 19", "tags": ["ai", "work", "data", "strategy"]}, {"id": "shazeer-openai-2026-06-19", "section": "news", "headline": "OpenAI poaches Noam Shazeer, a 'transformer' co-author, from Google", "summary": "Shazeer - co-author of the 2017 'Attention Is All You Need' paper that underpins nearly every modern chatbot, and a Gemini co-lead - is leaving Google for OpenAI, less than two years after Google reportedly paid $2.7B to bring him back via Character AI. Sam Altman called it a hire he'd wanted since OpenAI's founding. With Gemini 3.5 Pro's rumoured June launch gone quiet, some read his exit as a sign of uncertainty inside Google's model team. Where top researchers move is always a signal, and lately it's been OpenAI or Anthropic.", "link": "https://www.cnbc.com/2026/06/18/google-gemini-co-lead-noam-shazeer-leaves-for-openai.html", "sources": ["The Rundown AI", "The Neuron", "AI Daily Brief", "The Deep View"], "source_date": "Jun 19", "tags": ["ai", "openai", "google", "talent"]}, {"id": "fable-replacements-2026-06-19", "section": "news", "headline": "A week into the Fable shutdown, builders are MacGyvering replacements - and routing is the new edge", "summary": "With Fable 5 offline (Anthropic says it's 'very confident' Fable and Mythos return 'in the coming days'), the builder community has shifted from mourning to engineering around it. The emerging lesson isn't one model winning - it's smart routing beating brute force: open models like ZAI's GLM 5.2 (claimed to build a comparable landing page for 6 cents vs Opus's 49), OpenRouter's 'Fusion' panels that fan a prompt across several models and synthesize the best answer (within 1% of Fable at half the cost), and enterprise setups (Harvey) pairing a cheap open worker model with a frontier 'advisor' for high-stakes steps. Relevant to your multi-agent work: the competitive layer is moving from 'which model' to 'how you orchestrate them.'", "link": "https://aidailybrief.beehiiv.com/p/the-models-trying-to-replace-fable", "sources": ["AI Daily Brief", "The Rundown AI", "The Neuron"], "source_date": "Jun 19", "tags": ["ai", "anthropic", "models", "routing"]}, {"id": "microsoft-deepseek-cowork-2026-06-19", "section": "news", "headline": "Microsoft is reportedly weighing a Chinese model (DeepSeek) to power Copilot CoWork", "summary": "Axios reports Microsoft is considering a locally hosted fine-tune of DeepSeek V4 for Copilot CoWork, driven by CoWork's shift to usage-based pricing and the pressure to cut per-token costs. The irony is sharp: Washington banned Anthropic's Fable and Mythos over national-security concerns about model weights, while the most embedded enterprise software company on earth quietly ships a Chinese model inside the productivity stack of much of the Fortune 500. Worth tracking given Copilot is part of your day-to-day toolset.", "link": "https://www.axios.com/2026/06/16/microsoft-copilot-cowork-tokenmaxxing-cowork", "sources": ["AI Daily Brief"], "source_date": "Jun 19", "tags": ["ai", "microsoft", "copilot", "enterprise"]}, {"id": "openai-health-2026-06-19", "section": "news", "headline": "OpenAI leans into health: a reasoning model helped confirm 18 rare-disease diagnoses", "summary": "An NEJM AI study (Boston Children's, Harvard, OpenAI) re-ran 376 de-identified, previously unsolved pediatric cases through an o3 reasoning model; doctors confirmed 18 new diagnoses after expert review and testing. Separately, OpenAI says GPT-5.5 Instant now gives stronger health answers to free users, with 230M+ people asking ChatGPT health questions weekly. The useful framing: AI as a tireless 'second reader' that surfaces evidence-linked leads, not the doctor of record - the risk is people treating a calm, confident answer as a reason to skip care.", "link": "https://openai.com/index/diagnose-rare-childhood-diseases/", "sources": ["The Neuron", "The Rundown AI"], "source_date": "Jun 19", "tags": ["ai", "health", "openai"]}, {"id": "apple-iphone-ramageddon-2026-06-19", "section": "news", "headline": "Brace for a pricier iPhone: AI's appetite for memory chips is pushing device prices up", "summary": "Outgoing Apple CEO Tim Cook called price increases 'unavoidable,' blaming a 'hundred-year flood' in memory and storage chip costs driven by AI data centres. A WSJ analysis figures the next iPhone Pro could jump ~US$200 (to ~$1,830 CAD), and camera upgrades could push it near $2,000 CAD. Memory prices have quadrupled in a year - dubbed 'RAMageddon' - and it threatens phones, laptops, and consoles broadly. Practical takeaway: if you need a new phone or laptop, buying before the next release cycle may save you real money.", "link": "https://www.wsj.com/tech/apple-price-increases-memory-supply-199845b1", "sources": ["Read The Peak", "The Neuron"], "source_date": "Jun 19", "tags": ["tech", "apple", "prices", "ai-infrastructure"]}, {"id": "wealthsimple-predict-2026-06-19", "section": "news", "headline": "Wealthsimple is launching Canada's first prediction-markets app", "summary": "Wealthsimple Predict (in partnership with US-based Kalshi) will offer real-world event trading legally in Canada for the first time - roughly 4,000 markets, open to non-customers too. Regulators have only cleared economic, climate, and financial-market contracts so far; the popular politics and sports markets stay banned. Context: Kalshi's volume more than tripled to US$178B in six months. The 'yes, but': even benign markets like inflation prints can invite insider trading.", "link": "https://www.cbc.ca/news/business/prediction-markets-wealthsimple-9.7239575", "sources": ["Read The Peak"], "source_date": "Jun 19", "tags": ["canada", "fintech", "markets"]}, {"id": "snap-specs-2026-06-19", "section": "news", "headline": "Snap's $2,195 Specs are a real AR step forward - but an early-adopter buy, not a must-have", "summary": "After hands-on time, The Deep View's read: Snap Specs are chunkier than Meta Ray-Bans but do true AR (anchoring virtual objects like a 115-inch cinema screen into your space), and they're lighter and untethered compared with an Apple Vision Pro. At 132-136g they're session-based, not all-day, and at US$2,195 they're aimed at developers and enthusiasts. The longer arc that matters: AI assistance overlaid on your real environment with spatial awareness - an early step toward glasses that could eventually replace the phone.", "link": "https://www.thedeepview.com/articles/snap-specs-are-a-breakthrough-step-not-a-must-buy", "sources": ["The Deep View"], "source_date": "Jun 19", "tags": ["tech", "ar", "snap", "hardware"]}, {"id": "databricks-open-moat-2026-06-19", "section": "news", "headline": "Databricks bets that 'open' is the moat - shipping an open-source agent stack ahead of its IPO", "summary": "At its Data + AI Summit, Databricks (valued at $134B, IPO-bound, used by 60%+ of the Fortune 500) doubled down on openness: OpenSharing to move AI models/agents/skills across clouds without lock-in, an open-source 'meta-harness' called Omnigent to manage your other agents, and DBRX, an open LLM it claims tops other open models at launch. The strategic question worth sitting with: as every vendor ships its own siloed agent framework, does interoperability become the thing enterprises actually pay for? Directly relevant to your analytics-platform and multi-agent work.", "link": "https://www.thedeepview.com/articles/how-databricks-turned-openness-into-an-ai-moat", "sources": ["The Deep View", "The Rundown AI"], "source_date": "Jun 19", "tags": ["ai", "enterprise", "databricks", "data"]}, {"id": "empire-discount-grocery-2026-06-19", "section": "news", "headline": "Empire is going all-in on discount grocery as Canadians chase cheaper food", "summary": "Sobeys parent Empire (FY2026 sales: $31.95B) plans about 70 new stores over three years, more than three-quarters of them discount banners, plus roughly 15 new FreshCo locations across Western Canada, Ontario, and Atlantic Canada in FY2027. It follows the company's Mayrand acquisition in Quebec. The clear read for your world: the value/discount tier is where the grocery growth and capital are going, and the big banners are repositioning around it.", "link": "https://ca.finance.yahoo.com/news/empire-reports-q4-profit-revenue-112243904.html", "sources": ["Read The Peak", "Retail Insider"], "source_date": "Jun 19", "tags": ["retail", "grocery", "canada", "strategy"]}, {"id": "zellers-toronto-2026-06-19", "section": "news", "headline": "Zellers drew opening-day crowds at a new standalone Toronto store", "summary": "Retail Insider visited Zellers' new Toronto location on opening day and found strong turnout, value-focused merchandise, nostalgic touches, and a modern standalone format (a departure from the store-within-Hudson's-Bay model). Also in the Canadian retail pile: No Frills opened its 200th Ontario store, Le Creuset is opening its 13th Canadian store at Park Royal in West Vancouver, and an RBC report shows cardholder spending holding up but momentum easing.", "link": "https://retail-insider.com/", "sources": ["Retail Insider"], "source_date": "Jun 19", "tags": ["retail", "canada", "zellers"]}, {"id": "tokens-101-2026-06-19", "section": "news", "headline": "A plain-language primer on 'tokens' - the meter running behind every AI chat", "summary": "A clear explainer worth five minutes if you want the mental model under AI costs. A token is roughly a chunk of a word (about 100 tokens per 75 English words); the model re-reads the whole conversation every turn, which is why long chats slow down, drift vague, and burn through limits - and why uploaded images/files are token-heavy. The author's honest take: most token 'optimization' advice is built for people running API bills. For everyday chat use, two habits do the work - start a fresh chat when the topic changes, and ask for a short answer when you don't need a long one.", "link": "https://newsletter.stayingahead.com/p/tokens-101", "sources": ["Staying Ahead"], "source_date": "Jun 19", "tags": ["ai", "literacy", "explainer"]}, {"id": "cochrane-local-2026-06-19", "section": "news", "headline": "Around Cochrane: a CochraneNow Cup win, best summer fishing spots, and treaty chiefs vs the province", "summary": "From CochraneNow's Friday roundup: the Cochrane Lions won the CochraneNow Cup; a National Fishing Day piece maps the best fishing spots near town for the summer (handy for a Lily-friendly outing); Alberta treaty chiefs are calling for a treason investigation into Premier Smith and the UCP; and community spirit carried a rainy Footstock. Also: public access to SR1 land stays closed for now.", "link": "https://cochranenow.com/articles/national-fishing-day-the-best-fishing-spots-near-cochrane-this-summer", "sources": ["CochraneNow"], "source_date": "Jun 18", "tags": ["local", "cochrane", "alberta"]}, {"id": "training-gemini-meeting-prep-2026-06-19", "section": "training", "headline": "AI Training: auto-generate meeting prep with Google Workspace Studio + Gemini", "summary": "The Rundown's walkthrough builds a flow that turns every upcoming meeting into an auto-created prep brief - genuinely useful given how much of your week is meetings. Steps: (1) in Google Workspace Studio, create a new flow 'Based on a meeting'; (2) set the trigger to fire 10-15 min before the meeting; (3) add an 'Ask Gemini' step to write a short brief (context, open loops, suggested agenda, questions to ask); (4) add 'Create a doc' using the meeting title + 'Meeting Prep' for the name and the Gemini output for the body; (5) add 'Block time' and drop the doc link into the calendar block's description; (6) test with a fake calendar event before turning it on. Going further: start with one recurring meeting type, then expand to client calls and exec reviews.", "link": "https://app.therundown.ai/guides/save-hours-on-meeting-prep-with-this-automated-google-gemini-setup", "sources": ["The Rundown AI"], "source_date": "Jun 19", "tags": ["training", "google-gemini", "workflow"]}, {"id": "nyt-well-2026-06-19", "section": "regulars", "headline": "NYT Well: host a '90s-style, phone-free hangout", "summary": "Week 3 of Well's monthlong summer challenge: make plans with someone you want to see and leave the phones away, citing research that phones make shared time feel less connected. Body skimmed. Also in the pile: a piece on whether glutathione is worth it as a supplement, the women left out of menopause hormone therapy, a 32-mile Manhattan running loop, new options to cover long-term care, and 'triggered' vs just upset.", "link": "https://www.nytimes.com/section/well", "sources": ["NYT Well"], "source_date": "Jun 18", "tags": ["wellness", "nyt"]}, {"id": "wirecutter-tanks-2026-06-19", "section": "regulars", "headline": "NYT Wirecutter: 8 favourite tank tops (and a Nutribullet on sale)", "summary": "The Recommendation's summer picks after testing 25 tanks - winners include a ribbed racerback under $10 - plus minimalist '90s-style sandals. Body skimmed. Also flagged: the best popsicle molds (they made ~300 ice pops testing them - could be a fun Lily project), the cult Wamsutta pillows are back, their favourite room fan, and a Nutribullet personal blender on sale today.", "link": "https://www.nytimes.com/wirecutter", "sources": ["NYT Wirecutter"], "source_date": "Jun 18", "tags": ["wirecutter", "shopping"]}, {"id": "deals-ikea-joe-fresh-2026-06-19", "section": "deals", "headline": "New this week: IKEA Family summer event and a 4-day Joe Fresh sale", "summary": "IKEA is running a summer points event with extra for IKEA Family members, and Joe Fresh has a four-days-only sale on (women's, men's, kids', baby). Both routine seasonal pushes - flag-worthy only if you were already planning a shop. The weekend grocery and Father's Day flyers (Safeway's spend-$125-get-1,000-points to June 24, Costco's Father's Day offers, Nespresso's free cooler bag) are still running from earlier in the week.", "link": "https://www.ikea.com/ca/en/", "sources": ["IKEA", "Joe Fresh", "Safeway", "Costco"], "source_date": "Jun 19", "tags": ["deals", "shopping"]}, {"id": "ctc-fathers-day-2026-06-19", "section": "ctc", "headline": "CTC banners: a loud Father's Day weekend - SportChek golf, Mark's $30 bonus, and steady Canadian Tire flyers", "summary": "Cadence note - your banners are mailing hard into the Father's Day weekend. SportChek is pushing golf with the spend-$125-get-$30 weekend offer (June 18-21, see the top bar); Mark's This. Is. Big. Event has a spend-$125-get-$30 bonus card with Columbia clothing discounted. Canadian Tire kept up its usual flyer drumbeat (Bissell vacuums, OFF! repellent, a members-only bonus CT Money day) and is also sending product-review and Q&A requests off recent purchases. Nothing urgent beyond the SportChek weekend deadline.", "link": "https://www.marks.com/", "sources": ["SportChek", "Mark's", "Canadian Tire"], "source_date": "Jun 19", "tags": ["ctc", "sportchek", "marks", "canadian-tire"]}]}, {"build_date": "2026-06-18", "build_label": "Thursday, June 18", "entries": [{"id": "now-ct-30x-2026-06-18", "section": "now", "headline": "Today only: 30x CT Money at Canadian Tire", "summary": "Canadian Tire is running a one-day 30x Total CT Money event on June 18. Worth timing a planned purchase to today rather than tomorrow if you've got something in the cart.", "link": "https://www.canadiantire.ca/", "sources": ["Canadian Tire"], "source_date": "Jun 18", "tags": ["ctc", "deals", "now"]}, {"id": "ai-governance-g7-equity-2026-06-18", "section": "news", "headline": "At the G7, AI leaders push a US-led coalition - while Washington quietly weighs taking equity in AI companies", "summary": "Two threads converged this week. At the G7 in France, Anthropic's Dario Amodei and Google DeepMind's Demis Hassabis (backed by Sam Altman and PM Mark Carney) called for a US-led international coalition to set rules on model access, chip exports, and safety - this against the backdrop of the ongoing standoff over Washington's export restrictions that took Anthropic's top models (Mythos 5 and Fable 5) offline. Separately, Semafor reported senior Trump officials had discussed the government taking equity stakes in major AI firms - via 'Trump Accounts' or a sovereign wealth fund - before the export fight. The shift worth noting: Washington is moving from regulating AI to negotiating leverage and ownership over it. Macron and Modi both warned that a US 'off switch' on frontier models is a risk for everyone.", "link": "https://www.semafor.com/article/06/17/2026/trump-advisers-weigh-structure-of-potential-ai-stakes", "sources": ["The Rundown AI", "The Deep View", "The Neuron"], "source_date": "Jun 18", "tags": ["ai", "policy", "anthropic", "g7"]}, {"id": "databricks-genie-2026-06-18", "section": "news", "headline": "Databricks pitches 'open ecosystems' as the fix for enterprise agent sprawl", "summary": "At its Data + AI Summit, Databricks CEO Ali Ghodsi called the current state of enterprise AI a 'complete mess' - every SaaS vendor now ships its own agent, builder, and MCP server, creating lock-in and cross-platform chaos on top of the cost overruns and data-leakage problems agents already cause. Databricks' answer is its own agent suite, Genie (One, Ontology, App Builder, Agent, Code), but its real bet is openness: customers say they value not being trapped. Directly relevant to your multi-agent and SharePoint-grounded work - this is the lock-in-vs-open debate playing out at the platform level.", "link": "https://www.thedeepview.com/articles/why-databricks-may-have-answer-for-agent-chaos", "sources": ["The Deep View"], "source_date": "Jun 18", "tags": ["ai", "enterprise", "databricks", "strategy"]}, {"id": "pew-ai-2026-2026-06-18", "section": "news", "headline": "Pew: half of US adults now use AI chatbots, but trust keeps sliding", "summary": "Pew's 2026 survey of 5,000+ US adults shows adoption and optimism running in opposite directions. About half now use a chatbot (a quarter daily), up from a third in 2024 - yet nearly 40% expect AI to make society worse over 20 years and just 16% expect better. The under-30 group leans on AI hardest but trusts it least. On platform share: ChatGPT 44%, Gemini 24%, Claude just 6% - a reminder that Anthropic dominates industry chatter while barely registering with the average American.", "link": "https://www.pewresearch.org/internet/2026/06/17/americans-and-ai-2026-chatbots-smart-devices-and-views-on-impact/", "sources": ["The Rundown AI", "The Neuron"], "source_date": "Jun 18", "tags": ["ai", "data", "adoption"]}, {"id": "claude-code-expertise-2026-06-18", "section": "news", "headline": "Anthropic study: your domain expertise matters more than your coding skill when working with AI", "summary": "Anthropic analyzed 400K Claude Code sessions and found a user's expertise in their own field drives success more than general coding ability. Users made ~70% of planning decisions; Claude handled ~80% of execution. Experts pulled far more out of each prompt (12 actions / 3,200 words vs a beginner's 5 actions / 600 words), and lawyers, managers, and scientists with no coding title nearly matched software engineers on coding tasks. The throughline for your AI-fluency-as-complement-to-data-skills thesis: the value of agents is capped less by the model than by how well the user understands the actual job.", "link": "https://www.anthropic.com/research/claude-code-expertise", "sources": ["The Rundown AI"], "source_date": "Jun 18", "tags": ["ai", "research", "skills", "work"]}, {"id": "review-code-by-risk-2026-06-18", "section": "news", "headline": "A useful mental model: review AI-written code by risk, not by size", "summary": "Ramp's head of applied AI, Rahul Sengottuvelu, argues a 12-line change to login code can be more dangerous than a 1,200-line settings-page change. The rule: classify changes as high risk (auth, payments, data access, PII), medium (business logic), or low (UI, plumbing), then keep high-risk diffs small enough for line-by-line human review while verifying low-risk ones with tests, feature flags, or shadow mode. The forward-looking workflow Anthropic's Boris Cherny added: model + verifier in a loop - but with humans flagging what to inspect, not the AI approving its own work. A clean governance pattern as you scale agent workflows.", "link": "https://x.com/rahulgs/status/2067257255825686880", "sources": ["The Neuron"], "source_date": "Jun 18", "tags": ["ai", "workflow", "governance"]}, {"id": "midjourney-medical-2026-06-18", "section": "news", "headline": "Midjourney pivots into medical imaging with a 60-second full-body scanner", "summary": "The AI image company introduced Midjourney Medical and the Midjourney Scanner - a full-body ultrasound that fires millions of sound waves through water to build a detailed internal scan in about 60 seconds. The first 'Midjourney Spa' is planned for San Francisco in 2027, with a long-term goal of 50,000 scanners worldwide. Odd, ambitious, and a sign of how far AI-native companies are wandering from their lanes.", "link": "https://www.midjourney.com/medical/blogpost", "sources": ["The Neuron"], "source_date": "Jun 18", "tags": ["ai", "health", "hardware"]}, {"id": "allbirds-smartbird-2026-06-18", "section": "news", "headline": "Allbirds finishes its pivot, rebranding as 'Smartbird' and selling off the shoe business", "summary": "The sneaker brand once favoured by tech workers completed its turn into an AI infrastructure company, rebranding as Smartbird Inc. (after an April stint as NewBird AI) and naming former Danish AI-infrastructure exec Nadia Carlsten CEO. Its footwear assets are sold and gone; the stock jumped 39%. A small, strange marker of how hard companies are willing to chase the AI label.", "link": "https://www.reuters.com/business/retail-consumer/allbirds-rebrands-smartbird-ai-pivot-hires-former-aws-executive-ceo-2026-06-17/", "sources": ["Morning Brew", "The Deep View"], "source_date": "Jun 18", "tags": ["ai", "retail", "markets"]}, {"id": "fed-warsh-2026-06-18", "section": "news", "headline": "Warsh's first Fed meeting: rates held, but hikes now on the table for 2026", "summary": "New Fed Chair Kevin Warsh held the benchmark rate steady at 3.50-3.75%, but officials signalled rate hikes are likely this year - nine of 19 projected a hike (up from none in March), pushing markets down sharply. Despite being nominated by Trump with an expectation he'd cut quickly, hot inflation from the Iran war has flipped the script. Warsh is also standing up five task forces to review Fed data methods, communications, and AI's effect on growth.", "link": "https://www.bbc.com/news/articles/cdjkl78vd7lo", "sources": ["Morning Brew", "Read The Peak"], "source_date": "Jun 18", "tags": ["markets", "economy", "fed"]}, {"id": "us-iran-mou-2026-06-18", "section": "news", "headline": "US and Iran sign a 14-point memorandum to end hostilities", "summary": "Washington released the memorandum of understanding with Iran, signed by both presidents, kicking off final negotiations in Switzerland. In exchange for reopening the Strait of Hormuz and pledging no nuclear weapons, Iran can sell oil immediately and would see sanctions waived if it meets nuclear terms; a $300B rebuilding fund is established (the US says it won't contribute). The two sides have 60 days to finalize - the inflation backdrop behind this week's Fed caution.", "link": null, "sources": ["Morning Brew"], "source_date": "Jun 18", "tags": ["world", "iran", "oil"]}, {"id": "canada-psychedelics-2026-06-18", "section": "news", "headline": "Conservative MP tables a bill to partially legalize medical psychedelics in Canada", "summary": "MP Corey Tochor's bill would reclassify psychedelics like psilocybin (currently treated like heroin) so doctors could prescribe them for depression, PTSD, and other mental-health conditions. Comparisons cited: Oregon (~17,000 clients since 2023, few complications) and Australia's psychiatrist-led system. The catch is cost - clinical psychedelic therapy runs expensive, and a third of Oregon's licensed centres have already closed.", "link": "https://www.cbc.ca/news/politics/magic-mushrooms-drug-legalization-conservatives-9.7236254", "sources": ["Read The Peak"], "source_date": "Jun 18", "tags": ["canada", "health", "policy"]}, {"id": "lululemon-china-2026-06-18", "section": "news", "headline": "Lululemon apologizes after a Great Wall yoga event used a Japanese drum", "summary": "Lululemon issued an apology after its May yoga festival on the Great Wall featured what looked like a Japanese taiko drum - poorly timed given current China-Japan tensions, and badly received on Chinese social media. The stakes are real: mainland China (revenue up 29% last year) has been the lifeline as Lulu's Americas sales slip and shares hit a seven-year low. A clean cautionary tale on cultural-fit risk in a market Western brands increasingly depend on.", "link": "https://www.theguardian.com/media/2026/jun/17/lululemon-apologises-japanese-drum-great-wall-china-yoga-event", "sources": ["Read The Peak"], "source_date": "Jun 18", "tags": ["retail", "china", "brand"]}, {"id": "calgary-mcdonalds-taza-2026-06-18", "section": "news", "headline": "A new McDonald's at Taza's Buffalo Run will be Alberta's first designed with Tsuut'ina cultural guidance", "summary": "The Calgary-area Taza development announced a McDonald's at Buffalo Run that's the first in Alberta shaped by guidance from the Tsuut'ina-Taza Cultural Advisory Working Group. A small but notable local example of retail design built with Indigenous community input.", "link": "https://retail-insider.com/", "sources": ["Retail Insider"], "source_date": "Jun 18", "tags": ["retail", "calgary", "local"]}, {"id": "retail-canada-roundup-2026-06-18", "section": "news", "headline": "Canadian retail roundup: Playdium's biggest location, a grocery anchor for CF Richmond, and loyalty programs everywhere", "summary": "Also in the Canadian retail pile: Cineplex opened a 24,000 sq ft Playdium at Vaughan Mills with the most attractions of any in Canada; Fresh St. Market will anchor the CF Richmond Centre redevelopment in 2027; Dollarama joined the Blue Rewards program (and Pharmasave launched it across its stores) as loyalty becomes a cost-of-living tool; Groupe Dynamite posted 37% revenue growth and a four-year-high margin; and A&W brought back its Root Beer Float for a limited run.", "link": "https://retail-insider.com/", "sources": ["Retail Insider"], "source_date": "Jun 18", "tags": ["retail", "canada", "loyalty"]}, {"id": "canada-population-datacentre-2026-06-18", "section": "news", "headline": "Canada's population fell for a third straight quarter; Hamilton may pause a big data centre", "summary": "Two Canadian data points worth a glance: StatCan estimates the population dropped 55,000 in Q1, driven by 118,000 fewer temporary residents (Ottawa is steering the temporary-resident share from 6.1% toward a 5% target). And Hamilton is on the verge of pausing a proposed data centre after public backlash over the rapid AI buildout - an early sign of local pushback on AI infrastructure.", "link": "https://globalnews.ca/news/11909502/hamilton-advances-proposed-data-centre-moratorium-in-pushback-to-rapid-ai-buildout/", "sources": ["Read The Peak"], "source_date": "Jun 18", "tags": ["canada", "economy", "ai-infrastructure"]}, {"id": "cochrane-local-2026-06-18", "section": "news", "headline": "Around Cochrane: Banff-area closure for hungry bears, longer pharmacy refills, and a $100K lottery win", "summary": "From CochraneNow: a Banff-area trail closure after bears were spotted feeding (worth knowing if you're planning a hike), a new Alberta pharmacy deal bringing longer prescription refills and rural pilot projects, and a local couple's $100,000 Lotto Max Extra win. Also in the mix: a UCP nomination meet-and-greet and Country Thunder act Brettyn Rose.", "link": "https://cochranenow.com/articles/hungry-bears-prompt-banff-area-closure", "sources": ["CochraneNow"], "source_date": "Jun 17", "tags": ["local", "cochrane", "alberta"]}, {"id": "training-antigravity-crm-2026-06-18", "section": "training", "headline": "AI Training: build and host a custom CRM with Google Antigravity", "summary": "The Rundown's walkthrough turns a plain-English spec into a hosted full-stack CRM. The key move: make the agent plan first, then build on Firebase so the app gets real login, saved data, search, and a live URL. Steps: (1) download and open Google Antigravity; (2) create a clean folder and open it in the app; (3) sign in with Google; (4) give it a two-line prompt naming the features and stack (React, Vite, TypeScript, Firebase Auth, Firestore, Hosting; 'plan first'); (5) review the plan and cut any scope creep like billing or teams; (6) have it walk you through installing Firebase, then deploy and test the live URL. Going further: add Google login, auto-set-up Analytics, or connect a custom domain.", "link": "https://app.therundown.ai/guides/build-and-host-a-custom-crm-with-google-antigravity", "sources": ["The Rundown AI"], "source_date": "Jun 18", "tags": ["training", "google-antigravity", "build"]}, {"id": "nyt-sneakers-2026-06-18", "section": "regulars", "headline": "NYT Wirecutter: sneakers that look like dress shoes", "summary": "The Recommendation's pick on sneakers dressy enough to pass as dress shoes, plus flight-comfortable pants. Body not read - a quick scroll if you want a versatile shoe. Also in the pile: Google announced a new Gemini-powered Google Home Speaker.", "link": "https://www.nytimes.com/wirecutter", "sources": ["NYT Wirecutter", "Google"], "source_date": "Jun 17", "tags": ["wirecutter", "style"]}, {"id": "deals-fathers-day-2026-06-18", "section": "deals", "headline": "Father's Day deals landing ahead of Sunday (June 21)", "summary": "A wave of dad-targeted promos this week: Nespresso is offering a free limited-edition cooler bag with a coffee order, and Costco pushed Father's Day cell phone offers (Apple, Samsung) plus last-minute cruise deals. Nothing must-buy, but worth a look if you're sorting a gift before Sunday.", "link": "https://www.nespresso.com/ca/en/", "sources": ["Nespresso", "Costco"], "source_date": "Jun 17", "tags": ["deals", "fathers-day"]}, {"id": "deals-safeway-flyer-2026-06-18", "section": "deals", "headline": "Safeway weekly flyer: spend $125, get 1,000 points (June 18-24)", "summary": "This week's Safeway/liquor flyer runs June 18-24 with an all-week spend-$125-get-1,000-points offer. Routine weekly cycle - flag it if your shop lands above that threshold anyway.", "link": "https://www.safeway.ca/", "sources": ["Safeway"], "source_date": "Jun 17", "tags": ["deals", "grocery"]}, {"id": "ctc-tracker-2026-06-18", "section": "ctc", "headline": "CTC banners: heavy promo week - SportChek and Mark's both running 'Big' events, plus a CT super sale incoming", "summary": "Cadence note - it's a loud week across the banners. SportChek's Big Chek Event runs through June 24 with a weekend-only spend-$125-get-$30-code offer; Mark's This. Is. Big. Event includes 25% off Columbia; and Canadian Tire teased a 'Great Canadian Super Sale' in its next weekly flyer, on top of today's one-day 30x CT Money. SportChek and Mark's are your banners - the back-to-back event stacking is the pattern worth watching.", "link": "https://www.sportchek.ca/", "sources": ["SportChek", "Mark's", "Canadian Tire"], "source_date": "Jun 18", "tags": ["ctc", "sportchek", "marks", "deals"]}]}, {"build_date": "2026-06-17", "build_label": "Wednesday, June 17", "entries": [{"id": "spacex-cursor-2026-06-17", "section": "news", "headline": "SpaceX passes Amazon in value after its IPO surge, then buys AI coding startup Cursor for $60B", "summary": "After listing Friday at $135, SpaceX stock has rocketed nearly 49%, briefly making it the fourth-largest US company (around $2.65T) and Elon Musk the world's first trillionaire. It used the windfall to exercise a $60B all-stock option to acquire Cursor, the fast-growing AI coding startup, to help its struggling xAI/Grok catch up to Anthropic and OpenAI on enterprise coding. The skeptic's footnote: SpaceX is the only company in the top seven that lost money last year (on $18.7B revenue), and on Monday it made up roughly 75% of all retail single-stock buys.", "link": "https://techcrunch.com/2026/06/16/spacex-to-acquire-cursor-for-60b-in-stock-days-after-blockbuster-ipo/", "sources": ["The Rundown AI", "The Deep View", "Morning Brew", "Read The Peak"], "source_date": "Jun 17", "tags": ["ai", "markets", "spacex", "m-and-a"]}, {"id": "token-panic-2026-06-17", "section": "news", "headline": "Enterprises hit 'token panic' as AI inference bills blow past budgets", "summary": "At Databricks' Data + AI Summit, executives described AI inference costs running so far over budget it has become a crisis - one put it as 'the coding agents have run our token bills out of control,' another as last year letting every flower bloom, now coming in with a lawnmower. Two fixes are emerging: smarter model selection (stop routing simple tasks to frontier models like Claude, GPT, and Gemini) and hybrid compute (running cheaper open models on your own hardware). It's bad news for OpenAI and Anthropic, the biggest beneficiaries of unlimited-token access, and a growing line of vendors - Databricks' Unity AI Gateway among them - now want to help companies meter and route it. This is the enterprise-AI cost story playing out in real time.", "link": "https://www.thedeepview.com/articles/why-token-panic-is-reshaping-ai", "sources": ["The Deep View"], "source_date": "Jun 17", "tags": ["ai", "enterprise", "cost", "strategy"]}, {"id": "glm-52-2026-06-17", "section": "news", "headline": "China's Z AI releases GLM-5.2, an open-weights model that rivals GPT-5.5 and nears Claude Opus 4.8 on coding", "summary": "GLM-5.2 (MIT licence, 1M-token context) beats GPT-5.5 on real-world coding, reasoning, and math benchmarks and lands just below Claude Opus 4.8 - the closest an open model has come to the top closed systems, and at a fraction of the price. The timing matters: it arrives exactly as enterprises hunt for cheaper alternatives to frontier models.", "link": "https://z.ai/blog/glm-5.2", "sources": ["The Rundown AI", "The Deep View"], "source_date": "Jun 17", "tags": ["ai", "open-models", "china"]}, {"id": "chatgpt-share-2026-06-17", "section": "news", "headline": "ChatGPT's market share slips below 50% for the first time, with Claude gaining", "summary": "OpenAI's ChatGPT dropped below 50% market share for the first time since its launch, largely thanks to Anthropic's Claude. Context worth holding alongside it: OpenAI spent about US$34B last year against roughly $13B in revenue.", "link": "https://techcrunch.com/2026/06/16/chatgpts-market-share-slips-below-50-for-first-time/", "sources": ["The Deep View", "Read The Peak"], "source_date": "Jun 17", "tags": ["ai", "openai"]}, {"id": "copilot-cowork-ga-2026-06-17", "section": "news", "headline": "Microsoft makes Copilot Cowork generally available - on usage-based pricing", "summary": "Microsoft launched Copilot Cowork worldwide, an AI agent that runs multi-step tasks across M365 apps, and put it on usage-based pricing - a direct nod to the same token-cost pressure enterprises are wrestling with. Directly relevant to your Copilot and SharePoint-grounded agent work.", "link": "https://www.microsoft.com/en-us/microsoft-365/blog/2026/06/16/copilot-cowork-is-now-generally-available/", "sources": ["The Rundown AI", "The Deep View"], "source_date": "Jun 17", "tags": ["ai", "microsoft", "enterprise"]}, {"id": "anthropic-g7-ban-2026-06-17", "section": "news", "headline": "Trump administration rejects UK request to exempt G7 allies from the Anthropic model export ban", "summary": "Following the US restriction on Anthropic's top models, the administration reportedly turned down UK PM Keir Starmer's request to exempt G7 allies from the export ban - keeping even close partners locked out of the frontier models. A continuation of yesterday's Fable 5 ban story.", "link": "https://nypost.com/2026/06/16/business/trump-admin-open-to-talks-with-anthropic-over-foreigner-ban/", "sources": ["The Rundown AI"], "source_date": "Jun 17", "tags": ["ai", "policy", "anthropic"]}, {"id": "snap-specs-2026-06-17", "section": "news", "headline": "Snap unveils $2,195 SPECS AR glasses, pitched as a 'wearable computer'", "summary": "Snap revealed SPECS at the Augmented World Expo - lightweight AR glasses with a 51-degree display (roughly a 24-inch monitor in your field of view), about four hours of battery, shipping this fall for US$2,195. Snap frames them as replacing screens rather than supplementing them, joining Meta and Apple in the race to sell computers for your face. The catch reviewers flagged: at ~135g they may be heavier than is comfortable for all-day wear.", "link": "https://www.thedeepview.com/articles/snap-s-usd2k-ar-glasses-want-to-compete-with-pcs", "sources": ["The Deep View", "Morning Brew", "Read The Peak"], "source_date": "Jun 17", "tags": ["tech", "ar", "hardware"]}, {"id": "meta-ai-morale-2026-06-17", "section": "news", "headline": "Meta promises a culture reset as morale in its AI unit craters", "summary": "Meta CTO Andrew Bosworth pledged manager caps, fewer forced transfers, internal mobility, and better perks after reports that thousands of employees were shoved into AI 'grunt work' supporting model training - one called the unit 'the gulag.' He admitted Meta 'did an atrocious job explaining the vision' of its March AI reorg. The backlash also hit mandatory employee mouse-tracking used to collect AI training data.", "link": "https://www.wired.com/story/andrew-bosworth-meta-employees-unrest/", "sources": ["The Rundown AI"], "source_date": "Jun 17", "tags": ["ai", "meta", "workplace"]}, {"id": "cbc-hockey-night-2026-06-17", "section": "news", "headline": "CBC drops Hockey Night in Canada after 74 years", "summary": "CBC will no longer broadcast NHL games starting next season after failing to renew its sublicensing deal with Rogers Sportsnet, the league's Canadian rightsholder. It plans to replace the Saturday night block with programming on Canadian Olympic athletes - which, as The Peak dryly noted, is unlikely to pull the same numbers as Saturday hockey.", "link": "https://www.cbc.ca/sports/cbc-nhl-hockey-night-in-canada-ends-9.7236977", "sources": ["Read The Peak"], "source_date": "Jun 17", "tags": ["canada", "sports", "media"]}, {"id": "gofundme-essentials-2026-06-17", "section": "news", "headline": "More Canadians are turning to GoFundMe to cover groceries and bills", "summary": "Over 15,000 Canadian fundraisers for 'essential needs' - bills, groceries, housing - were launched in the first five months of 2026, a 274% jump since 2020. It tracks a widening wealth gap: the top 20% of households now hold 65.5% of net worth, the bottom 40% just 3.1%. Shelter costs are up 28.5% and groceries over 30% since before the pandemic. Most of these emergency campaigns don't hit their targets.", "link": "https://www.cbc.ca/radio/costofliving/cost-of-living-canadian-crownfunding-bills-expensive-9.7235630", "sources": ["Read The Peak"], "source_date": "Jun 17", "tags": ["canada", "economy", "cost-of-living"]}, {"id": "competition-bureau-grocery-2026-06-17", "section": "news", "headline": "Competition Bureau opens a probe into whether weak competition is inflating Canadian grocery prices", "summary": "Canada's Competition Bureau is investigating competition factors across the food supply chain and is seeking input from Canadians and industry. It lands amid survey data showing rising costs have hit roughly 95% of Canadians' finances, with solo households feeling grocery inflation hardest.", "link": "https://www.cbc.ca/news/business/competition-bureau-canada-food-supply-chain-grocery-prices-9.7237172", "sources": ["Read The Peak", "Retail Insider"], "source_date": "Jun 17", "tags": ["canada", "retail", "grocery"]}, {"id": "g7-summit-2026-06-17", "section": "news", "headline": "G7 leaders meet in France with Ukraine, Iran, and AI on the agenda", "summary": "Leaders of the G7 gathered in Evian-les-Bains. With the US and Iran tentatively agreeing to halt hostilities, attendees pushed to refocus on Ukraine's defence - several, including Trump, signalled they could reimpose Russian oil sanctions, though Trump sent mixed messages on US involvement. PM Mark Carney announced new sanctions on Russia and held talks with Italy about a possible trainer-jet purchase.", "link": "https://www.cbc.ca/news/politics/carney-zelenskyy-sanctions-meeting-9.7236829", "sources": ["Morning Brew", "Read The Peak"], "source_date": "Jun 17", "tags": ["world", "g7", "canada"]}, {"id": "pizza-hut-sale-2026-06-17", "section": "news", "headline": "Yum Brands sells Pizza Hut for $2.7B", "summary": "Yum Brands is offloading Pizza Hut in two deals - private equity firm LongRange Capital takes operations outside mainland China for $1.5B, and Yum China takes the rest for $1.2B. The chain's share of Yum revenue has shrunk every year since 2019 as Domino's and delivery apps ate into it. Yum keeps KFC and Taco Bell.", "link": "https://www.morningbrew.com/daily", "sources": ["Morning Brew"], "source_date": "Jun 17", "tags": ["retail", "food", "m-and-a"]}, {"id": "zellers-diner-2026-06-17", "section": "news", "headline": "Zellers to bring back diner food and kiddie rides as it preps a Toronto store", "summary": "Zellers is reviving diner-inspired food, kiddie rides, and a giant Zeddy Bear for its upcoming Toronto location, building on the Edmonton store's success, with COO Joey Benitah pointing to expansion plans across Canada. A nostalgia play aimed squarely at families.", "link": "https://retail-insider.com/", "sources": ["Retail Insider"], "source_date": "Jun 17", "tags": ["retail", "canada", "nostalgia"]}, {"id": "retail-canada-roundup-2026-06-17", "section": "news", "headline": "Canadian retail roundup: AI-shopping appetite outpaces trust, Dollarama loyalty with BMO, Canada Goose's new luxury concept", "summary": "A Checkout.com report finds 33% of consumers expect at least 10% of their purchases to be AI-driven within a year - well ahead of where trust and merchant readiness sit (worth a flag given the agentic-commerce angle at work). Also in the pile: Dollarama launched a loyalty program with BMO; Canada Goose opened its new global retail concept at Oakridge Park in Vancouver; Planet Fitness is opening inside a Medicine Hat Walmart; and Calgary's CF Chinook Centre added Gem Studio, a hands-on jewelry-making experience.", "link": "https://retail-insider.com/", "sources": ["Retail Insider"], "source_date": "Jun 17", "tags": ["retail", "canada", "ai", "calgary"]}, {"id": "training-perplexity-finance-2026-06-17", "section": "training", "headline": "AI Training: Use Perplexity Finance as a free AI stock-research hub", "summary": "The Rundown's walkthrough for researching any stock with AI without juggling tabs or paid tools. Steps: (1) install Perplexity's Comet browser and open the Finance tab; (2) use the Screener with plain-English queries, kept broad ('find energy stocks with low PE ratios'); (3) drill into a ticker's Overview, Financials, Earnings, and Analysis tabs; (4) ask follow-ups via the Comet assistant button at top-right, not the bottom chat box (which hides the stock data); (5) prompt 'Explain the stock move today in plain English - the most likely drivers and the sources that support each one,' then click through and verify the dates. Going further: set price alerts, build a watchlist, and connect a brokerage via Plaid to analyze your own portfolio.", "link": "https://app.therundown.ai/guides/conduct-better-stock-research-with-perplexity-finances-free-features", "sources": ["The Rundown AI"], "source_date": "Jun 17", "tags": ["training", "perplexity", "finance", "research"]}, {"id": "nyt-prime-day-2026-06-17", "section": "regulars", "headline": "NYT Wirecutter: the best early Prime Day deals", "summary": "The Recommendation's roundup of early Prime Day deals Wirecutter editors are actually excited about, ahead of the main event. Body not read - worth a scroll if you've got a purchase in mind.", "link": "https://www.nytimes.com/wirecutter", "sources": ["NYT Wirecutter"], "source_date": "Jun 17", "tags": ["wirecutter", "deals", "prime-day"]}, {"id": "ctc-sportchek-bigchek-2026-06-17", "section": "ctc", "headline": "SportChek: Big Chek Event continues with casual clothing and footwear", "summary": "SportChek is still pushing its Big Chek Event - today's send features casual clothing and shoes (including 20% off Nike casual). Cadence note: that's another Big Chek send this week, consistent with an event in its final stretch. Worth a look if you want summer casual pieces before it wraps.", "link": "https://www.sportchek.ca/", "sources": ["SportChek"], "source_date": "Jun 17", "tags": ["ctc", "sportchek", "deals"]}]}]</script>
