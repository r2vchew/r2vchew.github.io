<!doctype html>
<html lang="en-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex, nofollow">
<title>Digest</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📬</text></svg>">
<style>
  :root{
    --paper:#F1F2F0; --surface:#FBFCFA;
    --ink:#121614; --ink-2:#414A45; --ink-3:#6E7873; --ink-4:#9AA39E;
    --rule:#DBDFDA; --rule-2:#E7EAE5;
    --accent:#1F6F6B; --accent-soft:#DCE9E7;
    --flag:#8A5300; --flag-soft:#F3E7D3;
    --display:Georgia,"Iowan Old Style","Times New Roman",serif;
    --body:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    --mono:ui-monospace,"SF Mono","Cascadia Mono",Consolas,monospace;
  }
  @media (prefers-color-scheme:dark){
    :root{--paper:#101312;--surface:#171B19;--ink:#E6EAE7;--ink-2:#B2BAB6;
      --ink-3:#848D89;--ink-4:#5D6663;--rule:#282D2B;--rule-2:#1E2321;
      --accent:#5DB7B0;--accent-soft:#16302E;--flag:#D59B4E;--flag-soft:#2E2415;}
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0}
  body{background:var(--paper);color:var(--ink);font-family:var(--body);
       line-height:1.5;-webkit-font-smoothing:antialiased;
       padding-bottom:env(safe-area-inset-bottom)}
  .wrap{max-width:820px;margin:0 auto;padding:16px 14px 130px}
  @media (min-width:700px){ .wrap{padding:26px 20px 130px} }

  /* ---- sign in ---- */
  .gate{max-width:390px;margin:14vh auto 0;padding:0 20px;text-align:left}
  .gate h1{font-family:var(--display);font-size:30px;font-weight:400;margin:0 0 10px}
  .gate p{font-size:14.5px;color:var(--ink-2);margin:0 0 18px}
  .gate input{width:100%;font-size:16px;padding:12px 14px;border-radius:7px;
              border:1px solid var(--rule);background:var(--surface);color:var(--ink)}
  .gate button{width:100%;margin-top:9px;font-size:15px;padding:12px;border-radius:7px;
               border:1px solid var(--accent);background:var(--accent);color:var(--paper);
               font-family:var(--body);cursor:pointer}
  .gate .msg{font-size:13.5px;color:var(--accent);margin-top:14px;min-height:1.2em}
  .gate .msg.bad{color:var(--flag)}
  .gate .fine{font-size:12px;color:var(--ink-4);margin-top:22px;line-height:1.5}

  /* ---- header ---- */
  .top{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;
       padding-bottom:12px;border-bottom:2px solid var(--ink)}
  .top h1{font-family:var(--display);font-size:23px;font-weight:400;margin:0}
  .top .date{font-family:var(--mono);font-size:10.5px;letter-spacing:.09em;
             text-transform:uppercase;color:var(--ink-3)}
  .top .out{margin-left:auto;font-size:11.5px;color:var(--ink-4);background:none;
            border:0;cursor:pointer;padding:2px 0;font-family:var(--body)}

  /* ---- tabs: scrollable on narrow screens ---- */
  .tabs{display:flex;gap:6px;margin:14px -14px 0;padding:0 14px 2px;
        overflow-x:auto;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  @media (min-width:700px){ .tabs{margin-left:0;margin-right:0;padding-left:0;padding-right:0;flex-wrap:wrap} }
  .tab{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;
       padding:8px 12px;border-radius:6px;cursor:pointer;white-space:nowrap;flex:0 0 auto;
       border:1px solid var(--rule);background:transparent;color:var(--ink-3)}
  .tab[aria-selected="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
  .tab .n{opacity:.6;margin-left:5px}

  .scope{display:flex;gap:5px;margin:12px 0 0;flex-wrap:wrap}
  .scope button{font-family:var(--mono);font-size:10px;letter-spacing:.06em;
                text-transform:uppercase;padding:6px 10px;border-radius:5px;
                border:1px solid var(--rule);background:transparent;color:var(--ink-4);cursor:pointer}
  .scope button[aria-pressed="true"]{color:var(--accent);border-color:var(--accent);
                                     background:var(--accent-soft)}

  /* ---- urgent ---- */
  .urgent{border:1px solid var(--flag);background:var(--flag-soft);border-radius:7px;
          padding:10px 13px;margin-top:15px}
  .urgent .empty{font-size:12.5px;color:var(--flag);opacity:.8;margin:2px 0}
  .urgent .story.u{padding:8px 0;border-bottom:1px solid rgba(138,83,0,.22)}
  .urgent .story.u:last-child{border-bottom:0}
  .urgent .story.u h3{font-weight:600}
  .urgent .story.u > small{display:block;color:var(--flag);font-size:11.5px;margin-top:3px}
  .urgent .story.u .topic{display:none}

  .sec-label{font-family:var(--mono);font-size:10px;letter-spacing:.14em;
             text-transform:uppercase;color:var(--accent);font-weight:600;
             margin:26px 0 2px;padding-bottom:6px;border-bottom:1px solid var(--rule-2)}

  /* ---- story ---- */
  .story{padding:14px 0;border-bottom:1px solid var(--rule)}
  .story.compact{padding:10px 0;border-bottom:1px solid var(--rule-2)}
  .story h3{font-family:var(--display);font-size:18px;line-height:1.32;margin:0;
            font-weight:400;cursor:pointer}
  .story.compact h3{font-family:var(--body);font-size:15px;line-height:1.42}
  .story .brief{font-size:14.5px;color:var(--ink-2);margin:7px 0 0}
  .meta{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-top:7px}
  .chip{font-family:var(--mono);font-size:9px;letter-spacing:.06em;text-transform:uppercase;
        padding:3px 6px;border-radius:3px;background:var(--accent-soft);color:var(--accent);
        font-weight:600}
  .chip.one{background:transparent;border:1px solid var(--rule);color:var(--ink-4);font-weight:400}
  .chip.carry{background:transparent;border:1px dashed var(--ink-4);color:var(--ink-4);font-weight:400}
  .chip.saved{background:var(--flag-soft);color:var(--flag)}
  .outlets{font-family:var(--mono);font-size:10px;color:var(--ink-3)}
  .topic{font-size:11px;color:var(--ink-4)}

  .detail{display:none;margin-top:10px;padding:12px 14px;background:var(--surface);
          border:1px solid var(--rule);border-radius:6px}
  .story.open-d .detail{display:block}
  .detail ul{margin:0;padding-left:17px;display:grid;gap:6px}
  .detail li{font-size:13.5px;color:var(--ink-2)}
  .angles{border-top:1px solid var(--rule);margin-top:11px;padding-top:10px;display:grid;gap:7px}
  .angle b{font-family:var(--mono);font-size:9.5px;letter-spacing:.05em;text-transform:uppercase;
           color:var(--ink-3);display:block;margin-bottom:1px}
  .angle span{font-size:13px;color:var(--ink-2)}

  /* ---- actions: big enough for thumbs ---- */
  .acts{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:10px}
  .acts input{flex:1 1 100%;order:9;font-family:var(--body);font-size:16px;
              padding:9px 11px;border-radius:6px;border:1px solid var(--rule);
              background:var(--surface);color:var(--ink)}
  @media (min-width:700px){ .acts input{flex:1 1 auto;order:0;font-size:12.5px;padding:5px 10px} }
  button.act{font-family:var(--body);font-size:13px;color:var(--ink-3);cursor:pointer;
             background:transparent;border:1px solid var(--rule);border-radius:6px;
             padding:7px 12px;white-space:nowrap}
  button.act.vol{font-family:var(--mono)}
  button.act.on{color:var(--flag);border-color:var(--flag);background:var(--flag-soft)}
  button.act.primary{color:var(--accent);border-color:var(--accent-soft);background:var(--accent-soft)}
  button.act[disabled]{opacity:.45}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  .empty-state{font-size:13.5px;color:var(--ink-4);font-style:italic;padding:26px 0}

  /* ---- rules: bottom sheet ---- */
  .dock{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);
        border-top:1px solid var(--rule);box-shadow:0 -4px 18px -12px rgba(0,0,0,.5);
        padding-bottom:env(safe-area-inset-bottom)}
  @media (min-width:700px){
    .dock{left:auto;right:18px;bottom:18px;width:340px;border:1px solid var(--rule);
          border-radius:9px}
  }
  .dock-bar{display:flex;align-items:center;gap:9px;padding:13px 15px;cursor:pointer;
            font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase}
  .dock-bar .dot{width:6px;height:6px;border-radius:50%;background:var(--accent)}
  .dock-bar .cnt{margin-left:auto;color:var(--ink-3)}
  .dock-list{display:none;border-top:1px solid var(--rule);padding:10px 15px 15px;
             max-height:48vh;overflow-y:auto}
  .dock.open .dock-list{display:block}
  .rule{font-size:13px;color:var(--ink-2);padding:8px 0;border-bottom:1px dotted var(--rule);
        display:flex;gap:9px;align-items:flex-start}
  .rule:last-child{border-bottom:0}
  .rule .dir{font-family:var(--mono);font-size:10px;padding-top:2px}
  .rule .up{color:var(--accent)} .rule .down{color:var(--ink-4)}
  .rule b{color:var(--ink);font-weight:600}
  .rule i{color:var(--ink-3)}
  .rule .prop{font-family:var(--mono);font-size:8.5px;letter-spacing:.06em;text-transform:uppercase;
              background:var(--flag-soft);color:var(--flag);padding:2px 5px;border-radius:3px}
  .rule .x{margin-left:auto;cursor:pointer;color:var(--ink-4);border:0;background:none;
           font-size:17px;line-height:1;padding:0 6px}

  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:74px;z-index:40;
         background:var(--ink);color:var(--paper);font-size:13.5px;padding:10px 16px;
         border-radius:7px;opacity:0;pointer-events:none;transition:opacity .18s;
         max-width:88vw;text-align:center}
  .toast.show{opacity:1}
  @media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>
<body>

<div class="gate" id="gate" hidden>
  <h1>Digest</h1>
  <p>Sign in to read today's digest. We'll email you a link — no password.</p>
  <input id="email" type="email" inputmode="email" autocomplete="email"
         placeholder="you@example.com" aria-label="Email address">
  <button id="send">Email me a sign-in link</button>
  <p class="msg" id="gateMsg"></p>
  <p class="fine">This page holds no data of its own. Everything is fetched after
     you sign in, and the key published here grants nothing without a session.</p>
</div>

<div class="wrap" id="app" hidden>
  <div class="top">
    <h1>Digest</h1>
    <span class="date" id="date"></span>
    <button class="out" id="signout">Sign out</button>
  </div>
  <div class="tabs" id="tabs" role="tablist"></div>
  <div class="scope" id="scope"></div>
  <div id="urgent"></div>
  <div id="content"></div>
</div>

<aside class="dock" id="dock" hidden>
  <div class="dock-bar" id="dockBar" role="button" tabindex="0" aria-expanded="false">
    <span class="dot"></span><span>Your rules</span><span class="cnt" id="ruleCount">0</span>
  </div>
  <div class="dock-list" id="dockList"></div>
</aside>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

/* The publishable key is deliberately in a public file. `anon` has no access to
   any digest object — verified over HTTP — so this opens nothing on its own.
   The gate is a signed-in user with a row in digest.household_members. */
const SUPABASE_URL = "https://kejchvwswjpdrvyccufi.supabase.co";
const SUPABASE_KEY = "sb_publishable_0sg-HAeFVVj4vnYAMMNQng_pSX-lvLs";
const sb = createClient(SUPABASE_URL, SUPABASE_KEY);

const TABS = [["news","News"],["deals","Deals"],["others","Others"],
              ["ctc","CTC"],["training","AI Training"]];
let DATA = null, TAB = "news", SCOPE = "today", BUSY = false;

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function toast(msg){
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(t._t); t._t = setTimeout(()=>t.classList.remove("show"), 2800);
}

/* ---------------- auth ---------------- */
$("#send").addEventListener("click", async () => {
  const email = $("#email").value.trim();
  const msg = $("#gateMsg");
  if(!email){ msg.textContent = "Enter your email first."; msg.className = "msg bad"; return; }
  $("#send").disabled = true;
  const { error } = await sb.auth.signInWithOtp({
    email, options: { emailRedirectTo: location.href.split("#")[0] }
  });
  $("#send").disabled = false;
  msg.className = "msg" + (error ? " bad" : "");
  msg.textContent = error ? error.message
    : "Sent. Open the link on this device — it signs you in and stays signed in.";
});

$("#signout").addEventListener("click", async () => {
  await sb.auth.signOut(); location.reload();
});

/* ---------------- data ---------------- */
async function load(){
  const { data, error } = await sb.rpc("digest_feed");
  if(error){
    $("#content").innerHTML =
      `<p class="empty-state">Couldn't load: ${esc(error.message)}</p>`;
    return;
  }
  DATA = data;
  $("#date").textContent = new Date(DATA.day + "T12:00:00")
    .toLocaleDateString("en-CA",{weekday:"long",day:"numeric",month:"long"});
  render();
}

/* A note can be a command as well as a comment. It must always say what it did —
   a note silently reinterpreted as an instruction is the failure this whole
   project exists to avoid. */
function parseCommand(note){
  if(!note) return null;
  const m = note.match(/\bmove\s+(?:to|into)\s+(news|deals|others|ctc|ai[\s-]*(?:learning|training)|training|learning)\b/i);
  if(!m) return null;
  let t = m[1].toLowerCase().replace(/[\s-]+/g,"");
  if(t === "ailearning" || t === "aitraining" || t === "learning") t = "training";
  return t;
}

async function act(storyId, action, noteEl){
  if(BUSY) return;
  BUSY = true;
  document.querySelectorAll("button.act").forEach(b => b.disabled = true);
  const note = noteEl ? noteEl.value.trim() : "";
  const moveTo = parseCommand(note);
  const args = { p_story_id: storyId, p_action: action, p_note: note || null };
  if(moveTo && action !== "up" && action !== "down"){
    args.p_action = "move"; args.p_moved_to_tab = moveTo;
  }
  const { data, error } = await sb.rpc("digest_act", args);
  BUSY = false;
  if(error){ toast("Didn't save: " + error.message); await load(); return; }
  const label = TABS.find(t => t[0] === args.p_moved_to_tab);
  const applied = (data && data.applied) || [];
  toast(applied.length
    ? "✓ " + applied.join(", ").replace(/moved to (\w+)/, "moved to " + (label ? label[1] : "$1"))
    : "✓ noted");
  if(noteEl) noteEl.value = "";
  await load();
}

/* ---------------- rendering ---------------- */
function actionBar(s){
  const el = document.createElement("div");
  el.className = "acts";
  const note = document.createElement("input");
  note.type = "text"; note.enterKeyHint = "done";
  note.placeholder = "why? (optional — or “move to AI learning”)";
  note.setAttribute("aria-label","Note for this action");

  const mk = (label, cls, action) => {
    const b = document.createElement("button");
    b.className = "act " + cls; b.textContent = label;
    b.addEventListener("click", () => act(s.id, action, note));
    return b;
  };
  if(s.tab !== "training"){
    el.appendChild(mk("▲ more","vol","up"));
    el.appendChild(mk("▼ less","vol","down"));
  }
  el.appendChild(mk(s.saved ? "✓ Saved" : "Save", s.saved ? "on" : "", "save"));
  el.appendChild(mk("Clear","","clear"));
  el.appendChild(note);
  return el;
}

function storyEl(s, compact){
  const el = document.createElement("article");
  el.className = "story" + (compact ? " compact" : "");

  const head = document.createElement("div"); head.className = "head";
  const h = document.createElement("h3"); h.textContent = s.headline;
  head.appendChild(h); el.appendChild(head);

  const brief = document.createElement("p");
  brief.className = "brief"; brief.textContent = s.brief;
  const showBriefNow = !compact && s.brief;
  if(s.brief){ brief.style.display = showBriefNow ? "" : "none"; el.appendChild(brief); }

  const meta = document.createElement("div"); meta.className = "meta";
  if(s.source_count > 1){
    meta.insertAdjacentHTML("beforeend",
      `<span class="chip">${s.source_count} sources</span>
       <span class="outlets">${esc(s.outlets)}</span>`);
  } else if(s.outlets){
    meta.insertAdjacentHTML("beforeend", `<span class="chip one">${esc(s.outlets)}</span>`);
  }
  if(s.carried) meta.insertAdjacentHTML("beforeend", `<span class="chip carry">carried over</span>`);
  if(s.saved)   meta.insertAdjacentHTML("beforeend", `<span class="chip saved">saved</span>`);
  if(s.topic)   meta.insertAdjacentHTML("beforeend", `<span class="topic">${esc(s.topic)}</span>`);
  el.appendChild(meta);

  const details = s.details || [], angles = s.angles || [];
  if(details.length || angles.length){
    const d = document.createElement("div"); d.className = "detail";
    if(details.length){
      d.innerHTML = "<ul>" + details.map(x=>`<li>${esc(x)}</li>`).join("") + "</ul>";
    }
    if(angles.length){
      d.insertAdjacentHTML("beforeend", '<div class="angles">' + angles.map(a =>
        `<div class="angle"><b>${esc(a.source)}</b><span>${esc(a.added)}</span></div>`).join("") + "</div>");
    }
    el.appendChild(d);
  }

  const bar = actionBar(s);

  // Two-stage expansion. A compact row opens the brief first, then the details;
  // a top-tier story starts with its brief showing and has only one stage.
  let stage = showBriefNow ? 1 : 0;
  const toggle = document.createElement("button");
  toggle.className = "act primary";
  const sync = () => {
    if(stage === 0) toggle.textContent = "Show more";
    else if(stage === 1 && (details.length || angles.length)) toggle.textContent = "Details";
    else toggle.textContent = "Hide details";
    if(s.brief) brief.style.display = stage >= 1 ? "" : "none";
    el.classList.toggle("open-d", stage >= 2);
  };
  const bump = () => {
    const max = (details.length || angles.length) ? 2 : 1;
    stage = stage >= max ? (showBriefNow ? 1 : 0) : stage + 1;
    sync();
  };
  toggle.addEventListener("click", bump);
  h.addEventListener("click", bump);
  if(s.brief || details.length || angles.length) bar.insertBefore(toggle, bar.firstChild);
  sync();

  el.appendChild(bar);
  return el;
}

function renderUrgent(){
  const box = $("#urgent"); box.innerHTML = "";
  if(TAB !== "news") return;
  const u = DATA.stories.filter(s => s.is_urgent);
  const panel = document.createElement("div");
  panel.className = "urgent";
  if(!u.length){
    panel.innerHTML = `<p class="empty">Nothing with a deadline inside a day. Recurring weekly offers don't count — they'd fill this and make it useless.</p>`;
  } else {
    u.forEach(s => {
      const el = storyEl(s, true);
      el.classList.add("u");
      if(s.urgent_reason){
        const why = document.createElement("small");
        why.textContent = s.urgent_reason;
        el.querySelector(".head").after(why);
      }
      panel.appendChild(el);
    });
  }
  box.appendChild(panel);
}

function render(){
  $("#tabs").innerHTML = TABS.map(([id,label]) => {
    const n = id === "training"
      ? DATA.library.length
      : DATA.stories.filter(s => s.tab === id).length;
    return `<button class="tab" role="tab" data-tab="${id}"
             aria-selected="${id===TAB}">${label}<span class="n">${n}</span></button>`;
  }).join("");
  $("#tabs").querySelectorAll(".tab").forEach(b =>
    b.addEventListener("click", () => { TAB = b.dataset.tab; render(); }));

  const scope = $("#scope");
  if(TAB === "training"){ scope.innerHTML = ""; }
  else {
    const list = DATA.stories.filter(s => s.tab === TAB);
    const today = list.filter(s => !s.carried).length;
    scope.innerHTML = [["today",`Today ${today}`],
                       ["carried",`Carried over ${list.length - today}`],
                       ["all",`All ${list.length}`]]
      .map(([k,l])=>`<button data-scope="${k}" aria-pressed="${k===SCOPE}">${l}</button>`).join("");
    scope.querySelectorAll("button").forEach(b =>
      b.addEventListener("click", () => { SCOPE = b.dataset.scope; render(); }));
  }

  renderUrgent();
  const c = $("#content"); c.innerHTML = "";

  if(TAB === "training"){
    c.insertAdjacentHTML("beforeend",
      `<p class="sec-label">A library, not a queue — it accumulates</p>`);
    if(!DATA.library.length){
      c.insertAdjacentHTML("beforeend",
        `<p class="empty-state">Nothing filed yet. Type “move to AI learning” in any note box and clear it.</p>`);
    }
    DATA.library.forEach(s => c.appendChild(storyEl(
      Object.assign({tab:"training", source_count:1, outlets:"", angles:[]}, s), false)));
  } else {
    let list = DATA.stories.filter(s => s.tab === TAB);
    if(SCOPE === "today")   list = list.filter(s => !s.carried);
    if(SCOPE === "carried") list = list.filter(s =>  s.carried);

    if(!list.length){
      c.insertAdjacentHTML("beforeend", `<p class="empty-state">Nothing here.</p>`);
    } else if(TAB === "news"){
      const top = list.filter(s => s.tier === "top"), rest = list.filter(s => s.tier !== "top");
      if(top.length){
        c.insertAdjacentHTML("beforeend", `<p class="sec-label">Worth a read</p>`);
        top.forEach(s => c.appendChild(storyEl(s, false)));
      }
      if(rest.length){
        c.insertAdjacentHTML("beforeend",
          `<p class="sec-label">Everything else that arrived — ${rest.length}</p>`);
        rest.forEach(s => c.appendChild(storyEl(s, true)));
      }
    } else {
      list.forEach(s => c.appendChild(storyEl(s, true)));
    }
  }
  renderRules();
}

function renderRules(){
  const list = $("#dockList"), rules = DATA.rules || [];
  $("#ruleCount").textContent = rules.length;
  list.innerHTML = rules.length ? rules.map(r => {
    const up = r.effect === "louder";
    return `<div class="rule">
      <span class="dir ${up?"up":"down"}">${up?"▲":"▼"}</span>
      <span><b>${esc(r.subject_label)}</b> — ${esc(String(r.effect).replace("_"," "))}${
        r.target_tab ? " → " + esc(r.target_tab) : ""}
        ${r.note ? `<i> — “${esc(r.note)}”</i>` : ""}
        ${r.status === "proposed" ? ' <span class="prop">proposed</span>' : ""}</span>
      <button class="x" data-rule="${r.id}" data-status="${
        r.status === "proposed" ? "active" : "retired"}"
        aria-label="${r.status === "proposed" ? "Approve" : "Retire"}">${
        r.status === "proposed" ? "✓" : "×"}</button>
    </div>`;
  }).join("") : `<p style="font-size:12.5px;color:var(--ink-3);margin:4px 0">
      No rules yet. Every ▲ ▼ writes one here, in your own words.</p>`;

  list.querySelectorAll("button[data-rule]").forEach(b =>
    b.addEventListener("click", async () => {
      const { error } = await sb.rpc("digest_rule_status",
        { p_rule_id: +b.dataset.rule, p_status: b.dataset.status });
      toast(error ? "Didn't save: " + error.message
                  : (b.dataset.status === "active" ? "✓ rule approved" : "rule retired"));
      load();
    }));
}

const dock = $("#dock"), bar = $("#dockBar");
const toggleDock = () => { dock.classList.toggle("open");
  bar.setAttribute("aria-expanded", dock.classList.contains("open")); };
bar.addEventListener("click", toggleDock);
bar.addEventListener("keydown", e => {
  if(e.key === "Enter" || e.key === " "){ e.preventDefault(); toggleDock(); }});

/* ---------------- boot ---------------- */
async function boot(){
  const { data: { session } } = await sb.auth.getSession();
  const inApp = !!session;
  $("#gate").hidden = inApp;
  $("#app").hidden  = !inApp;
  $("#dock").hidden = !inApp;
  if(inApp) await load();
}
sb.auth.onAuthStateChange(() => boot());
boot();
</script>
</body>
</html>
